<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EmpireCraft Core</title>
<link rel="icon" href="icon-192.png">
<style>
/* 服务器核心的小界面：开服的那台电脑上，嵌在核心自己的窗口里(见 .server 的 CoreShell)。
   照政体编辑器的像素主题：左边一条导航、右边金边框的面板，方角、像素图标、像素字(12 像素的整数倍才清楚：正文 12，大字 24) */
@font-face{font-family:"Fusion Pixel";src:url(host/pixel.woff2) format("woff2");font-display:swap}
:root{--bg:#161916;--bar:#0e100e;--panel:#242924;--card:#2d332d;--card2:#353c35;--input:#111311;--line:#3c443b;--edge:#0b0d0b;
--text:#ece4cf;--muted:#9b957f;--gold:#f0c75a;--gold-dim:#a8873a;--green:#4f9442;--green-hi:#73b862;--red:#c4483b;--red-hi:#e06d5d;--btn:#394039;--btn-hi:#4b534a}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0;background:var(--bg)}
body{color:var(--text);font:12px/1.75 "Fusion Pixel","Microsoft YaHei","Segoe UI",sans-serif;display:grid;grid-template-columns:176px minmax(0,1fr);gap:10px;padding:10px;user-select:none;overflow:hidden}
img{image-rendering:pixelated}
img.ico{width:20px;height:20px;flex:none;vertical-align:middle}
img.ico.lg{width:32px;height:32px}
.frame{border:8px solid transparent;border-image:url(host/regimeFrame.png) 8 / 8px stretch;background:var(--panel) padding-box;box-shadow:0 4px 0 rgba(0,0,0,.35);image-rendering:pixelated;min-height:0}

/* ── 左边：名号、状态、导航 ── */
#side{display:flex;flex-direction:column;padding:10px 8px 8px}
.brand{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 12px;border-bottom:1px solid var(--line)}
.brand img{width:56px;height:56px;border:2px solid var(--edge);box-shadow:0 0 0 1px var(--gold-dim)}
.brand .n1{color:var(--gold);font-size:12px;margin-top:4px}
.brand .n2{color:var(--muted)}
.lamp{display:flex;align-items:center;justify-content:center;gap:6px;margin:10px 0;padding:4px 6px;border:1px solid var(--line);background:var(--input);color:var(--muted)}
.lamp i{width:8px;height:8px;background:#666;flex:none}
.lamp.on{color:var(--green-hi)}.lamp.on i{background:var(--green-hi);box-shadow:0 0 6px var(--green-hi)}
.lamp.wait{color:var(--gold)}.lamp.wait i{background:var(--gold);box-shadow:none}
.lamp.off{color:var(--red-hi)}.lamp.off i{background:var(--red-hi)}
#nav{display:grid;gap:2px}
#nav button{display:flex;align-items:center;gap:8px;width:100%;justify-content:flex-start;border:0;background:transparent;box-shadow:none;color:var(--muted);padding:7px 8px}
#nav button:hover{background:var(--card);color:var(--text)}
#nav button.active{background:var(--card2);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
#side .grow{flex:1}
#side .foot{color:var(--muted);border-top:1px solid var(--line);padding-top:8px;text-align:center;line-height:1.5}
#side .foot b{display:block;color:var(--text);font-weight:normal}

/* ── 右边：面板 ── */
#main{display:flex;flex-direction:column;padding:12px 14px;overflow:hidden}
.page{display:none;flex:1;min-height:0;flex-direction:column}
.page.show{display:flex}
.head{display:flex;align-items:center;gap:10px;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.head h2{margin:0;color:var(--gold);font-size:24px;line-height:1.2;font-weight:normal}
.head .sub{color:var(--muted)}
.head .grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);padding:10px 12px;min-height:0}
.card h3{margin:0 0 8px;color:var(--gold);font-size:12px;font-weight:normal;border-bottom:1px solid var(--line);padding-bottom:4px;display:flex;align-items:center;gap:6px}
.muted{color:var(--muted)}

/* 概况：四块主指标、连接与操作两栏、席位占满余下的高度 */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--line);padding:8px 10px;display:flex;align-items:center;gap:10px;min-width:0}
.stat .v{color:var(--gold);font-size:24px;line-height:1.15;white-space:nowrap}
.stat .k{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat div{min-width:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-bottom:8px}
.link{display:flex;gap:12px;align-items:stretch}
.link canvas{width:132px;height:132px;background:#fff;cursor:zoom-in;flex:none;border:2px solid var(--edge);box-shadow:0 0 0 1px var(--gold-dim)}
.link .side2{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.addr{background:var(--input);border:1px solid var(--line);color:#ffe3a0;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:text;cursor:pointer}
.addr:hover{border-color:var(--gold-dim)}
.acts{display:grid;gap:6px}
.act{display:flex;align-items:center;gap:10px;width:100%;justify-content:flex-start;text-align:left;padding:6px 10px}
.act .t2{color:var(--muted);line-height:1.4}
.act.danger .t2{color:#ffd9d2}
.act div{min-width:0}
#seat-card{flex:1;display:flex;flex-direction:column}
#seats{overflow:auto;flex:1;min-height:0}
.seat{display:flex;align-items:center;gap:8px;padding:4px 2px;border-top:1px dashed var(--line)}
.seat:first-child{border-top:0}
.seat .dot{width:8px;height:8px;background:#555;flex:none}.seat.on .dot{background:var(--green-hi);box-shadow:0 0 5px var(--green-hi)}
.seat .sw{width:12px;height:12px;border:1px solid var(--edge);flex:none}
.seat .who{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

button{font:inherit;color:var(--text);border:2px solid var(--edge);background:var(--btn);box-shadow:inset 0 2px 0 var(--btn-hi);padding:4px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
button:hover{background:var(--btn-hi)}
button:active{box-shadow:inset 0 2px 0 var(--edge);transform:translateY(1px)}
button.primary{background:var(--green);color:#fff;box-shadow:inset 0 2px 0 var(--green-hi)}
button.primary:hover{background:#5ba54d}
button.danger{background:var(--red);color:#fff;box-shadow:inset 0 2px 0 var(--red-hi)}
button.danger:hover{background:#d1574a}
button.small{padding:2px 8px}
button:disabled{opacity:.45;cursor:not-allowed}
input{font:inherit;color:var(--text);background:var(--input);border:1px solid var(--line);padding:4px 8px;outline:none;user-select:text}
input:focus{border-color:var(--gold)}
input::placeholder{color:#6d6858}

/* 设置、法则、账号 */
.scroll{flex:1;min-height:0;overflow:auto;padding-right:2px}
.head input{width:200px}
.grp{display:flex;align-items:center;gap:8px;margin:10px 0 4px;padding:3px 8px;color:var(--gold);background:var(--bar);border:1px solid var(--line);border-left:3px solid var(--gold);cursor:pointer}
.grp:first-child{margin-top:0}
.grp .n{color:var(--muted);margin-left:auto}
.grp .fold{color:var(--muted);width:10px;text-align:center}
.row{display:flex;align-items:center;gap:12px;padding:6px 10px;background:var(--card);border:1px solid var(--line);margin-bottom:4px}
.row:hover{background:var(--card2)}
.row .txt{flex:1;min-width:0}
.row .txt .d{color:var(--muted);line-height:1.5}
.row img.tog{width:48px;height:18px;cursor:pointer;flex:none}
.row input{width:110px;text-align:right}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{color:var(--gold);font-weight:normal;background:var(--card);position:sticky;top:0}
td.r,th.r{text-align:right}
tr:hover td{background:var(--card)}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line)}

#veil{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:9}
#veil.show{display:flex}
.dlg{padding:12px 14px;max-width:86vw;min-width:280px}
.dlg h3{margin:0 0 8px;color:var(--gold);font-weight:normal;font-size:12px;border-bottom:1px solid var(--line);padding-bottom:4px}
.dlg .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.dlg canvas{width:min(64vmin,340px);height:min(64vmin,340px);background:#fff;display:block;margin:6px auto;border:2px solid var(--edge)}
#login{display:none;flex:1;align-items:center;justify-content:center}
#login.show{display:flex}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--bar);border:1px solid var(--gold-dim);color:var(--text);padding:4px 14px;display:none;z-index:10;box-shadow:0 4px 0 rgba(0,0,0,.35)}
#toast.bad{border-color:var(--red-hi);color:var(--red-hi)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--btn-hi);border:2px solid var(--panel)}::-webkit-scrollbar-track{background:var(--panel)}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}#main{overflow:auto}.page.show{flex:none}}
</style>
</head>
<body>
<aside id="side" class="frame">
  <div class="brand"><img src="icon-192.png" alt=""><span class="n1" data-t="name1"></span><span class="n2" data-t="name2"></span></div>
  <div class="lamp" id="lamp"><i></i><span id="lamp-t"></span></div>
  <div id="nav">
    <button data-p="home"><img class="ico" src="host/iconWorldInfo.png" alt=""><span data-t="tab_home"></span></button>
    <button data-p="mod"><img class="ico" src="host/iconOptions.png" alt=""><span data-t="tab_mod"></span></button>
    <button data-p="laws"><img class="ico" src="host/iconWorldLaws.png" alt=""><span data-t="tab_laws"></span></button>
    <button data-p="users"><img class="ico" src="host/iconKings.png" alt=""><span data-t="tab_users"></span></button>
  </div>
  <div class="grow"></div>
  <div class="foot"><span data-t="k_mode"></span><b id="v-mode">—</b></div>
</aside>

<section id="main" class="frame">
  <div id="login"><div class="card" style="max-width:380px">
    <h3><img class="ico" src="host/iconQuestionMark.png" alt=""><span data-t="login_title"></span></h3>
    <div class="muted" data-t="login_note"></div>
    <div style="display:flex;gap:8px;margin-top:10px"><input id="login-code" maxlength="40" spellcheck="false" autocomplete="off" style="flex:1"><button class="primary" id="login-go" data-t="login_go"></button></div>
    <div id="login-err" style="color:var(--red-hi);min-height:1.75em"></div>
  </div></div>

  <div class="page" id="p-home">
    <div class="head"><img class="ico lg" src="host/iconWorldInfo.png" alt=""><h2 data-t="tab_home"></h2><span class="sub" id="home-sub"></span></div>
    <div class="stats">
      <div class="stat"><img class="ico lg" src="host/iconHistory.png" alt=""><div><div class="v" id="v-date">—</div><div class="k" id="k-date"></div></div></div>
      <div class="stat"><img class="ico lg" src="host/iconKnowledge.png" alt=""><div><div class="v" id="v-speed">—</div><div class="k" id="k-speed"></div></div></div>
      <div class="stat"><img class="ico lg" src="host/iconEasternHuman.png" alt=""><div><div class="v" id="v-online">—</div><div class="k" data-t="k_online"></div></div></div>
      <div class="stat"><img class="ico lg" src="host/iconSaveLocal.png" alt=""><div><div class="v" id="v-saved">—</div><div class="k" id="k-saved"></div></div></div>
    </div>
    <div class="two">
      <div class="card">
        <h3><img class="ico" src="host/iconTitleLayer.png" alt=""><span data-t="card_link"></span></h3>
        <div class="link">
          <canvas id="qr" width="1" height="1" hidden></canvas>
          <div class="side2">
            <div class="muted" id="link-note" data-t="link_note"></div>
            <div class="addr" id="v-addr">—</div>
            <div class="muted" id="v-admin-code" hidden></div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:auto">
              <button class="small" id="b-qr"><img class="ico" src="host/iconTitleLayer.png" alt=""><span data-t="b_qr"></span></button>
              <button class="small" id="b-copy"><img class="ico" src="host/iconBooksWritten.png" alt=""><span data-t="b_copy"></span></button>
            </div>
          </div>
        </div>
      </div>
      <div class="card">
        <h3><img class="ico" src="host/iconBooksWritten.png" alt=""><span data-t="card_acts"></span></h3>
        <div class="acts">
          <button class="act" id="b-admin"><img class="ico lg" src="host/iconKingdom.png" alt=""><div><div data-t="b_admin"></div><div class="t2" data-t="b_admin_sub"></div></div></button>
          <button class="act" id="b-save"><img class="ico lg" src="host/iconSaveLocal.png" alt=""><div><div data-t="b_save"></div><div class="t2" id="b-save-sub"></div></div></button>
          <button class="act danger" id="b-stop" hidden><img class="ico lg" src="host/iconGoBack.png" alt=""><div><div id="b-stop-t"></div><div class="t2" id="b-stop-sub"></div></div></button>
        </div>
      </div>
    </div>
    <div class="card" id="seat-card">
      <h3><img class="ico" src="host/iconKings.png" alt=""><span data-t="card_seats"></span><span class="muted" id="seat-count" style="margin-left:auto"></span></h3>
      <div id="seats"></div>
    </div>
  </div>

  <div class="page" id="p-mod">
    <div class="head"><img class="ico lg" src="host/iconOptions.png" alt=""><h2 data-t="tab_mod"></h2><span class="sub" id="mod-count"></span><span class="grow"></span><input id="mod-find"></div>
    <div class="scroll" id="mod-list"></div>
  </div>
  <div class="page" id="p-laws">
    <div class="head"><img class="ico lg" src="host/iconWorldLaws.png" alt=""><h2 data-t="tab_laws"></h2><span class="sub" id="laws-count"></span><span class="grow"></span><input id="laws-find"></div>
    <div class="scroll" id="laws-list"></div>
  </div>
  <div class="page" id="p-users">
    <div class="head"><img class="ico lg" src="host/iconKings.png" alt=""><h2 data-t="tab_users"></h2><span class="sub" id="users-note"></span><span class="grow"></span><button class="small" id="users-refresh"><img class="ico" src="host/iconHistory.png" alt=""><span data-t="b_refresh"></span></button></div>
    <div class="scroll" id="users-list"></div>
  </div>
</section>

<div id="veil"><div class="dlg frame" id="dlg"></div></div>
<div id="toast"></div>

var lang="cz";
function t(k){var s=(S[lang]||S.cz)[k];if(s===undefined)s=S.cz[k]||k;for(var i=1;i<arguments.length;i++)s=s.split("{"+(i-1)+"}").join(arguments[i]);return s}
function $(id){return document.getElementById(id)}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function applyLang(){
  document.documentElement.lang=lang==="en"?"en":"zh";
  document.title=t("name");
  var n=document.querySelectorAll("[data-t]");for(var i=0;i<n.length;i++)n[i].textContent=t(n[i].getAttribute("data-t"));
  $("mod-find").placeholder=t("find_mod");$("laws-find").placeholder=t("find_laws");
}
// 管理员令牌同网页管理页用一个键：在这里登入了，同一个浏览器里的管理页也是管理员
var KEY="ec_admin",token=store(KEY),gone=false,page=store("ec_host_page")||"home";
var state=null,host=null,save=null,srv=null,lists=null,accounts=null,alive=false;

function api(method,path,body){
  var opt={method:method,headers:{},cache:"no-store"};
  if(token)opt.headers["X-Terminal-Token"]=token;
  if(body){opt.body=JSON.stringify(body);opt.headers["Content-Type"]="application/json"}
  return fetch(path,opt).then(function(r){return r.json().then(function(j){return{status:r.status,json:j||{}}},function(){return{status:r.status,json:{}}})});
}
var toastAt=0;
function toast(text,bad){var b=$("toast");b.textContent=text;b.className=bad?"bad":"";b.style.display="block";clearTimeout(toastAt);toastAt=setTimeout(function(){b.style.display="none"},2600)}

// ───── 登入：地址后面带着管理员码(八位)或一张票(三十二位)，记下就从地址栏去掉；已有令牌的先照令牌试 ─────
var carried=null;
(function(){
  var m=/^#admin=([A-Za-z0-9]{4}-?[A-Za-z0-9]{4}|[0-9a-f]{32})$/.exec(location.hash);
  if(!m)return;
  carried=m[1].length===32?m[1]:m[1].toUpperCase().replace(/[^A-Z0-9]/g,"");
  try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}
})();
function signIn(body,err){
  return api("POST","/api/admin/pair",body).then(function(r){
    if(r.status===200&&r.json.token){token=r.json.token;store(KEY,token);goPage(page);tick(true);return true}
    if(err)err.textContent=t(r.json.error==="locked"?"e_locked":"e_wrong");
    return false;
  },function(){if(err)err.textContent=t("e_net");return false});
}
function lostToken(){
  token=null;store(KEY,null);
  if(carried){var c=carried;carried=null;signIn(c.length===32?{ticket:c}:{code:c}).then(function(ok){if(!ok)showPage()});return}
  showPage();
}
// 没有管理员身份时只留登入那一块
function showPage(){
  var on=!!token,p=document.querySelectorAll(".page");
  $("login").className=on?"":"show";
  for(var i=0;i<p.length;i++)p[i].className="page"+(on&&p[i].id==="p-"+page?" show":"");
}
$("login-go").onclick=function(){
  var v=$("login-code").value.trim(),err=$("login-err");err.textContent="";
  if(!v)return;
  // 一个框里"账号:密码"，或管理员码
  signIn(v.indexOf(":")>0?{user:v.slice(0,v.indexOf(":")).trim(),password:v.slice(v.indexOf(":")+1)}:{code:v},err);
};
$("login-code").onkeydown=function(e){if(e.key==="Enter")$("login-go").onclick()};

// ───── 导航 ─────
function goPage(p){
  page=p;store("ec_host_page",p);
  var b=$("nav").children;for(var i=0;i<b.length;i++)b[i].className=b[i].getAttribute("data-p")===p?"active":"";
  showPage();
  if(token){if(p==="mod"||p==="laws")loadLists();if(p==="users")loadAccounts()}
}
(function(){var b=$("nav").children;for(var i=0;i<b.length;i++)b[i].onclick=function(){goPage(this.getAttribute("data-p"))}})();

// ───── 轮询 ─────
var round=0;
function tick(now){
  if(gone)return;
  if(!token){lostToken();return}
  api("GET","/api/state").then(function(r){
    if(r.status===401){lostToken();return}
    alive=true;state=r.json;
    if(state.lang&&S[state.lang]&&state.lang!==lang){lang=state.lang;applyLang();lists=null;accounts=null;goPage(page)}
    drawHome();
  },function(){alive=false;drawHome()});
  if(now||round%3===0){
    api("GET","/api/admin/save").then(function(r){if(r.status===200){save=r.json;drawHome()}},function(){});
    api("GET","/api/admin/host").then(function(r){if(r.status===200){
      host=r.json;drawHome();drawQr($("qr"));
      if($("dialog-qr"))drawQr($("dialog-qr"));
    }},function(){});
    api("GET","/api/server").then(function(r){if(r.status===200){srv=r.json;drawHome()}},function(){});
  }
  if(round%5===4){if(page==="users")loadAccounts();if(page==="mod"||page==="laws")loadLists()}
  round++;
}

function p2(n){return n<10?"0"+n:String(n)}
// 存档时间：当天只写几点几分，隔天带上月日
function when(iso,brief){
  if(!iso)return null;
  var d=new Date(iso);if(isNaN(d))return String(iso);
  var hm=p2(d.getHours())+":"+p2(d.getMinutes()),today=new Date();
  if(brief&&d.toDateString()===today.toDateString())return hm;
  return (d.getMonth()+1)+"-"+p2(d.getDate())+" "+hm;
}
function detached(){return !!((host&&host.detached)||(save&&save.detached))}
function canStop(){return host?!!host.can_stop:detached()}
function xs(p){p=Number(p)/100;if(!(p>0))return"×0";return"×"+(p>=10||p===Math.round(p)?String(Math.round(p)):String(Math.round(p*100)/100))}
function drawHome(){
  var lamp=$("lamp"),loaded=!!(state&&state.loaded),dated=loaded&&state.year!==undefined;
  lamp.className="lamp "+(gone||!alive?"off":loaded?"on":"wait");
  $("lamp-t").textContent=t(gone?"lamp_gone":!alive?"lamp_off":loaded?"lamp_on":"lamp_wait");
  $("v-date").textContent=dated?t("month",state.month):"—";
  $("k-date").textContent=dated?t("k_date",state.year):t("k_date_none");
  var lagging=loaded&&!state.paused&&state.actual>=0;
  // 流速显示成游戏原版的倍数 ×N(服务器报的是百分数，100 = 常速)
  $("v-speed").textContent=loaded&&state.speed!==undefined?xs(lagging?state.actual:state.speed):"—";
  $("k-speed").textContent=loaded&&state.paused?t("paused"):lagging?t("k_speed_slow",xs(state.speed)):t("k_speed");
  var online=host&&host.online!==undefined?host:srv;
  $("v-online").textContent=online?online.online+" / "+online.max:"—";
  var saved=save?when(save.saved,true):null;
  $("v-saved").textContent=save?(saved||t("never")):"—";
  $("k-saved").textContent=t("k_saved");
  $("b-save-sub").textContent=(save&&save.saved?t("b_save_sub",when(save.saved)):t("b_save_none"))+(save&&save.autosave_minutes>0?" · "+t("auto",save.autosave_minutes):"");
  $("v-mode").textContent=host||save?t(detached()?"mode_detached":host&&host.can_stop?"mode_alone":"mode_game"):"—";
  var addr=host&&(host.address||host.scan)||"";
  $("v-addr").textContent=addr||"—";$("v-addr").title=host&&host.scan||"";
  $("link-note").textContent=t(host&&host.qr_admin?"admin_qr_note":"link_note");
  var code=host&&host.admin_code;
  $("v-admin-code").hidden=!code;
  $("v-admin-code").textContent=code?t("admin_code",code):"";
  $("b-qr").hidden=!(host&&host.qr&&host.qr.length);$("b-copy").hidden=!addr;
  $("b-stop").hidden=!canStop();
  $("b-stop-t").textContent=t(detached()?"b_stop_game":"b_stop");
  $("b-stop-sub").textContent=t(detached()?"b_stop_game_sub":"b_stop_sub");
  var box=$("seats"),seats=state&&state.seats||[],on=0;
  box.textContent="";
  seats.forEach(function(s){
    if(s.online)on++;
    var row=el("div","seat"+(s.online?" on":""));
    row.appendChild(el("span","dot"));
    if(s.color){var sw=el("span","sw");sw.style.background=s.color;row.appendChild(sw)}
    row.appendChild(el("span","who",s.name+(s.ruler?" · "+s.ruler:"")));
    row.appendChild(el("span","muted",s.ruler?(s.realm||"")+(s.cities!==undefined?" · "+t("cities",s.cities):""):t("seat_free")));
    box.appendChild(row);
  });
  if(!seats.length)box.appendChild(el("div","empty",t("seats_none")));
  $("seat-count").textContent=seats.length?t("seat_count",seats.length,on):"";
}

// ───── 二维码：核心给格子(一行一个 01 字符串)，这里只管画 ─────
function drawQr(c){
  var q=host&&host.qr;
  if(!q||!q.length){c.hidden=true;return false}
  c.hidden=false;
  var quiet=4,n=q.length,side=n+quiet*2,x=c.getContext("2d");
  c.width=c.height=side;c.title=t(host.qr_admin?"admin_qr_title":"qr_title");
  x.fillStyle="#fff";x.fillRect(0,0,side,side);x.fillStyle="#000";
  for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(q[r].charAt(k)==="1")x.fillRect(k+quiet,r+quiet,1,1);
  return true;
}
function bigQr(){
  dialog(function(box){
    box.appendChild(el("h3",null,t(host&&host.qr_admin?"admin_qr_title":"qr_title")));
    var c=el("canvas");c.id="dialog-qr";box.appendChild(c);
    if(!drawQr(c))box.replaceChild(el("div","muted",t("no_qr")),c);
    var a=el("div","muted",host&&(host.scan||host.address)||"");a.style.textAlign="center";a.style.userSelect="text";box.appendChild(a);
    buttons(box,[{text:t("close"),go:closeDialog}]);
  });
}
function copyAddr(){
  var text=host&&(host.scan||host.address);
  if(!text)return;
  try{navigator.clipboard.writeText(text).then(function(){toast(t("copied"))},function(){})}catch(e){}
}
$("qr").onclick=bigQr;$("b-qr").onclick=bigQr;$("b-copy").onclick=copyAddr;$("v-addr").onclick=copyAddr;

// ───── 对话框 ─────
function dialog(fill){var d=$("dlg");d.textContent="";fill(d);$("veil").className="show"}
function closeDialog(){$("veil").className=""}
function buttons(box,list){
  var row=el("div","btns");
  list.forEach(function(b){var e=el("button",b.cls||"",b.text);e.onclick=b.go;row.appendChild(e)});
  box.appendChild(row);
}
function confirmBox(title,note,danger,go){
  dialog(function(box){
    box.appendChild(el("h3",null,title));box.appendChild(el("div","muted",note));
    buttons(box,[{text:t("cancel"),go:closeDialog},{text:t("ok"),cls:danger?"danger":"primary",go:function(){closeDialog();go()}}]);
  });
}
$("veil").onclick=function(e){if(e.target===this)closeDialog()};

// ───── 操作 ─────
// 网页管理页在系统浏览器里开：叫核心去开(它带上登入用的票)；老一点的核心没有这个接口，就在这里开
$("b-admin").onclick=function(){
  api("POST","/api/admin/open",{page:"admin"}).then(function(r){
    if(r.status===200){toast(t("opened"));return}
    store("ec_role","admin");window.open("/","_blank");
  },function(){toast(t("e_net"),true)});
};
$("b-save").onclick=function(){
  api("POST","/api/admin/save").then(function(r){if(r.status===200){save=r.json;toast(t("saving"));setTimeout(function(){tick(true)},1500)}else toast(t("e_fail"),true)},function(){toast(t("e_net"),true)});
};
$("b-stop").onclick=function(){
  var back=detached();
  confirmBox(t("stop_title"),t(back?"stop_game_note":"stop_note"),true,function(){
    api("POST","/api/admin/return",{}).then(function(r){
      if(r.status!==200){toast(t("e_fail"),true);return}
      gone=true;drawHome();
      dialog(function(box){box.appendChild(el("h3",null,t("lamp_gone")));box.appendChild(el("div","muted",t("stopping")))});
    },function(){toast(t("e_net"),true)});
  });
};

// ───── 模组设置、世界法则 ─────
var folded={};
function loadLists(){
  api("GET","/api/admin/settings").then(function(r){if(r.status===200){lists=r.json;drawList("mod");drawList("laws")}},function(){});
}
function drawList(kind){
  var box=$(kind+"-list"),rows=lists?(kind==="mod"?lists.settings:lists.laws)||[]:[];
  // 正在某个框里打字时不重画，免得把字冲掉
  if(document.activeElement&&box.contains(document.activeElement))return;
  var find=$(kind+"-find").value.trim().toLowerCase(),shown=0,top=box.scrollTop;
  box.textContent="";
  // 核心给了类名(group)和类的先后(order)就按类排，一类一个标题条，点一下收起；搜的时候都摊开
  var grouped=rows.some(function(it){return !!it.group}),last=null,head=null,inGroup=0;
  if(grouped)rows=rows.map(function(it,i){return{it:it,i:i}}).sort(function(a,b){return (a.it.order||0)-(b.it.order||0)||a.i-b.i}).map(function(x){return x.it});
  rows.forEach(function(it){
    if(find&&(it.name+" "+(it.desc||"")+" "+(it.group||"")+" "+it.id).toLowerCase().indexOf(find)<0)return;
    shown++;
    if(grouped&&it.group!==last){
      last=it.group;inGroup=0;
      head=el("div","grp");
      var shut=!find&&!!folded[kind+":"+last];
      head.appendChild(el("span","fold",shut?"+":"-"));head.appendChild(el("span",null,last||t("grp_other")));
      head.appendChild(el("span","n"));
      head.onclick=(function(name){return function(){folded[kind+":"+name]=!folded[kind+":"+name];drawList(kind)}})(last);
      box.appendChild(head);
    }
    if(head){inGroup++;head.lastChild.textContent=t("count",inGroup)}
    if(grouped&&!find&&folded[kind+":"+last])return;
    var row=el("div","row"),txt=el("div","txt");
    txt.appendChild(el("div",null,it.name));if(it.desc)txt.appendChild(el("div","d",it.desc));
    row.appendChild(txt);
    var isSwitch=kind==="laws"||it.kind==="switch",on=kind==="laws"?!!it.on:it.value===true;
    if(isSwitch){
      var g=el("img","tog");g.src="host/DefaultToggle1"+(on?"On":"Off")+".png";g.alt=t(on?"on":"off");g.title=t(on?"on":"off");
      g.onclick=function(){change(kind,it,!on)};row.appendChild(g);
    }else{
      var inp=el("input");inp.value=it.value===null||it.value===undefined?"":String(it.value);inp.spellcheck=false;
      inp.onkeydown=function(e){if(e.key==="Enter")inp.blur();if(e.key==="Escape"){inp.value=String(it.value);inp.blur()}};
      inp.onchange=function(){if(inp.value!==String(it.value))change(kind,it,inp.value)};
      row.appendChild(inp);
    }
    box.appendChild(row);
  });
  if(!shown)box.appendChild(el("div","empty",t("none")));
  $(kind+"-count").textContent=t("count",shown);
  box.scrollTop=top;
}
function change(kind,it,value){
  var req=kind==="laws"?api("POST","/api/admin/law",{id:it.id,on:value}):api("POST","/api/admin/settings",{id:it.id,value:value});
  req.then(function(r){
    if(r.status!==200){toast(t("e_fail"),true);return}
    if(kind==="laws")it.on=value;else it.value=value;
    toast(t("changed",it.name));drawList(kind);
    // 核心在主循环里才真改：过一会儿照它的再对一遍
    setTimeout(loadLists,1200);
  },function(){toast(t("e_net"),true)});
}
$("mod-find").oninput=function(){drawList("mod")};$("laws-find").oninput=function(){drawList("laws")};

// ───── 用户管理 ─────
function loadAccounts(){
  api("GET","/api/admin/accounts").then(function(r){if(r.status===200){accounts=r.json;drawAccounts()}},function(){});
}
function drawAccounts(){
  var box=$("users-list"),rows=accounts&&accounts.accounts||[];
  $("users-note").textContent=accounts?t("users_note",rows.length,t(accounts.registration==="closed"?"reg_closed":accounts.registration==="code"?"reg_code":"reg_open")):"";
  box.textContent="";
  if(!rows.length){box.appendChild(el("div","empty",t("users_none")));return}
  var table=el("table"),head=el("tr");
  ["u_user","u_created","u_last","u_seat",""].forEach(function(k,i){head.appendChild(el("th",i===4?"r":"",k?t(k):""))});
  table.appendChild(head);
  rows.forEach(function(a){
    var tr=el("tr");
    tr.appendChild(el("td",null,a.user));tr.appendChild(el("td","muted",when(a.created)||"—"));tr.appendChild(el("td","muted",when(a.last)||"—"));
    tr.appendChild(el("td",a.seat?"":"muted",t(a.seat?"u_has":"u_no")));
    var td=el("td","r"),b=el("button","small danger");
    var ic=el("img","ico");ic.src="host/iconRemove.png";ic.alt="";b.appendChild(ic);b.appendChild(el("span",null,t("u_delete")));
    b.onclick=function(){
      confirmBox(t("del_title",a.user),t("del_note"),true,function(){
        api("POST","/api/admin/account/delete",{user:a.user}).then(function(r){
          if(r.status===200){toast(t("deleted",a.user));loadAccounts()}else toast(t("e_fail"),true);
        },function(){toast(t("e_net"),true)});
      });
    };
    td.appendChild(b);tr.appendChild(td);table.appendChild(tr);
  });
  box.appendChild(table);
}
$("users-refresh").onclick=loadAccounts;

// ───── 开始：先问核心用哪种语言 ─────
fetch("/api/server",{cache:"no-store"}).then(function(r){return r.status===200?r.json():null}).then(function(j){
  if(j){srv=j;if(S[j.lang])lang=j.lang}
},function(){}).then(function(){
  applyLang();goPage(S.cz[("tab_"+page)]?page:"home");drawHome();
  // 带着码或票进来、又没有旧令牌：直接拿它登
  if(!token&&carried)lostToken();else tick(true);
  setInterval(function(){if(!document.hidden)tick(false)},3000);
});
})();
