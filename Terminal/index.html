<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4c5143">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="终端">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>EmpireCraft Terminal</title>
<style>
:root{--bg:#14150f;--card:#1e2018;--line:#3a3d2e;--ink:#e8e2cf;--soft:#b9b39d;--mute:#8a8f80;--gold:#f3c34a;--cyan:#7fd8ea;--green:#65d66e;--red:#e2675a;--amber:#e9a85b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:12px 14px calc(76px + env(safe-area-inset-bottom))}
h1{font-size:19px;font-weight:600;margin:0;color:var(--gold)}
h2{font-size:14px;font-weight:600;margin:0 0 8px;color:var(--gold)}
.sub{font-size:12.5px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rows>div{padding:9px 0;border-top:1px solid var(--line)}
.rows>div:first-child{border-top:0;padding-top:2px}
.tag{font-size:11.5px;padding:1px 8px;border-radius:9px;border:1px solid var(--line);color:var(--soft);white-space:nowrap;flex:none}
.tag.gold{color:var(--gold);border-color:#6b5a26}.tag.amber{color:var(--amber);border-color:#6b4f2a}
.tag.red{color:var(--red);border-color:#6b322c}.tag.green{color:var(--green);border-color:#2f5f33}.tag.cyan{color:var(--cyan);border-color:#2f5a63}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:#191b14;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.kpi b{display:block;font-size:18px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
button,input{font:inherit;color:var(--ink)}
button{background:#2a2c20;border:1px solid #5a5a40;border-radius:8px;padding:10px 14px;min-height:44px}
button.primary{background:#5a4a1c;border-color:var(--gold);color:#fff3cf}
button:active{transform:scale(.98)}
input{background:#101109;border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
input:focus,button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
#code{font-size:26px;letter-spacing:.35em;text-align:center}
.err{color:var(--red);font-size:13px;min-height:20px;margin-top:6px}
#bar{position:sticky;top:0;z-index:3;background:var(--bg);padding:6px 0 8px;border-bottom:1px solid var(--line)}
#warn{display:none;background:#4a2320;color:#ffd9d2;font-size:13px;padding:6px 10px;border-radius:8px;margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:#191b14;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:4}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.world{font-size:13px;font-weight:600;color:var(--gold);margin:16px 0 2px}
.nation{padding:10px 0;border-top:1px solid var(--line)}
.act{min-height:40px;padding:8px 12px;margin:8px 8px 0 0}
#sheet{position:fixed;left:0;top:0;right:0;bottom:0;z-index:6}
.sheet-back{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.6)}
.sheet-box{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}
.pick.primary{background:#5a4a1c;border-color:var(--gold)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));background:#2a2c20;border:1px solid var(--gold);color:var(--ink);padding:10px 14px;border-radius:10px;z-index:5;width:max-content;max-width:90%;font-size:14px}
.banner{background:#3a2f12;border:1px solid #6b5a26;color:var(--gold);border-radius:10px;padding:10px 14px;margin-top:10px;cursor:pointer}
nav button{border:0;border-radius:0;background:none;color:var(--mute);min-height:56px;font-size:14px}
nav button.on{color:var(--gold);box-shadow:inset 0 2px 0 var(--gold)}
.bar{height:6px;border-radius:3px;background:#101109;margin-top:8px;overflow:hidden}
.bar i{display:block;height:6px;border-radius:3px}
canvas{display:block;width:100%;border-radius:10px;border:1px solid var(--line);background:#0e0f0c;touch-action:none;cursor:grab}
.zoom button{min-height:40px;min-width:44px;padding:6px 10px;margin-left:6px;font-size:17px}
.zoom button[disabled]{opacity:.4}
.pick{width:100%;text-align:left;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pick[disabled]{opacity:.5}
.detail{display:none;font-size:13px;color:var(--soft);margin-top:6px}
.open .detail{display:block}
.report{cursor:pointer}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
[hidden]{display:none!important}

/* ───── 帝国盒子的界面风格(用户 2026-11-11 "ui 尽量用和帝国盒子 ui 一样的风格，包括 frame 之类的") ─────
   配色取自游戏里的宽窗口(橄榄灰的窗底、深色卡片、WideKit 的金青绿红)，卡片套同一张像素框 FactionFrame，
   要紧的卡(待批、弹出的选择界面)套金框 FactionFrame_dominate；一律方角，按钮是深边加顶上一道高光。
   框图取不到(游戏里的终端是旧版)时卡片只是没有框，底色照旧 */
:root{--bg:#4c5143;--card:#2c312a;--card2:#3d4036;--line:#565b4c;--edge:#14160f;--ink:#f2eee2;--soft:#c8c2b4;--mute:#8fa0a8;
  --gold:#f3c34a;--cyan:#7fd8ea;--green:#65d66e;--red:#ff6666;--amber:#e9a85b}
html,body{background:var(--bg)}
h1{color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.45)}
h2{color:var(--gold);text-shadow:0 1px 0 rgba(0,0,0,.45)}
.card,.banner,.sheet-box{border-radius:0;border:12px solid transparent;background:var(--card);
  border-image:url(FactionFrame.png) 12 fill / 12px stretch;image-rendering:pixelated}
.card{padding:4px 6px}
.banner{border-image-source:url(FactionFrame_dominate.png);padding:2px 6px;color:var(--gold)}
.sheet-box{border-image-source:url(FactionFrame_dominate.png);padding:6px 6px calc(10px + env(safe-area-inset-bottom))}
#decrees>.card:first-child{border-image-source:url(FactionFrame_dominate.png)}
.kpi{background:var(--card2);border:1px solid var(--edge);border-radius:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.kpi b{color:var(--gold)}
.rows>div,.nation{border-top-color:var(--line)}
button{border-radius:0;border:2px solid var(--edge);background:#3a4039;color:var(--ink);box-shadow:inset 0 2px 0 #50584e}
button:active{box-shadow:inset 0 2px 0 var(--edge);transform:translateY(1px)}
button.primary,.pick.primary,.act.primary{background:#4f9442;border-color:var(--edge);color:#fff;box-shadow:inset 0 2px 0 #73b862}
button[disabled]{opacity:.45}
.pick{background:#333930}
input{border-radius:0;border:2px solid var(--edge);background:#161812;box-shadow:inset 0 2px 0 rgba(0,0,0,.5)}
.tag{border-radius:0;background:#1d201a;border-color:var(--edge)}
.tag.gold{border-color:#7a6426}.tag.amber{border-color:#7a5a2c}.tag.red{border-color:#7a3232}.tag.green{border-color:#35693a}.tag.cyan{border-color:#33636d}
#bar{background:var(--bg);border-bottom:2px solid var(--edge)}
#warn{border-radius:0;border:2px solid var(--edge);background:#5a2620}
nav{background:var(--card);border-top:2px solid var(--edge)}
nav button{box-shadow:none;border:0;background:none}
nav button.on{color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}
canvas{border-radius:0;border:2px solid var(--edge)}
.bar{border-radius:0;border:1px solid var(--edge);background:#161812;height:8px}
.bar i{border-radius:0;height:6px}
.world{text-shadow:0 1px 0 rgba(0,0,0,.45)}
.sheet-back{background:rgba(10,12,8,.7)}
#toast{border-radius:0;border-width:2px;background:var(--card)}
.sw{border-radius:0}
</style>
</head>
<body>
<div id="app">

<section id="s-pair" hidden>
  <h1 data-t="pair_title"></h1>
  <p class="sub" data-t="pair_hint"></p>
  <div class="card">
    <label class="sub" for="name" data-t="pair_name"></label>
    <input id="name" maxlength="16" autocomplete="nickname" style="margin:4px 0 12px">
    <label class="sub" for="code" data-t="pair_code"></label>
    <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" style="margin-top:4px">
    <div class="err" id="pair-err"></div>
    <button class="primary" id="pair-go" style="width:100%" data-t="pair_go"></button>
  </div>
</section>

<section id="s-wait" hidden>
  <h1 data-t="app_title"></h1>
  <div class="card"><div data-t="wait_world"></div><div class="sub" data-t="wait_world_hint"></div></div>
</section>

<section id="s-vacant" hidden>
  <h1 data-t="vacant_title"></h1>
  <p class="sub" id="vacant-why"></p>
  <div id="rulers"></div>
</section>

<section id="s-main" hidden>
  <div id="bar">
    <div class="row"><h1 id="realm"></h1><span class="sub" id="date"></span></div>
    <div class="row"><span class="sub" id="ruler"></span><span class="sub" id="pace"></span></div>
    <div id="warn" data-t="offline"></div>
    <div id="stale" class="banner" hidden data-t="stale"></div>
    <div id="away" class="banner" hidden></div>
  </div>

  <div id="p-reports">
    <div class="banner" id="vote-banner" hidden style="cursor:pointer"></div>
    <div class="banner" id="pending-banner" hidden></div>
    <div class="card">
      <div class="sub" id="since"></div>
      <div class="grid" style="margin-top:8px">
        <div class="kpi"><span class="sub" data-t="kpi_wars"></span><b id="k-wars">0</b></div>
        <div class="kpi"><span class="sub" data-t="kpi_new"></span><b id="k-new">0</b></div>
        <div class="kpi"><span class="sub" data-t="kpi_trust"></span><b id="k-trust"></b></div>
      </div>
    </div>
    <div class="card"><h2 data-t="reports"></h2><div class="rows" id="reports"></div></div>
  </div>

  <div id="p-map" hidden>
    <div class="card" style="padding:10px">
      <canvas id="map" width="600" height="360"></canvas>
      <div class="row" style="margin-top:8px"><span id="map-pick" class="sub" data-t="map_tap"></span><span class="zoom" style="flex:none"><button id="z-out" aria-label="zoom out">&minus;</button><button id="z-in" aria-label="zoom in">+</button><button id="z-reset" data-t="map_reset" style="font-size:13px"></button></span></div>
      <div id="map-acts"></div>
    </div>
    <div class="card">
      <span class="tag cyan" id="sight"></span><div class="sub" id="sight-note" style="margin-top:6px"></div>
      <div style="margin-top:8px;font-size:13px;color:var(--soft)">
        <div><span class="sw" style="background:var(--gold)"></span><span data-t="lg_own"></span></div>
        <div><span class="sw" style="background:#7a8f6a"></span><span data-t="lg_known"></span></div>
        <div><span class="sw" style="background:repeating-linear-gradient(45deg,#7a8f6a 0 3px,#34392e 3px 6px)"></span><span data-t="lg_rumour"></span></div>
        <div><span class="sw" style="background:#0e0f0c;border:1px solid var(--line)"></span><span data-t="lg_fog"></span></div>
      </div>
    </div>
  </div>

  <div id="p-decrees" hidden><div id="decrees"></div></div>

  <div id="p-realm" hidden>
    <div class="card">
      <div class="row"><h2 style="margin:0" data-t="officials"></h2><span class="tag amber" id="corr"></span></div>
      <div class="bar"><i id="corr-bar" style="background:var(--amber)"></i></div>
      <div class="sub" id="trust-note" style="margin-top:6px"></div>
      <button class="act" id="purge-go" data-t="purge_go"></button>
    </div>
    <div class="grid" style="margin-top:10px">
      <div class="kpi"><span class="sub" data-t="f_treasury"></span><b id="f-treasury"></b><span class="sub" id="f-treasury-n"></span></div>
      <div class="kpi"><span class="sub" data-t="f_army"></span><b id="f-army"></b><span class="sub" id="f-army-n"></span></div>
      <div class="kpi"><span class="sub" data-t="f_people"></span><b id="f-people"></b><span class="sub" id="f-people-n"></span></div>
    </div>
    <div class="card"><h2 data-t="wars"></h2><div class="rows" id="wars"></div></div>
    <div class="card" id="a2hs" hidden><h2 data-t="a2hs"></h2><div id="fixed-box" hidden><div class="sub" id="fixed-note"></div><button class="act" id="fixed-go" data-t="a2hs_fixed"></button></div><div class="sub" data-t="a2hs_ios"></div><div class="sub" data-t="a2hs_android" style="margin-top:4px"></div></div>
    <div class="card"><h2 data-t="cities"></h2><div class="sub" data-t="cities_note"></div><div class="rows" id="cities" style="margin-top:6px"></div></div>
  </div>
</section>
</div>

<div id="sheet" hidden><div class="sheet-back" id="sheet-back"></div><div class="sheet-box" role="dialog" aria-modal="true"><div class="row"><h2 id="sheet-title" style="margin:0"></h2><button id="sheet-close" class="act" style="margin:0" aria-label="close">&times;</button></div><div class="sub" id="sheet-note" style="margin-top:4px"></div><div id="sheet-body"></div></div></div>
<div id="toast" role="status" hidden></div>
<nav id="nav" hidden><div>
  <button data-p="reports" data-t="tab_reports" class="on"></button>
  <button data-p="map" data-t="tab_map"></button>
  <button data-p="realm" data-t="tab_realm"></button>
  <button data-p="decrees" data-t="tab_decrees"></button>
</div></nav>

var lang=/^zh/i.test(navigator.language||"")?(/tw|hk|hant/i.test(navigator.language)?"ch":"cz"):"en";
function t(key){var s=(T[lang]||T.en)[key];if(s==null)s=T.en[key]||key;for(var i=1;i<arguments.length;i++)s=s.split("{"+(i-1)+"}").join(arguments[i]);return s}
function $(id){return document.getElementById(id)}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function applyLang(){document.documentElement.lang=lang==="en"?"en":"zh";var n=document.querySelectorAll("[data-t]");for(var i=0;i<n.length;i++)n[i].textContent=t(n[i].getAttribute("data-t"))}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function num(v){return Number(v).toLocaleString(lang==="en"?"en-US":"zh-CN")}
// 大数缩写(卡片里放得下)：中文按万、亿，英文按 K、M
function trim1(x){var s=x.toFixed(x>=100?0:1);return s.replace(/\.0$/,"")}
function short(v){
  v=Number(v);var a=Math.abs(v);
  if(lang==="en")return a>=1e9?trim1(v/1e9)+"B":a>=1e6?trim1(v/1e6)+"M":a>=1e4?trim1(v/1e3)+"K":num(v);
  var wan=lang==="ch"?"萬":"万",yi=lang==="ch"?"億":"亿";
  return a>=1e8?trim1(v/1e8)+" "+yi:a>=1e4?trim1(v/1e4)+" "+wan:num(v);
}

// 这份网页要游戏里的终端至少是第几版(见 TerminalHost.Version)
var NEED=10;
// 网页所在的路径：直连时是空的；经联机大厅进来是 /r/房间号。接口都接在它后面，令牌也按它分开存(一个大厅域名下有许多房间)
var BASE=location.pathname.replace(/\/[^\/]*$/,""),TOKEN_KEY="ec_token"+(BASE?":"+BASE:"");
var token=store(TOKEN_KEY),state=null,map=null,page="reports",fails=0,openReport=null,openCity=null,lastMapAt=0;

function api(method,path,body){
  var opt={method:method,headers:{},cache:"no-store"};
  if(token)opt.headers["X-Terminal-Token"]=token;
  if(body){opt.body=JSON.stringify(body);opt.headers["Content-Type"]="application/json"}
  return fetch(BASE+path,opt).then(function(r){return r.json().then(function(j){return{status:r.status,json:j}},function(){return{status:r.status,json:{}}})});
}
function show(id){["s-pair","s-wait","s-vacant","s-main"].forEach(function(s){$(s).hidden=s!==id});$("nav").hidden=id!=="s-main"}

// 配对
$("pair-go").onclick=function(){
  var code=$("code").value.replace(/\D/g,"");
  if(code.length!==6){$("pair-err").textContent=t("e_code");return}
  $("pair-err").textContent="";
  api("POST","/api/pair",{code:code,name:$("name").value}).then(function(r){
    if(r.status===200&&r.json.token){token=r.json.token;store(TOKEN_KEY,token);$("code").value="";poll()}
    else $("pair-err").textContent=t("e_"+(r.json.error||"net"));
  },function(){$("pair-err").textContent=t("e_net")});
};
$("code").oninput=function(){$("pair-err").textContent=""};

// 轮询
function poll(){
  if(!token){show("s-pair");autoPair();return}
  api("GET","/api/state").then(function(r){
    if(r.status===401){token=null;store(TOKEN_KEY,null);show("s-pair");autoPair();return}
    fails=0;$("warn").style.display="none";
    state=r.json;
    if(state.lang&&T[state.lang]&&state.lang!==lang){lang=state.lang;applyLang()}
    render();
    if(state.loaded&&!state.vacant&&(page==="map"||!map)&&Date.now()-lastMapAt>15000)loadMap();
  },function(){if(++fails>=2)$("warn").style.display="block"});
}
function loadMap(){
  lastMapAt=Date.now();
  api("GET","/api/map").then(function(r){if(r.status===200&&r.json.ready){map=decodeMap(r.json);drawMap()}},function(){});
}

function render(){
  if(!state.loaded){show("s-wait");return}
  if(state.vacant){renderVacant();return}
  show("s-main");
  $("realm").textContent=state.realm.name;
  $("date").textContent=t("date",state.year,state.month);
  $("ruler").textContent=t("ruler",state.ruler.name,state.ruler.age)+" · "+t("role_"+state.realm.role);
  $("pace").textContent=state.paused?t("paused"):t("pace",state.speed);
  renderVote();
  $("stale").hidden=(state.v||0)>=NEED;
  $("away").hidden=!state.away;
  if(state.away)$("away").textContent=state.away.kind==="campaign"?t("away_campaign"):t("away_tour",state.away.city,state.away.left);
  renderReports();renderRealm();renderSight();renderDecrees();renderMapActs();
}

// 凡是列国家的地方都按 天下 → 帝国或王国 → 行政区 归类。items 每项要有 tianxia、empire、kind、cities、id；
// makeRow(项, 是否缩进) 给出这一行；opened 记哪些帝国的行政区展开着；again 是重画这一处的函数
function renderGrouped(box,items,makeRow,opened,again){
  var worlds={},order=[];
  items.forEach(function(r){
    var key=r.tianxia||"";
    if(!worlds[key]){worlds[key]={name:key,cities:0,units:{},list:[]};order.push(worlds[key])}
    var w=worlds[key],uk=r.empire?"e:"+r.empire:"k:"+r.id,u=w.units[uk];
    if(!u){u=w.units[uk]={empire:r.empire||null,head:null,members:[],cities:0};w.list.push(u)}
    if(r.kind==="member"||r.kind==="official")u.members.push(r);else u.head=r;
    u.cities+=r.cities||0;w.cities+=r.cities||0;
  });
  order.sort(function(x,y){return (x.name===""?1:0)-(y.name===""?1:0)||y.cities-x.cities});
  order.forEach(function(w){
    box.appendChild(el("div","world",(w.name||t("tx_none"))+" · "+t("tx_cities",w.cities)));
    w.list.sort(function(x,y){return y.cities-x.cities});
    w.list.forEach(function(u){
      if(u.head)box.appendChild(makeRow(u.head,false));
      else if(u.empire){var orphan=el("div","sub",u.empire);orphan.style.marginTop="10px";box.appendChild(orphan)}
      if(!u.members.length)return;
      var key=w.name+"/"+u.empire,open=!!opened[key];
      var more=el("button","act",t("tx_members",u.members.length)+(open?"  −":"  +"));more.style.marginLeft="16px";
      more.onclick=function(e){e.stopPropagation();opened[key]=!open;again()};
      box.appendChild(more);
      if(open){u.members.sort(function(x,y){return (y.cities||0)-(x.cities||0)});u.members.forEach(function(m){box.appendChild(makeRow(m,true))})}
    });
  });
}
function renderVacant(){
  show("s-vacant");map=null;mv.set=false;
  var f=state.former||{},why=state.reason||"none";
  $("vacant-why").textContent=why==="none"||!f.realm?t("why_none"):t("why_"+why,f.realm,f.ruler);
  var box=$("rulers");box.textContent="";
  function pickButton(r,indent){
    var b=el("button","pick"),left=el("span"),right=el("span","tag "+(r.taken?"":"gold"),r.taken?t("taken",r.taken):t("pick"));
    left.appendChild(el("div",null,r.realm+" · "+r.ruler));
    left.appendChild(el("div","sub",t("ruler_detail",t("role_"+r.kind),r.cities,r.age)));
    b.appendChild(left);b.appendChild(right);
    if(indent){b.style.marginLeft="16px";b.style.width="calc(100% - 16px)"}
    if(r.taken)b.disabled=true;
    b.onclick=function(){b.disabled=true;api("POST","/api/choose",{id:r.id}).then(function(){setTimeout(poll,600)},function(){b.disabled=false})};
    return b;
  }
  renderGrouped(box,state.rulers||[],pickButton,openEmpire,renderVacant);
}
var openEmpire={},openDiplo={},openSpy={};

function span(months){months=Math.max(0,months);return months>=12?t("span_y",Math.floor(months/12),months%12):t("span_m",months)}

function renderReports(){
  var key="ec_seen_"+state.realm.name,seen=null;
  try{seen=JSON.parse(store(key)||"null")}catch(e){}
  var nowMonths=state.year*12+state.month,reports=state.reports||[],fresh=0;
  if(seen){
    var mins=Math.max(0,Math.round((Date.now()-seen.at)/60000));
    $("since").textContent=t("since",mins>=60?t("real_h",Math.floor(mins/60),mins%60):t("real_m",mins),span(nowMonths-seen.m));
    reports.forEach(function(r){if(r.id>seen.id)fresh++});
  }else{$("since").textContent=t("since_first");fresh=reports.length}
  $("k-wars").textContent=(state.wars||[]).length;
  $("k-new").textContent=fresh;
  $("k-trust").textContent=t("trust"+state.intel.trust);
  var box=$("reports");box.textContent="";
  if(!reports.length)box.appendChild(el("div","sub",t("no_reports")));
  reports.forEach(function(r){
    var item=el("div","report"+(openReport===r.id?" open":"")),head=el("div","row"),left=el("div");
    left.appendChild(el("div",null,r.text));
    left.appendChild(el("div","sub",t("date",r.year,r.month)));
    head.appendChild(left);
    var tags=el("div");tags.style.cssText="display:flex;flex-direction:column;gap:4px;align-items:flex-end";
    if(!r.own&&r.kind!=="spy")tags.appendChild(el("span","tag cyan",t("k_foreign")));
    if(r.kind==="major")tags.appendChild(el("span","tag red",t("k_major")));
    else if(r.kind==="ledger")tags.appendChild(el("span","tag gold",t("k_ledger")));
    else if(r.kind==="order")tags.appendChild(el("span","tag green",t("k_order")));
    else if(r.kind==="spy")tags.appendChild(el("span","tag cyan",t("k_spy")));
    else if(r.kind==="tour")tags.appendChild(el("span","tag gold",t("c_toured")));

    if(r.late>0)tags.appendChild(el("span","tag amber",t("late",r.late)));
    head.appendChild(tags);item.appendChild(head);
    var d=t("d_when",r.year,r.month)+(r.late>0?t("d_late",r.late):t("d_prompt"));
    if(r.kind==="ledger")d+=t("d_ledger");else if(!r.own)d+=t("d_foreign");
    item.appendChild(el("div","detail",d));
    item.onclick=function(){openReport=openReport===r.id?null:r.id;renderReports()};
    box.appendChild(item);
  });
  if(state.intel.lost>0)box.appendChild(el("div","sub",t("lost")));
  // 看过了：记下这回看到哪(换页、离开时才记，免得"新到"立刻归零)
  pendingSeen={key:key,value:JSON.stringify({at:Date.now(),m:nowMonths,id:reports.length?reports[0].id:(seen?seen.id:0)})};
}
var pendingSeen=null;
function commitSeen(){if(pendingSeen){store(pendingSeen.key,pendingSeen.value);pendingSeen=null}}
window.addEventListener("pagehide",commitSeen);
document.addEventListener("visibilitychange",function(){if(document.hidden)commitSeen();else poll()});

function renderRealm(){

      line(t("cd_corr",Math.round(c.corruption*100)));line(t("cd_zones",c.zones));

// 地图：先把"所知天下"那一片画成一张像素图，再按眼下的视野(放大几倍、对着哪里)贴到画布上。
// 双指捏合、滚轮、加减按钮放大缩小，单指拖动挪地方；没怎么动的一下算点选
var FOG=254,WATER=253,WILD=252,mv={z:1,x:0,y:0,set:false},MAXZ=8;
function decodeMap(j){
  var bin=atob(j.cells),cells=new Uint8Array(j.w*j.h),at=0;
  for(var i=0;i+1<bin.length;i+=2){var v=bin.charCodeAt(i),n=bin.charCodeAt(i+1);for(var k=0;k<n&&at<cells.length;k++)cells[at++]=v}

  for(var y=0;y<j.h;y++)for(var x=0;x<j.w;x++)if(cells[y*j.w+x]!==FOG){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0){x0=0;y0=0;x1=j.w-1;y1=j.h-1}
  x0=Math.max(0,x0-3);y0=Math.max(0,y0-3);x1=Math.min(j.w-1,x1+3);y1=Math.min(j.h-1,y1+3);
  j.grid=cells;j.view={x:x0,y:y0,w:x1-x0+1,h:y1-y0+1};
  j.realms.forEach(function(r){var c=r.color||"#888888";r.rgb=[parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)]});
  if(!mv.set){mv.set=true;mv.z=1;mv.x=x0+(x1-x0+1)/2;mv.y=y0+(y1-y0+1)/2}
  return j;
}
function paintMap(){
  var v=map.view,off=document.createElement("canvas");off.width=v.w;off.height=v.h;
  var octx=off.getContext("2d"),img=octx.createImageData(v.w,v.h),d=img.data,g=map.grid,W=map.w;
  function cell(x,y){return x<0||y<0||x>=map.w||y>=map.h?FOG:g[y*W+x]}
  for(var y=0;y<v.h;y++)for(var x=0;x<v.w;x++){
    var gx=v.x+x,gy=v.y+y,c=g[gy*W+gx],r,gg,b;
    if(c===FOG){var s=((gx+gy)%4===0)?22:14;r=s;gg=s+1;b=s-2}
    else if(c===WATER){r=28;gg=38;b=44}

      if(realm&&realm.tier===2){if((gx+gy)%3!==0){r=(r+52*2)/3;gg=(gg+57*2)/3;b=(b+46*2)/3}}
      var edge=cell(gx+1,gy)!==c||cell(gx,gy+1)!==c;
      if(edge){if(realm&&realm.tier===0){r=243;gg=195;b=74}else{r*=.5;gg*=.5;b*=.5}}}
    var p=(y*v.w+x)*4;d[p]=r;d[p+1]=gg;d[p+2]=b;d[p+3]=255;
  }
  octx.putImageData(img,0,0);map.off=off;
}
function drawMap(){
  if(!map)return;
  var cv=$("map"),v=map.view,dpr=Math.min(3,window.devicePixelRatio||1),cssW=cv.clientWidth||320;
  var cssH=Math.max(160,Math.min(cssW*1.1,cssW*v.h/v.w));
  cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);cv.style.height=cssH+"px";
  if(!map.off)paintMap();
  // 视野：放大 z 倍；形状跟画布一样，不出"所知天下"那一片
  var w=v.w/mv.z,h=w*cssH/cssW;
  if(h>v.h){h=v.h;w=h*cssW/cssH}
  var x=Math.min(Math.max(mv.x-w/2,v.x),v.x+v.w-w),y=Math.min(Math.max(mv.y-h/2,v.y),v.y+v.h-h);
  mv.x=x+w/2;mv.y=y+h/2;map.win={x:x,y:y,w:w,h:h};
  var ctx=cv.getContext("2d");ctx.imageSmoothingEnabled=false;
  ctx.fillStyle="#0e0f0c";ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(map.off,x-v.x,y-v.y,w,h,0,0,cv.width,cv.height);
  var k=cv.width/w;
  if(map.capital){var cx=(map.capital[0]+.5-x)*k,cy=(map.capital[1]+.5-y)*k,q=4*dpr;ctx.fillStyle="#fff3cf";ctx.strokeStyle="#14150f";ctx.lineWidth=dpr;ctx.fillRect(cx-q,cy-q,q*2,q*2);ctx.strokeRect(cx-q,cy-q,q*2,q*2)}
  ctx.font="600 "+(12*dpr)+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineJoin="round";
  map.realms.forEach(function(r){
    if(r.x==null||!r.name)return;
    var tw=ctx.measureText(r.name).width;
    if(r.tier!==0&&Math.sqrt(r.n)*k<tw*.6)return;
    var px=(r.x+.5-x)*k,py=(r.y+.5-y)*k;
    if(px<0||py<0||px>cv.width||py>cv.height)return;
    ctx.lineWidth=3*dpr;ctx.strokeStyle="rgba(14,15,12,.85)";ctx.strokeText(r.name,px,py);
    ctx.fillStyle=r.tier===0?"#f3c34a":r.tier===2?"#b9b39d":"#e8e2cf";ctx.fillText(r.name,px,py);
  });
  $("z-out").disabled=mv.z<=1.001;$("z-in").disabled=mv.z>=MAXZ-.001;$("z-reset").disabled=mv.z<=1.001;
}
// 以画布上的一点(占宽高的比例)为准放大缩小：那一点底下的地方不动
function zoomAt(factor,fx,fy){
  if(!map||!map.win)return;
  var win=map.win,gx=win.x+fx*win.w,gy=win.y+fy*win.h,z=Math.min(MAXZ,Math.max(1,mv.z*factor));
  if(z===mv.z)return;
  var ratio=mv.z/z;mv.z=z;
  mv.x=gx+(.5-fx)*win.w*ratio;mv.y=gy+(.5-fy)*win.h*ratio;
  drawMap();
}
function pickAt(clientX,clientY){
  if(!map||!map.win)return;
  var rect=$("map").getBoundingClientRect(),win=map.win;
  var x=Math.floor(win.x+(clientX-rect.left)/rect.width*win.w),y=Math.floor(win.y+(clientY-rect.top)/rect.height*win.h);
  if(x<0||y<0||x>=map.w||y>=map.h)return;
  var c=map.grid[y*map.w+x],r=map.realms[c];
  $("map-pick").textContent=c===FOG?t("m_fog"):c===WATER?t("m_water"):c===WILD||!r?t("m_wild"):r.tier===2?t("m_rumour",r.name):r.name;
  // 点中一个已知之国：弹出对它能办的事
  if(c<250&&r&&r.tier===1&&r.id&&state&&state.decrees){
    var dg=(state.decrees.groups||[]).filter(function(x){return x.id==="diplomacy"})[0];
    var dr=dg&&dg.realms.filter(function(x){return x.id===r.id})[0];
    if(dr)diploSheet(dg,dr);
  }
}
(function(){
  var cv=$("map"),pts={},pinch=null,moved=0;
  function count(){return Object.keys(pts).length}
  function spread(){var k=Object.keys(pts),a=pts[k[0]],b=pts[k[1]];return{d:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
  cv.addEventListener("pointerdown",function(e){
    try{cv.setPointerCapture(e.pointerId)}catch(err){}
    pts[e.pointerId]={x:e.clientX,y:e.clientY};
    if(count()===1)moved=0;
    if(count()===2){pinch=spread();pinch.z=mv.z;moved=99}
  });
  cv.addEventListener("pointermove",function(e){
    var p=pts[e.pointerId];if(!p||!map||!map.win)return;
    var dx=e.clientX-p.x,dy=e.clientY-p.y;pts[e.pointerId]={x:e.clientX,y:e.clientY};
    var rect=cv.getBoundingClientRect();
    if(count()===1){
      moved+=Math.abs(dx)+Math.abs(dy);
      if(moved<6)return;
      mv.x-=dx/rect.width*map.win.w;mv.y-=dy/rect.height*map.win.h;drawMap();
    }else if(count()===2&&pinch){
      var now=spread(),target=Math.min(MAXZ,Math.max(1,pinch.z*now.d/pinch.d));
      zoomAt(target/mv.z,(now.x-rect.left)/rect.width,(now.y-rect.top)/rect.height);
    }
  });
  function up(e){
    var single=count()===1&&pts[e.pointerId];
    delete pts[e.pointerId];pinch=null;
    if(single&&moved<6&&e.type==="pointerup")pickAt(e.clientX,e.clientY);
  }
  cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  cv.addEventListener("wheel",function(e){
    e.preventDefault();var rect=cv.getBoundingClientRect();
    zoomAt(e.deltaY<0?1.25:.8,(e.clientX-rect.left)/rect.width,(e.clientY-rect.top)/rect.height);
  },{passive:false});
  $("z-in").onclick=function(){zoomAt(1.6,.5,.5)};
  $("z-out").onclick=function(){zoomAt(1/1.6,.5,.5)};
  $("z-reset").onclick=function(){mv.z=1;drawMap()};
})();
window.addEventListener("resize",drawMap);

// 页签
var tabs=document.querySelectorAll("nav button");
for(var i=0;i<tabs.length;i++)tabs[i].onclick=function(){
  commitSeen();page=this.getAttribute("data-p");
  for(var j=0;j<tabs.length;j++)tabs[j].className=tabs[j]===this?"on":"";
  ["reports","map","realm","decrees"].forEach(function(p){$("p-"+p).hidden=p!==page});
  window.scrollTo(0,0);
  if(page==="map"){drawMap();if(Date.now()-lastMapAt>5000)loadMap()}
  if(page==="reports"&&state&&state.loaded&&!state.vacant)renderReports();
};

// 从数字地址跳到固定地址时带过来的配对(?k=)：记下，随后从地址栏去掉
(function(){
  var m=/[?&]k=([0-9a-f]{32})(?:&|$)/.exec(location.search);
  if(!m)return;
  token=m[1];store(TOKEN_KEY,token);
  try{history.replaceState(null,"",location.pathname)}catch(e){}
})();
// 固定地址：电脑的地址变了、换台电脑开游戏都还是它。这部手机认得出这个名字才给按钮(拿图标试一下)；跳过去时把配对带上
var FIXED="empirecraft.local";
(function(){
  if(location.hostname===FIXED||!location.port)return;
  var base="http://"+FIXED+":"+location.port,probe=new Image();
  probe.onload=function(){$("fixed-note").textContent=t("a2hs_fixed_note",FIXED+":"+location.port);$("fixed-box").hidden=false};
  probe.src=base+"/icon-192.png?"+Date.now();
  $("fixed-go").onclick=function(){location.href=base+"/"+(token?"?k="+token:"")};
})();
// 扫码进来：地址里带着配对码(?c=)，记下，用完把它从地址栏去掉。没配过就拿它直接配(见 autoPair)；
// 手机里留着旧令牌的先照旧令牌试，作废了(被除名、房主换了存档)再拿这个码配——以前有旧令牌就把码丢了，
// 公开的房间进去还得手填(用户 2026-11-11 "终端的公开模式是不是搞错了怎么还需要我填配对码")
var scanned=null,triedScan=false,triedLobby=false;
(function(){
  var m=/[?&]c=(\d{6})(?:&|$)/.exec(location.search);
  if(!m)return;
  try{history.replaceState(null,"",location.pathname)}catch(e){}
  scanned=m[1];
})();
// 没配对时自己配：先用地址里带来的码；没有码、又是在联机大厅的房间里(/r/房间号)，就问大厅这间是不是公开的，是就拿它给的码配。
// 各试一回，不成就留在配对页等手填
function autoPair(){
  if(token)return;
  if(scanned&&!triedScan){triedScan=true;$("code").value=scanned;$("pair-go").onclick();return}
  var room=/^\/r\/([0-9a-f]{16})$/.exec(BASE);
  if(!room||triedLobby)return;
  triedLobby=true;
  fetch("/api/join?room="+room[1],{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
    if(token||!j||!j.open||!j.code)return;
    $("code").value=j.code;$("pair-go").onclick();
  },function(){});
}
$("purge-go").onclick=function(){goDecrees()};
$("a2hs").hidden=!!(navigator.standalone||(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches));
$("sheet-close").onclick=closeSheet;$("sheet-back").onclick=closeSheet;
applyLang();
poll();
setInterval(function(){if(!document.hidden)poll()},3000);
