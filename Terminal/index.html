<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4c5143">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="终端">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>EmpireCraft Terminal</title>
<style>
:root{--bg:#14150f;--card:#1e2018;--line:#3a3d2e;--ink:#e8e2cf;--soft:#b9b39d;--mute:#8a8f80;--gold:#f3c34a;--cyan:#7fd8ea;--green:#65d66e;--red:#e2675a;--amber:#e9a85b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:12px 14px calc(76px + env(safe-area-inset-bottom))}
h1{font-size:19px;font-weight:600;margin:0;color:var(--gold)}
h2{font-size:14px;font-weight:600;margin:0 0 8px;color:var(--gold)}
.sub{font-size:12.5px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rows>div{padding:9px 0;border-top:1px solid var(--line)}
.rows>div:first-child{border-top:0;padding-top:2px}
.tag{font-size:11.5px;padding:1px 8px;border-radius:9px;border:1px solid var(--line);color:var(--soft);white-space:nowrap;flex:none}
.tag.gold{color:var(--gold);border-color:#6b5a26}.tag.amber{color:var(--amber);border-color:#6b4f2a}
.tag.red{color:var(--red);border-color:#6b322c}.tag.green{color:var(--green);border-color:#2f5f33}.tag.cyan{color:var(--cyan);border-color:#2f5a63}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:#191b14;border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.kpi b{display:block;font-size:18px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
button,input{font:inherit;color:var(--ink)}
button{background:#2a2c20;border:1px solid #5a5a40;border-radius:8px;padding:10px 14px;min-height:44px}
button.primary{background:#5a4a1c;border-color:var(--gold);color:#fff3cf}
button:active{transform:scale(.98)}
input{background:#101109;border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-height:44px}
input:focus,button:focus-visible{outline:2px solid var(--cyan);outline-offset:1px}
#code{font-size:26px;letter-spacing:.35em;text-align:center}
.err{color:var(--red);font-size:13px;min-height:20px;margin-top:6px}
#bar{position:sticky;top:0;z-index:3;background:var(--bg);padding:6px 0 8px;border-bottom:1px solid var(--line)}
#warn{display:none;background:#4a2320;color:#ffd9d2;font-size:13px;padding:6px 10px;border-radius:8px;margin-top:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:#191b14;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:4}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.world{font-size:13px;font-weight:600;color:var(--gold);margin:16px 0 2px}
.nation{padding:10px 0;border-top:1px solid var(--line)}
.act{min-height:40px;padding:8px 12px;margin:8px 8px 0 0}
#sheet{position:fixed;left:0;top:0;right:0;bottom:0;z-index:6}
.sheet-back{position:absolute;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.6)}
.sheet-box{position:absolute;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));max-height:82vh;overflow:auto}
.pick.primary{background:#5a4a1c;border-color:var(--gold)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));background:#2a2c20;border:1px solid var(--gold);color:var(--ink);padding:10px 14px;border-radius:10px;z-index:5;width:max-content;max-width:90%;font-size:14px}
.banner{background:#3a2f12;border:1px solid #6b5a26;color:var(--gold);border-radius:10px;padding:10px 14px;margin-top:10px;cursor:pointer}
nav button{border:0;border-radius:0;background:none;color:var(--mute);min-height:56px;font-size:14px}
nav button.on{color:var(--gold);box-shadow:inset 0 2px 0 var(--gold)}
.bar{height:6px;border-radius:3px;background:#101109;margin-top:8px;overflow:hidden}
.bar i{display:block;height:6px;border-radius:3px}
canvas{display:block;width:100%;border-radius:10px;border:1px solid var(--line);background:#0e0f0c;touch-action:none;cursor:grab}
.zoom button{min-height:40px;min-width:44px;padding:6px 10px;margin-left:6px;font-size:17px}
.zoom button[disabled]{opacity:.4}
.pick{width:100%;text-align:left;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pick[disabled]{opacity:.5}
.detail{display:none;font-size:13px;color:var(--soft);margin-top:6px}
.open .detail{display:block}
.report{cursor:pointer}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
[hidden]{display:none!important}

/* ───── 帝国盒子的界面风格(用户 2026-11-11 "ui 尽量用和帝国盒子 ui 一样的风格，包括 frame 之类的") ─────
   配色取自游戏里的宽窗口(橄榄灰的窗底、深色卡片、WideKit 的金青绿红)，卡片套同一张像素框 FactionFrame，
   要紧的卡(待批、弹出的选择界面)套金框 FactionFrame_dominate；一律方角，按钮是深边加顶上一道高光。
   框图取不到(游戏里的终端是旧版)时卡片只是没有框，底色照旧 */
:root{--bg:#4c5143;--card:#2c312a;--card2:#3d4036;--line:#565b4c;--edge:#14160f;--ink:#f2eee2;--soft:#c8c2b4;--mute:#8fa0a8;
  --gold:#f3c34a;--cyan:#7fd8ea;--green:#65d66e;--red:#ff6666;--amber:#e9a85b}
html,body{background:var(--bg)}
h1{color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.45)}
h2{color:var(--gold);text-shadow:0 1px 0 rgba(0,0,0,.45)}
.card,.banner,.sheet-box{border-radius:0;border:12px solid transparent;background:var(--card);
  border-image:url(FactionFrame.png) 12 fill / 12px stretch;image-rendering:pixelated}
.card{padding:4px 6px}
.banner{border-image-source:url(FactionFrame_dominate.png);padding:2px 6px;color:var(--gold)}
.sheet-box{border-image-source:url(FactionFrame_dominate.png);padding:6px 6px calc(10px + env(safe-area-inset-bottom))}
#decrees>.card:first-child{border-image-source:url(FactionFrame_dominate.png)}
.kpi{background:var(--card2);border:1px solid var(--edge);border-radius:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.kpi b{color:var(--gold)}
.rows>div,.nation{border-top-color:var(--line)}
button{border-radius:0;border:2px solid var(--edge);background:#3a4039;color:var(--ink);box-shadow:inset 0 2px 0 #50584e}
button:active{box-shadow:inset 0 2px 0 var(--edge);transform:translateY(1px)}
button.primary,.pick.primary,.act.primary{background:#4f9442;border-color:var(--edge);color:#fff;box-shadow:inset 0 2px 0 #73b862}
button[disabled]{opacity:.45}
.pick{background:#333930}
input{border-radius:0;border:2px solid var(--edge);background:#161812;box-shadow:inset 0 2px 0 rgba(0,0,0,.5)}
.tag{border-radius:0;background:#1d201a;border-color:var(--edge)}
.tag.gold{border-color:#7a6426}.tag.amber{border-color:#7a5a2c}.tag.red{border-color:#7a3232}.tag.green{border-color:#35693a}.tag.cyan{border-color:#33636d}
#bar{background:var(--bg);border-bottom:2px solid var(--edge)}
#warn{border-radius:0;border:2px solid var(--edge);background:#5a2620}
nav{background:var(--card);border-top:2px solid var(--edge)}
nav button{box-shadow:none;border:0;background:none}
nav button.on{color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}
canvas{border-radius:0;border:2px solid var(--edge)}
.bar{border-radius:0;border:1px solid var(--edge);background:#161812;height:8px}
.bar i{border-radius:0;height:6px}
.world{text-shadow:0 1px 0 rgba(0,0,0,.45)}
.sheet-back{background:rgba(10,12,8,.7)}
#toast{border-radius:0;border-width:2px;background:var(--card)}
.sw{border-radius:0}
/* 舆图：平时铺满抬头与页签之间，全屏时盖住整个屏幕；角上的按钮、底下的条子都浮在图上 */
#mapbox{position:relative;margin-top:10px}
/* 选人页(用户 2026-11-13 "初始的选择国家为什么不是全屏地图")：同主界面一样舆图铺满整个屏幕；
   说明和"接着领"的几位浮在左上(样子同状态条)，图右边的按钮照旧，点国后底下出条子。选人时不取军情，军队那一层不摆 */
body.vacant{overflow:hidden}
body.vacant #mapbox{position:fixed;left:0;top:0;right:0;bottom:0;z-index:1;margin:0;background:#0e0f0c}
body.vacant #mapbox canvas{border:0}
body.vacant #map-full,body.vacant #map-army{display:none}
body.vacant #map-zoom,body.vacant #map-panel{bottom:calc(8px + env(safe-area-inset-bottom))}
body.vacant #map-layers{top:calc(8px + env(safe-area-inset-top))}
body.vacant #vacant-head{position:fixed;z-index:3;left:6px;top:calc(6px + env(safe-area-inset-top));max-width:min(360px,calc(100vw - 72px));max-height:46vh;
  overflow:auto;-webkit-overflow-scrolling:touch;padding:5px 10px 7px;background:rgba(44,49,42,.95);border:2px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
body.vacant #vacant-head h1{font-size:16px;margin:0}
body.vacant #vacant-head p{margin:3px 0 0;font-size:12.5px;line-height:1.45}
/* 加载界面的动画(用户 2026-11-13 "我希望加载界面可以给点动态的动画")：一卷舆图展开又卷起，右轴跟着纸边走(两者同一时长同一缓动)；
   驿马在底下来回跑；进度条斜纹走动；正等着的那一步图标一明一暗、"在路上"后头的点一个个冒出来，到了的那一步"已到"跳一下 */
#s-load{padding-top:5vh}
#s-load h1{text-align:center}
#load-stage{width:300px;max-width:100%;margin:0 auto 14px}
#load-scroll{position:relative;height:84px}
#load-scroll .rod{position:absolute;top:-7px;bottom:-7px;width:10px;z-index:2;border:2px solid var(--edge);
  background:linear-gradient(90deg,#5a3d1a,#c8953e 45%,#5a3d1a)}
#load-scroll .rod.r{left:6px;animation:ld-rod 4.2s ease-in-out infinite}
#load-paper{position:absolute;left:8px;top:0;bottom:0;width:0;overflow:hidden;animation:ld-unroll 4.2s ease-in-out infinite;
  background-color:#d9c38f;background-image:linear-gradient(rgba(96,64,24,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(96,64,24,.2) 1px,transparent 1px);
  background-size:12px 12px;box-shadow:inset 0 3px 0 rgba(255,255,255,.18),inset 0 -3px 0 rgba(0,0,0,.18)}
#load-art{position:absolute;left:0;top:0;width:284px;height:100%}
#load-art svg{position:absolute;left:0;top:0;width:100%;height:100%}
#load-art .ic{position:absolute;image-rendering:pixelated}
#load-road{position:relative;height:32px;margin-top:14px;overflow:hidden;border-bottom:2px dashed #7a6426}
#load-rider{position:absolute;bottom:3px;left:-30px;animation:ld-ride 3.4s linear infinite}
#load-rider .ic{display:block;image-rendering:pixelated;animation:ld-bob .3s steps(2) infinite}
#load-tip{text-align:center;min-height:1.6em;margin-top:4px}
#load-tip.in{animation:ld-fade .5s ease-out}
#load-bar{position:relative;overflow:hidden;width:0;background:var(--gold);transition:width .5s ease-out}
#load-bar::after{content:"";position:absolute;top:0;bottom:0;left:-12px;right:0;animation:ld-stripe .6s linear infinite;
  background:repeating-linear-gradient(-45deg,rgba(255,255,255,.3) 0 4px,transparent 4px 8px)}
#load-steps .now>.ic{animation:ld-pulse .8s ease-in-out infinite alternate}
#load-steps .tag.pop{animation:ld-pop .45s ease-out}
.ld-dots::after{content:"\2026";display:inline-block;width:0;overflow:hidden;vertical-align:bottom;animation:ld-dots 1.2s steps(4) infinite}
@keyframes ld-unroll{0%{width:0}45%{width:calc(100% - 16px)}80%{width:calc(100% - 16px)}100%{width:0}}
@keyframes ld-rod{0%{left:6px}45%{left:calc(100% - 10px)}80%{left:calc(100% - 10px)}100%{left:6px}}
@keyframes ld-ride{from{left:-30px}to{left:100%}}
@keyframes ld-bob{to{transform:translateY(-3px)}}
@keyframes ld-fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes ld-stripe{to{transform:translateX(11.31px)}}
@keyframes ld-pulse{from{opacity:.4;transform:scale(.88)}to{opacity:1;transform:scale(1.08)}}
@keyframes ld-pop{0%{transform:scale(.5)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes ld-dots{to{width:1.2em}}
@media (prefers-reduced-motion:reduce){
  #load-paper,#load-scroll .rod.r,#load-rider,#load-rider .ic,#load-bar::after,#load-steps .now>.ic,.ld-dots::after,#load-tip.in,#load-steps .tag.pop{animation:none}
  #load-paper{width:calc(100% - 16px)}#load-scroll .rod.r{left:calc(100% - 10px)}#load-rider{left:45%}.ld-dots::after{width:1.2em}
}
#mapbox.full{position:fixed;left:0;top:0;right:0;bottom:0;z-index:5;margin:0;background:#0e0f0c}
#mapbox.full canvas{border:0}
#map-top{position:absolute;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
#map-top>*{pointer-events:auto}
#mapbox.full #map-top{top:calc(8px + env(safe-area-inset-top))}
#map-intel{background:rgba(29,32,26,.9);white-space:normal;flex:0 1 auto}
#map-full{min-height:36px;padding:4px 12px;font-size:13px;flex:none}
#map-zoom{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
#map-zoom button{min-height:40px;min-width:44px;padding:4px 8px;margin:0;font-size:17px}
#mapbox.full #map-zoom,#mapbox.full #map-panel{bottom:calc(8px + env(safe-area-inset-bottom))}
#map-panel{position:absolute;left:8px;right:62px;bottom:8px;background:rgba(44,49,42,.96);border:2px solid var(--edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08);padding:8px 10px;max-height:46%;overflow:auto}
#map-panel b{color:var(--gold)}
#map-panel .x{min-height:30px;min-width:34px;padding:0 8px;margin:0}
#map-panel .act{margin:8px 8px 0 0}
#toast{z-index:7}
body.mapfull #toast{bottom:auto;top:calc(52px + env(safe-area-inset-top))}
/* ───── 层次(用户 2026-11-12 "看着东西好多好挤也没有层次感") ─────
   五级字：国名 › 卡片标题(小、金、拉开字距) › 一件事的题目 .it › 正文 › 小字 .sub。
   页面上一件事占一行(.li：左名目右现状，能点的带箭头)，挑人填字都进弹出界面；按钮只留给当场就办的事，
   分三种：推荐的(primary 绿)、驳与诛(no 红字)、点过一下等确认的(armed 金) */
#app{padding:10px 12px calc(76px + env(safe-area-inset-bottom))}
.card{padding:6px 8px 8px;margin-top:12px}
h2{font-size:13px;letter-spacing:.1em;margin:0 0 4px}
.sub{font-size:12px;line-height:1.45}
.it{font-size:16px;font-weight:600;line-height:1.35}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:46px;padding:8px 0;border-top:1px solid var(--line)}
.li.tap{cursor:pointer}.li.tap:active{background:rgba(255,255,255,.05)}
.li.off{opacity:.45}
.li.flat{border-top:0;min-height:34px;padding:6px 0 0}
.li-l{min-width:0;flex:1}
.li-r{display:flex;align-items:center;gap:8px;flex:none;max-width:58%;text-align:right;color:var(--soft)}
.li-r .sub{font-size:13px;color:var(--soft)}
.chev{color:var(--mute);font-size:20px;line-height:1}
#sheet-body>.li:first-child{border-top:0}
.pend{padding:12px 0 10px;border-top:1px solid var(--line)}
.stance{display:flex;gap:2px;height:6px;margin-top:10px}
.stance i{display:block;height:6px}
.sum{display:flex;gap:12px;font-size:13px}
.verdict{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-top:10px}
.verdict .act{margin:0;min-height:44px;font-size:16px;padding:6px 4px}
.act{min-height:38px;padding:6px 12px;font-size:14px}
.act.no,.pick.no{color:#ffb4aa}
.act.armed,.pick.armed{background:#7a5f1e;color:#fff3cf;box-shadow:inset 0 2px 0 #b08a2e}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 12px}
.chips .act{margin:0}
.act.more{background:none;border:0;box-shadow:none;color:var(--mute);min-height:32px;padding:4px 0;margin-top:0;font-size:13px}
.card.gold{border-image-source:url(FactionFrame_dominate.png)}
#decrees>.card:first-child:not(.gold){border-image-source:url(FactionFrame.png)}
/* ───── 图标与页签(用户 2026-11-12 "模仿模组的风格，多加点图标和分组，作出软件或者游戏的 ui 的感觉") ─────
   图标都是模组现成的像素图标；底下五个页签带图标；政令页各组是一排图标页签，一回只看一组 */
.ic{image-rendering:pixelated;flex:none;vertical-align:middle}
h2 .ic{margin-right:6px;vertical-align:-5px}
.kpi>.ic{float:right;margin:0 0 2px 4px}
nav div{grid-template-columns:repeat(5,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;min-height:58px;padding:5px 0 4px}
nav button .ic{opacity:.5;filter:grayscale(.7)}
nav button.on .ic{opacity:1;filter:none}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:66px;padding:6px 2px 5px;
  font-size:12.5px;line-height:1.2;background:var(--card);color:var(--soft)}
.tile .ic{opacity:.75}
.tile.on{background:#474c3c;color:var(--gold);box-shadow:inset 0 -3px 0 var(--gold),inset 0 2px 0 #5d6450}
.tile.on .ic{opacity:1}
.badge{position:absolute;top:3px;right:4px;min-width:16px;height:16px;padding:0 4px;font:normal 11px/16px sans-serif;background:var(--gold);color:#221a05;text-align:center}
/* 典册：树(同辈一行、父居子中、直角连线，整棵放在能拖的框里)与史册 */
.tree{position:relative;overflow:hidden;height:62vh;min-height:260px;margin-top:8px;background:#22261f;border:2px solid var(--edge);touch-action:none;cursor:grab}
.tree-in{position:absolute;left:0;top:0;transform-origin:0 0}
.tree-tools{position:absolute;right:6px;top:6px;z-index:1;display:flex;gap:4px}
.tree-tools button{min-height:34px;min-width:38px;padding:2px 6px;margin:0;display:flex;align-items:center;justify-content:center}
.tree-in svg{position:absolute;left:0;top:0}
.tree-line{fill:none;stroke:#8a8f6e;stroke-width:2;shape-rendering:crispEdges}
.node{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px 4px;background:var(--card2);
  border:2px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);text-align:center;cursor:pointer;overflow:hidden}
.node b{font-size:13.5px;font-weight:600;line-height:1.2;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .t{font-size:11px;color:var(--gold);line-height:1.2;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .y{font-size:10.5px;color:var(--mute);line-height:1.2;white-space:nowrap}
.node .no{position:absolute;left:3px;top:2px;font:normal 10px/1 sans-serif;color:var(--gold)}
.node.ruler{border-color:#b08a2e;background:#4a4530}
.node.self{box-shadow:0 0 0 2px var(--cyan)}
.node.dead{opacity:.75}
.legend{display:flex;gap:14px;margin-top:8px;align-items:center}
.legend .node{position:static;display:inline-block;width:14px;height:14px;padding:0;margin-right:5px;vertical-align:-2px;cursor:default}
.hist{padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.hist .sub{margin-right:8px;white-space:nowrap}
.chart{display:block;width:100%;height:auto;margin-top:4px;background:#22261f;border:2px solid var(--edge)}
.pt{image-rendering:pixelated;flex:none;background:#22261f;border:2px solid var(--edge);vertical-align:middle}
.act .pt{margin-right:6px;border-width:1px}
.face{display:flex;justify-content:center;padding:6px 0 10px}
.face .pt,#me-face .pt{border-color:#b08a2e}
.led{display:grid;grid-template-columns:1fr auto auto;gap:3px 14px;font-size:13px;padding:8px 10px;margin:0 0 10px;color:var(--soft);background:#22261f;border:2px solid var(--edge)}
.led .r{text-align:right;font-variant-numeric:tabular-nums}
.led-h{color:var(--gold);font-size:12px;margin-top:4px}
.led .bad{color:var(--red)}
.chart text{font-family:inherit}
.legend .sw{margin-right:5px}
/* ───── 像游戏一样的界面(用户 2026-11-12 "横屏布局可以，做的像游戏一样就行""最好再基于横屏给个竖屏的"；
   起因是群里的意见 "这个网页主体就是这个地图，然后功能键移动到侧边或者上面") ─────
   两种拿法是同一套：舆图永远铺在底下；左上角一块状态条(国名、年月、君主、流速、军情截至哪个月)；页签是一条游戏式的方按钮
   (竖着拿在底下横排，横着拿在最左竖排)；办事的那几页是浮在图上的窗口(金框、标题栏、右上角关)，再点一下页签或点关就收起只看图。
   层级四档、图例、放大缩小竖在图的右边；弹出的选择界面在屏幕正中；提示从顶上出来 */
:root{--navw:calc(64px + env(safe-area-inset-left));--side:min(400px,48vw);--barh:64px;--navh:66px}
body.main{overflow:hidden}
body.main #p-map{display:block!important;position:fixed;left:0;top:0;right:0;bottom:var(--navh);z-index:1}
body.main.mapfull #p-map{z-index:5;left:0;bottom:0}
body.main #p-map>.sub,body.main #p-map>.card{display:none}
body.main #mapbox{margin:0}
body.main #mapbox canvas{border:0}
body.main #map-top{left:auto}
/* 状态条 */
body.main #bar{position:fixed;z-index:3;left:6px;top:calc(6px + env(safe-area-inset-top));width:auto;max-width:min(330px,68vw);padding:4px 10px 6px;
  background:rgba(44,49,42,.95);border:2px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
body.main #bar h1{font-size:16px}
body.main #bar .row{gap:14px}
body.main #bar .banner{border:0;border-image:none;background:none;padding:2px 0 0;margin-top:2px;font-size:12px;line-height:1.4}
#intel-row{margin-top:3px}
#map-intel{color:var(--cyan);font-size:11.5px;line-height:1.35;background:none}
/* 页签：方按钮 */
nav button{position:relative}
nav .badge{right:calc(50% - 28px);font-style:normal}
body.main nav{background:rgba(44,49,42,.97);border-top:2px solid var(--edge);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
body.main nav div{gap:4px}
body.main nav button{min-height:54px;background:#3a4039;border:2px solid var(--edge);box-shadow:inset 0 2px 0 #50584e;color:var(--soft);font-size:11.5px}
body.main nav button .ic{width:26px;height:26px;opacity:.9;filter:none}
body.main nav button.on{background:#5a5230;border-color:#b08a2e;color:var(--gold);box-shadow:inset 0 2px 0 #8a7a3a}
/* 窗口 */
body.main #p-reports,body.main #p-decrees,body.main #p-realm,body.main #p-annals{position:fixed;z-index:2;overflow:auto;-webkit-overflow-scrolling:touch;
  left:6px;right:6px;top:calc(var(--barh) + 14px);bottom:calc(var(--navh) + 6px);background:var(--bg);
  border:12px solid transparent;border-image:url(FactionFrame_dominate.png) 12 / 12px stretch;padding:38px 2px 6px}
#win-head{display:none}
body.main.side #win-head{display:flex;position:fixed;z-index:3;left:18px;right:18px;top:calc(var(--barh) + 26px);height:34px;align-items:center;gap:8px;
  background:var(--bg);border-bottom:2px solid var(--edge);padding:0 2px 4px}
body.main.mapfull #win-head{display:none}
#win-head b{flex:1;color:var(--gold);font-size:15px;letter-spacing:.1em;text-shadow:0 1px 0 rgba(0,0,0,.45)}
#win-head button{min-height:28px;min-width:34px;padding:0 8px;margin:0;font-size:16px}
body.main .tree{height:calc(100vh - var(--barh) - var(--navh) - 210px)}
/* 图右边的按钮 */
#map-layers{position:absolute;right:8px;top:52px;display:flex;flex-direction:column;gap:4px}
#mapbox.full #map-layers{top:calc(52px + env(safe-area-inset-top))}
#map-layers button{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:42px;min-width:44px;padding:3px 4px 2px;margin:0;
  font-size:10.5px;line-height:1.2;background:rgba(58,64,57,.94)}
#map-full,#map-zoom button{display:flex;align-items:center;justify-content:center}
#map-full{min-width:44px}
.hl{display:flex;align-items:center;gap:6px;min-width:0}
#bar .sub{white-space:nowrap}
#ruler{overflow:hidden;text-overflow:ellipsis}
#bar .hl .ic{flex:none}
.act .ic{margin-right:6px;vertical-align:-4px}
#win-close .ic,#sheet-close .ic,#map-panel .x .ic{margin:0;vertical-align:-2px}
#map-layers button.on{background:#7a5f1e;color:#fff3cf;box-shadow:inset 0 2px 0 #b08a2e}
#map-layers #map-legend-go{color:var(--mute)}
@media (max-height:400px){#map-layers button{min-height:32px}#map-layers button span{display:none}#z-reset{display:none}}
/* 弹出的选择界面在正中；提示从顶上出来 */
.sheet-box{top:50%;bottom:auto;transform:translateY(-50%);left:6px;right:6px;max-height:86vh;padding-bottom:10px}
body.main #toast,body.mapfull #toast{bottom:auto;top:calc(var(--barh) + 18px)}
@media (orientation:landscape) and (min-width:640px){
  body.main nav{left:0;top:0;bottom:0;right:auto;width:var(--navw);border-top:0;border-right:2px solid var(--edge);
    padding:calc(4px + env(safe-area-inset-top)) 4px calc(4px + env(safe-area-inset-bottom)) calc(4px + env(safe-area-inset-left));overflow:auto}
  body.main nav div{grid-template-columns:1fr;max-width:none;margin:0}
  body.main nav button{min-height:52px}
  body.main #p-map{left:var(--navw);bottom:0}
  body.main #bar{left:calc(var(--navw) + 8px)}
  body.main.side #bar{left:calc(var(--navw) + var(--side) + 18px);max-width:calc(100vw - var(--navw) - var(--side) - 84px)}
  body.main #p-reports,body.main #p-decrees,body.main #p-realm,body.main #p-annals{left:calc(var(--navw) + 8px);right:auto;width:var(--side);top:8px;bottom:8px}
  body.main.side #win-head{left:calc(var(--navw) + 20px);right:auto;width:calc(var(--side) - 24px);top:20px}
  body.main #toast,body.mapfull #toast{top:10px}
}
/* ───── 管理员(见 TerminalHost.Admin；用户 2026-11-13 要的管理员入口) ─────
   管理员的页签只有 舆图 / 席位 / 房间 三个；席位、房间两页同别的办事页一样是浮在图上的窗口 */
nav button[data-p=aseats],nav button[data-p=aroom]{display:none}
body.admin nav button[data-p=aseats],body.admin nav button[data-p=aroom]{display:flex}
body.admin nav button[data-p=reports],body.admin nav button[data-p=decrees],body.admin nav button[data-p=realm],body.admin nav button[data-p=annals]{display:none}
body.admin nav div{grid-template-columns:repeat(3,1fr)}
body.main #p-aseats,body.main #p-aroom{position:fixed;z-index:2;overflow:auto;-webkit-overflow-scrolling:touch;
  left:6px;right:6px;top:calc(var(--barh) + 14px);bottom:calc(var(--navh) + 6px);background:var(--bg);
  border:12px solid transparent;border-image:url(FactionFrame_dominate.png) 12 / 12px stretch;padding:38px 2px 6px}
#s-pair #admin-open{display:flex;align-items:center;gap:6px;margin:14px auto 0}
.adm-code{font:600 17px/1.2 ui-monospace,Menlo,Consolas,monospace;color:var(--gold);letter-spacing:.08em}
.adm-nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.adm-nums button{margin:0;min-height:42px;padding:4px}
.adm-nums button.on{background:#7a5f1e;color:#fff3cf;box-shadow:inset 0 2px 0 #b08a2e}
@media (orientation:landscape) and (min-width:640px){
  body.admin nav div{grid-template-columns:1fr}
  body.main #p-aseats,body.main #p-aroom{left:calc(var(--navw) + 8px);right:auto;width:var(--side);top:8px;bottom:8px}
}
</style>
</head>
<body>
<div id="app">

<section id="s-pair" hidden>
  <h1 data-t="pair_title"></h1>
  <p class="sub" data-t="pair_hint"></p>
  <div class="card">
    <label class="sub" for="name" data-t="pair_name"></label>
    <input id="name" maxlength="16" autocomplete="nickname" style="margin:4px 0 12px">
    <label class="sub" for="code" data-t="pair_code"></label>
    <input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" style="margin-top:4px">
    <div class="err" id="pair-err"></div>
    <button class="primary" id="pair-go" style="width:100%" data-t="pair_go"></button>
  </div>
  <!-- 管理员入口(见 TerminalHost.Admin)：凭电脑上终端窗口里的管理员码进，公开的房间也一样 -->
  <button class="act more" id="admin-open"><img class="ic" data-ic="i_lock" width="18" height="18" alt=""><span id="admin-open-t" data-t="adm_entry"></span></button>
  <div class="card" id="admin-card" hidden>
    <label class="sub" for="admin-code" data-t="adm_code"></label>
    <input id="admin-code" maxlength="9" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="XXXX-XXXX" style="margin-top:4px">
    <div class="err" id="admin-err"></div>
    <button class="primary" id="admin-go" style="width:100%" data-t="adm_go"></button>
  </div>
</section>

<section id="s-wait" hidden>
  <h1 data-t="app_title"></h1>
  <div class="card"><div data-t="wait_world"></div><div class="sub" data-t="wait_world_hint"></div></div>
</section>

<section id="s-load" hidden>
  <!-- 加载时的动画(用户 2026-11-13 "我希望加载界面可以给点动态的动画")：一卷舆图展开又收起(计里画方的格子、山川城池)，底下驿马来回跑 -->
  <div id="load-stage" aria-hidden="true">
    <div id="load-scroll">
      <b class="rod"></b>
      <div id="load-paper"><div id="load-art">
        <svg viewBox="0 0 300 84" preserveAspectRatio="none" shape-rendering="crispEdges">
          <polyline points="0,62 34,58 58,66 92,60 118,48 150,52 176,40 206,44 236,30 268,34 300,24" fill="none" stroke="#4a7fa8" stroke-width="4"/>
          <polyline points="128,0 132,18 124,34 136,52 130,70 134,84" fill="none" stroke="#a8433a" stroke-width="2" stroke-dasharray="5 4"/>
        </svg>
        <img class="ic" data-ic="l_terrain" width="28" height="28" alt="" style="left:8%;top:10%">
        <img class="ic" data-ic="l_terrain" width="22" height="22" alt="" style="left:22%;top:34%">
        <img class="ic" data-ic="i_capital" width="22" height="22" alt="" style="left:58%;top:14%">
        <img class="ic" data-ic="i_city" width="18" height="18" alt="" style="left:30%;top:66%">
        <img class="ic" data-ic="i_city" width="18" height="18" alt="" style="left:74%;top:56%">
        <img class="ic" data-ic="l_terrain" width="26" height="26" alt="" style="left:84%;top:8%">
      </div></div>
      <b class="rod r"></b>
    </div>
    <div id="load-road"><span id="load-rider"><img class="ic" data-ic="arm_cavalry" width="26" height="26" alt=""></span></div>
  </div>
  <h1 data-t="load_title"></h1>
  <div class="sub" id="load-tip"></div>
  <div class="card">
    <div id="load-steps"></div>
    <div class="bar"><i id="load-bar"></i></div>
    <div class="sub" id="load-time" style="margin-top:8px"></div>
    <div class="sub" data-t="load_note" style="margin-top:4px"></div>
  </div>
</section>

<section id="s-vacant" hidden>
  <div id="vacant-head">
    <h1 data-t="vacant_title"></h1>
    <p class="sub" id="vacant-why"></p>
    <div id="vacant-next"></div>
    <p class="sub" data-t="pick_hint"></p>
    <button class="act more" id="vacant-admin" style="margin:2px 0 0"><span id="vacant-admin-t" data-t="adm_entry"></span></button>
  </div>
  <div id="vacant-map"></div>
</section>

<section id="s-main" hidden>
  <div id="bar">
    <div class="row"><span class="hl"><span id="me-face"></span><h1 id="realm"></h1></span><span class="sub hl"><img class="ic" data-ic="k_years" width="16" height="16" alt=""><span id="date"></span></span></div>
    <div class="row"><span class="sub hl"><img class="ic" data-ic="h_ruler" width="16" height="16" alt=""><span id="ruler"></span></span><span class="sub" id="pace"></span></div>
    <div id="intel-row" class="hl" hidden><img class="ic" data-ic="k_army" width="16" height="16" alt=""><span id="map-intel"></span></div>
    <div id="warn" data-t="offline"></div>
    <div id="stale" class="banner" hidden data-t="stale"></div>
    <div id="away" class="banner" hidden></div>
  </div>

  <div id="p-reports" hidden>
    <div class="banner" id="vote-banner" hidden style="cursor:pointer"></div>
    <div class="banner" id="pending-banner" hidden></div>
    <div class="card">
      <div class="sub" id="since"></div>
      <div class="grid" style="margin-top:8px">
        <div class="kpi"><img class="ic" data-ic="k_war" width="20" height="20" alt=""><span class="sub" data-t="kpi_wars"></span><b id="k-wars">0</b></div>
        <div class="kpi"><img class="ic" data-ic="k_new" width="20" height="20" alt=""><span class="sub" data-t="kpi_new"></span><b id="k-new">0</b></div>
        <div class="kpi"><img class="ic" data-ic="k_trust" width="20" height="20" alt=""><span class="sub" data-t="kpi_trust"></span><b id="k-trust"></b></div>
      </div>
    </div>
    <div class="card"><h2><img class="ic" data-ic="tab_reports" width="20" height="20" alt=""><span data-t="reports"></span></h2><div class="rows" id="reports"></div></div>
  </div>

  <div id="p-map">
    <div id="mapbox">
      <canvas id="map" width="600" height="360"></canvas>
      <div id="map-top"><span></span><button id="map-full" aria-label="fullscreen"><img class="ic" data-ic="c_full" width="20" height="20" alt="" id="full-ic"></button></div>
      <div id="map-layers"><button data-l="pol"><img class="ic" data-ic="ly_empire" width="20" height="20" alt=""><span data-t="ly_pol"></span></button><button data-l="dj"><img class="ic" data-ic="a_dejure" width="20" height="20" alt=""><span data-t="ly_dj"></span></button><button id="map-army"><img class="ic" data-ic="k_army" width="20" height="20" alt=""><span data-t="ly_army"></span></button><button id="map-3d"><img class="ic" data-ic="l_terrain" width="20" height="20" alt=""><span data-t="ly_3d"></span></button><button id="map-legend-go"><img class="ic" data-ic="ly_legend" width="20" height="20" alt=""><span data-t="ly_legend"></span></button></div>
      <div class="zoom" id="map-zoom"><button id="z-in" aria-label="zoom in"><img class="ic" data-ic="c_in" width="20" height="20" alt=""></button><button id="z-out" aria-label="zoom out"><img class="ic" data-ic="c_out" width="20" height="20" alt=""></button><button id="z-reset" aria-label="fit"><img class="ic" data-ic="c_fit" width="20" height="20" alt=""></button></div>
      <div id="map-panel" hidden></div>
    </div>
    <div class="sub" data-t="map_tap" style="margin-top:6px"></div>
    <div class="sub" data-t="map_turn"></div>
    <div class="card" id="map-legend">
      <span class="tag cyan" id="sight"></span><div class="sub" id="sight-note" style="margin-top:6px"></div>
      <div style="margin-top:8px;font-size:13px;color:var(--soft)">
        <div><span class="sw" style="background:var(--gold)"></span><span data-t="lg_own"></span></div>
        <div><span class="sw" style="background:var(--gold);border-right:4px solid #6f6026"></span><span data-t="lg_prov"></span></div>
        <div><span class="sw" style="background:#7a8f6a"></span><span data-t="lg_known"></span></div>
        <div><span class="sw" style="background:repeating-linear-gradient(45deg,#7a8f6a 0 3px,#34392e 3px 6px)"></span><span data-t="lg_rumour"></span></div>
        <div><span class="sw" style="background:#0e0f0c;border:1px solid var(--line)"></span><span data-t="lg_fog"></span></div>
        <div style="margin-top:6px" data-t="lg_lines"></div>
      </div>
    </div>
  </div>

  <div id="p-decrees" hidden><div id="decrees"></div></div>

  <div id="p-annals" hidden><div id="annals"></div></div>

  <div id="p-realm" hidden>
    <div class="card">
      <div class="row"><h2 style="margin:0"><img class="ic" data-ic="k_officials" width="20" height="20" alt=""><span data-t="officials"></span></h2><span class="tag amber" id="corr"></span></div>
      <div class="bar"><i id="corr-bar" style="background:var(--amber)"></i></div>
      <div class="sub" id="trust-note" style="margin-top:6px"></div>
      <button class="act" id="purge-go" data-t="purge_go"></button>
    </div>
    <div class="grid" style="margin-top:10px">
      <div class="kpi"><img class="ic" data-ic="k_treasury" width="20" height="20" alt=""><span class="sub" data-t="f_treasury"></span><b id="f-treasury"></b><span class="sub" id="f-treasury-n"></span></div>
      <div class="kpi"><img class="ic" data-ic="k_army" width="20" height="20" alt=""><span class="sub" data-t="f_army"></span><b id="f-army"></b><span class="sub" id="f-army-n"></span></div>
      <div class="kpi"><img class="ic" data-ic="k_people" width="20" height="20" alt=""><span class="sub" data-t="f_people"></span><b id="f-people"></b><span class="sub" id="f-people-n"></span></div>
    </div>
    <div class="card" id="fiscal-card" hidden><h2><img class="ic" data-ic="k_treasury" width="20" height="20" alt=""><span data-t="fs_title"></span></h2><div id="fiscal"></div></div>
    <div class="card"><h2><img class="ic" data-ic="k_war" width="20" height="20" alt=""><span data-t="wars"></span></h2><div class="rows" id="wars"></div></div>
    <div class="card" id="a2hs" hidden><h2 data-t="a2hs"></h2><div id="fixed-box" hidden><div class="sub" id="fixed-note"></div><button class="act" id="fixed-go" data-t="a2hs_fixed"></button></div><div class="sub" data-t="a2hs_ios"></div><div class="sub" data-t="a2hs_android" style="margin-top:4px"></div></div>
    <div class="card"><h2><img class="ic" data-ic="k_cities" width="20" height="20" alt=""><span data-t="cities"></span></h2><div class="sub" data-t="cities_note"></div><div class="rows" id="cities" style="margin-top:6px"></div></div>
    <div class="card" id="review-card" hidden><h2><img class="ic" data-ic="k_officials" width="20" height="20" alt=""><span data-t="rv_title"></span></h2><div class="sub" data-t="rv_note"></div><div id="review" style="margin-top:6px"></div></div>
    <div class="card" id="prov-card" hidden><h2 data-t="provinces"></h2><div class="sub" data-t="provinces_note"></div><div class="rows" id="provinces" style="margin-top:6px"></div></div>
    <div class="card" id="adm-card"><div id="adm-entry"></div></div>
  </div>
  <div id="p-aseats" hidden><div id="aseats"></div></div>
  <div id="p-aroom" hidden><div id="aroom"></div></div>
</section>
</div>

<div id="sheet" hidden><div class="sheet-back" id="sheet-back"></div><div class="sheet-box" role="dialog" aria-modal="true"><div class="row"><h2 id="sheet-title" style="margin:0"></h2><button id="sheet-close" class="act" style="margin:0" aria-label="close"><img class="ic" data-ic="c_close" width="16" height="16" alt=""></button></div><div class="sub" id="sheet-note" style="margin-top:4px"></div><div id="sheet-body"></div></div></div>
<div id="toast" role="status" hidden></div>
<div id="win-head"><img class="ic" id="win-ic" width="20" height="20" alt=""><b id="win-title"></b><button id="win-close" class="act" aria-label="close"><img class="ic" data-ic="c_close" width="16" height="16" alt=""></button></div>
<nav id="nav" hidden><div>

var NEED=17;
// 网页所在的路径：直连时是空的；经联机大厅进来是 /r/房间号。接口都接在它后面，令牌也按它分开存(一个大厅域名下有许多房间)
var BASE=location.pathname.replace(/\/[^\/]*$/,""),TOKEN_KEY="ec_token"+(BASE?":"+BASE:"");
var token=store(TOKEN_KEY),state=null,map=null,page="map",fails=0,openReport=null,openCity=null,lastMapAt=0;
// 管理员(见 TerminalHost.Admin)：管理员令牌另存；这部手机眼下用哪个身份(seat 领君主 / admin 管理员)也记着
var ADMIN_KEY="ec_admin"+(BASE?":"+BASE:""),ROLE_KEY="ec_role"+(BASE?":"+BASE:"");
var adminToken=store(ADMIN_KEY),role=adminToken&&store(ROLE_KEY)==="admin"?"admin":"seat";
function asAdmin(){return role==="admin"&&!!adminToken}

function api(method,path,body){
  var opt={method:method,headers:{},cache:"no-store"};
  var tk=asAdmin()?adminToken:token;
  if(tk)opt.headers["X-Terminal-Token"]=tk;
  if(body){opt.body=JSON.stringify(body);opt.headers["Content-Type"]="application/json"}
  return fetch(BASE+path,opt).then(function(r){return r.json().then(function(j){return{status:r.status,json:j}},function(){return{status:r.status,json:{}}})});
}

$("pair-go").onclick=function(){
  var code=$("code").value.replace(/\D/g,"");
  if(code.length!==6){$("pair-err").textContent=t("e_code");return}
  $("pair-err").textContent="";
  api("POST","/api/pair",{code:code,name:$("name").value}).then(function(r){
    if(r.status===200&&r.json.token){token=r.json.token;store(TOKEN_KEY,token);$("code").value="";poll()}
    else $("pair-err").textContent=t("e_"+(r.json.error||"net"));
  },function(){$("pair-err").textContent=t("e_net")});
};
$("code").oninput=function(){$("pair-err").textContent=""};

// 轮询
var pageAt=null;
function poll(){
  if(!token&&!asAdmin()){show("s-pair");admEntryLabels();autoPair();return}
  var asked=role;
  api("GET","/api/state").then(function(r){
    // 换了身份，这一回问的作废
    if(asked!==role)return;
    if(r.status===401&&asked==="admin"){adminLost();return}
    if(r.status===401){token=null;store(TOKEN_KEY,null);show("s-pair");autoPair();return}
    fails=0;$("warn").style.display="none";
    state=r.json;
    // 网页换了新版(游戏那头的 index.html 改了)：重新载入，不接着跑旧网页里的代码
    if(state.page){if(pageAt==null)pageAt=state.page;else if(state.page!==pageAt){location.reload();return}}
    if(state.lang&&T[state.lang]&&state.lang!==lang){lang=state.lang;applyLang()}
    render();
    // 总图、军情都是"变了才取"：state 里各带一个数，同手上那份对不上才去要
    if(state.loaded&&(!map||mapShown()&&state.mapStamp!==map.stamp)&&Date.now()-lastMapAt>2500)loadMap();
    // 山川上回没取全就停了：过几秒从头再取(不然图一直是黑的)
    else if(state.loaded&&map&&map.ts&&(!terr||terr.ts!==map.ts)&&!terrBusy&&terrStopAt&&Date.now()-terrStopAt>5000)loadTerrain();
    if(state.loaded&&!state.vacant&&mapShown()&&state.armyStamp!=null&&(!armies||armies.stamp!==state.armyStamp))loadArmies();
  },function(){if(++fails>=2)$("warn").style.display="block"});
}

// 进来先同步(用户 2026-11-12 "载入服务器时可以给个加载界面，用于下载同步服务端数据")：国势、各地块归属、山川地貌、军情
// 都到了才进主界面，舆图一上来就是细的。线路慢(经中转出入境)时一直有进展就一直等；30 秒一点进展都没有(游戏那头卡着)才放进去，
// 图上会写着山川还在路上
var synced=false,syncAt=0,syncMoved=0,syncSum=-1,terrProg=null;
function syncing(){
  if(synced)return false;
  var box=$("load-steps");
  // 新的一轮同步：各行从头建
  if(!syncAt){syncAt=syncMoved=Date.now();syncSum=-1;box._sig=null}
  var steps=[["load_state",true,"tab_realm"],["load_map",!!map,"tab_map"],["load_terrain",!!map&&(!!terr||!map.ts),"l_terrain"]];
  // 选人时不取军情(没领君主看不到军队)，少这一步
  if(!state.vacant)steps.push(["load_armies",!!armies||state.armyStamp==null,"k_army"]);
  var done=steps.every(function(x){return x[1]}),sum=0;
  steps.forEach(function(x){sum+=x[0]==="load_terrain"&&!x[1]&&terrProg?terrProg.p/terrProg.n:x[1]?1:0});
  if(sum!==syncSum){syncSum=sum;syncMoved=Date.now()}
  if(done||Date.now()-syncMoved>30000){synced=true;loadTick(false);return false}
  show("s-load");loadTick(true);
  // 各步一行：头一回建好，往后只改字和样子(整行重建的话图标的明暗、"已到"的跳动每回都从头来)
  var sig=steps.map(function(x){return x[0]}).join();
  if(box._sig!==sig){
    box._sig=sig;box.textContent="";box._rows={};
    steps.forEach(function(x){
      var tag=el("span","tag"),row=li(t(x[0]),null,tag,null);
      row.insertBefore(ic(x[2],22),row.firstChild);box.appendChild(row);box._rows[x[0]]={row:row,tag:tag,was:x[1]};
    });
  }
  var now=steps.filter(function(x){return !x[1]})[0];
  steps.forEach(function(x){
    var r=box._rows[x[0]],part=x[0]==="load_terrain"&&!x[1]&&terrProg?terrProg.p/terrProg.n:0;
    // 先前没到、这会儿到了：跳一下
    var pop=x[1]&&(!r.was||r.tag.classList.contains("pop"));
    r.was=x[1];
    r.row.classList.toggle("now",now===x);
    r.tag.className="tag "+(x[1]?"green":"gold")+(pop?" pop":"")+(!x[1]&&part<=0?" ld-dots":"");
    var text=x[1]?t("load_done"):part>0?Math.round(part*100)+"%":t("load_wait");
    if(r.tag.textContent!==text)r.tag.textContent=text;
  });
  $("load-bar").style.width=Math.round(sum/steps.length*100)+"%";
  if(!state.vacant&&!armies&&state.armyStamp!=null&&Date.now()-armyAt>4000)loadArmies();
  return true;
}
// 加载界面上的钟：每秒走一下等了多久，轮换一句提示；等久了提一句线路慢
var loadTimer=null,loadTipAt=-1;
function loadTick(on){
  if(!on){if(loadTimer){clearInterval(loadTimer);loadTimer=null}return}
  if(!loadTimer){loadTipAt=-1;loadTimer=setInterval(loadClock,1000);loadClock()}
}
function loadClock(){
  if(synced||$("s-load").hidden){loadTick(false);return}
  var secs=Math.max(0,Math.round((Date.now()-syncAt)/1000));
  $("load-time").textContent=t("load_time",secs)+(secs>=15?" · "+t("load_slow"):"");
  var tips=(T[lang]||T.en).load_tips||T.en.load_tips,k=Math.floor(secs/4)%tips.length;
  if(k!==loadTipAt){loadTipAt=k;var tip=$("load-tip");tip.textContent=tips[k];tip.classList.remove("in");void tip.offsetWidth;tip.classList.add("in")}
}
function render(){
  if(!state.loaded){show("s-wait");return}
  if(state.admin){renderAdmin();return}
  // 选人页也先过加载界面(用户 2026-11-13 "我的加载界面呢")：疆域、山川都到了再出图，不让人对着一张黑图
  if(state.vacant){
    if(!picking){picking=true;resetMap();mapInto(true)}
    if(syncing())return;
    renderVacant();return;
  }
  // 刚领了一位君主：地图挪回舆图页，按他的眼界从头取

function lineChart(series,first,last){
  var NS="http://www.w3.org/2000/svg",W=320,H=120,L=8,R=58,T=8,B=18,n=series[0].values.length,max=1,min=0;
  series.forEach(function(sr){sr.values.forEach(function(v){if(v>max)max=v;if(v<min)min=v})});
  var svg=document.createElementNS(NS,"svg");svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.setAttribute("class","chart");
  function X(i){return L+(W-L-R)*(n<2?.5:i/(n-1))}
  function Y(v){return T+(H-T-B)*(1-(v-min)/(max-min||1))}
  function add(tag,attrs,text){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(text!=null)e.textContent=text;svg.appendChild(e);return e}
  [0,.5,1].forEach(function(f){var y=T+(H-T-B)*f;add("line",{x1:L,x2:W-R,y1:y,y2:y,stroke:"#565b4c","stroke-width":1,"stroke-dasharray":f===1?"":"2 3"})});
  if(min<0)add("line",{x1:L,x2:W-R,y1:Y(0),y2:Y(0),stroke:"#8fa0a8","stroke-width":1});
  var ends=[];
  series.forEach(function(sr){
    add("polyline",{points:sr.values.map(function(v,i){return X(i).toFixed(1)+","+Y(v).toFixed(1)}).join(" "),fill:"none",stroke:sr.color,"stroke-width":2,"stroke-linejoin":"miter","shape-rendering":"crispEdges"});
    sr.values.forEach(function(v,i){add("rect",{x:X(i)-2,y:Y(v)-2,width:4,height:4,fill:sr.color})});
    ends.push({y:Y(sr.values[n-1]),text:short(sr.values[n-1]),color:sr.color});
  });
  // 线尾的数：挨得太近的错开
  ends.sort(function(a,b){return a.y-b.y});
  for(var i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<11)ends[i].y=ends[i-1].y+11;
  ends.forEach(function(e){add("text",{x:W-R+5,y:Math.min(H-B,Math.max(T+4,e.y))+3,fill:e.color,"font-size":10},e.text)});
  add("text",{x:L,y:H-4,fill:"#8fa0a8","font-size":10},first);
  if(n>1)add("text",{x:W-R,y:H-4,fill:"#8fa0a8","font-size":10,"text-anchor":"end"},last);
  return svg;
}

// 一棵树：nodes 每项 {id,parent,…}；make(项) 给出这一格里的内容。同辈一行，父在上、子在下，父居子的正中，
// 连线走直角。整棵树放在一个框里，自己管拖动和缩放(用户 2026-11-12 世系图"完全拖动不了""一屏装不下，想缩小看整棵""有一块被挡住"：

// 开出来先对着 focus 那一格，整棵装得下就直接看全
function drawTree(host,nodes,make,focus,tap){
  var by={},roots=[],W=96,H=64,GX=10,GY=28,next=0,deep=0,view={s:1,x:0,y:0,dragged:false};
  nodes.forEach(function(n){by[n.id]={n:n,kids:[],x:0,d:0,done:false}});
  nodes.forEach(function(n){
    var v=by[n.id],p=n.parent!=null?by[n.parent]:null,up=p,loop=false,guard=0;
    while(up&&guard++<200){if(up===v){loop=true;break}up=up.n.parent!=null?by[up.n.parent]:null}
    if(p&&!loop)p.kids.push(v);else roots.push(v);
  });
  function place(v,d){
    v.done=true;v.d=d;if(d>deep)deep=d;
    var kids=v.kids.filter(function(k){return!k.done});
    if(!kids.length){v.x=next++;return}
    kids.forEach(function(k){place(k,d+1)});
    v.x=(kids[0].x+kids[kids.length-1].x)/2;v.shown=kids;
  }
  roots.forEach(function(r){if(!r.done){place(r,0);next+=0.4}});
  var wide=Math.max(1,Math.ceil(next-0.4))*(W+GX)-GX,tall=(deep+1)*(H+GY)-GY;
  var frame=el("div","tree"),inner=el("div","tree-in");
  wide+=24;tall+=24;
  inner.style.width=wide+"px";inner.style.height=tall+"px";
  var ns="http://www.w3.org/2000/svg",svg=document.createElementNS(ns,"svg"),path="";
  svg.setAttribute("width",wide);svg.setAttribute("height",tall);
  function cx(v){return 12+v.x*(W+GX)+W/2}
  function top(v){return 12+v.d*(H+GY)}
  Object.keys(by).forEach(function(id){
    var v=by[id];if(!v.shown)return;
    var y0=top(v)+H,mid=y0+GY/2;
    path+="M"+cx(v)+" "+y0+"V"+mid;
    path+="M"+cx(v.shown[0])+" "+mid+"H"+cx(v.shown[v.shown.length-1]);
    v.shown.forEach(function(k){path+="M"+cx(k)+" "+mid+"V"+top(k)});
  });
  var line=document.createElementNS(ns,"path");line.setAttribute("d",path);line.setAttribute("class","tree-line");svg.appendChild(line);
  inner.appendChild(svg);
  var at=null;
  Object.keys(by).forEach(function(id){
    var v=by[id],n=v.n,box=el("div","node"+(n.ruler?" ruler":"")+(n.self?" self":"")+(n.alive===false?" dead":""));
    box.style.left=(12+v.x*(W+GX))+"px";box.style.top=top(v)+"px";box.style.width=W+"px";box.style.height=H+"px";
    make(n,box);
    if(tap)box.onclick=function(){if(!view.dragged)tap(n)};
    inner.appendChild(box);
    if(focus!=null&&n.id===focus)at=v;
  });
  frame.appendChild(inner);host.appendChild(frame);
  // 看的位置：x、y 是树的左上角在框里的哪儿，s 是缩放
  function fitScale(){return Math.min(1,frame.clientWidth/wide,frame.clientHeight/tall)}
  function apply(){
    var fw=frame.clientWidth,fh=frame.clientHeight,tw=wide*view.s,th=tall*view.s;
    // 比框小的那一向居中，比框大的不拖出界
    view.x=tw<=fw?(fw-tw)/2:Math.min(0,Math.max(fw-tw,view.x));
    view.y=th<=fh?(fh-th)/2:Math.min(0,Math.max(fh-th,view.y));
    inner.style.transform="translate("+view.x+"px,"+view.y+"px) scale("+view.s+")";
  }
  function zoom(f,px,py){
    var s=Math.min(2,Math.max(Math.min(.25,fitScale()),view.s*f));
    if(px==null){px=frame.clientWidth/2;py=frame.clientHeight/2}
    view.x=px-(px-view.x)*s/view.s;view.y=py-(py-view.y)*s/view.s;view.s=s;apply();
  }
  function fit(){view.s=fitScale();apply()}
  var tools=el("div","tree-tools");
  [["c_fit",fit],["c_in",function(){zoom(1.4)}],["c_out",function(){zoom(1/1.4)}]].forEach(function(x){
    var b=el("button","act");b.appendChild(ic(x[0],18));b.onclick=function(e){e.stopPropagation();x[1]()};
    b.onpointerdown=function(e){e.stopPropagation()};tools.appendChild(b);
  });
  frame.appendChild(tools);
  // 拖动、捏合：手指挪过 6 点就算拖，松手时不算点了一格
  var pts={},last=null;
  function spread(){var k=Object.keys(pts);if(k.length<2)return null;var a=pts[k[0]],b=pts[k[1]];
    return{d:Math.hypot(a.x-b.x,a.y-b.y),x:(a.x+b.x)/2,y:(a.y+b.y)/2}}

    if(Object.keys(pts).length===1)view.dragged=false;
    last=spread();
  });
  frame.addEventListener("pointermove",function(e){
    var p=pts[e.pointerId];if(!p)return;
    var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(Math.hypot(p.x-p.x0,p.y-p.y0)>6)view.dragged=true;
    var two=spread();
    if(two&&last){
      var r=frame.getBoundingClientRect();

  function up(e){delete pts[e.pointerId];last=spread()}
  frame.addEventListener("pointerup",up);frame.addEventListener("pointercancel",up);frame.addEventListener("pointerleave",up);

  },{passive:false});
  setTimeout(function(){
    if(at&&fitScale()<.75){view.s=1;view.x=frame.clientWidth/2-cx(at);view.y=frame.clientHeight/2-top(at)-H/2;apply()}
    else fit();
  },0);
}

// 男女使用同一颈口与脚底坐标，衣装各有一版；后发、脸、衣着、面纹、胡须、前发、冠帽依序合成。

// 所有配件都在同一画布上。全包冠帽压住前后发，其余冠帽只压住帽檐以上的前发。
function ptLayers(p){
  var T=PORTRAIT.tiles,clip=PORTRAIT.clip[p.hat],body="body:"+p.body+":"+p.sex,out=[];
  PORTRAIT.order.forEach(function(layer){
    var key;
    if(layer==="body")key=body;
    else if(layer==="base"){if(T[body]!=null)return;key="base:"+p.sex}
    else if(layer==="hair"||layer==="back"){if(clip==="all")return;key=layer+":"+p.hair}
    else key=layer+":"+p[layer];
    if(T[key]!=null)out.push({key:key,index:T[key],clip:layer==="hair"?clip||0:0});
  });

function portraitUrl(parts,thumb){
  var key=[parts.sex,parts.body,parts.head,parts.mark,parts.beard,parts.hair,parts.hat,
    parts.skin,parts.tone,parts.hairColor,parts.eye,!!thumb].join("|");

  var ctx=cv.getContext("2d"),out=ctx.createImageData(cw,ch),d=out.data;
  var skin=parts.tone?parts.tone.split(",").map(Number):pal.skin[parts.skin]||pal.skin[0];
  var hair=pal.hair[parts.hairColor]||pal.hair[0],eye=pal.eye[parts.eye]||pal.eye[0];
  ptLayers(parts).forEach(function(L){
    var ax=L.index%PORTRAIT.columns*W+crop[0],ay=Math.floor(L.index/PORTRAIT.columns)*H+crop[1];
    var base=PORTRAIT.skinBases[L.key],tone=base&&base.map(function(v,c){return skin[c]/Math.max(1,v)});
    var tintHair=/^(back|hair|beard):/.test(L.key);

        r*=tone[0];g*=tone[1];b*=tone[2];

// 游戏表型颜色落在自然肤色带，再掺入原有色相。过世人物或旧数据没有颜色时按文化选。
var PT_RAMP=[[66,42,32],[104,68,48],[158,112,82],[200,158,128],[218,183,170]];
function ptTone(hex){
  if(!/^[0-9a-f]{6}$/i.test(hex||""))return null;
  var g=[0,2,4].map(function(i){return parseInt(hex.substr(i,2),16)});
  function lum(c){return .3*c[0]+.59*c[1]+.11*c[2]}

function decodeMap(j){

// 图层(用户 2026-11-12 "图层分两种, 一种是政体图层一种是法理图层""天下拉近是帝国, 帝国拉近是王国级法理""在帝国图层,
// 拉近到一个帝国后就隐藏帝国铭牌, 然后显示那个帝国的行政区, 拉近到某个行政区就显示那个行政区的城市"；层级全靠远近)：

// 一个图层是一棵树(map.nodes：lvl 0 天下、1 帝国、2 国或王国法理，后者是叶)，每块地挂在一片叶上(map.zLeaf)。

// 页面上当场就办的小按钮：收不回来的事点一下先变"确认"，再点才办
function admArmBtn(key,label,icon,go,cls){
  var on=admArm===key,b=el("button","act"+(on?" armed":cls?" "+cls:""));
  if(ICON[icon])b.appendChild(ic(icon,18));
  b.appendChild(document.createTextNode(on?t("d_confirm",label):label));b.style.margin="0";
  b.onclick=function(e){
    e.stopPropagation();
    if(admArm!==key){admArm=key;renderAdminRoom();return}
    admArm=null;b.disabled=true;go();
  };
  return b;
}
// 弹出界面里的一项，同上
function admPick(key,label,sub,icon,no,go){
  var on=admArm===key,b=el("button","pick"+(on?" armed":no?" no":"")),lead=el("span","hl"),left=el("span");
  left.appendChild(el("div",null,on?t("d_confirm",label):label));if(sub)left.appendChild(el("div","sub",sub));
  if(ICON[icon])lead.appendChild(ic(icon,24));lead.appendChild(left);b.appendChild(lead);
  b.onclick=function(){if(admArm!==key){admArm=key;renderSheet();return}admArm=null;closeSheet();go()};
  return b;
}
function renderAdminSeats(){
  var box=$("aseats"),seats=state.seats||[],sig=JSON.stringify([seats,state.limit,lang]);
  if(box._sig===sig)return;
  box._sig=sig;box.textContent="";
  var on=seats.filter(function(s){return s.online}).length,ruling=seats.filter(function(s){return s.ruler}).length;
  var head=el("div","card gold"),grid=el("div","grid");
  grid.appendChild(admKpi("k_people",t("adm_k_seats"),seats.length+"/"+state.limit));
  grid.appendChild(admKpi("i_ok",t("adm_k_online"),String(on)));
  grid.appendChild(admKpi("i_crown",t("adm_k_ruling"),String(ruling)));
  head.appendChild(grid);box.appendChild(head);
  var card=el("div","card");card.appendChild(hd("k_people",t("adm_seats")));
  if(!seats.length)card.appendChild(el("div","sub",t("adm_no_seats")));
  seats.forEach(function(s){
    var tag=el("span","tag "+(s.online?"green":""),t(s.online?"adm_online":"adm_away"));
    var row=li(s.name,s.ruler?t("adm_seat_ruling",s.realm,s.ruler)+" · "+t("role_"+s.role):t("adm_seat_vacant"),tag,function(){adminSeatSheet(s)});
    var lead=s.look&&PORTRAIT?portrait(s.look,s.rid,30):ic("i_crown",24);if(!s.ruler)lead.style.opacity=".3";
    row.insertBefore(lead,row.firstChild);
    card.appendChild(row);
  });
  card.appendChild(el("div","sub",t("adm_seats_note")));
  box.appendChild(card);
}
function adminSeatSheet(s){
  admArm=null;
  openSheet({title:s.name,note:(s.ruler?t("adm_seat_ruling",s.realm,s.ruler)+" · "+t("role_"+s.role):t("adm_seat_vacant"))+" · "+t(s.online?"adm_online":"adm_away"),
    items:[],custom:function(box){
      if(s.look&&PORTRAIT){var f=el("div","face");f.appendChild(portrait(s.look,s.rid,64));box.appendChild(f)}
      if(s.ruler)box.appendChild(admPick("recall",t("adm_recall"),t("adm_recall_note"),"i_return",false,function(){adminSend({id:"recall",target:s.key})}));
      box.appendChild(admPick("kick",t("adm_kick"),t("adm_kick_note"),"dv_remove",true,function(){adminSend({id:"kick",target:s.key})}));
    }});
}
function renderAdminRoom(){
  var box=$("aroom"),r=state.room||{},v=state.speedVote,seats=state.seats||[];
  var sig=JSON.stringify([state.speed,state.slowed,state.paused,state.code,state.limit,seats.length,r,v&&[v.id,v.yes,v.no,v.need],admArm,lang,!!token]);
  if(box._sig===sig)return;
  box._sig=sig;box.textContent="";
  // 世界：流速、暂停
  var world=el("div","card gold");world.appendChild(hd("k_years",t("adm_world")));
  if(v){var vote=el("div","sub",t("adm_vote_live",v.by,v.percent,v.yes,v.no,v.need));vote.style.color="var(--amber)";world.appendChild(vote)}
  world.appendChild(li(t("adm_speed"),t("adm_speed_sub")+(state.slowed?"":" · "+t("adm_unslowed")),el("span","tag gold",state.speed+"%"),adminSpeedSheet));
  var pause=el("button","act"+(state.paused?" primary":""));pause.style.margin="0";
  pause.appendChild(document.createTextNode(t(state.paused?"adm_resume":"adm_pause")));
  pause.onclick=function(){pause.disabled=true;adminSend({id:"pause",choice:state.paused?"off":"on"})};
  world.appendChild(liAct(t("adm_clock"),t(state.paused?"adm_paused":"adm_running"),pause));
  box.appendChild(world);
  // 配对：普通配对码、席位上限
  var pair=el("div","card");pair.appendChild(hd("i_lock",t("adm_pair")));
  var right=el("span","hl");right.appendChild(el("span","adm-code",state.code||"------"));
  right.appendChild(admArmBtn("new_code",t("adm_new_code"),"i_office",function(){adminSend({id:"new_code"})}));
  pair.appendChild(li(t("adm_code_now"),t("adm_code_sub"),right,null));
  pair.appendChild(li(t("adm_limit"),t("adm_limit_sub",seats.length),el("span","tag gold",String(state.limit)),adminLimitSheet));
  box.appendChild(pair);
  // 联机大厅：接没接(只看)、公开与否、房间名
  var lobby=el("div","card");lobby.appendChild(hd("g_diplomacy",t("adm_lobby")));
  var line=t("adm_line_"+(r.line||"global"));
  lobby.appendChild(li(t("adm_lobby"),null,el("span","tag "+(r.lobby&&r.online?"green":r.lobby?"amber":""),
    !r.lobby?t("adm_lobby_off"):r.online?t("adm_lobby_on",line):t("adm_lobby_wait",line)),null));
  var open=el("button","act"+(r.open?"":" primary"));open.style.margin="0";
  open.appendChild(document.createTextNode(t(r.open?"adm_make_private":"adm_make_open")));
  open.onclick=function(){open.disabled=true;adminSend({id:"room_open",choice:r.open?"off":"on"})};
  lobby.appendChild(liAct(t("adm_open"),t(r.open?"adm_open_on":"adm_open_off")+" · "+t("adm_open_note"),open));
  lobby.appendChild(li(t("adm_room_name"),r.name?null:t("adm_room_auto",r.auto||""),el("span","sub",r.name||r.auto||""),adminRoomSheet));
  box.appendChild(lobby);
  // 身份：回君主席位(或去配一个)、退出管理员
  var self=el("div","card");self.appendChild(hd("i_seal",t("adm_self")));
  self.appendChild(li(t(token?"adm_to_seat":"adm_pair_seat"),t(token?"adm_to_seat_sub":"adm_pair_seat_sub"),null,function(){switchRole("seat")}));
  self.appendChild(liAct(t("adm_logout"),t("adm_logout_sub"),admArmBtn("logout",t("adm_logout"),"c_close",adminLogout,"no")));
  box.appendChild(self);
}
function adminLogout(){
  var done=function(){adminToken=null;store(ADMIN_KEY,null);switchRole("seat")};
  api("POST","/api/admin/logout").then(done,done);
}
// 世界流速：五档直接点，别的数自己填
function adminSpeedSheet(){
  var choices=state.speedChoices||[5,10,25,50,100];
  openSheet({title:t("adm_speed"),note:t("adm_speed_note"),items:[],custom:function(box){
    choices.forEach(function(p){
      var b=el("button","pick"+(p===state.speed?" primary":"")),lead=el("span","hl");
      lead.appendChild(ic("k_years",24));lead.appendChild(el("span",null,t("adm_speed_set",p)));b.appendChild(lead);
      b.onclick=function(){closeSheet();adminSend({id:"speed",choice:String(p)})};
      box.appendChild(b);
    });
    var inp=el("input");inp.type="number";inp.min="1";inp.max="100";inp.inputMode="numeric";inp.placeholder=t("adm_speed_custom");inp.style.marginTop="10px";
    var go=el("button","pick primary");go.appendChild(el("span",null,t("adm_save")));go.style.justifyContent="center";
    go.onclick=function(){var p=Math.round(Number(inp.value));if(!(p>=1&&p<=100)){inp.focus();return}closeSheet();adminSend({id:"speed",choice:String(p)})};
    box.appendChild(inp);box.appendChild(go);
  }});
}
// 席位上限：1 到 16 点一个
function adminLimitSheet(){
  admLimit=state.limit;
  openSheet({title:t("adm_limit"),note:t("adm_limit_note")+" "+t("adm_limit_sub",(state.seats||[]).length),items:[],custom:function(box){
    var grid=el("div","adm-nums");
    for(var n=1;n<=(state.maxLimit||16);n++)(function(n){
      var b=el("button",n===admLimit?"on":"",String(n));
      b.onclick=function(){closeSheet();if(n!==state.limit)adminSend({id:"seat_limit",choice:String(n)})};
      grid.appendChild(b);
    })(n);
    box.appendChild(grid);
  }});
}
function adminRoomSheet(){
  var r=state.room||{};
  openSheet({title:t("adm_room_name"),note:t("adm_room_hint"),items:[],custom:function(box){
    var inp=el("input");inp.maxLength=24;inp.value=r.name||"";inp.placeholder=r.auto||"";inp.style.marginTop="6px";
    var go=el("button","pick primary");go.appendChild(el("span",null,t("adm_save")));go.style.justifyContent="center";
    go.onclick=function(){closeSheet();adminSend({id:"room_name",choice:inp.value.trim()})};
    inp.onkeydown=function(e){if(e.key==="Enter")go.onclick()};
    box.appendChild(inp);box.appendChild(go);
  }});
}
// 点图上的国：是哪位君主、哪个席位领着；有席位领着的可以就地收回
function adminRealm(r){
  sel=null;aim=false;
  if(!r){panel(t("m_wild"),[]);return}
  var who=r.id?(state.rulers||[]).filter(function(x){return x.kid===r.id})[0]:null;
  if(!who){panel(r.name,[belongOf(r)||null]);return}
  var seat=(state.seats||[]).filter(function(s){return s.kid===who.kid})[0],acts=[];
  if(seat)acts.push({label:t("adm_recall"),icon:"i_return",go:function(){adminSeatSheet(seat)}});
  panel(who.realm+" · "+who.ruler,[t("ruler_detail",t("role_"+who.kind),who.cities,who.age),belongOf(r)||null,
    seat?t("adm_held",seat.name):t("adm_free")],acts);
}
// 点图上的军：上帝视角，番号、兵数照实
function adminArmies(list){
  sel=null;aim=false;mapSelZone=-1;
  var total=0,rs=[],first=list[0];
  list.forEach(function(a){total+=a.n;if(rs.indexOf(a.r)<0)rs.push(a.r);if(a.n>first.n)first=a});
  var realm=map.realms[first.r],who=realm?realm.name:"?";
  var lines=[t("adm_army_total",num(total))+(list.length>1?" · "+t("army_count",list.length):"")];
  list.slice().sort(function(a,b){return b.n-a.n}).slice(0,6).forEach(function(a){
    var rr=map.realms[a.r];lines.push((a.name||"?")+" · "+num(a.n)+(rs.length>1&&rr?" · "+rr.name:""));
  });
  panel(rs.length>1?t("army_mixed",who,rs.length):t("army_foreign",who),lines);
  drawMap();
}
// 配对页、选人页上的管理员入口
$("admin-open").onclick=function(){
  if(adminToken){switchRole("admin");return}
  var c=$("admin-card");c.hidden=!c.hidden;if(!c.hidden)$("admin-code").focus();
};
$("admin-go").onclick=function(){adminLogin($("admin-code").value,$("admin-err"),function(){$("admin-code").value="";$("admin-card").hidden=true})};
$("admin-code").onkeydown=function(e){if(e.key==="Enter")$("admin-go").onclick()};
$("admin-code").oninput=function(){$("admin-err").textContent=""};
$("vacant-admin").onclick=adminEntry;

// 页签。舆图是底(群里的意见 "这个网页主体就是这个地图，然后功能键移动到侧边或者上面")：办事的那一页是浮在图上的窗口，
// 再点一下它的页签、点窗口右上角的关、点"地图"页签，都是收起来只看图
var tabs=document.querySelectorAll("nav button");
function goPage(p){
  commitSeen();
  if(p===page&&p!=="map")p="map";
  page=p;
  $("win-title").textContent=page==="map"?"":t("tab_"+page);
  if(ICON["tab_"+page])$("win-ic").src=ICON["tab_"+page];
  for(var j=0;j<tabs.length;j++)tabs[j].className=tabs[j].getAttribute("data-p")===page?"on":"";
  ["reports","map","realm","decrees","annals","aseats","aroom"].forEach(function(q){$("p-"+q).hidden=q!==page});
  document.body.classList.toggle("side",page!=="map");
  if(page==="annals")openAnnals();
  window.scrollTo(0,0);
  if(page!=="map")$("p-"+page).scrollTop=0;
  if(mapShown()){
    drawMap();
    if(!map||state&&state.mapStamp!==map.stamp&&Date.now()-lastMapAt>2500)loadMap();
    if(Date.now()-armyAt>5000)loadArmies();
  }
  if(page==="reports"&&state&&state.loaded&&!state.vacant)renderReports();
}
for(var i=0;i<tabs.length;i++)tabs[i].onclick=function(){goPage(this.getAttribute("data-p"))};
function badge(id,n){var b=$(id);b.hidden=!n;b.textContent=n>99?"99+":n}
// 抬头有多高：横着拿时左边那一栏的内容从它底下排起
function fit(){
  var root=document.documentElement.style,before=root.getPropertyValue("--barh")+root.getPropertyValue("--navh");
  root.setProperty("--barh",$("bar").offsetHeight+"px");root.setProperty("--navh",$("nav").offsetHeight+"px");
  // 页签栏的高矮变了(头一回量出来、转了屏)：图跟着重画
  if(before!==root.getPropertyValue("--barh")+root.getPropertyValue("--navh")&&map&&map.win)drawMap();
}
$("win-close").onclick=function(){goPage("map")};
window.addEventListener("resize",fit);

// 从数字地址跳到固定地址时带过来的配对(?k=)：记下，随后从地址栏去掉
(function(){
  var m=/[?&]k=([0-9a-f]{32})(?:&|$)/.exec(location.search);
  if(!m)return;
  token=m[1];store(TOKEN_KEY,token);
  try{history.replaceState(null,"",location.pathname)}catch(e){}
})();
// 固定地址：电脑的地址变了、换台电脑开游戏都还是它。这部手机认得出这个名字才给按钮(拿图标试一下)；跳过去时把配对带上
var FIXED="empirecraft.local";
(function(){
  if(location.hostname===FIXED||!location.port)return;
  var base="http://"+FIXED+":"+location.port,probe=new Image();
  probe.onload=function(){$("fixed-note").textContent=t("a2hs_fixed_note",FIXED+":"+location.port);$("fixed-box").hidden=false};
  probe.src=base+"/icon-192.png?"+Date.now();
  $("fixed-go").onclick=function(){location.href=base+"/"+(token?"?k="+token:"")};
})();
// 扫码进来：地址里带着配对码(?c=)，记下，用完把它从地址栏去掉。没配过就拿它直接配(见 autoPair)；
// 手机里留着旧令牌的先照旧令牌试，作废了(被除名、房主换了存档)再拿这个码配——以前有旧令牌就把码丢了，
// 公开的房间进去还得手填(用户 2026-11-11 "终端的公开模式是不是搞错了怎么还需要我填配对码")
var scanned=null,triedScan=false,triedLobby=false;
(function(){
  var m=/[?&]c=(\d{6})(?:&|$)/.exec(location.search);
  if(!m)return;
  try{history.replaceState(null,"",location.pathname)}catch(e){}
  scanned=m[1];
})();
// 没配对时自己配：先用地址里带来的码；没有码、又是在联机大厅的房间里(/r/房间号)，就问大厅这间是不是公开的，是就拿它给的码配。
// 各试一回，不成就留在配对页等手填
function autoPair(){
  if(token)return;
  if(scanned&&!triedScan){triedScan=true;$("code").value=scanned;$("pair-go").onclick();return}
  var room=/^\/r\/([0-9a-f]{16})$/.exec(BASE);
  if(!room||triedLobby)return;
  triedLobby=true;
  fetch("/api/join?room="+room[1],{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
    if(token||!j||!j.open||!j.code)return;
    $("code").value=j.code;$("pair-go").onclick();
  },function(){});
}
$("purge-go").onclick=function(){goDecrees()};
$("a2hs").hidden=!!(navigator.standalone||(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches));
$("sheet-close").onclick=closeSheet;$("sheet-back").onclick=closeSheet;
applyLang();
poll();
setInterval(function(){if(!document.hidden)poll()},3000);
})();
