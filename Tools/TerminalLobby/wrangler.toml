# EmpireCraft 终端模式联机大厅(Cloudflare Workers + Durable Objects)。发布步骤见同目录「发布说明.md」
name = "empirecraft-lobby"
main = "worker.js"
compatibility_date = "2025-06-01"

# 挂在自己的域名上(域名要在同一个 Cloudflare 账号里)；发布时会自动建好这条解析和证书
routes = [
  { pattern = "lobby.cmhgamedev.dpdns.org", custom_domain = true }
]

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# 免费档只能用 SQLite 后端的 Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]
