# EmpireCraft 终端模式联机大厅(Cloudflare Workers + Durable Objects)。发布步骤见同目录「发布说明.md」
name = "empirecraft-lobby"
main = "worker.js"
compatibility_date = "2025-06-01"

# 原来挂在 lobby.cmhgamedev.dpdns.org，2026-11-28 被 Cloudflare 封了：先用 workers.dev 地址
# (https://empirecraft-lobby.zhangzhaoyu101.workers.dev)。以后要挂自己的域名(域名要在同一个 Cloudflare 账号里)，
# 加回 routes = [ { pattern = "lobby-global.cmhai.tech", custom_domain = true } ]
workers_dev = true

# 图标、像素框按原样打进去(worker.js 里 import 进来是一段字节)
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

# 免费档只能用 SQLite 后端的 Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Lobby"]
