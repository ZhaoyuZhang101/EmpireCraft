<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmpireCraft 科技 / 制度节点编辑器</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="pixel-theme.css" />
  <style>
    .fgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
    .fhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .fkey{font-size:11px;opacity:.6;font-family:Consolas,monospace}
    .fhint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:2px}
    .fnote{font-size:12px;color:var(--muted);margin:2px 0 4px}
    .fhead .inherit{margin-left:auto}
    h3 .fhint{font-weight:normal;margin:0}
    .rowcard{border:1px solid var(--line);padding:8px 10px;margin-bottom:8px}
    .rowcard .rowhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
    .rowcard .rowhead .spacer{flex:1}
    .mapgrid{display:grid;grid-template-columns:180px minmax(0,1fr) 34px;gap:6px 8px;align-items:start}
    .settings-sec{scroll-margin-top:10px;margin-bottom:6px}
    .uses .chip{cursor:pointer}
    .pick{position:relative}
    .pickmenu{position:absolute;top:100%;left:0;z-index:30;min-width:300px;max-width:460px;max-height:300px;overflow:auto;background:var(--c-input,#fffdfa);border:1px solid var(--c-gold-dim,var(--line));box-shadow:0 6px 18px rgba(0,0,0,.45)}
    .pickmenu>div{padding:3px 8px;cursor:pointer;display:flex;gap:8px;align-items:center;white-space:nowrap}
    .pickmenu>div.on,.pickmenu>div:hover{background:var(--c-card2,#f0dcb3)}
    .pickmenu .fkey{margin-left:auto}
    .chip .fkey{margin-left:3px}
    details.adv{margin-top:14px;border-top:1px dashed var(--line);padding-top:4px}
    details.adv>summary{cursor:pointer;color:var(--accent2);padding:6px 0}
    #newDlg{width:min(780px,94vw)}
    #newDlg .fgrid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
    #lineDlg{width:min(720px,94vw)}
    #importDlg{width:min(860px,94vw)}
    #importDlg .pickall{max-height:46vh;overflow:auto;border:1px solid var(--line);padding:4px 8px;margin-top:8px}
    #importDlg .lvl{font-size:12px;color:var(--muted);margin:8px 0 2px;border-bottom:1px dashed var(--line)}
    #importDlg label.row{display:flex;gap:8px;align-items:center;padding:2px 0;cursor:pointer}
    #importDlg label.row.off{opacity:.55;cursor:default}
    #importDlg label.row .fkey{margin-left:auto}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="side">
      <label class="field">数据源<select id="sourceSel"></select></label>
      <div class="toolbar">
        <button class="small" id="newLineBtn" title="在 InstitutionTrees 里新建一条制度科技线：空白起步，或整条复制一条现有的线">＋ 新建科技树</button>
      </div>
      <div class="toolbar" id="nodeTools">
        <button class="primary small" id="addBtn"><img class="ico sm" src="assets/icons/iconShovelPlus.png">新节点</button>
        <button class="small" id="cloneBtn">复制</button>
        <button class="small" id="importBtn" title="从别的科技树挑节点复制到这条线">导入节点</button>
        <button class="small danger" id="delBtn">删除</button>
      </div>
      <input id="nodeFilter" placeholder="搜索 id / 名称…" />
      <select id="groupFilter"></select>
      <div class="list" id="nodeList"></div>
      <div class="toolbar">
        <button class="primary" id="saveBtn"><img class="ico sm" src="assets/icons/iconSaveLocal.png">保存文件</button>
        <button id="reloadBtn">重新读取</button>
      </div>
    </aside>
    <main class="panel">
      <div class="graph" id="graph"></div>
      <div id="editor" style="margin-top:14px"><p class="muted">从左侧或上面的图里选一个节点。</p></div>
    </main>
  </div>

  <script src="common.js"></script>
  <script src="zh-convert.js"></script>
  <script>
    // 数据源 = 一个 json 文件里的一个节点数组(科技、材料、制度线、公共模板、名著、商品)，或一个文件的全局设置(kind: "settings")。
    // 字段按 C# 载入器(TechnologySystem、InstitutionConfig、LandmarkBookSystem、CommodityMarketSystem)给出编辑控件，
    // 表单没覆盖的字段放进“其它字段(JSON)”，原样保留。保存时只重写改过的部分，没改的地方保持原文件的排版。
    const TECH = "Technology/TechTree.json", BOOKS = "Technology/LandmarkBooks.json", COMM = "Technology/Commodities.json";
    const SETTINGS = "InstitutionTrees/Settings.json";
    const SOURCES = [];
    const S = { docs: {}, source: null, selected: null, dirty: new Set(), locales: {}, localeEdits: {}, landmarkCsv: null, lookups: {}, loadErrors: [],
      newNodes: new WeakSet(), advOpen: false, zhAuto: {} };

    // ---------- 小工具 ----------
    const isObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
    const isEmptyVal = v => v === "" || v === null || v === undefined || (Array.isArray(v) && !v.length) || (isObj(v) && !Object.keys(v).length);
    function deepEq(a, b) {
      if (a === b) return true;
      if (Array.isArray(a)) return Array.isArray(b) && a.length === b.length && a.every((x, i) => deepEq(x, b[i]));
      if (isObj(a)) {
        if (!isObj(b)) return false;
        const ka = Object.keys(a).filter(k => a[k] !== undefined), kb = Object.keys(b).filter(k => b[k] !== undefined);
        return ka.length === kb.length && ka.every(k => Object.prototype.hasOwnProperty.call(b, k) && deepEq(a[k], b[k]));
      }
      return false;
    }
    function getPath(o, k) { return String(k).split(".").reduce((x, p) => isObj(x) ? x[p] : undefined, o); }
    // 写一个(可带点号的)字段；空值删掉这个键，因此变空的上级对象也一并删掉(keep = 空数组/空对象也写进去)
    function setPath(o, k, v, keep = false) {
      const parts = String(k).split(".");
      if (isEmptyVal(v) && !(keep && (Array.isArray(v) || isObj(v)))) {
        const chain = [o];
        for (const p of parts.slice(0, -1)) { const next = chain[chain.length - 1][p]; if (!isObj(next)) return; chain.push(next); }
        const last = parts[parts.length - 1];
        if (!(last in chain[chain.length - 1])) return;
        delete chain[chain.length - 1][last];
        for (let i = chain.length - 1; i > 0; i--) { if (Object.keys(chain[i]).length) break; delete chain[i - 1][parts[i - 1]]; }
        return;
      }
      let cur = o;
      for (const p of parts.slice(0, -1)) { if (!isObj(cur[p])) cur[p] = {}; cur = cur[p]; }
      cur[parts[parts.length - 1]] = v;
    }
    function summary(v) {
      if (v === true) return "是";
      if (v === false) return "否";
      if (Array.isArray(v)) return v.length ? v.map(x => isObj(x) ? JSON.stringify(x) : x).join("、") : "(空)";
      if (isObj(v)) return Object.entries(v).map(([k, x]) => `${k} ${x}`).join("、") || "(空)";
      return String(v);
    }
    const F = (k, label, type = "text", opt = null, more = {}) => ({ k, label, type, opt, ...more });
    const SEC = (sec, hint = "") => ({ sec, hint });
    const ADV = () => ({ adv: true });
    const optsOf = o => (typeof o === "function" ? o() : o || []).map(x => Array.isArray(x) ? x : [x, x]);
    const clamp01 = x => Math.max(0, Math.min(1, x));

    // ---------- 枚举：直接读 C# 源码，读不到用内置清单 ----------
    async function readCs(file) {
      try { const r = await api.readText(file); return r.exists ? r.text.replace(/\/\*[\s\S]*?\*\//g, "").replace(/\/\/.*$/gm, "") : ""; } catch { return ""; }
    }
    async function readEnum(file, name, fallback) {
      const m = (await readCs(file)).match(new RegExp(`enum\\s+${name}\\s*\\{([^}]*)\\}`));
      const names = m ? m[1].split(",").map(s => s.split("=")[0].trim()).filter(s => /^[\p{L}_][\p{L}\p{N}_]*$/u.test(s)) : [];
      return names.length ? names : fallback;
    }
    async function readStringSet(file, field, fallback) {
      const m = (await readCs(file)).match(new RegExp(`${field}\\s*=\\s*new[^{]*\\{([^}]*)\\}`));
      const names = m ? [...m[1].matchAll(/"([^"]+)"/g)].map(x => x[1]) : [];
      return names.length ? names : fallback;
    }

    // ---------- 字段表 ----------
    const BRANCH_LABEL = { material: "材料", metallurgy: "冶金", military: "军事", construction: "营造", science: "科学", naval: "海军", civics: "典章",
      administration: "行政", finance: "财政", society: "社会", ideology: "理念", production: "生产" };
    const branchOpt = b => [b, BRANCH_LABEL[b] ? `${BRANCH_LABEL[b]} ${b}` : b];
    const BOOST_TYPES = [["building_type", "建筑类型 building_type"], ["resource", "仓库资源 resource"], ["population", "全文化人口 population"], ["cities", "城市数 cities"],
      ["material", "已发现材料 material"], ["tech", "已掌握科技 tech"], ["institution_feature", "制度特性 institution_feature"], ["contact_knows", "接触文化已掌握 contact_knows"], ["war_knows", "交战文化已掌握 war_knows"]];
    const ENVIRONMENTS = [["prosperous", "富庶 prosperous"], ["industrial", "有工业 industrial"], ["industrial_unrest", "工业且工农不满 industrial_unrest"], ["militarized", "战时或兵多 militarized"], ["mass_politics", "大众政治 mass_politics"]];
    const GOOD_TIERS = [["basic", "基础物资 basic"], ["raw", "原料 raw"], ["manufactured", "制成品 manufactured"], ["luxury", "奢侈品 luxury"]];
    const EFFECT_COLS = () => [
      { f: "type", label: "效果", kind: "select", opts: () => S.lookups.effects },
      { f: "value", label: "值", kind: "list", opts: [], omitEmpty: true },
      { f: "option", label: "选项", kind: "list", opts: [], omitEmpty: true },
      { f: "int_value", label: "整数值", kind: "number", omitEmpty: true },
      { f: "faction", label: "派系", kind: "select", opts: () => ["", ...S.lookups.factions], omitEmpty: true }
    ];

    // 字段顺序：常用的在前；ADV() 之后的进折叠的「高级」(没填的按代码默认值，输入框里灰字就是默认值)
    function techFields() {
      return [
        SEC("基本"),
        F("branch", "分支", "select", () => (doc(TECH)?.branches || []).filter(b => b !== "material").map(branchOpt)),
        F("tier", "时代", "era", null, { def: 1, hint: "也决定进时代要的“此前各时代科技”；高过本文化时代太多的要多花钱" }),
        F("cost", "基础花费", "number", null, { def: 10, hint: "实际花费再乘全局倍率、城数、超时代倍率" }),
        F("", "时代节点", "custom", null, { virtual: true, render: eraNodeNote }),
        SEC("前置"),
        F("requires_techs", "前置科技", "refs", "tech"),
        F("requires_materials", "需要材料", "refs", "material"),
        SEC("解锁"),
        F("unlock_materials", "解锁打造材料", "chips", () => uniq(["wood", "stone", "leather", "copper", "bronze", "silver", "iron", "steel", "mythril", "adamantine", ...collect("tech", "unlock_materials")]),
          { hint: "原版装备材质(ItemAsset.material)，如 bronze、steel" }),
        F("unlock_items", "解锁装备", "chips", () => collect("tech", "unlock_items"), { hint: "物品 id，别的模组没装时自动跳过" }),
        F("unlock_buildings", "解锁建筑", "chips", () => collect("tech", "unlock_buildings"), { hint: "支持 * 通配，如 6house_*_modernmod" }),
        F("unlock_units", "解锁单位", "chips", () => collect("tech", "unlock_units"), { hint: "别的模组的载具等 ActorAsset id" }),
        ADV(),
        SEC("科研"),
        F("research_bonus", "科研加成", "number", null, { def: 0, hint: "0.1 = 科研产出 +10%" }),
        F("research_slots", "同时研究几项", "number", null, { def: 0, hint: "研究出来后能并行研究的项数(取已研究科技里最大的)" }),
        F("requires_institutions", "需要制度特性", "table", null, { hint: "本文化推行了带该特性的制度(特性值不低于最低值)才能研究",
          cols: [{ f: "feature", label: "制度特性", kind: "list", opts: () => S.lookups.features }, { f: "min_value", label: "最低值", kind: "number", def: 1 }] }),
        F("by_line", "按制度线换名字与前置", "custom", null, { render: byLineWidget,
          hint: "某条制度线上这项科技换个名字(语言键 tech_&lt;key&gt; / tech_&lt;key&gt;_desc)和前置；没写的线用上面的前置" }),
        SEC("海军", "海军分支：水师辐射、舰船战力、舰种"),
        F("naval_reach", "水师辐射加格数", "number", null, { def: 0 }),
        F("naval_power", "舰船战力加成", "number", null, { def: 0, hint: "0.25 = +25%" }),
        F("naval_hull", "舰种倍率", "number", null, { def: 0, hint: "1.5 / 2.5 / 4，取已研究的最高" }),
        SEC("灵感与物资"),
        F("boosts", "灵感(提前做到就给一部分进度)", "table", null, {
          cols: [{ f: "type", label: "条件", kind: "select", opts: BOOST_TYPES }, { f: "value", label: "对象", kind: "list", opts: () => [...namedOpts("material")(), ...namedOpts("tech")(), ...S.lookups.features] }, { f: "amount", label: "数量", kind: "number", def: 1 }] }),
        F("", "研究离不开的物资", "custom", null, { virtual: true, render: techGoodsWidget, hint: "商品市场(Commodities.json 的 techs)：缺得越多研究越慢" })
      ];
    }

    function instFields(line, isTemplate = false) {
      const cultureSugg = () => {
        const all = S.lookups.cultures || [];
        const mine = all.filter(c => c.line === line), rest = all.filter(c => c.line !== line);
        return [...mine, ...rest].map(c => [c.name, `${c.cn || c.name}${c.line ? " · " + c.line : ""}`]);
      };
      return [
        SEC("基本"),
        ...(isTemplate ? [] : [F("template", "套用公共模板", "select", () => templates().map(t => [t.id, `${locText(t.name_key) || t.id}  ${t.id}`]), { blank: "不套用", hint: "这里没写的字段沿用模板(对象逐字段合并、数组整体替换)" })]),
        F("branch", "分支", "select", () => uniq(["administration", "finance", "military", "society", "ideology", "production", ...S.lookups.instBranches]).map(branchOpt), { def: "administration" }),
        F("advancement", "进阶度(层级)", "number", null, { def: 1, hint: "树上的层级，也是吸收外来制度的门槛" }),
        F("regime", "施行后切换政体", "select", () => S.lookups.regimes, { blank: "不切换", hint: "根节点的政体就是这条线的初始政体" }),
        SEC("前置与条件"),
        ...(isTemplate ? [] : [F("requires", "前置(全部)", "refs", "self"), F("requires_any", "前置(任一)", "refs", "self"),
          F("exclusive_with", "互斥", "refs", "self"), F("replaces", "取代", "refs", "self")]),
        F("requires_techs", "需要科技", "refs", "tech", { hint: "科技树开着时：没研究出这些科技不能研究、施行，也不会被吸收" }),
        F("requires_cities", "至少几座城", "number", null, { def: 0, hint: "本国(帝国按全帝国)至少有几座城才能推行；0 不限" }),
        SEC("效果"),
        F("features", "制度特性", "kv", () => S.lookups.features, { hint: "系统只认特性、不认节点 id；多个节点声明同一特性取最大值" }),
        F("effects_on_complete", "施行完成时", "table", null, { cols: EFFECT_COLS() }),
        ADV(),
        SEC("名称键与其它条件"),
        F("name_key", "名称 key", "text", null, { hint: "节点名、说明的文本键；加 _&lt;文化小写&gt; 后缀可给某个文化另起叫法" }),
        F("description_key", "描述 key", "text"),
        F("requires_composite_empire", "要先完成多元帝国整合", "bool", null, { def: false }),
        F("research.mandate_required", "研究要多少天命", "number", null, { def: 0 }),
        SEC("适用文化", "同一条线里只给部分文化；不合本文化的节点在树上显示锁定"),
        F("cultures", "只给这些文化", "chips", cultureSugg),
        F("exclude_cultures", "这些文化不能", "chips", cultureSugg),
        F("requires_traits", "文化要有其中一个政治特性", "chips", () => S.lookups.traits, { hint: "如 nomad 游牧、raider 劫掠传统(见各文化 CultureRule.jsonc 的 political_traits)" }),
        F("exclude_traits", "有这些政治特性的文化不能", "chips", () => S.lookups.traits, { hint: "如 banner 八旗传统(四等人制不给它，它走旗民分治)" }),
        SEC("推行"),
        F("reform.base_progress_per_year", "每年进度", "number", null, { def: 8 }),
        F("reform.minimum_years", "至少几年", "number", null, { def: 5 }),
        F("reform.allow_force", "可以强行推行", "bool", null, { def: true }),
        F("reform.force_radicalism", "强推时激进度", "number", null, { def: 20 }),
        F("effects_on_start", "开始推行时的效果", "table", null, { cols: EFFECT_COLS() }),
        SEC("反对与叛乱"),
        F("resistance.base_radicalism", "基础激进度", "number", null, { def: 5 }),
        F("resistance.vested_interest_radicalism", "触动既得利益的激进度", "number", null, { def: 15 }),
        F("resistance.rebellion_threshold", "叛乱门槛", "number", null, { def: 75 }),
        F("resistance.opposition_faction_growth", "反对派壮大", "number", null, { def: 1 }),
        F("resistance.reason_key", "叛乱理由文本键", "text", () => S.lookups.reasonKeys, { def: "institution_resistance_reason_generic" }),
        SEC("阶层与派系的态度", "数值越大态度越强"),
        F("politics.support_classes", "支持的阶层", "kv", () => S.lookups.classes),
        F("politics.oppose_classes", "反对的阶层", "kv", () => S.lookups.classes),
        F("politics.support_factions", "支持的派系", "kv", () => S.lookups.factions),
        F("politics.oppose_factions", "反对的派系", "kv", () => S.lookups.factions),
        F("politics.sponsor_only", "只有这些派系主导朝政才能发起", "chips", () => S.lookups.factions),
        SEC("吸收", "别的线的文化能不能吸收这项制度；-1 = 沿用全局设置"),
        F("absorb.enabled", "能被吸收", "bool", null, { def: true }),
        F("absorb.minimum_exposure", "最低接触度", "number", null, { def: -1 }),
        F("absorb.minimum_contact_years", "最少接触年数", "number", null, { def: -1 })
      ];
    }

    function landmarkFields() {
      return [
        SEC("什么时候写出来", "研究出某项技术，或推行了带某特性的制度(二选一)"),
        F("category", "类别", "select", [["politics", "政治 politics"], ["economy", "经济 economy"], ["military", "军事 military"], ["science", "科学 science"], ["history", "历史 history"], ["literature", "文学 literature"]]),
        F("tech", "触发：研究出技术", "select", namedOpts("tech")),
        F("feature", "触发：制度特性", "select", () => S.lookups.features),
        SEC("推动"),
        F("techs", "推动技术(进度占费用比例)", "kv", namedOpts("tech")),
        F("institutions", "推动制度(特性 → 改革加速)", "kv", () => S.lookups.features, { hint: "0.3 = +30%；以 * 结尾为前缀匹配，如 ideology_stage:Communism:*" }),
        ADV(),
        SEC("触发细节"),
        F("min_value", "特性值至少", "number", null, { def: 1 }),
        F("required_techs", "还要全部研究出", "refs", "tech"),
        F("environment", "城里的社会条件", "select", ENVIRONMENTS),
        F("annual_chance", "每年成书概率", "number", null, { def: 1, hint: "0~1" }),
        F("institution_progress", "成书时正在推行的改革进度", "number", null, { def: 10, hint: "0~100" }),
        SEC("理念书"),
        F("ideology", "传播的理念", "select", () => S.lookups.ideologies),
        F("ideology_outbreak", "首次成书时引发人口改信", "number", null, { def: 0, hint: "0~1" })
      ];
    }

    function goodsFields() {
      return [
        SEC("基本"),
        F("tier", "门类", "select", GOOD_TIERS),
        F("price", "基准价格", "number", null, { def: 1 }),
        F("era", "从第几个时代起", "era", null, { def: 0, hint: "从这个科技时代起才有手工、地形产出与百姓、军队的需求(矿场、工厂的产出不看时代)" }),
        F("needs", "各阶层需求", "kv", () => S.lookups.classes, { hint: "阶层 → 每千人每年几份" }),
        ADV(),
        SEC("产出"),
        F("resources", "物资账产出折算", "kv", () => S.lookups.resources, { hint: "资源 id → 一份资源折合几份" }),
        F("biomes", "地形产出", "kv", () => S.lookups.biomes, { hint: "城辖区内每格该群系每年出几份(再乘人手)" }),
