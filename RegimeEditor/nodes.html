    // ---------- 读写 ----------
    function doc(file) { return S.docs[file]?.data; }
    function nodes(src = S.source) { const d = doc(src.file); return d && Array.isArray(d[src.path]) ? d[src.path] : []; }
    function ids(sourceId) { const src = SOURCES.find(s => s.id === sourceId); return src && src.path ? nodes(src).map(n => n.id) : []; }
    // 选取器用：节点的中文名与层级
    function itemsOf(sourceId) {
      const src = SOURCES.find(s => s.id === sourceId);
      if (!src || !src.path) return [];
      return nodes(src).map(n => ({ id: n.id, name: nodeName(n, src), sub: src.level ? `L${n[src.level] ?? (src.kind === "goods" ? 0 : "?")}${src.group && n[src.group] ? " " + (BRANCH_LABEL[n[src.group]] || n[src.group]) : ""}` : "" }));
    }
    const namedOpts = sourceId => () => itemsOf(sourceId).map(x => [x.id, x.name && x.name !== x.id ? `${x.name}  ${x.id}` : x.id]);
    function listAt(o, key, create) { if (!o) return []; if (!Array.isArray(o[key])) { if (!create) return []; o[key] = []; } return o[key]; }
    function mapAt(o, key, create) { if (!o) return {}; if (!isObj(o[key])) { if (!create) return {}; o[key] = {}; } return o[key]; }
    function templateDocs() { return Object.keys(S.docs).filter(f => f.startsWith("InstitutionTrees/Common/")); }
    function templates() { return templateDocs().flatMap(f => doc(f)?.templates || []); }
    function templateOf(id) { return templates().find(t => t.id === id); }
    function instDocs() { return SOURCES.filter(s => s.kind === "inst").map(s => s.file); }
    function collect(sourceId, field) { const src = SOURCES.find(s => s.id === sourceId); return src ? uniq(nodes(src).flatMap(n => n[field] || [])).sort() : []; }

    async function loadDoc(file) {
      try {
        const r = await api.readText(file);
        if (!r.exists) return;
        const indent = (r.text.match(/\n([ \t]+)"/) || [, "  "])[1];
        let cst = null;
        try { cst = cstParse(r.text); } catch { cst = null; }
        S.docs[file] = { data: parseJsonLoose(r.text), indent, crlf: r.text.includes("\r\n"), cst };
      } catch (e) { S.loadErrors.push(`${file}：${e.message}`); }
    }

    async function ensureLocales(keys) {
      const missing = uniq(keys).filter(k => !(k in S.locales));
      if (!missing.length) return false;
      Object.assign(S.locales, await api.readLocales(missing));
      return true;
    }

    async function loadAll() {
      SOURCES.length = 0;
      S.docs = {}; S.dirty.clear(); S.localeEdits = {}; S.loadErrors = []; S.locales = {};
      const L = S.lookups;
      L.regimes = (await api.listDir("Scripts/Regimes/Configs")).filter(e => e.dir).map(e => e.name).sort();
      L.classes = await readEnum("Scripts/GeneralSystems/ClassSystem.cs", "SocialClass", ["Labour", "Peasant", "Merchant", "Army", "Officer", "Noble", "Landlord", "Citizen", "Slave", "SlaveOwner", "Guoren", "Yeren", "Banner"]);
      L.factions = (await readEnum("Scripts/Regimes/FixedFaction.cs", "FactionType", ["原始", "尊王", "诸侯", "中央", "自治", "攘夷", "绥靖", "血脉", "僭主", "神权", "共和", "民主", "革命", "融入", "同化", "共产", "无", "外戚", "宦官"])).filter(f => f !== "无");
      L.ideologies = await readEnum("Scripts/GeneralSystems/PartySystem.cs", "PartyIdeology", ["Anarchism", "SocialDemocracy", "Libertarianism", "SocialLiberalism", "Capitalism", "ConservativeLiberalism", "Centrism", "Socialism", "Communism", "ReligiousDemocracy", "Authoritarianism", "Conservatism", "Fascism"]);
      L.effects = await readStringSet("Scripts/GeneralSystems/InstitutionDefinitionRegistry.cs", "SupportedEffects", ["add_mandate", "change_tax_level", "set_regime_option", "modify_faction_power", "enable_claim", "change_regime", "unlock_succession_law", "set_succession_law", "grant_trait", "abolish_monarchy", "open_private_land_market", "enact_law", "relieve_malady"]);
      try {
        L.cultures = (await api.listCultures()).map(c => ({ name: c.name, cn: c.data?.translate_cz || "", line: c.data?.setting?.institution_line || "", traits: c.data?.setting?.political_traits || [] }));
      } catch { L.cultures = []; }
      L.traits = uniq(["strong_unification", "nomad", "raider", "dharmic", "dry_native", ...L.cultures.flatMap(c => c.traits)]);

      for (const f of [TECH, BOOKS, COMM, SETTINGS]) await loadDoc(f);
      const commons = (await api.listDir("InstitutionTrees/Common")).filter(e => !e.dir && e.name.toLowerCase().endsWith(".json")).map(e => e.name).sort();
      for (const name of commons) await loadDoc(`InstitutionTrees/Common/${name}`);
      const lines = (await api.listDir("InstitutionTrees")).filter(e => !e.dir && e.name.toLowerCase().endsWith(".json") && e.name.toLowerCase() !== "settings.json").map(e => e.name.slice(0, -5)).sort();
      for (const line of lines) await loadDoc(`InstitutionTrees/${line}.json`);
      L.lines = lines.filter(line => S.docs[`InstitutionTrees/${line}.json`]);

      const all = [techSource(), materialSource(), techSettingsSource(), ...L.lines.map(institutionSource), instSettingsSource(),
        ...commons.map(templateSource), landmarkSource(), goodsSource(), marketSettingsSource()];
      SOURCES.push(...all.filter(s => S.docs[s.file]));

      // 下拉提示：所有制度线、模板、科技树、名著里出现过的特性等
      const feats = new Set(), branches = new Set(), reasons = new Set(["institution_resistance_reason_generic"]);
      for (const s of SOURCES.filter(s => s.kind === "inst" || s.kind === "template"))
        for (const n of nodes(s)) {
          Object.keys(n.features || {}).forEach(f => feats.add(f));
          if (n.branch) branches.add(n.branch);
          if (n.resistance?.reason_key) reasons.add(n.resistance.reason_key);
        }
      for (const line of L.lines) { const r = doc(`InstitutionTrees/${line}.json`)?.default_resistance_reason_key; if (r) reasons.add(r); }
      for (const l of doc(TECH)?.institution_links || []) feats.add(l.feature);
      for (const t of doc(TECH)?.techs || []) for (const q of t.requires_institutions || []) feats.add(q.feature);
      for (const f of doc(SETTINGS)?.constitution?.required_features || []) feats.add(f);
      L.features = uniq([...feats]).sort();
      L.instBranches = [...branches].sort();
      L.reasonKeys = [...reasons].sort();
      const comm = doc(COMM);
      L.biomes = uniq((comm?.goods || []).flatMap(g => [...Object.keys(g.biomes || {}), ...Object.keys(g.prospect || {})])).sort();
      L.resources = uniq([...(comm?.goods || []).flatMap(g => Object.keys(g.resources || {})), ...(doc(TECH)?.materials || []).flatMap(m => (m.resources || []).map(r => r.id))]).sort();

      const r = await api.readText("Locales/Cultures/Books/LandmarkBooks.csv");
      S.landmarkCsv = r.exists ? parseCsv(r.text) : { header: ["key", "cz", "en", "ch"], rows: [] };
      // 节点名称、时代名、文明等级名、制度线名的本地化
      const keys = [];
      for (const s of SOURCES) if (s.nameKey) for (const n of nodes(s)) keys.push(s.nameKey(n), s.descKey?.(n));
      for (const e of doc(TECH)?.eras || []) keys.push(e.key);
      for (const c of doc(SETTINGS)?.culture_levels || []) keys.push(c.name_key);
      for (const line of L.lines) keys.push(doc(`InstitutionTrees/${line}.json`)?.name_key || `institution_line_${line.toLowerCase()}`);
      S.locales = await api.readLocales(uniq(keys));
      renderSourceSel();
      const keep = S.source?.id;
      if (SOURCES.length) selectSource(SOURCES.find(s => s.id === keep) ? keep : SOURCES[0].id);
      if (S.loadErrors.length) toast("有文件读取失败(这些文件不会被改动)：\n" + S.loadErrors.join("\n"), true);
    }

    function renderSourceSel() {
      document.getElementById("sourceSel").innerHTML = SOURCES.map(s => `<option value="${esc(s.id)}">${esc(s.label)}</option>`).join("");
    }

    function selectSource(id) {
      S.source = SOURCES.find(s => s.id === id);
      S.selected = null;
      document.getElementById("sourceSel").value = id;
      document.getElementById("importBtn").style.display = S.source.kind === "inst" ? "" : "none";
      const settings = S.source.kind === "settings";
      const groups = !settings && S.source.group ? uniq(nodes().map(n => n[S.source.group] || "")).sort() : [];
      document.getElementById("groupFilter").innerHTML = `<option value="">全部分组</option>` + groups.map(g => `<option>${esc(g)}</option>`).join("");
      document.getElementById("groupFilter").style.display = groups.length ? "" : "none";
      for (const el of ["nodeTools", "nodeFilter", "graph"]) document.getElementById(el).style.display = settings ? "none" : "";
      renderList(); renderGraph(); renderEditor();
    }

    function nodeName(n, src = S.source) {
      if (src.landmark) {
        const row = S.landmarkCsv.rows.find(r => r[0] === `landmark_book_${n.id}`);
        return row ? (row[1] || row[2] || n.id) : n.id;
      }
      const key = src.nameKey?.(n);
      const edit = S.localeEdits[key];
      return edit?.cz || S.locales[key]?.cz || S.locales[key]?.en || n.id;
    }
    function locText(key) { const v = { ...(S.locales[key] || {}), ...(S.localeEdits[key] || {}) }; return v.cz || v.en || ""; }

    function filteredNodes() {
      const q = document.getElementById("nodeFilter").value.trim().toLowerCase();
      const g = document.getElementById("groupFilter").value;
      return nodes().filter(n => (!g || (n[S.source.group] || "") === g) &&
        (!q || String(n.id).toLowerCase().includes(q) || nodeName(n).toLowerCase().includes(q)));
    }

    function renderList() {
      const src = S.source;
      const list = document.getElementById("nodeList");
      document.getElementById("saveBtn").classList.toggle("dirty", S.dirty.size > 0 || Object.keys(S.localeEdits).length > 0 || !!S.landmarkCsv?.dirty);
      if (src.kind === "settings") {
        list.innerHTML = src.sections.map((s, i) => `<div class="item" data-sec="${i}">${ico(src.icon, "sm")}${esc(s.title)}</div>`).join("");
        list.querySelectorAll(".item").forEach(el => el.onclick = () => document.getElementById(`sec-${el.dataset.sec}`)?.scrollIntoView({ block: "start" }));
        return;
      }
      const sorted = [...filteredNodes()].sort((a, b) => (src.level ? (a[src.level] || 0) - (b[src.level] || 0) : 0) || String(a.id).localeCompare(String(b.id)));
      list.innerHTML = sorted.map(n => `<div class="item ${n === S.selected ? "active" : ""}" data-id="${esc(n.id)}">${ico(src.icon, "sm")}${esc(nodeName(n))}
        <span class="sub">${src.level ? "L" + (n[src.level] ?? (src.kind === "goods" ? 0 : "?")) + " · " : ""}${esc(n.id)}</span></div>`).join("");
      list.querySelectorAll(".item").forEach(el => el.onclick = () => selectNode(el.dataset.id));
    }

    function selectNode(id) {
      S.selected = nodes().find(n => n.id === id) || null;
      renderList(); renderGraph(); renderEditor();
    }
    function goTo(sourceId, id) { selectSource(sourceId); if (id) selectNode(id); }

    // ---------- 关系图 ----------
    function renderGraph() {
      const src = S.source, box = document.getElementById("graph");
      if (src.kind === "settings") { box.innerHTML = ""; return; }
      const list = filteredNodes();
      const levelOf = n => src.level ? Number(n[src.level] || 0) : 0;
      const levels = uniq(list.map(levelOf).map(String)).map(Number).sort((a, b) => a - b);
      const cols = {};
      const pos = new Map();
      for (const n of [...list].sort((a, b) => String(a[src.group] || "").localeCompare(String(b[src.group] || "")) || String(a.id).localeCompare(String(b.id)))) {
        const c = levels.indexOf(levelOf(n));
        cols[c] = (cols[c] || 0) + 1;
        pos.set(n.id, { x: 12 + c * 190, y: 12 + (cols[c] - 1) * 34, n });
      }
      const w = 12 + levels.length * 190, h = 20 + Math.max(1, ...Object.values(cols)) * 34;
      const refs = src.refFields;
      const sel = S.selected;
      const related = new Set();
      if (sel) {
        refs.forEach(f => (sel[f] || []).forEach(id => related.add(id)));
        list.forEach(n => refs.some(f => (n[f] || []).includes(sel.id)) && related.add(n.id));
      }
      let lines = "";
      for (const { x, y, n } of pos.values())
        for (const f of refs) for (const id of Array.isArray(n[f]) ? n[f] : []) {
          const p = pos.get(id); if (!p) continue;
          const hot = sel && (n === sel || id === sel.id);
          const dash = f === "requires" || f === "requires_techs" ? "" : ' stroke-dasharray="4 3"';
          lines += `<path d="M${p.x + 150} ${p.y + 13} C${p.x + 170} ${p.y + 13},${x - 20} ${y + 13},${x} ${y + 13}" fill="none" stroke="${hot ? "#8d3a1f" : "#b8995f"}" stroke-width="${hot ? 2 : 1}"${dash}/>`;
        }
      box.innerHTML = `<svg width="${w}" height="${h}">${lines}</svg>` +
        levels.map((lv, i) => src.level ? `<div style="position:absolute;left:${12 + i * 190}px;top:0;font-size:11px;color:var(--muted)">L${lv}</div>` : "").join("") +
        [...pos.values()].map(({ x, y, n }) => `<div class="gnode ${n === sel ? "active" : related.has(n.id) ? "rel" : ""}" style="left:${x}px;top:${y + 4}px" data-id="${esc(n.id)}" title="${esc(n.id)}">${esc(nodeName(n))}</div>`).join("");
      box.querySelectorAll(".gnode").forEach(el => el.onclick = () => selectNode(el.dataset.id));
      const act = box.querySelector(".gnode.active");
      if (act) act.scrollIntoView({ block: "nearest", inline: "nearest" });
    }

    // ---------- 表单控件 ----------
    function markDirty(file = S.source.file) { S.dirty.add(file); document.getElementById("saveBtn").classList.add("dirty"); }

    // 表单没覆盖的字段：顶层键整个列出；带点号的字段(如 reform.minimum_years)只占对象里的那几个子键，其余子键照样列出
    function coverage(specs, claims = []) {
      const direct = new Set(["id", ...claims]), nested = new Map();
      for (const f of specs) {
        if (!f.k || f.virtual) continue;
        const [a, b] = f.k.split(".");
        if (b === undefined) direct.add(a); else { if (!nested.has(a)) nested.set(a, new Set()); nested.get(a).add(b); }
      }
      return { direct, nested };
    }
    function restOf(n, cov) {
      const out = {};
      for (const [k, v] of Object.entries(n)) {
        if (cov.direct.has(k)) continue;
        const sub = cov.nested.get(k);
        if (sub && isObj(v)) { const left = Object.keys(v).filter(x => !sub.has(x)); if (left.length) out[k] = Object.fromEntries(left.map(x => [x, v[x]])); continue; }
        out[k] = v;
      }
      return out;
    }
    function applyRest(n, obj, cov) {
      for (const k of Object.keys(n)) {
        if (cov.direct.has(k)) continue;
        const sub = cov.nested.get(k);
        if (sub && isObj(n[k])) {
          const keepSub = isObj(obj[k]) ? obj[k] : {};
          let removed = false;
          for (const x of Object.keys(n[k])) if (!sub.has(x) && !(x in keepSub)) { delete n[k][x]; removed = true; }
          if (removed && !Object.keys(n[k]).length && !(k in obj)) delete n[k];
          continue;
        }
        if (!(k in obj)) delete n[k];
      }
      for (const [k, v] of Object.entries(obj)) {
        if (cov.direct.has(k)) continue;
        if (cov.nested.has(k) && isObj(v) && isObj(n[k])) { for (const [x, y] of Object.entries(v)) if (!deepEq(n[k][x], y)) n[k][x] = y; }
        else if (!deepEq(n[k], v)) n[k] = v;
      }
    }

    // datalist 的选项：值是 id，旁边显示中文名
    function dlOptions(opt) { return optsOf(opt).map(([v, l]) => `<option value="${esc(v)}"${l !== v ? ` label="${esc(l)}"` : ""}>`).join(""); }
    // 时代下拉：值是档次数字，显示时代名
    function eraOptions() { return (doc(TECH)?.eras || []).map(e => [String(e.tier), `${e.tier} ${locText(e.key) || e.key}`]); }

    // 选取器：已选的显示中文名(带 id)；搜索框按中文名或 id 过滤，点选或回车加入；列表里没有的 id 也可以直接输入回车
    function pickChips(values, { items, known = null, onChange, placeholder = "搜索添加…" }) {
      const wrap = document.createElement("div");
      wrap.className = "chips";
      let cache = null;
      const list = () => cache || (cache = items());
      const nameOf = v => list().find(x => x.id === v)?.name || "";
      const render = focus => {
        wrap.innerHTML = values.map((v, i) => {
          const miss = known && !known.has(v), nm = nameOf(v);
          return `<span class="chip ${miss ? "missing" : ""}" title="${esc(miss ? `找不到 ${v}` : v)}">${esc(nm || v)}${nm && nm !== v ? `<span class="fkey">${esc(v)}</span>` : ""}<button data-i="${i}">×</button></span>`;
        }).join("") + `<span class="chip-add pick"><input placeholder="${esc(placeholder)}"><div class="pickmenu" hidden></div></span>`;
        wrap.querySelectorAll("button[data-i]").forEach(b => b.onclick = () => { values.splice(Number(b.dataset.i), 1); render(); onChange(values); });
        const input = wrap.querySelector("input"), menu = wrap.querySelector(".pickmenu");
        let hits = [], hi = -1;
        const show = () => {
          const q = input.value.trim().toLowerCase();
          const score = x => (x.id.toLowerCase().startsWith(q) || (x.name || "").toLowerCase().startsWith(q)) ? 0 : 1;
          hits = list().filter(x => !values.includes(x.id) && (!q || x.id.toLowerCase().includes(q) || (x.name || "").toLowerCase().includes(q) || (x.sub || "").toLowerCase().includes(q)));
          if (q) hits.sort((a, b) => score(a) - score(b));
          hits = hits.slice(0, 80);
          hi = Math.min(hi, hits.length - 1);
          menu.innerHTML = hits.map((x, i) => `<div data-h="${i}" class="${i === hi ? "on" : ""}"><span>${esc(x.name || x.id)}</span>${x.sub ? `<span class="fhint">${esc(x.sub)}</span>` : ""}${x.name && x.name !== x.id ? `<span class="fkey">${esc(x.id)}</span>` : ""}</div>`).join("")
            || `<div class="fhint">${q ? "没有匹配；回车直接加入输入的内容" : "没有可选项"}</div>`;
          menu.hidden = false;
          menu.querySelectorAll("[data-h]").forEach(el => el.onmousedown = e => { e.preventDefault(); add(hits[Number(el.dataset.h)].id); });
        };
        const add = v => { if (v && !values.includes(v)) { values.push(v); render(true); onChange(values); } };
        input.addEventListener("mousedown", () => setTimeout(show));
        input.addEventListener("input", () => { hi = -1; show(); });
        input.addEventListener("blur", () => setTimeout(() => { menu.hidden = true; }, 120));
        input.addEventListener("keydown", e => {
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            e.preventDefault(); if (menu.hidden) show();
            hi = Math.max(0, Math.min(hits.length - 1, hi + (e.key === "ArrowDown" ? 1 : -1)));
            menu.querySelectorAll("[data-h]").forEach((el, i) => el.classList.toggle("on", i === hi));
            menu.querySelector(".on")?.scrollIntoView({ block: "nearest" });
            return;
          }
          if (e.key === "Escape") { menu.hidden = true; return; }
          if (e.key !== "Enter") return;
          e.preventDefault();
          const q = input.value.trim();
          if (hi >= 0 && hits[hi]) return add(hits[hi].id);
          if (!q) return;
          if (list().some(x => x.id === q)) return add(q);
          if (hits.length) return add(hits[0].id);
          add(q);
        });
        if (focus) input.focus();
      };
      render();
      return wrap;
    }

    // 一个字段的编辑控件。ctx: { file(默认当前数据源的文件), inherit(模板实例的模板，用来显示沿用值), onChange(k, v), rerender() }
    function fieldWidget(n, f, ctx = {}) {
      const file = ctx.file || S.source.file;
      const own = f.k ? getPath(n, f.k) : undefined;
      const inh = ctx.inherit && f.k ? getPath(ctx.inherit, f.k) : undefined;
      const wrap = document.createElement("div");
      if (f.k) wrap.dataset.k = f.k;
      if (["refs", "chips", "kv", "table", "custom"].includes(f.type) || f.wide) wrap.style.gridColumn = "1 / -1";
      const keyTag = f.k && f.showKey !== false ? `<span class="fkey">${esc(f.k)}</span>` : "";
      const head = `<span class="fhead">${f.label}${keyTag}${inh !== undefined && own !== undefined ? `<button class="small inherit" data-inherit title="删掉本节点自己写的值，沿用模板">沿用模板</button>` : ""}</span>`;
      const hint = f.hint ? `<div class="fhint">${f.hint}</div>` : "";
      const fallback = inh !== undefined ? `模板：${summary(inh)}` : f.def !== undefined ? `默认 ${summary(f.def)}` : "";
      // 模板实例里清空数组/对象要写成空的(否则会沿用模板)；其它情况清空就删掉这个键
      const set = v => {
        // 新建的节点：等于代码默认值的字段不写
        if (S.newNodes.has(n) && inh === undefined && f.def !== undefined && deepEq(v, f.def)) v = "";
        setPath(n, f.k, v, f.keepEmpty || inh !== undefined);
        if (!ctx.draft) markDirty(file);
        ctx.onChange?.(f.k, v);
        // 模板实例头一次写自己的值：重画出“沿用模板”按钮
        if (inh !== undefined && (getPath(n, f.k) !== undefined) !== (own !== undefined)) (ctx.rerender || renderEditor)();
      };
      const note = () => own === undefined && (inh !== undefined || f.def !== undefined) ? `<div class="fnote">${inh !== undefined ? "沿用模板" : "未填写时默认"}：${esc(summary(inh !== undefined ? inh : f.def))}</div>` : "";
      if (f.type === "text" || f.type === "number") {
        const listId = f.opt ? "dl" + Math.random().toString(36).slice(2) : "";
        wrap.innerHTML = `<label class="field">${head}<input type="${f.type}" step="any" value="${esc(own ?? "")}" placeholder="${esc(fallback)}" ${listId ? `list="${listId}"` : ""}></label>
          ${listId ? `<datalist id="${listId}">${dlOptions(f.opt)}</datalist>` : ""}${hint}`;
        wrap.querySelector("input").onchange = e => {
          const raw = e.target.value.trim();
          set(f.type === "number" ? (raw === "" || isNaN(Number(raw)) ? "" : Number(raw)) : raw);
        };
      } else if (f.type === "select" || f.type === "bool" || f.type === "era") {
        const cur = f.type === "bool" ? (own === true ? "true" : own === false ? "false" : "") : String(own ?? "");
        let options = f.type === "bool" ? [["true", "是"], ["false", "否"]] : f.type === "era" ? eraOptions() : optsOf(f.opt).filter(([v]) => v !== "");
        if (cur && !options.some(([v]) => String(v) === cur)) options = [[cur, cur], ...options];
        const defOpt = inh === undefined && f.def !== undefined ? options.find(([v]) => String(v) === String(f.def)) : null;
        options = [["", f.blank ? `(${f.blank})` : defOpt && f.type !== "bool" ? `(默认 ${defOpt[1]})` : fallback ? `(${fallback})` : "(无)"], ...options];
        wrap.innerHTML = `<label class="field">${head}<select>${options.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === cur ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></label>${hint}`;
        wrap.querySelector("select").onchange = e => {
          const v = e.target.value;
          set(v === "" ? "" : f.type === "bool" ? v === "true" : f.type === "era" ? Number(v) : v);
        };
      } else if (f.type === "refs" || f.type === "chips") {
        const target = f.type === "refs" ? (f.opt === "self" ? S.source.id : f.opt) : null;
        const values = Array.isArray(own) ? [...own] : [];
        const items = f.type === "refs" ? () => itemsOf(target) : () => optsOf(f.opt).map(([v, l]) => ({ id: String(v), name: l !== v ? l : "" }));
        wrap.innerHTML = `<label class="field">${head}</label>${hint}${note()}`;
        wrap.appendChild(pickChips(values, {
          items, known: f.type === "refs" ? new Set(ids(target)) : null,
          onChange: v => { set([...v]); if (!ctx.draft && target === S.source.id) renderGraph(); }
        }));
      } else if (f.type === "kv") {
        const map = isObj(own) ? { ...own } : {};
        const listId = "kv" + Math.random().toString(36).slice(2);
        const draw = () => {
          wrap.innerHTML = `<label class="field">${head}</label>${hint}${Object.keys(map).length ? "" : note()}<datalist id="${listId}">${dlOptions(f.opt)}</datalist>
            <table class="sheet"><tr><th>键</th><th style="width:140px">值</th><th class="act"></th></tr>
            ${Object.entries(map).map(([k, v], i) => `<tr><td><input list="${listId}" data-k="${i}" value="${esc(k)}"></td><td><input type="number" step="any" data-v="${i}" value="${esc(v)}"></td><td class="act"><button class="small" data-d="${i}">×</button></td></tr>`).join("")}
            </table><button class="small" data-add style="margin-top:4px">＋ 一项</button>`;
          const commit = () => set({ ...map });
          wrap.querySelectorAll("[data-k]").forEach(inp => inp.onchange = () => {
            const e = Object.entries(map); const i = Number(inp.dataset.k); const k = inp.value.trim();
            if (k && k !== e[i][0] && k in map) { toast(`键 ${k} 已存在`, true); draw(); return; }
            e[i][0] = k;
            Object.keys(map).forEach(x => delete map[x]); e.forEach(([x, v]) => x && (map[x] = v)); commit(); draw();
          });
          wrap.querySelectorAll("[data-v]").forEach(inp => inp.onchange = () => { const k = Object.keys(map)[Number(inp.dataset.v)]; map[k] = inp.value === "" ? 0 : Number(inp.value); commit(); });
          wrap.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { delete map[Object.keys(map)[Number(b.dataset.d)]]; commit(); draw(); });
          wrap.querySelector("[data-add]").onclick = () => { let k = "new_key", i = 1; while (map[k] !== undefined) k = `new_key_${i++}`; map[k] = 1; commit(); draw(); };
          bindInherit();
        };
        draw();
        return wrap;
      } else if (f.type === "table") {
        // 对象数组：灵感 / 需要制度特性 / 发现材料的资源 / 制度效果
        const cols = f.cols;
        const rows = (Array.isArray(own) ? own : []).map(r => ({ ...r }));
        const draw = () => {
          wrap.innerHTML = `<label class="field">${head}</label>${hint}${rows.length ? "" : note()}
            <table class="sheet"><tr>${cols.map(c => `<th>${c.label}</th>`).join("")}<th class="act"></th></tr>
            ${rows.map((r, i) => `<tr>${cols.map(c => {
              const v = r[c.f];
              if (c.kind === "select") {
                const opts = optsOf(c.opts);
                const all = v !== undefined && v !== "" && !opts.some(([o]) => o === v) ? [[v, v], ...opts] : opts;
                return `<td><select data-r="${i}" data-f="${c.f}" style="border:none">${all.map(([o, l]) => `<option value="${esc(o)}" ${o === (v ?? "") ? "selected" : ""}>${esc(l || "(无)")}</option>`).join("")}</select></td>`;
              }
              const dl = c.kind === "list" ? `list="dl_${f.k}_${c.f}"` : "";
              return `<td><input data-r="${i}" data-f="${c.f}" ${c.kind === "number" ? 'type="number" step="any"' : ""} ${dl} value="${esc(v ?? "")}" placeholder="${c.def !== undefined ? esc("默认 " + c.def) : ""}"></td>`;
            }).join("")}<td class="act"><button class="small" data-d="${i}">×</button></td></tr>`).join("")}
            </table>${cols.filter(c => c.kind === "list").map(c => `<datalist id="dl_${f.k}_${c.f}">${dlOptions(c.opts)}</datalist>`).join("")}
            <button class="small" data-add style="margin-top:4px">＋ 一行</button>`;
          const commit = () => set(rows.map(r => ({ ...r })));
          wrap.querySelectorAll("[data-r]").forEach(inp => inp.onchange = () => {
            const c = cols.find(c => c.f === inp.dataset.f), r = rows[Number(inp.dataset.r)];
            const raw = inp.value;
            if (raw === "" && (c.omitEmpty || c.kind === "number")) delete r[c.f];
            else r[c.f] = c.kind === "number" ? Number(raw) : raw;
            commit();
          });
          wrap.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { rows.splice(Number(b.dataset.d), 1); commit(); draw(); });
          wrap.querySelector("[data-add]").onclick = () => {
            const r = {};
            for (const c of cols) {
              if (c.omitEmpty) continue;
              r[c.f] = c.kind === "number" ? (c.def ?? 1) : c.kind === "select" ? (optsOf(c.opts)[0]?.[0] ?? "") : "";
            }
            rows.push(r); commit(); draw();
          };
          bindInherit();
        };
        draw();
        return wrap;
      } else if (f.type === "custom") {
        wrap.innerHTML = `<label class="field">${head}</label>${hint}`;
        f.render(wrap, n, ctx);
      }
      bindInherit();
      return wrap;
      function bindInherit() {
        const b = wrap.querySelector("[data-inherit]");
        if (b) b.onclick = e => { e.preventDefault(); setPath(n, f.k, ""); markDirty(file); (ctx.rerender || renderEditor)(); };
      }
    }

    function renderFields(box, n, specs, ctx) {
      let grid = null;
      const adv = specs.findIndex(f => f.adv);
      for (const [i, f] of specs.entries()) {
        if (f.adv) {
          // 「高级」：默认收起，标题上写已填了几项
          const filled = specs.slice(i + 1).filter(x => x.k && !x.virtual && getPath(n, x.k) !== undefined).length;
          const d = document.createElement("details");
          d.className = "adv"; d.open = S.advOpen;
          d.innerHTML = `<summary>高级(${filled ? `已填 ${filled} 项` : "都没填"}；没填的按默认值，输入框里的灰字就是默认值)</summary>`;
          d.ontoggle = () => { S.advOpen = d.open; };
          box.appendChild(d); box = d; grid = null; continue;
        }
        if (f.sec) {
          const h = document.createElement("h3");
          h.innerHTML = esc(f.sec) + (f.hint ? ` <span class="fhint">${esc(f.hint)}</span>` : "");
          box.appendChild(h); grid = null; continue;
        }
        if (!grid) { grid = document.createElement("div"); grid.className = "fgrid"; box.appendChild(grid); }
        grid.appendChild(fieldWidget(n, f, ctx));
      }
    }

    function locInputs(key, label, langs = ["cz", "en", "ch"]) {
      const v = { ...(S.locales[key] || {}), ...(S.localeEdits[key] || {}) };
      return langs.map(l => `<label class="field">${label} ${l}<input data-loc="${esc(key)}" data-lang="${l}" value="${esc(v[l] || "")}"></label>`).join("");
    }
    function bindLoc(box) {
      box.querySelectorAll("[data-loc]").forEach(inp => inp.oninput = () => {
        const k = inp.dataset.loc; if (!k) return;
        S.localeEdits[k] = { ...(S.localeEdits[k] || {}), [inp.dataset.lang]: inp.value };
        document.getElementById("saveBtn").classList.add("dirty");
      });
      const keys = uniq([...box.querySelectorAll("[data-loc]")].map(i => i.dataset.loc));
      for (const k of keys) {
        const q = l => box.querySelector(`[data-loc="${CSS.escape(k)}"][data-lang="${l}"]`);
        bindZh(q("cz"), q("ch"), k);
      }
    }

    // 简繁自动互填：一边改了，另一边空着或还是上次自动填的就跟着转换，手改过的不再动。
    // 简体为主：繁体正好是改前简体的转换(原有文本多半如此)也算自动的；反过来不算，免得改繁体把手写的简体冲掉
    function bindZh(cz, ch, key) {
      if (!cz || !ch || typeof zhToTrad !== "function" || typeof zhToSimp !== "function") return;
      let syncing = false;
      const link = (from, to, conv, autoKey, loose) => {
        let prev = from.value;
        from.addEventListener("input", () => {
          if (syncing) { prev = from.value; return; }
          if (to.value === "" || to.value === S.zhAuto[autoKey] || (loose && to.value === conv(prev))) {
            const v = conv(from.value);
            S.zhAuto[autoKey] = v;
            if (v !== to.value) { to.value = v; syncing = true; to.dispatchEvent(new Event("input", { bubbles: true })); syncing = false; }
          }
          prev = from.value;
        });
      };
      link(cz, ch, zhToTrad, `${key}|ch`, true);
      link(ch, cz, zhToSimp, `${key}|cz`, false);
    }

    // 对象数组(时代、文明等级、科技推动制度)：每行一张小卡片
    function rowsEditor(box, o) {
      const draw = () => {
        const arr = o.get(false);
        box.innerHTML = "";
        arr.forEach((row, i) => {
          const card = document.createElement("div");
          card.className = "rowcard";
          card.innerHTML = `<div class="rowhead"><b>#${i + 1}</b><span class="fhint">${o.info ? o.info(row) : ""}</span><span class="spacer"></span><button class="small danger" data-del>删除</button></div>`;
          const grid = document.createElement("div"); grid.className = "fgrid"; card.appendChild(grid);
          for (const f of o.fields) grid.appendChild(fieldWidget(row, f, { file: o.file, rerender: draw,
            onChange: k => { if (o.loc && o.loc(row) && (k === "key" || k === "name_key")) ensureLocales([o.loc(row)]).then(draw); else if (k === "tier" || k === "node") draw(); } }));
          if (o.loc && o.loc(row)) { const g = document.createElement("div"); g.className = "grid three"; g.style.marginTop = "6px"; g.innerHTML = locInputs(o.loc(row), "名称"); card.appendChild(g); bindLoc(g); }
          card.querySelector("[data-del]").onclick = () => { arr.splice(i, 1); markDirty(o.file); draw(); };
          box.appendChild(card);
        });
        const add = document.createElement("button");
        add.className = "small"; add.textContent = "＋ 一行";
        add.onclick = () => { o.get(true).push(o.newRow()); markDirty(o.file); draw(); };
        box.appendChild(add);
      };
      draw();
    }

    // 键 → 值 的对象(工厂配方、兵种换装、科技离不开的物资、按制度线换的写法)
    function mapEditor(box, o) {
      const draw = () => {
        const map = o.get(false);
        const listId = "mk" + Math.random().toString(36).slice(2);
        const known = o.known?.();
        box.innerHTML = `<datalist id="${listId}">${dlOptions(o.keys || [])}</datalist>`;
        const grid = document.createElement("div"); grid.className = "mapgrid"; box.appendChild(grid);
        grid.innerHTML = `<div class="fhint">${esc(o.keyLabel)}</div><div></div><div></div>`;
        Object.keys(map).forEach((key, i) => {
          const k = document.createElement("div");
          k.innerHTML = `<input list="${listId}" value="${esc(key)}" ${known && !known.has(key) ? 'style="color:var(--danger)" title="找不到这个 id"' : ""}>`;
          const cell = document.createElement("div");
          const del = document.createElement("div");
          del.innerHTML = `<button class="small" title="删除这一项">×</button>`;
          grid.append(k, cell, del);
          o.renderValue(map, key, cell);
          k.querySelector("input").onchange = e => {
            const nk = e.target.value.trim();
            if (!nk || nk === key) return draw();
            if (nk in map) { toast(`${nk} 已存在`, true); return draw(); }
            const entries = Object.entries(map); entries[i][0] = nk;
            Object.keys(map).forEach(x => delete map[x]); entries.forEach(([x, v]) => map[x] = v);
            markDirty(o.file); draw();
          };
          del.querySelector("button").onclick = () => { delete map[key]; if (!Object.keys(map).length) o.onEmpty?.(); markDirty(o.file); draw(); };
        });
        const add = document.createElement("button");
        add.className = "small"; add.textContent = "＋ 一项"; add.style.marginTop = "6px";
        add.onclick = () => { const m = o.get(true); let k = "new_key", n = 1; while (k in m) k = `new_key_${n++}`; m[k] = o.newValue(); markDirty(o.file); draw(); };
        box.appendChild(add);
      };
      draw();
    }

    // 科技表单里的几个自定义控件
    function eraNodeNote(wrap, n) {
      const eras = (doc(TECH)?.eras || []).filter(e => (e.node || []).includes(n.id));
      wrap.querySelector(".field").insertAdjacentHTML("beforeend", eras.length
        ? `<span>是 ${eras.map(e => `<b>${esc(locText(e.key) || e.key)}</b>(第 ${e.tier} 档)`).join("、")} 的节点科技${eras.some(e => Number(e.tier) !== Number(n.tier ?? 1)) ? `<span style="color:var(--danger)">，但这项科技在第 ${n.tier ?? 1} 档</span>` : ""}</span>`
        : `<span class="muted">不是哪个时代的节点科技(在“时代与研究参数”里设)</span>`);
    }
    function byLineWidget(wrap, n, ctx) {
      const box = document.createElement("div"); wrap.appendChild(box);
      mapEditor(box, { file: ctx.file || TECH, get: c => mapAt(n, "by_line", c), keyLabel: "制度线", keys: () => S.lookups.lines, known: () => new Set(S.lookups.lines),
        onEmpty: () => delete n.by_line,
        newValue: () => ({ key: "", requires_techs: [] }),
        renderValue: (map, key, cell) => {
          if (!isObj(map[key])) map[key] = {};
          const g = document.createElement("div"); g.className = "fgrid"; cell.appendChild(g);
          g.appendChild(fieldWidget(map[key], F("key", "名字 key", "text", null, { hint: "tech_&lt;key&gt;；不填用原名" }), { file: TECH }));
          g.appendChild(fieldWidget(map[key], F("requires_techs", "这条线的前置", "refs", "tech", { keepEmpty: true }), { file: TECH }));
        } });
    }
    function techGoodsWidget(wrap, n) {
      const comm = doc(COMM);
      if (!comm) { wrap.insertAdjacentHTML("beforeend", `<div class="fnote">没有 Technology/Commodities.json</div>`); return; }
      const values = [...(comm.techs?.[n.id] || [])];
      wrap.appendChild(pickChips(values, { items: () => itemsOf("goods"), known: new Set(ids("goods")),
        onChange: v => { const m = mapAt(comm, "techs", true); if (v.length) m[n.id] = [...v]; else delete m[n.id]; markDirty(COMM); } }));
    }
    function eraInfo(r) {
      const techs = doc(TECH)?.techs || [];
      const share = clamp01(Number(doc(TECH)?.era_prior_share ?? 2 / 3));
      const prior = techs.filter(t => Number(t.tier ?? 1) < Number(r.tier)).length;
      const need = Math.ceil(prior * share - 1e-4);
      const off = (r.node || []).filter(id => { const t = techs.find(x => x.id === id); return t && Number(t.tier ?? 1) !== Number(r.tier); });
      return esc(locText(r.key) || r.key || "") + (Number(r.tier) > 1 ? ` · 此前各时代科技 ${prior} 项，进这个时代要研究 ${need} 项` : " · 研究过任一科技即进入") +
        (off.length ? ` · <span style="color:var(--danger)">节点科技 ${esc(off.join("、"))} 不在这一档</span>` : "");
    }

    // 引用这个节点的地方(跨文件)
    function usages(src, id) {
      const out = [];
      const push = (sourceId, nid, label) => out.push({ sourceId, id: nid, label });
      if (src.kind === "tech") {
        for (const t of doc(TECH)?.techs || []) {
          if ((t.requires_techs || []).includes(id)) push("tech", t.id, `科技 ${nodeName(t, src)}`);
          else if (Object.values(t.by_line || {}).some(v => (v?.requires_techs || []).includes(id))) push("tech", t.id, `科技 ${nodeName(t, src)}(按线前置)`);
        }
        const mat = SOURCES.find(s => s.id === "material");
        for (const m of nodes(mat)) if ((m.requires_techs || []).includes(id)) push("material", m.id, `材料 ${nodeName(m, mat)}`);
        for (const e of doc(TECH)?.eras || []) if ((e.node || []).includes(id)) push("techcfg", null, `时代 ${locText(e.key) || e.key}`);
        for (const s of SOURCES.filter(s => s.kind === "inst" || s.kind === "template"))
          for (const x of nodes(s)) if ((x.requires_techs || []).includes(id)) push(s.id, x.id, `${s.kind === "template" ? "模板" : s.line} · ${nodeName(x, s)}`);
        const lm = SOURCES.find(s => s.id === "landmark");
        if (lm) for (const b of nodes(lm)) if (b.tech === id || (b.required_techs || []).includes(id) || (b.techs && id in b.techs)) push("landmark", b.id, `名著 ${nodeName(b, lm)}`);
        if (doc(COMM)?.techs && id in doc(COMM).techs) push("marketcfg", null, "商品市场");
      } else if (src.kind === "material") {
        const tech = SOURCES.find(s => s.id === "tech");
        for (const t of doc(TECH)?.techs || []) if ((t.requires_materials || []).includes(id)) push("tech", t.id, `科技 ${nodeName(t, tech)}`);
      } else if (src.kind === "template") {
        for (const s of SOURCES.filter(s => s.kind === "inst")) for (const x of nodes(s)) if (x.template === id) push(s.id, x.id, `${s.line} · ${nodeName(x, s)}`);
      } else {
        for (const o of nodes(src)) if (src.refFields.some(f => (o[f] || []).includes(id))) push(src.id, o.id, nodeName(o, src));
        if (src.kind === "inst" && (doc(src.file)?.root_nodes || []).includes(id)) out.unshift({ sourceId: src.id, id: null, label: "本线根节点" });
      }
      return out;
    }

    // ---------- 编辑区 ----------
    function renderEditor() {
      const box = document.getElementById("editor"), src = S.source, n = S.selected;
      if (src.kind === "settings") return renderSettings(box, src);
      if (!n) return renderNoSelection(box, src);
      const cov = coverage(src.fields);
      const rest = restOf(n, cov);
      const nameKey = src.nameKey?.(n), descKey = src.descKey?.(n);
      const lmRow = src.landmark ? (S.landmarkCsv.rows.find(r => r[0] === `landmark_book_${n.id}`) || null) : null;
      const inherited = n.template ? templateOf(n.template) : null;
      const uses = usages(src, n.id);
      box.innerHTML = `<div class="card">
        <h2>${ico(src.icon, "lg")}${esc(nodeName(n))} <span class="badge">${esc(n.id)}</span><span style="flex:1"></span><button class="small" id="dupBtn" title="复制一份放在它后面，名字加“(副本)”">复制本节点</button></h2>
        <div class="grid four">
          <label class="field">id<input id="fId" value="${esc(n.id)}"></label>
          ${src.landmark ? ["cz", "en", "ch"].map((l, i) => `<label class="field">书名 ${l}<input data-lm="${i + 1}" value="${esc(lmRow?.[i + 1] || "")}"></label>`).join("") : locInputs(nameKey, "名称")}
        </div>
        ${src.landmark ? `<p class="muted">通用书名写在 Locales/Cultures/Books/LandmarkBooks.csv；各文化自己的书名在文化编辑器 → 书籍词库 → 传世名著。</p>` :
          descKey ? `<div class="grid three" style="margin-top:8px">${["cz", "en", "ch"].map(l => `<label class="field">描述 ${l}<textarea data-loc="${esc(descKey)}" data-lang="${l}" style="min-height:60px">${esc({ ...(S.locales[descKey] || {}), ...(S.localeEdits[descKey] || {}) }[l] || "")}</textarea></label>`).join("")}</div>
          <p class="muted" style="margin:4px 0 0">本地化 key：${esc(nameKey)} / ${esc(descKey)}(保存时写入 Locales/cz.json、en.json、ch.json)</p>`
          : `<p class="muted" style="margin:4px 0 0">本地化 key：${esc(nameKey)}(保存时写入 Locales/cz.json、en.json、ch.json)</p>`}
        ${inherited ? `<div class="note" style="margin-top:8px">继承公共模板 <b>${esc(inherited.id)}</b>：这里没写的字段沿用模板(对象逐字段合并、数组整体替换)，输入框里灰字是模板的值。</div>` : ""}
        ${n.template && !inherited ? `<div class="note" style="margin-top:8px;color:var(--danger)">找不到公共模板 ${esc(n.template)}，游戏里会跳过这个节点。</div>` : ""}
        <div id="fFields"></div>
        <h3>其它字段(JSON)</h3>
        <textarea class="code" id="fRest" style="min-height:120px">${esc(Object.keys(rest).length ? JSON.stringify(rest, null, 2) : "")}</textarea>
        <p class="muted">表单里没有的字段都在这里，原样保留；改完点别处生效。</p>
        ${uses.length || src.refFields.length ? `<h3>被谁引用</h3><div class="chips uses">${uses.map((u, i) => `<span class="chip" data-use="${i}">${esc(u.label)}</span>`).join("") || `<span class="muted">没有</span>`}</div>` : ""}
      </div>`;
      renderFields(box.querySelector("#fFields"), n, src.fields, {
        inherit: inherited,
        onChange: k => {
          if (k === src.level || k === src.group) { renderList(); renderGraph(); }
          if (k === "template" || k === "name_key" || k === "description_key") ensureLocales([src.nameKey(n), src.descKey(n)]).finally(renderEditor);
        }
      });
      box.querySelector("#fId").onchange = e => renameNode(n, e.target.value.trim());
      bindLoc(box);
      box.querySelectorAll("[data-loc]").forEach(inp => inp.addEventListener("input", () => { if (inp.dataset.loc === nameKey && inp.dataset.lang === "cz") { renderList(); renderGraph(); } }));
      box.querySelectorAll("[data-lm]").forEach(inp => inp.oninput = () => {
        let row = S.landmarkCsv.rows.find(r => r[0] === `landmark_book_${n.id}`);
        if (!row) { row = [`landmark_book_${n.id}`, "", "", ""]; S.landmarkCsv.rows.push(row); }
        row[Number(inp.dataset.lm)] = inp.value; S.landmarkCsv.dirty = true;
        document.getElementById("saveBtn").classList.add("dirty");
      });
      if (src.landmark) bindZh(box.querySelector('[data-lm="1"]'), box.querySelector('[data-lm="3"]'), `landmark_book_${n.id}`);
      box.querySelector("#dupBtn").onclick = duplicateNode;
      box.querySelector("#fRest").onchange = e => {
        let obj = {};
        try { obj = e.target.value.trim() ? parseJsonLoose(e.target.value) : {}; } catch (err) { return toast("其它字段 JSON 格式错误：" + err.message, true); }
        if (!isObj(obj)) return toast("其它字段要写成一个 { } 对象", true);
        applyRest(n, obj, cov); markDirty(); toast("已更新其它字段"); renderEditor();
      };
      box.querySelectorAll("[data-use]").forEach(el => el.onclick = () => { const u = uses[Number(el.dataset.use)]; goTo(u.sourceId, u.id); });
    }

    // 制度线不选节点时：这条线本身的设置(名称、根节点、立宪覆盖)
    function renderNoSelection(box, src) {
      const count = `从左侧或上面的图里选一个节点。共 ${nodes().length} 个节点。`;
      if (src.kind !== "inst") { box.innerHTML = `<p class="muted">${count}</p>`; return; }
      const d = doc(src.file);
      const nameKey = d.name_key || `institution_line_${src.line.toLowerCase()}`;
      const specs = [
        F("name_key", "线名称 key", "text", null, { hint: `不填按 institution_line_${esc(src.line.toLowerCase())}` }),
        F("root_nodes", "根节点", "refs", "self", { hint: "这条线所有文化开局即持有；根节点声明的政体就是初始政体" }),
        F("default_resistance_reason_key", "默认反对理由文本键", "text", () => S.lookups.reasonKeys),
        SEC("立宪(覆盖全局设置)", "不填 = 沿用“制度 · 全局设置”"),
        F("constitution.enabled", "可以立宪", "bool", null, { blank: "沿用全局" }),
        F("constitution.requires_composite_empire", "要先完成多元帝国整合", "bool", null, { blank: "沿用全局" }),
        F("constitution.required_features", "要具备的制度特性", "chips", () => S.lookups.features),
        F("constitution.required_techs", "要先研究出的科技", "refs", "tech")
      ];
      const cov = coverage(specs, ["nodes"]);
      const rest = restOf(d, cov);
      box.innerHTML = `<p class="muted">${count}</p><div class="card"><h2>${ico(src.icon, "lg")}${esc(locText(nameKey) || src.line)} <span class="badge">${esc(src.file)}</span></h2>
        <div class="grid three">${locInputs(nameKey, "线名称")}</div><div id="lineFields"></div>
        <h3>其它字段(JSON)</h3><textarea class="code" id="lineRest" style="min-height:80px">${esc(Object.keys(rest).length ? JSON.stringify(rest, null, 2) : "")}</textarea></div>`;
      renderFields(box.querySelector("#lineFields"), d, specs, { onChange: k => { if (k === "name_key") ensureLocales([d.name_key || `institution_line_${src.line.toLowerCase()}`]).finally(renderEditor); } });
      bindLoc(box);
      box.querySelector("#lineRest").onchange = e => {
        let obj = {};
        try { obj = e.target.value.trim() ? parseJsonLoose(e.target.value) : {}; } catch (err) { return toast("JSON 格式错误：" + err.message, true); }
        if (!isObj(obj)) return toast("要写成一个 { } 对象", true);
        applyRest(d, obj, cov); markDirty(); toast("已更新"); renderEditor();
      };
    }

    function renderSettings(box, src) {
      const d = doc(src.file);
      const allFields = src.sections.flatMap(s => s.fields || []);
      const cov = coverage(allFields, [...(src.claims || []), ...src.sections.flatMap(s => s.claims || [])]);
      const rest = restOf(d, cov);
      box.innerHTML = `<div class="card"><h2>${ico(src.icon, "lg")}${esc(src.label)} <span class="badge">${esc(src.file)}</span></h2><div id="secs"></div>
        <h3>其它字段(JSON)</h3><textarea class="code" id="setRest" style="min-height:140px">${esc(Object.keys(rest).length ? JSON.stringify(rest, null, 2) : "")}</textarea>
        <p class="muted">表单里没有的字段都在这里，原样保留；改完点别处生效。</p></div>`;
      const secs = box.querySelector("#secs");
      src.sections.forEach((s, i) => {
        const el = document.createElement("div");
        el.className = "settings-sec"; el.id = `sec-${i}`;
        el.innerHTML = `<h3>${esc(s.title)}</h3>${s.hint ? `<div class="fhint" style="margin:-4px 0 8px">${esc(s.hint)}</div>` : ""}`;
        secs.appendChild(el);
        if (s.fields) { const g = document.createElement("div"); el.appendChild(g); renderFields(g, d, s.fields, { file: src.file }); }
        if (s.render) { const g = document.createElement("div"); g.style.marginTop = "8px"; el.appendChild(g); s.render(g); }
      });
      box.querySelector("#setRest").onchange = e => {
        let obj = {};
        try { obj = e.target.value.trim() ? parseJsonLoose(e.target.value) : {}; } catch (err) { return toast("其它字段 JSON 格式错误：" + err.message, true); }
        if (!isObj(obj)) return toast("其它字段要写成一个 { } 对象", true);
        applyRest(d, obj, cov); markDirty(src.file); toast("已更新其它字段"); renderEditor();
      };
    }

    // ---------- 改名、增删 ----------
    // 改一个文件里的数据；内容真的变了才记为待保存
    function touch(file, fn) {
      const d = doc(file); if (!d) return;
      const before = JSON.stringify(d);
      fn(d);
      if (JSON.stringify(d) !== before) S.dirty.add(file);
    }
    const swapArr = (arr, a, b) => Array.isArray(arr) ? arr.map(x => x === a ? b : x) : arr;
    const swapKeys = (obj, a, b) => isObj(obj) && a in obj ? Object.fromEntries(Object.entries(obj).map(([k, v]) => [k === a ? b : k, v])) : obj;

    // 改 id：所有引用一起改(包括别的文件)，本地化 key(按 id 生成的那种)也跟着搬
    async function renameNode(n, newId) {
      const src = S.source, oldId = n.id;
      if (!newId || newId === oldId) return;
      if (nodes().some(o => o.id === newId)) { toast(`id ${newId} 已存在`, true); renderEditor(); return; }
      const oldName = src.nameKey?.(n), oldDesc = src.descKey?.(n);
      n.id = newId;
      markDirty();
      for (const o of nodes()) for (const f of src.refFields) if (Array.isArray(o[f])) o[f] = swapArr(o[f], oldId, newId);
      if (src.kind === "inst") touch(src.file, d => { if (Array.isArray(d.root_nodes)) d.root_nodes = swapArr(d.root_nodes, oldId, newId); });
      if (src.kind === "material") touch(TECH, d => {
        for (const t of d.techs || []) {
          if (Array.isArray(t.requires_materials)) t.requires_materials = swapArr(t.requires_materials, oldId, newId);
          for (const b of t.boosts || []) if (b.type === "material" && b.value === oldId) b.value = newId;
        }
      });
      if (src.kind === "template") for (const file of instDocs()) touch(file, d => { for (const x of d.nodes || []) if (x.template === oldId) x.template = newId; });
      if (src.kind === "goods") touch(COMM, d => {
        for (const k of Object.keys(d.techs || {})) d.techs[k] = swapArr(d.techs[k], oldId, newId);
        for (const k of Object.keys(d.arms || {})) d.arms[k] = swapArr(d.arms[k], oldId, newId);
        for (const r of Object.values(d.factories || {})) if (isObj(r)) { r.inputs = swapKeys(r.inputs, oldId, newId); r.outputs = swapKeys(r.outputs, oldId, newId); }
      });
      if (src.kind === "tech") {
        touch(TECH, tree => {
          for (const t of tree.techs || []) {
            for (const v of Object.values(t.by_line || {})) if (isObj(v)) v.requires_techs = swapArr(v.requires_techs, oldId, newId);
            for (const b of t.boosts || []) if (b.type === "tech" && b.value === oldId) b.value = newId;
          }
          for (const m of tree.materials || []) m.requires_techs = swapArr(m.requires_techs, oldId, newId);
          for (const e of tree.eras || []) e.node = swapArr(e.node, oldId, newId);
          for (const l of tree.institution_links || []) { l.requires_techs = swapArr(l.requires_techs, oldId, newId); l.drivers = swapKeys(l.drivers, oldId, newId); }
          if (tree.industry) { tree.industry.capitalist_budding_techs = swapArr(tree.industry.capitalist_budding_techs, oldId, newId); tree.industry.employment_cap_bonus = swapKeys(tree.industry.employment_cap_bonus, oldId, newId); }
          for (const g of tree.mod_gates || []) if (g.tech === oldId) g.tech = newId;
        });
        for (const file of [...instDocs(), ...templateDocs()]) touch(file, d => {
          for (const x of d.nodes || d.templates || []) if (Array.isArray(x.requires_techs)) x.requires_techs = swapArr(x.requires_techs, oldId, newId);
          if (isObj(d.constitution) && Array.isArray(d.constitution.required_techs)) d.constitution.required_techs = swapArr(d.constitution.required_techs, oldId, newId);
        });
        touch(SETTINGS, d => { if (isObj(d.constitution) && Array.isArray(d.constitution.required_techs)) d.constitution.required_techs = swapArr(d.constitution.required_techs, oldId, newId); });
        touch(BOOKS, d => { for (const b of d.books || []) { if (b.tech === oldId) b.tech = newId; b.techs = swapKeys(b.techs, oldId, newId); if (Array.isArray(b.required_techs)) b.required_techs = swapArr(b.required_techs, oldId, newId); } });
        touch(COMM, d => { d.techs = swapKeys(d.techs, oldId, newId); });
      }
      if (src.nameKey && !n.name_key) {
        const newName = src.nameKey(n), newDesc = src.descKey?.(n);
        if (newName !== oldName) S.localeEdits[newName] = { ...(S.locales[oldName] || {}), ...(S.localeEdits[oldName] || {}) };
        if (newDesc && newDesc !== oldDesc) S.localeEdits[newDesc] = { ...(S.locales[oldDesc] || {}), ...(S.localeEdits[oldDesc] || {}) };
      }
      if (src.landmark) { const row = S.landmarkCsv.rows.find(r => r[0] === `landmark_book_${oldId}`); if (row) { row[0] = `landmark_book_${newId}`; S.landmarkCsv.dirty = true; } }
      renderList(); renderGraph(); renderEditor();
      let extra = "";
      if (src.kind === "inst") {
        // 派系决议规则(ClaimRules.json)按节点 id 引用制度，那个文件归“派系决议规则”页管，这里只提醒
        try { const r = await api.readText("ClaimRules.json"); if (r.exists && r.text.includes(`"${oldId}"`)) extra = `；ClaimRules.json 里还引用着 ${oldId}，请到“派系决议规则”页改`; } catch { }
      }
      toast(`已改名 ${oldId} → ${newId}，引用已同步${extra}`, !!extra);
    }

    // ---------- 新建、复制 ----------
    // 新建只问名称、时代/分支、前置；id 由英文名生成(没填就自动编号)，本地化 key、花费、层级等按前置和同档节点推算
    const slug = t => String(t || "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
    const median = arr => { const a = arr.filter(x => typeof x === "number" && isFinite(x)).sort((x, y) => x - y); return a.length ? a[Math.floor((a.length - 1) / 2)] : undefined; };
    const pick = (o, keys) => Object.fromEntries(keys.filter(k => !isEmptyVal(o[k])).map(k => [k, o[k]]));
    // 同类节点 id 不能重复(制度节点各线之间也不能重复)
    function takenIds(src) {
      const group = src.kind === "inst" || src.kind === "template" ? SOURCES.filter(s => s.kind === src.kind) : [src];
      return new Set(group.flatMap(s => nodes(s).map(n => n.id)));
    }
    function uniqueId(src, base, numbered = false) {
      const taken = takenIds(src);
      if (!numbered && !taken.has(base)) return base;
      let i = numbered ? 1 : 2;
      while (taken.has(`${base}_${i}`)) i++;
      return `${base}_${i}`;
    }
    function genId(src, en) {
      const s = slug(en), line = src.line ? src.line.toLowerCase() : "";
      if (s) return uniqueId(src, src.kind === "inst" && !s.startsWith(line + "_") ? `${line}_${s}` : s);
      return uniqueId(src, { tech: "custom_tech", material: "custom_material", inst: `${line}_policy`, template: "custom_template", landmark: "custom_book", goods: "custom_good" }[src.kind] || "new_node", true);
    }
    function deriveNode(src, d) {
      const auto = [];
      const most = arr => { const c = {}; arr.forEach(x => { if (x) c[x] = (c[x] || 0) + 1; }); return Object.keys(c).sort((a, b) => c[b] - c[a])[0]; };
      if (src.kind === "tech") {
        const pre = (d.requires_techs || []).map(id => nodes(src).find(t => t.id === id)).filter(Boolean);
        const maxEra = Math.max(1, ...(doc(TECH)?.eras || []).map(e => Number(e.tier) || 0));
        const tier = d.tier ?? (pre.length ? Math.min(maxEra, Math.max(...pre.map(t => Number(t.tier) || 1)) + 1) : 1);
        if (d.tier === undefined) auto.push(`时代 ${tier}`);
        const branch = d.branch || most(pre.map(t => t.branch)) || "science";
        if (!d.branch) auto.push(`分支 ${BRANCH_LABEL[branch] || branch}`);
        const sameTier = nodes(src).filter(t => Number(t.tier ?? 1) === tier);
        const cost = median(sameTier.filter(t => t.branch === branch).map(t => t.cost)) ?? median(sameTier.map(t => t.cost)) ?? 10;
        auto.push(`花费 ${cost}(同时代科技的中位数)`);
        return { node: { branch, tier, cost, ...pick(d, ["requires_techs", "requires_materials"]) }, auto };
      }
      if (src.kind === "material") return { node: { tier: d.tier ?? 1, ...pick(d, ["requires_techs"]) }, auto: d.tier === undefined ? ["时代 1"] : [] };
      if (src.kind === "inst" || src.kind === "template") {
        const pre = (d.requires || []).map(id => nodes(src).find(n => n.id === id)).filter(Boolean);
        const adv = d.advancement ?? (pre.length ? Math.max(...pre.map(n => Number(n.advancement) || 1)) + 1 : 1);
        if (src.kind === "inst" && d.advancement === undefined) auto.push(`进阶度 ${adv}`);
        const branch = d.branch || most(pre.map(n => n.branch));
        if (!d.branch && branch) auto.push(`分支 ${BRANCH_LABEL[branch] || branch}`);
        const node = pick(d, ["template"]);
        if (branch && branch !== "administration") node.branch = branch;
        if (src.kind === "inst" && adv !== 1) node.advancement = adv;
        return { node: { ...node, ...pick(d, ["requires", "requires_techs"]) }, auto };
      }
      if (src.kind === "landmark") return { node: { ...pick(d, ["tech"]), category: d.category || "literature" }, auto: d.category ? [] : ["类别 文学"] };
      if (src.kind === "goods") {
        const tier = d.tier || "luxury";
        const price = median(nodes(src).filter(g => g.tier === tier).map(g => g.price)) ?? 1;
        return { node: { tier, price, ...pick(d, ["era"]) }, auto: [...(d.tier ? [] : ["门类 奢侈品"]), `价格 ${price}(同门类的中位数)`] };
      }
      return { node: { ...d }, auto };
    }

    function openNewNode() {
      const src = S.source;
      if (!src || src.kind === "settings") return;
      document.getElementById("newDlg")?.remove();
      const draft = {};
      S.newNodes.add(draft);
      delete S.zhAuto["__new|ch"]; delete S.zhAuto["__new|cz"];
      const nm = src.landmark ? "书名" : "名称";
      const dlg = document.createElement("dialog");
      dlg.id = "newDlg";
      dlg.innerHTML = `<h2 style="margin-top:0">${ico(src.icon, "lg")}新建 · ${esc(src.label)}</h2>
        <div class="grid two">
          <label class="field">${nm}(简体)<input id="nCz" placeholder="必填"></label>
          <label class="field">${nm}(繁体，自动转换)<input id="nCh"></label>
          <label class="field">英文名(可不填)<input id="nEn" placeholder="不填：保存时先用简体顶上"></label>
          <label class="field">id(自动)<input id="nId"></label>
        </div>
        ${src.descKey ? `<label class="field" style="margin-top:8px">说明(简体，可不填)<textarea id="nDesc" style="min-height:54px"></textarea></label>` : ""}
        <div id="nFields"></div>
        <div class="note" id="nAuto" style="margin-top:10px"></div>
        <div class="toolbar" style="margin-top:12px;justify-content:flex-end"><button id="nCancel">取消</button><button class="primary" id="nOk">创建</button></div>`;
      document.body.appendChild(dlg);
      const $ = q => dlg.querySelector(q);
      let idTouched = false;
      const refresh = () => {
        if (!idTouched) $("#nId").value = genId(src, $("#nEn").value);
        const { auto } = deriveNode(src, draft);
        $("#nAuto").innerHTML = `id 由英文名生成(没填就自动编号)，本地化 key 自动起好${auto.length ? `；自动补上：${esc(auto.join("、"))}` : ""}。其余字段按代码默认值不写进文件，建好后可以在表单里改。`;
      };
      renderFields($("#nFields"), draft, newNodeFields(src), { draft: true, onChange: refresh });
      bindZh($("#nCz"), $("#nCh"), "__new");
      $("#nEn").oninput = refresh;
      $("#nId").oninput = () => { idTouched = !!$("#nId").value.trim(); if (!idTouched) refresh(); };
      const close = () => { dlg.close(); dlg.remove(); };
      $("#nCancel").onclick = close;
      $("#nOk").onclick = () => {
        const cz = $("#nCz").value.trim();
        if (!cz) { toast(`请先填${nm}(简体)`, true); $("#nCz").focus(); return; }
        const id = $("#nId").value.trim() || genId(src, $("#nEn").value);
        if (/\s/.test(id)) { toast("id 不能有空格", true); return; }
        if (takenIds(src).has(id)) { toast(`id ${id} 已存在`, true); return; }
        close();
        createNode(src, draft, { id, cz, ch: $("#nCh").value.trim(), en: $("#nEn").value.trim(), desc: $("#nDesc")?.value.trim() || "" });
      };
      for (const q of ["#nCz", "#nCh", "#nEn", "#nId"]) $(q).addEventListener("keydown", e => { if (e.key === "Enter") $("#nOk").click(); });
      refresh();
      dlg.showModal();
      $("#nCz").focus();
    }

    function createNode(src, draft, { id, cz, ch, en, desc }) {
      const { node } = deriveNode(src, draft);
      const trad = t => (t && typeof zhToTrad === "function" ? zhToTrad(t) : "");
      let full;
      if (src.kind === "inst" || src.kind === "template") {
        const { template, ...rest } = node;
        full = { id, ...(template ? { template } : {}), name_key: `institution_${id}`, ...(desc || !template ? { description_key: `institution_${id}_desc` } : {}), ...rest };
      } else full = { id, ...node };
      if (src.landmark) { S.landmarkCsv.rows.push([`landmark_book_${id}`, cz, en, ch || trad(cz)]); S.landmarkCsv.dirty = true; }
      else {
        S.localeEdits[src.nameKey(full)] = { cz, en, ch: ch || trad(cz) };
        const dk = src.descKey?.(full);
        // 没写说明也写一条空的，免得游戏里显示 key
        if (dk && (desc || !full.template)) S.localeEdits[dk] = { cz: desc, en: "", ch: trad(desc) };
      }
      // 放在同层级最后一个节点后面，文件里还是按层级排
      const list = listAt(doc(src.file), src.path, true);
      let at = list.length;
      if (src.level && full[src.level] !== undefined)
        for (let i = list.length - 1; i >= 0; i--) if (Number(list[i][src.level] ?? 0) <= Number(full[src.level])) { at = i + 1; break; }
      list.splice(at, 0, full);
      S.newNodes.add(full);
      markDirty(src.file);
      document.getElementById("nodeFilter").value = "";
      document.getElementById("groupFilter").value = "";
      selectNode(id);
      toast(`已新建 ${cz}(${id})，记得保存`);
    }

    // 把一条本地化文字抄到新 key 上(mark：名字后面加“(副本)”)
    function copyLoc(from, to, mark) {
      if (!from || !to || from === to) return;
      const v = { ...(S.locales[from] || {}), ...(S.localeEdits[from] || {}) };
      S.localeEdits[to] = mark ? { cz: v.cz ? v.cz + "(副本)" : "", ch: v.ch ? v.ch + "(副本)" : "", en: v.en ? v.en + " (copy)" : "" } : { cz: v.cz || "", ch: v.ch || "", en: v.en || "" };
    }

    // 复制：放在原节点后面，名字加“(副本)”；制度节点的副本用自己的名称 key
    function duplicateNode() {
      const src = S.source, n = S.selected;
      if (!n || src.kind === "settings") return;
      const copy = JSON.parse(JSON.stringify(n));
      const id = uniqueId(src, `${n.id}_copy`);
      copy.id = id;
      if (src.kind === "inst" || src.kind === "template") {
        copy.name_key = `institution_${id}`;
        if (copy.description_key || !copy.template) copy.description_key = `institution_${id}_desc`;
      }
      copyLoc(src.nameKey?.(n), src.nameKey?.(copy), true);
      copyLoc(src.descKey?.(n), src.descKey?.(copy), false);
      if (src.landmark) {
        const row = S.landmarkCsv.rows.find(r => r[0] === `landmark_book_${n.id}`) || [];
        S.landmarkCsv.rows.push([`landmark_book_${id}`, row[1] ? row[1] + "(副本)" : "", row[2] ? row[2] + " (copy)" : "", row[3] ? row[3] + "(副本)" : ""]);
        S.landmarkCsv.dirty = true;
      }
      const list = nodes();
      list.splice(list.indexOf(n) + 1, 0, copy);
      S.newNodes.add(copy);
      markDirty(); selectNode(id);
      toast(`已复制为 ${id}`);
    }

    function deleteNode() {
      const src = S.source, n = S.selected;
      if (!n || src.kind === "settings") return;
      const uses = usages(src, n.id);
      if (!confirm(`删除节点 ${n.id}？${uses.length ? `\n有 ${uses.length} 处引用它${src.refFields.length ? "，本文件里的前置/互斥/取代引用会一起去掉" : "，保存前检查会列出来"}。` : ""}`)) return;
      const list = nodes(); list.splice(list.indexOf(n), 1);
      for (const o of list) for (const f of src.refFields) if (Array.isArray(o[f])) o[f] = o[f].filter(x => x !== n.id);
      if (src.kind === "inst") { const d = doc(src.file); if (Array.isArray(d.root_nodes)) d.root_nodes = d.root_nodes.filter(x => x !== n.id); }
      S.selected = null; markDirty(); renderList(); renderGraph(); renderEditor();
    }

    // ---------- 新建科技树、从别的树导入节点 ----------
    // 制度节点 id 各线之间不能重复，线与线之间也不许有前置/互斥/取代(游戏载入时会禁用跨线引用的节点)。
    // 所以导入是“复制成本线的节点”：id 换成本线前缀，选中节点之间的引用跟着换；
    // 指向没导入节点的引用，本线有同一公共模板的实例就接到它上面，否则去掉并列出来。
    const INST_REFS = ["requires", "requires_any", "exclusive_with", "replaces"];
    const LINE_ID_RE = /^[A-Za-z][A-Za-z0-9_]*$/;
    const lineLabel = s => locText(doc(s.file)?.name_key || `institution_line_${s.line.toLowerCase()}`) || s.line;
    // 一条线的 id 前缀：用得最多的那个(罗马线多数是 western_)，再加按线名的(roma_)
    function linePrefixes(list, line) {
      const c = {};
      for (const n of list) { const m = /^([a-z0-9]+)_/.exec(String(n.id)); if (m) c[m[1]] = (c[m[1]] || 0) + 1; }
      const best = Object.keys(c).sort((a, b) => c[b] - c[a])[0];
      return uniq([...(best && c[best] * 2 >= list.length ? [best + "_"] : []), slug(line) + "_"]);
    }
    function lineTaken(id) {
      const low = id.toLowerCase();
      return low === "settings" || low === "common" || (S.lookups.lines || []).some(l => l.toLowerCase() === low);
    }
    function lineIdFrom(en) {
      const words = String(en || "").match(/[A-Za-z0-9]+/g) || [];
      let base = words.map(w => w[0].toUpperCase() + w.slice(1)).join("");
      if (!/^[A-Za-z]/.test(base)) base = "Custom" + (base || "Line");
      let id = base, i = 2;
      while (lineTaken(id)) id = `${base}${i++}`;
      return id;
    }

    // from：来源制度线；to：目标制度线；picked：要导入的节点 id。keepOrder：照来源顺序接在末尾(整条复制用)
    function importInstNodes(from, to, picked, { dropCultures = true, keepOrder = false } = {}) {
      const fromList = nodes(from), toList = listAt(doc(to.file), "nodes", true);
      const pres = linePrefixes(fromList, from.line), toPre = linePrefixes(toList, to.line)[0];
      const taken = takenIds(to);
      const tplHere = new Map(toList.filter(n => n.template).map(n => [n.template, n.id]));
      const idMap = new Map(), fresh = new Set(), skipped = [], dropped = [];
      for (const n of fromList) {
        if (!picked.has(n.id)) continue;
        if (n.template && tplHere.has(n.template)) {
          idMap.set(n.id, tplHere.get(n.template));
          skipped.push(`${nodeName(n, from)}：本线已有同一公共模板的 ${tplHere.get(n.template)}`);
          continue;
        }
        const old = String(n.id), pre = pres.find(p => old.startsWith(p));
        const base = old.includes("@") ? `${old.split("@")[0]}@${to.line}` : pre ? toPre + old.slice(pre.length) : toPre + old;
        let id = base, i = 2;
        while (taken.has(id)) id = `${base}_${i++}`;
        taken.add(id); fresh.add(id); idMap.set(n.id, id);
        if (n.template) tplHere.set(n.template, id);
      }
      const fromById = new Map(fromList.map(n => [n.id, n]));
      const added = [];
      for (const n of fromList) {
        const id = idMap.get(n.id);
        if (!fresh.has(id)) continue;
        const copy = JSON.parse(JSON.stringify(n));
        copy.id = id;
        for (const f of INST_REFS) {
          if (!Array.isArray(copy[f])) continue;
          const out = [];
          for (const r of copy[f]) {
            const tpl = fromById.get(r)?.template;
            const target = idMap.get(r) || (tpl && tplHere.get(tpl));
            if (target) out.push(target); else dropped.push(`${id}.${f} → ${r}`);
          }
          if (out.length) copy[f] = uniq(out); else delete copy[f];
        }
        if (dropCultures) { delete copy.cultures; delete copy.exclude_cultures; }
        // 名称、说明另起本线的文本键，文字照抄，以后两条线各改各的；套模板又没自己起名的照旧沿用模板
        if (!copy.template || copy.name_key) copy.name_key = `institution_${id}`;
        if (!copy.template || copy.description_key) copy.description_key = `institution_${id}_desc`;
        const node = {};
        for (const k of ["id", "template", "name_key", "description_key"]) if (k in copy) node[k] = copy[k];
        Object.assign(node, copy);
        copyLoc(from.nameKey(n), to.nameKey(node), false);
        copyLoc(from.descKey(n), to.descKey(node), false);
        let at = toList.length;
        if (!keepOrder)
          for (let i = toList.length - 1; i >= 0; i--) if (Number(toList[i].advancement ?? 1) <= Number(node.advancement ?? 1)) { at = i + 1; break; }
        toList.splice(at, 0, node);
        S.newNodes.add(node);
        added.push(node);
      }
      if (added.length) markDirty(to.file);
      return { added, skipped, dropped, idMap };
    }

    function showReport(title, lines) {
      document.getElementById("reportDlg")?.remove();
      const dlg = document.createElement("dialog");
      dlg.id = "reportDlg";
      dlg.style.width = "min(720px,94vw)";
      dlg.innerHTML = `<h2 style="margin-top:0">${esc(title)}</h2><div style="max-height:56vh;overflow:auto">${lines.map(l => `<div class="fhint" style="font-size:13px">${esc(l)}</div>`).join("")}</div>
        <div class="toolbar" style="margin-top:12px;justify-content:flex-end"><button class="primary" id="rOk">知道了</button></div>`;
      document.body.appendChild(dlg);
      dlg.querySelector("#rOk").onclick = () => { dlg.close(); dlg.remove(); };
      dlg.showModal();
    }

    function openNewLine() {
      if (!S.lookups.lines) return;
      document.getElementById("lineDlg")?.remove();
      for (const k of ["__line|ch", "__line|cz", "__root|ch", "__root|cz"]) delete S.zhAuto[k];
      const lines = SOURCES.filter(s => s.kind === "inst");
      const dlg = document.createElement("dialog");
      dlg.id = "lineDlg";
      dlg.innerHTML = `<h2 style="margin-top:0">${ico("iconWorldLaws", "lg")}新建科技树(制度线)</h2>
        <div class="grid two">
          <label class="field">名称(简体)<input id="lCz" placeholder="必填，如 波斯"></label>
          <label class="field">名称(繁体，自动转换)<input id="lCh"></label>
          <label class="field">英文名(可不填)<input id="lEn" placeholder="如 Persia；用来起线 id"></label>
          <label class="field">线 id = 文件名(自动)<input id="lId"></label>
        </div>
        <label class="field" style="margin-top:8px">从哪里起步<select id="lFrom">
          <option value="">空白：只有一个根节点</option>

        </select></label>
        <div id="lBlank" class="grid three" style="margin-top:8px">
          <label class="field">根节点名称(简体)<input id="lRootCz" value="原始部落"></label>
          <label class="field">根节点名称(繁体)<input id="lRootCh" value="原始部落"></label>
          <label class="field">初始政体<select id="lRegime">${(S.lookups.regimes || []).map(r => `<option${r === "Origin" ? " selected" : ""}>${esc(r)}</option>`).join("")}</select></label>
        </div>
        <label id="lCopyOpt" style="display:none;margin-top:8px"><input type="checkbox" id="lDropCult" checked> 去掉节点上的“只给这些文化 / 这些文化不能”(原线按它自己的文化写的；政治特性条件保留)</label>
        <div class="note" id="lNote" style="margin-top:10px"></div>
        <div class="toolbar" style="margin-top:12px;justify-content:flex-end"><button id="lCancel">取消</button><button class="primary" id="lOk">创建</button></div>`;
      document.body.appendChild(dlg);
      const $ = q => dlg.querySelector(q);
      let idTouched = false;
      const refresh = () => {
        if (!idTouched) $("#lId").value = lineIdFrom($("#lEn").value);
        const copy = !!$("#lFrom").value, id = $("#lId").value.trim();
        $("#lBlank").style.display = copy ? "none" : "";
        $("#lCopyOpt").style.display = copy ? "" : "none";
        $("#lNote").innerHTML = `保存后写成 InstitutionTrees/${esc(id || "…")}.json，节点 id 用 ${esc(slug(id) + "_")} 开头。` +
          (copy ? "整条复制：节点 id 换成新前缀，名称、说明照抄成新的文本键，前置关系照原样，以后两条线各改各的。" : "根节点所有走这条线的文化开局就有，它的政体就是初始政体；建好后用“新节点”“导入节点”往上加。") +
          "<br>要让文化走这条线：到“文化”页把它们的“制度科技线”选成它，没有文化认领的线游戏里不会出现。";
      };
      bindZh($("#lCz"), $("#lCh"), "__line");
      bindZh($("#lRootCz"), $("#lRootCh"), "__root");
      $("#lEn").oninput = refresh;
      $("#lFrom").onchange = refresh;
      $("#lId").oninput = () => { idTouched = !!$("#lId").value.trim(); refresh(); };
      const close = () => { dlg.close(); dlg.remove(); };
      $("#lCancel").onclick = close;
      $("#lOk").onclick = async () => {
        const cz = $("#lCz").value.trim();
        if (!cz) { toast("请先填名称(简体)", true); $("#lCz").focus(); return; }
        const id = $("#lId").value.trim() || lineIdFrom($("#lEn").value);
        if (!LINE_ID_RE.test(id)) { toast("线 id 只能用英文字母、数字、下划线，并以字母开头", true); return; }
        if (/^(settings|common)$/i.test(id)) { toast("Settings、Common 是制度目录里的保留名，换个 id", true); return; }
        if (lineTaken(id)) { toast(`已经有 ${id} 这条线了(文件名不分大小写)`, true); return; }
        try { if ((await api.readText(`InstitutionTrees/${id}.json`)).exists) { toast(`InstitutionTrees/${id}.json 已经存在(可能是读不进来的文件)，换个 id`, true); return; } } catch { }
        const from = SOURCES.find(s => s.id === $("#lFrom").value) || null;
        const o = { cz, ch: $("#lCh").value.trim(), en: $("#lEn").value.trim(), rootCz: $("#lRootCz").value.trim() || "原始部落", rootCh: $("#lRootCh").value.trim(),
          regime: $("#lRegime").value, dropCultures: $("#lDropCult").checked };
