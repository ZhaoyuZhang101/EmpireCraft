        createLine(id, from, o);
      };
      for (const q of ["#lCz", "#lCh", "#lEn", "#lId"]) $(q).addEventListener("keydown", e => { if (e.key === "Enter") $("#lOk").click(); });
      refresh();
      dlg.showModal();
      $("#lCz").focus();
    }

    function createLine(id, from, o) {
      const trad = t => (t && typeof zhToTrad === "function" ? zhToTrad(t) : t || "");
      const file = `InstitutionTrees/${id}.json`, nameKey = `institution_line_${id.toLowerCase()}`;
      const data = { name_key: nameKey, root_nodes: [] };
      // 整条复制时，线上的其它设置(默认反对理由、立宪覆盖等)也照抄
      if (from) for (const [k, v] of Object.entries(doc(from.file))) if (!["name_key", "root_nodes", "nodes"].includes(k)) data[k] = JSON.parse(JSON.stringify(v));
      data.nodes = [];
      S.docs[file] = { data, indent: "  ", crlf: false, cst: null };
      S.localeEdits[nameKey] = { cz: o.cz, en: o.en, ch: o.ch || trad(o.cz) };
      const src = institutionSource(id);
      const insts = SOURCES.filter(s => s.kind === "inst");
      const after = insts.find(s => s.line.localeCompare(id) > 0);
      SOURCES.splice(after ? SOURCES.indexOf(after) : insts.length ? SOURCES.indexOf(insts[insts.length - 1]) + 1 : SOURCES.length, 0, src);
      S.lookups.lines = [...(S.lookups.lines || []), id].sort();
      const notes = [];
      if (from) {
        const r = importInstNodes(from, src, new Set(nodes(from).map(n => n.id)), { dropCultures: o.dropCultures, keepOrder: true });
        data.root_nodes = (doc(from.file).root_nodes || []).map(x => r.idMap.get(x)).filter(Boolean);
        notes.push(`从 ${from.line} 复制了 ${r.added.length} 个节点`);
        if (r.dropped.length) notes.push(`${r.dropped.length} 条引用原线里就找不到，已去掉`);
      } else {
        const rid = uniqueId(src, `${slug(id)}_origin`);
        const root = { id: rid, name_key: `institution_${rid}`, description_key: `institution_${rid}_desc`, branch: "society", advancement: 1,
          reform: { minimum_years: 1, allow_force: false }, absorb: { enabled: false }, ...(o.regime ? { regime: o.regime } : {}) };
        data.nodes.push(root);
        data.root_nodes = [rid];
        S.localeEdits[root.name_key] = { cz: o.rootCz, en: "", ch: o.rootCh || trad(o.rootCz) };
        S.localeEdits[root.description_key] = { cz: "", en: "", ch: "" };
        S.newNodes.add(root);
      }
      markDirty(file);
      renderSourceSel();
      selectSource(src.id);
      toast(`已新建科技树 ${o.cz}(${id})${notes.length ? "，" + notes.join("，") : ""}。记得保存，再到“文化”页让文化走这条线`);
    }

    function openImport() {
      const to = S.source;
      if (!to || to.kind !== "inst") return;
      const others = SOURCES.filter(s => s.kind === "inst" && s !== to);
      if (!others.length) { toast("没有别的科技树可以导入", true); return; }
      document.getElementById("importDlg")?.remove();
      const picked = new Set();
      const toTpl = new Map(nodes(to).filter(n => n.template).map(n => [n.template, n.id]));
      const dlg = document.createElement("dialog");
      dlg.id = "importDlg";
      dlg.innerHTML = `<h2 style="margin-top:0">${ico("iconWorldLaws", "lg")}导入节点到 ${esc(lineLabel(to))} (${esc(to.line)})</h2>
        <div class="grid two">
          <label class="field">从哪条线<select id="iFrom">${others.map(s => `<option value="${esc(s.id)}">${esc(lineLabel(s))} (${esc(s.line)})，${nodes(s).length} 个节点</option>`).join("")}</select></label>
          <label class="field">筛选<input id="iFilter" placeholder="搜索 id / 名称…"></label>
        </div>
        <div class="toolbar" style="margin-top:6px"><button class="small" id="iAll" title="勾上筛选出来的全部节点">全选</button><button class="small" id="iNone">全不选</button>
          <button class="small" id="iPre" title="把选中节点的前置一路往上补齐">补上前置</button><span style="flex:1"></span><span class="fhint" id="iCount"></span></div>
        <div class="pickall" id="iList"></div>
        <label style="display:block;margin-top:8px"><input type="checkbox" id="iDropCult" checked> 去掉节点上的“只给这些文化 / 这些文化不能”(原线按它自己的文化写的)</label>
        <div class="note" style="margin-top:8px">导入的是副本：id 换成本线前缀，名称、说明照抄成新的文本键；选中节点之间的前置、互斥、取代跟着换。线与线之间不能互相引用，指向没选上节点的引用会去掉(本线有同一公共模板的就接到它上面)，导入后会列出来。</div>
        <div class="toolbar" style="margin-top:12px;justify-content:flex-end"><button id="iCancel">取消</button><button class="primary" id="iOk">导入</button></div>`;
      document.body.appendChild(dlg);
      const $ = q => dlg.querySelector(q);
      const from = () => SOURCES.find(s => s.id === $("#iFrom").value);
      const dupOf = n => n.template && toTpl.get(n.template);
      const count = () => { $("#iCount").textContent = picked.size ? `已选 ${picked.size} 个` : "还没选"; };
      const render = () => {
        const src = from(), q = $("#iFilter").value.trim().toLowerCase();
        const list = nodes(src).filter(n => !q || String(n.id).toLowerCase().includes(q) || nodeName(n, src).toLowerCase().includes(q));
        const lv = n => Number(n.advancement ?? 1);
        const levels = uniq(list.map(n => String(lv(n)))).map(Number).sort((a, b) => a - b);
        $("#iList").innerHTML = levels.map(l => `<div class="lvl">进阶度 ${l}</div>` + list.filter(n => lv(n) === l).map(n => {
          const dup = dupOf(n);
          return `<label class="row${dup ? " off" : ""}" title="${esc(dup ? `本线已有同一公共模板的 ${dup}` : n.id)}"><input type="checkbox" data-id="${esc(n.id)}"${picked.has(n.id) ? " checked" : ""}${dup ? " disabled" : ""}>${esc(nodeName(n, src))}` +
            `${n.branch ? `<span class="fhint">${esc(BRANCH_LABEL[n.branch] || n.branch)}</span>` : ""}${dup ? `<span class="fhint">本线已有</span>` : ""}<span class="fkey">${esc(n.id)}</span></label>`;
        }).join("")).join("") || `<p class="muted">没有节点</p>`;
        $("#iList").querySelectorAll("input[data-id]").forEach(cb => cb.onchange = () => { if (cb.checked) picked.add(cb.dataset.id); else picked.delete(cb.dataset.id); count(); });
        count();
      };
      $("#iFrom").onchange = () => { picked.clear(); render(); };
      $("#iFilter").oninput = render;
      $("#iAll").onclick = () => { $("#iList").querySelectorAll("input[data-id]:not(:disabled)").forEach(cb => picked.add(cb.dataset.id)); render(); };
      $("#iNone").onclick = () => { picked.clear(); render(); };
      // 前置(全部)都补上；前置(任一)一个都没选时才补，补全部候选，用不着的再取消
      $("#iPre").onclick = () => {
        const byId = new Map(nodes(from()).map(n => [n.id, n]));
        const ok = id => byId.has(id) && !dupOf(byId.get(id));
        const before = picked.size, stack = [...picked];
        while (stack.length) {
          const n = byId.get(stack.pop());
          if (!n) continue;
          const any = (n.requires_any || []).filter(ok);
          const need = [...(n.requires || []).filter(ok), ...(any.some(id => picked.has(id) || dupOf(byId.get(id))) ? [] : any)];
          for (const id of need) if (!picked.has(id)) { picked.add(id); stack.push(id); }
        }
        render();
        toast(picked.size > before ? `补上了 ${picked.size - before} 个前置` : "选中的节点前置都已选上");
      };
      const close = () => { dlg.close(); dlg.remove(); };
      $("#iCancel").onclick = close;
      $("#iOk").onclick = () => {
        if (!picked.size) { toast("先勾选要导入的节点", true); return; }
        const src = from();
        const r = importInstNodes(src, to, picked, { dropCultures: $("#iDropCult").checked });
        close();
        selectSource(to.id);
        if (r.added.length) selectNode(r.added[0].id);
        const head = `已从 ${lineLabel(src)} 导入 ${r.added.length} 个节点，记得保存`;
        if (!r.skipped.length && !r.dropped.length) { toast(head); return; }
        showReport(head, [
          ...(r.skipped.length ? [`跳过 ${r.skipped.length} 个(同一公共模板一条线只留一个，引用它的已接到本线那个上)：`, ...r.skipped.map(x => "· " + x)] : []),
          ...(r.dropped.length ? [`去掉了 ${r.dropped.length} 条指向没导入节点的引用，需要的话在表单里重新接：`, ...r.dropped.map(x => "· " + x)] : [])
        ]);
      };
      render();
      dlg.showModal();
    }

    // 保存前检查：引用了不存在的节点、id 重复等
    function validate() {
      const problems = [];
      const has = id => new Set(ids(id));
      const techs = has("tech"), mats = has("material"), goods = has("goods");
      const check = (where, list, set, what) => { for (const r of Array.isArray(list) ? list : []) if (!set.has(r)) problems.push(`${where} → ${r} 不是${what}`); };
      for (const src of SOURCES.filter(s => s.path && S.dirty.has(s.file))) {
        const all = new Set(nodes(src).map(n => n.id));
        if (all.size !== nodes(src).length) problems.push(`${src.label} 有重复 id`);
        for (const n of nodes(src)) {
          for (const f of src.refFields) check(`${n.id}.${f}`, n[f], all, "本文件里的节点");
          if (src.kind === "tech") { check(`${n.id}.requires_materials`, n.requires_materials, mats, "材料"); for (const [line, v] of Object.entries(n.by_line || {})) check(`${n.id}.by_line.${line}`, v?.requires_techs, techs, "科技"); }
          if (["material", "inst", "template"].includes(src.kind)) check(`${n.id}.requires_techs`, n.requires_techs, techs, "科技");
          if (src.kind === "inst" && n.template && !templateOf(n.template)) problems.push(`${n.id}.template → ${n.template} 不是公共模板`);
          if (src.kind === "landmark") { if (n.tech) check(`${n.id}.tech`, [n.tech], techs, "科技"); check(`${n.id}.required_techs`, n.required_techs, techs, "科技"); check(`${n.id}.techs`, Object.keys(n.techs || {}), techs, "科技"); }
        }
        if (src.kind === "inst") check(`${src.line}.root_nodes`, doc(src.file).root_nodes, all, "本线节点");
      }
      if (S.dirty.has(TECH)) {
        for (const e of doc(TECH).eras || []) check(`时代 ${e.tier}.node`, e.node, techs, "科技");
        for (const l of doc(TECH).institution_links || []) check(`制度联动 ${l.feature}.requires_techs`, l.requires_techs, techs, "科技");
      }
      if (S.dirty.has(COMM)) {
        const c = doc(COMM);
        for (const [t, list] of Object.entries(c.techs || {})) { check("商品市场 techs", [t], techs, "科技"); check(`商品市场 techs.${t}`, list, goods, "商品"); }
        for (const [a, list] of Object.entries(c.arms || {})) check(`商品市场 arms.${a}`, list, goods, "商品");
        for (const [k, r] of Object.entries(c.factories || {})) check(`商品市场 factories.${k}`, [...Object.keys(r?.inputs || {}), ...Object.keys(r?.outputs || {})], goods, "商品");
      }
      if (S.dirty.has(SETTINGS)) {
        const d = doc(SETTINGS);
        if (d.default_line && !S.lookups.lines.includes(d.default_line)) problems.push(`default_line → ${d.default_line} 不是制度线`);
        check("全局立宪 required_techs", d.constitution?.required_techs, techs, "科技");
      }
      return problems;
    }

    // ---------- 保存：保持原文件排版 ----------
    // 读入时记下每个值在原文里的位置；保存时没改的值原样照抄，改过的对象/数组沿用原来的换行、缩进、空行与间隔，
    // 只有新加的内容按同级的样式生成(同级是一行写完的就一行写，跨行的就跨行写)
    function cstParse(text) {
      let i = 0;
      const fail = m => { throw new Error(`${m}(位置 ${i})`); };
      const trivia = () => {
        const s = i;
        for (;;) {
          const c = text[i];
          if (c === " " || c === "\t" || c === "\n" || c === "\r" || c === "﻿") i++;
          else if (c === "/" && text[i + 1] === "/") { const e = text.indexOf("\n", i); i = e < 0 ? text.length : e; }
          else if (c === "/" && text[i + 1] === "*") { const e = text.indexOf("*/", i + 2); i = e < 0 ? text.length : e + 2; }
          else break;
        }
        return text.slice(s, i);
      };
      const str = () => { const s = i; i++; while (i < text.length && text[i] !== '"') i += text[i] === "\\" ? 2 : 1; if (i >= text.length) fail("字符串没有结尾"); i++; return JSON.parse(text.slice(s, i)); };
      const value = () => {
        const start = i, c = text[i];
        if (c === "{" || c === "[") {
          const obj = c === "{", closeCh = obj ? "}" : "]", t = obj ? "o" : "a";
          i++;
          const items = [], v = obj ? {} : [];
          let before = trivia();
          if (text[i] === closeCh) { i++; return { t, start, end: i, items, close: before, v }; }
          for (;;) {
            const it = { before };
            if (obj) {
              if (text[i] !== '"') fail("缺少键名");
              const ks = i; it.key = str(); it.rawKey = text.slice(ks, i);
              const ss = i; trivia(); if (text[i] !== ":") fail("缺少冒号"); i++; trivia(); it.sep = text.slice(ss, i);
            }
            it.node = value();
            if (obj) v[it.key] = it.node.v; else v.push(it.node.v);
            items.push(it);
            it.after = trivia();
            if (text[i] === ",") {
              i++; before = trivia();
              if (text[i] === closeCh) { i++; return { t, start, end: i, items, close: before, v }; }
              continue;
            }
            if (text[i] === closeCh) { const close = it.after; it.after = ""; i++; return { t, start, end: i, items, close, v }; }
            fail("缺少逗号");
          }
        }
        if (c === '"') str();
        else { const m = /^(?:-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|true|false|null)/.exec(text.slice(i, i + 80)); if (!m) fail("无法识别的值"); i += m[0].length; }
        return { t: "p", start, end: i, v: JSON.parse(text.slice(start, i)) };
      };
      const lead = trivia();
      const root = value();
      const tail = text.slice(i);
      if (!/^(\s|\/\/[^\n]*|\/\*[\s\S]*?\*\/)*$/.test(tail)) fail("结尾有多余内容");
      return { text, lead, root, tail };
    }

    function jsonInline(v, pad) {
      if (Array.isArray(v)) return "[" + v.map(x => jsonInline(x, false)).join(", ") + "]";
      if (isObj(v)) {
        const ks = Object.keys(v).filter(k => v[k] !== undefined);
        if (!ks.length) return "{}";
        const body = ks.map(k => JSON.stringify(k) + ": " + jsonInline(v[k], false)).join(", ");
        return pad ? "{ " + body + " }" : "{" + body + "}";
      }
      return v === undefined ? "null" : JSON.stringify(v);
    }
    function jsonFresh(v, ctx) {
      if (!(Array.isArray(v) || isObj(v))) return v === undefined ? "null" : JSON.stringify(v);
      if (ctx.pretty) return JSON.stringify(v, null, ctx.unit).replace(/\n/g, "\n" + ctx.indent);
      return jsonInline(v, ctx.pad);
    }
    function jsonEmit(v, node, ctx) {
      if (node && deepEq(v, node.v)) return ctx.src.slice(node.start, node.end);
      const arr = Array.isArray(v);
      if (arr || isObj(v)) return node && node.t === (arr ? "a" : "o") && node.items.length ? jsonEmitContainer(v, node, ctx) : jsonFresh(v, ctx);
      return v === undefined ? "null" : JSON.stringify(v);
    }
    function jsonEmitContainer(v, node, ctx) {
      const src = ctx.src, arr = Array.isArray(v), items = node.items;
      const textOf = it => src.slice(it.node.start, it.node.end);
      const ws = s => /^[ \t\r\n]*$/.test(s);
      const indentOf = s => s.slice(s.lastIndexOf("\n") + 1).match(/^[ \t]*/)[0];
      const multi = items.some(it => it.before.includes("\n")) || node.close.includes("\n");
      const nl = items.find(it => it.before.includes("\n"));
      const childIndent = nl ? indentOf(nl.before) : ctx.indent + ctx.unit;
      const firstBefore = ws(items[0].before) ? items[0].before : (multi ? "\n" + childIndent : "");
      const restBefore = multi ? "\n" + childIndent : (items[1] && ws(items[1].before) ? items[1].before : " ");
      const sep = !arr && ws(items[0].sep.replace(":", "")) ? items[0].sep : ": ";
      const prettyMember = multi && items.some(it => it.node.t !== "p" && textOf(it).includes("\n"));
      const entries = arr ? v.map((x, i) => [i, x]) : Object.keys(v).filter(k => v[k] !== undefined).map(k => [k, v[k]]);
      // 新旧元素对应：对象按键；数组先按 id、再按内容相同、最后按位置
      const match = new Array(entries.length).fill(null);
      const used = new Set();
      if (!arr) {
        const byKey = new Map(items.map(it => [it.key, it]));
        entries.forEach(([k], p) => { const it = byKey.get(k); if (it) { match[p] = it; used.add(it); } });
      } else {
        entries.forEach(([, x], p) => {
          if (!isObj(x) || typeof x.id !== "string") return;
          const it = items.find(it => !used.has(it) && isObj(it.node.v) && it.node.v.id === x.id);
          if (it) { match[p] = it; used.add(it); }
        });
        entries.forEach(([, x], p) => {
          if (match[p]) return;
          const it = items.find(it => !used.has(it) && deepEq(it.node.v, x));
          if (it) { match[p] = it; used.add(it); }
        });
        entries.forEach(([, x], p) => {
          if (match[p] || !items[p] || used.has(items[p])) return;
          if (isObj(x) && typeof x.id === "string" && isObj(items[p].node.v) && typeof items[p].node.v.id === "string") return;
          match[p] = items[p]; used.add(items[p]);
        });
      }
      let out = arr ? "[" : "{";
      entries.forEach(([k, x], p) => {
        const it = match[p];
        const before = p === 0 ? (it === items[0] ? it.before : firstBefore) : (it && it !== items[0] ? it.before : restBefore);
        const lineIndent = before.includes("\n") ? indentOf(before) : ctx.indent;
        const sib = it || match.slice(0, p).reverse().find(Boolean) || match.find(Boolean) || items[items.length - 1];
        const sibText = sib ? textOf(sib) : "";
        const childCtx = { src, unit: ctx.unit, indent: lineIndent, pretty: arr ? sibText.includes("\n") : prettyMember, pad: arr && /^[{\[] /.test(sibText) };
        const body = it ? jsonEmit(x, it.node, childCtx) : jsonFresh(x, childCtx);
        out += (p ? "," : "") + before + (arr ? "" : (it ? it.rawKey + it.sep : JSON.stringify(k) + sep)) + body + (it ? it.after : "");
      });
      if (!entries.length) return arr ? "[]" : "{}";
      return out + node.close + (arr ? "]" : "}");
    }

    function serializeDoc(file) {
      const d = S.docs[file];
      const plain = () => JSON.stringify(d.data, null, d.indent) + "\n";
      let text = null;
      if (d.cst) {
        try {
          text = d.cst.lead + jsonEmit(d.data, d.cst.root, { src: d.cst.text, unit: d.indent, indent: "", pretty: true, pad: false }) + d.cst.tail;
          if (!deepEq(parseJsonLoose(text), d.data)) { console.warn("保持排版写回结果不一致，改用整体重写", file); text = null; }
        } catch (e) { console.warn("保持排版写回失败，改用整体重写", file, e); text = null; }
      }
      if (text === null) text = plain();
      if (d.crlf) text = text.replace(/\r?\n/g, "\r\n");
      return text;
    }

    async function saveAll() {
      const problems = validate();
      if (problems.length && !confirm("发现问题：\n" + problems.slice(0, 15).join("\n") + (problems.length > 15 ? `\n…共 ${problems.length} 条` : "") + "\n\n仍然保存？")) return;
      try {
        let count = 0;
        for (const file of [...S.dirty]) {
          const d = S.docs[file];
          if (!d) continue;
          const text = serializeDoc(file);
          await api.writeText(file, text);
          try { d.cst = cstParse(text); } catch { d.cst = null; }
          S.dirty.delete(file); count++;
        }
        const edits = Object.fromEntries(Object.entries(S.localeEdits).filter(([k]) => k));
        // 英文没填的先用中文顶上，游戏里不会显示成 key
        let fallback = 0;
        for (const [k, v] of Object.entries(edits)) {
          const en = v.en !== undefined ? v.en : S.locales[k]?.en;
          const zh = v.cz || S.locales[k]?.cz || v.ch || S.locales[k]?.ch || "";
          if (!String(en || "").trim() && zh.trim()) { v.en = zh; fallback++; }
        }
        if (S.landmarkCsv?.dirty) for (const r of S.landmarkCsv.rows) if (!String(r[2] || "").trim() && String(r[1] || r[3] || "").trim()) { r[2] = r[1] || r[3]; fallback++; }
        if (Object.keys(edits).length) await api.writeLocales(edits);
        if (S.landmarkCsv?.dirty) { await api.writeText("Locales/Cultures/Books/LandmarkBooks.csv", serializeCsv(S.landmarkCsv)); S.landmarkCsv.dirty = false; }
        for (const [k, v] of Object.entries(edits)) S.locales[k] = { ...(S.locales[k] || {}), ...v };
        S.localeEdits = {};
        renderList();
        toast(`已保存 ${count} 个文件${Object.keys(edits).length ? `，${Object.keys(edits).length} 条本地化` : ""}${fallback ? `；${fallback} 条英文没填，先用中文顶上` : ""}。游戏里重新加载世界后生效。`);
      } catch (e) { toast("保存失败：" + e.message, true); }
    }

    async function init() {
      mountAppBar("nodes.html");
      if (!api) { document.getElementById("editor").innerHTML = `<p class="muted">请用 启动桌面版.bat 打开，浏览器里无法读写模组文件。</p>`; return; }
      document.getElementById("sourceSel").onchange = e => selectSource(e.target.value);
      document.getElementById("nodeFilter").oninput = () => { renderList(); renderGraph(); };
      document.getElementById("groupFilter").onchange = () => { renderList(); renderGraph(); };
      document.getElementById("addBtn").onclick = openNewNode;
      document.getElementById("cloneBtn").onclick = duplicateNode;
      document.getElementById("importBtn").onclick = openImport;
      document.getElementById("newLineBtn").onclick = openNewLine;
      document.getElementById("delBtn").onclick = deleteNode;
      document.getElementById("saveBtn").onclick = saveAll;
      const unsaved = () => S.dirty.size || Object.keys(S.localeEdits).length || S.landmarkCsv?.dirty;
      document.getElementById("reloadBtn").onclick = () => { if (!unsaved() || confirm("放弃未保存的修改并重新读取？")) loadAll(); };
      window.addEventListener("beforeunload", e => { if (unsaved()) { e.preventDefault(); e.returnValue = ""; } });
      try { await loadAll(); } catch (e) { toast("读取失败：" + e.message, true); }
    }
    init();
  </script>
</body>
