<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmpireCraft 军制与官阶</title>
  <link rel="stylesheet" href="common.css" />
  <style>
    .fk{color:var(--muted);font-family:Consolas,monospace;font-size:12px;margin-left:4px}
    .fh{color:var(--muted);font-size:12px;line-height:1.5}
    .warn,.fh.warn{color:var(--danger)}
    .note.warn{color:var(--danger);border-color:var(--danger)}
    .panel .card{margin-top:12px}
    .panel .card > h3:first-child{margin-top:0}
    .panel .card > .hint:first-of-type{margin-top:0}
    .card .sub-card{border:1px dashed var(--line);padding:8px 10px;margin-top:8px}
    label.field{align-content:start}
    label.field > span:first-child{color:var(--ink)}
    .panel table.sheet th{position:static}
    .panel table.sheet.sticky th{position:sticky;top:-14px;z-index:2}
    table.sheet th{white-space:nowrap}
    table.sheet .sel-id{padding:0 6px 2px;margin:0;font-size:11px}
    .arms{display:flex;flex-wrap:wrap;gap:6px 16px}
    .arms label{display:inline-flex;align-items:center;gap:2px;color:var(--ink);cursor:pointer}
    .inline-check{display:inline-flex;align-items:center;gap:2px;color:var(--ink);cursor:pointer}
    table.sheet{margin-top:4px}
    table.sheet td.txt{padding:4px 6px;vertical-align:top}
    table.sheet td.c{text-align:center}
    table.sheet td.act{white-space:nowrap;width:1%;padding:2px 4px}
    table.sheet td.act button{margin:0 1px}
    table.sheet td select,table.sheet td input:not([type=checkbox]){border:none !important;background:transparent !important;padding:4px 6px;width:100%}
    table.sheet td select:focus,table.sheet td input:not([type=checkbox]):focus{background:var(--c-input,#fff) !important}
    table.sheet tr.dim td{opacity:.6}
    table.sheet tr.click{cursor:pointer}
    table.sheet .early{display:grid;gap:2px}
    table.sheet .early label{display:flex;align-items:center;gap:4px;white-space:nowrap;color:var(--muted)}
    table.sheet .early select{width:auto;flex:1}
    .example{margin-top:8px;padding:6px 10px;border:1px dashed var(--line);color:var(--ink)}
    .example .fk{margin-left:0}
    .chips .chip.link{cursor:pointer}
    .save-group{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
    .side .list .note{font-size:12px}
    .side .hint{font-size:12px;margin:0}
    .toolbar.tight{gap:4px}
    .row-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .row-head .spacer{flex:1}
    .row-head label.field{display:flex;align-items:center;gap:6px}
    .row-head label.field input{width:200px}
    #askDlg .grid{min-width:380px}
    details.adv > summary{cursor:pointer;color:var(--muted);list-style-position:inside}
    details.adv > summary:hover{color:var(--ink)}
    details.adv[open] > summary{color:var(--accent2);border-bottom:1px solid var(--line);padding-bottom:4px}
    .toggles .inline-check{margin-right:16px}
  </style>
  <link rel="stylesheet" href="pixel-theme.css" />
</head>
<body>
  <div class="layout">
    <aside class="side">
      <div class="side-group">
        <h4>编辑</h4>
        <div class="section-nav" id="sectionNav"></div>
      </div>
      <input id="filter" placeholder="搜索…" />
      <div class="toolbar tight" id="listTools"></div>
      <div class="list" id="list"></div>
      <div class="save-group">
        <button class="primary wide" id="saveBtn"><img class="ico sm" src="assets/icons/iconSaveLocal.png">保存全部</button>
        <div class="btn-grid">
          <button id="reloadBtn">重新读取</button>
          <button id="openBtn">打开配置目录</button>
        </div>
        <p class="hint">写入 Formations.json、OfficialRanks.json、Locales/OfficialRanks.csv，建制名写入三份语言文件；重启游戏后生效。</p>
      </div>
    </aside>
    <main class="panel" id="editor"><p class="muted">读取中…</p></main>
  </div>
  <div id="dls" hidden></div>

  <dialog id="askDlg">
    <h3 id="askTitle"></h3>
    <div class="grid" id="askBody"></div>
    <div class="toolbar" style="margin-top:12px"><button class="primary" id="askOk">确定</button><button id="askCancel">取消</button></div>
  </dialog>

  <script src="common.js"></script>
  <script src="zh-convert.js"></script>
  <script>
    // 军制(Scripts/Regimes/Configs/Formations.json，游戏端 FormationSystem.cs)与
    // 文武等级(OfficialRanks.json + Locales/OfficialRanks.csv，游戏端 OfficialRankRules.cs / OfficialRankSystem.cs)。
    // 原则：只改用户动过的字段；不认识的字段原样保留、位置不变；留空 = 不写 = 按游戏默认值。
    const FORM_FILE = "Scripts/Regimes/Configs/Formations.json";
    const RANK_FILE = "Scripts/Regimes/Configs/OfficialRanks.json";
    const TITLE_CSV = "Locales/OfficialRanks.csv";
    const HONORARY_CSV = "Locales/HonoraryOfficial.csv";
    const LANGS = [["cz", "简体"], ["en", "English"], ["ch", "繁體"]];
    const FALLBACK_REGIMES = ["LvLing", "Feudalism", "ZhouFeudalism", "Modern", "Arabic", "YouMu", "Republic", "Origin", "ClassicalRepublic", "Bakufu", "HuaxiaOrigin", "NomadFeudalism", "Transmigrant", "Colonial", "Company"];
    const FALLBACK_ARMS = ["Infantry", "Archer", "Chariot", "Cavalry", "Musket", "Rifle", "Artillery", "Mechanized", "Tank", "Helicopter", "Fighter", "Bomber", "Militia", "HeavyArtillery"];

    // 字段的规范顺序：新加的字段按这个顺序插到合适位置，不认识的字段不动
    const TOP_F = ["version", "formations", "regimes", "fallback"];
    const FORMATION_FIELDS = ["name", "template", "numeral", "modern_template", "scope", "echelons", "source", "raise", "training", "veteran_cap", "upkeep", "denied_arms", "task", "reach", "command"];
    const SLOT_ORDER = ["central", "district", "prefecture", "manual", "early", "early_below_stage", "merge_at_stage"];
    const TOP_R = ["version", "civilizations", "fallback", "forms", "floors", "unranked", "military_offices", "general_floors", "captain_floor", "soldier_cap", "capital_bonus", "soldier_ladders", "named_ranks"];
    const FORM_ORDER = ["modern", "performance_ladder", "civil_label", "military_label", "general_floors", "captain_floor", "civilizations"];
    const ENTRY_ORDER = ["civil", "military", "grade_suffix", "merit", "soldier_ladder"];

    // 建制字段的游戏默认值(FormationDef 的初值)
    const DEF = { template: "formation_template_corps", numeral: "", modern_template: "", scope: "formation", source: "any", raise: 1, training: 1, veteran_cap: 100, upkeep: 1, task: "field", reach: "", command: "central" };
    const NUMERALS = [["", "第几(默认)：第一、第二……"], ["stem", "天干字：甲字、乙字……癸字，用完接甲字二"], ["banner", "八旗：满洲镶黄旗、满洲正黄旗……二十四旗一轮"], ["wing", "左右翼：左翼第一、右翼第一、中军第一……"]];
    const SCOPES = [["kingdom", "全国一套"], ["formation", "本建制一套"], ["region", "每座驻地一套"]];
    const SOURCES = [["any", "各城丁壮"], ["local", "只从驻地附近征"], ["trained", "只收归化台账里受过训的合格军人(花钱募的不受限)"], ["banner", "只收旗人、统治族群和蒙古(游牧文化)百姓(别的军不收旗人)"]];
    const TASKS = [["field", "野战：最先出动"], ["mixed", "攻守兼顾：其次出动"], ["garrison", "守备：最后出动，不渡海"]];
    const COMMANDS = [["central", "听中央调遣"], ["local", "地方节制：总动员、出征也不调出动员范围"], ["lord", "领主统带(目前只用于显示)"], ["tribe", "部族统带(目前只用于显示)"]];
    const SHORT = {
      source: { any: "各城", local: "驻地附近", trained: "受训军人", banner: "旗人" },
      task: { field: "野战", mixed: "攻守兼顾", garrison: "守备" },
      command: { central: "中央", local: "地方", lord: "领主", tribe: "部族" },
      scope: { kingdom: "全国", formation: "本建制", region: "驻地" }
    };
    const SLOTS = [
      ["central", "中央", "京师、王国首都的驻军"],
      ["district", "军区", "藩属、行政区首都的驻军；成员国(行政区、封国)的军一律用这一格"],
      ["prefecture", "军府", "府兵制等按城设的军府"],
      ["manual", "手动编组", "手动编成的军(成员国的用军区那一格)"]
    ];
    const SLOT_SHORT = { central: "中央", district: "军区", prefecture: "军府", manual: "手动", early: "早期" };
    const STAGES = ["不设", "降临元老院", "第一届执委会", "共同纲领", "定国号", "元老院内阁", "还都"];
    const STEMS = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
    const SPECIAL_FORMS = {
      one_party: ["一党制 / 民主集中制", "现代政体、共和制里一党执政或施行民主集中制时用。"],
      republic: ["多党共和", "现代政体、共和制的其余情况。"],
      constitutional: ["君主立宪", "君主国开了议会以后用。"]
    };
    const SECTIONS = [
      ["formations", "建制", "iconArmy"],
      ["regimes", "政体军制", "iconKingdom"],
      ["general", "官阶 · 通用规则", "iconWorldLaws"],
      ["forms", "官阶 · 政体形态", "iconKings"],
      ["floors", "官阶 · 岗位定底", "iconTitleLayer"],
      ["titles", "官阶 · 称谓表", "iconBooks"]
    ];

    const S = {
      section: "formations", files: {}, csv: null, honorary: {}, loc: {}, czAll: {}, locEdits: {},
      regimes: [], arms: [], officeNames: {}, cultures: [], cultureNames: {}, lines: [], extraSets: [],
      sel: { formations: null, forms: null, floors: null, titles: null },
      // advOpen：哪些“高级”展开着；newIds：本次新建的建制；auto：简繁自动填写最后填进去的值(键|语言)
      advOpen: {}, newIds: new Set(), auto: {}, manual: {}
    };
    const LINE_NAMES = { Huaxia: "华夏", Roma: "西方", Arabic: "阿拉伯", Youmu: "游牧", Japan: "日本", Aosong: "澳宋" };
    const hasZh = () => typeof zhToTrad === "function" && typeof zhToSimp === "function";
    const F = () => S.files.formations.data;
    const R = () => S.files.ranks.data;
    const $ = (sel, root = document) => root.querySelector(sel);
    const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
    const panel = document.getElementById("editor");
    const clone = o => JSON.parse(JSON.stringify(o));
    const isObj = o => !!o && typeof o === "object" && !Array.isArray(o);

    // ================= JSON：保持键顺序、尽量保持原来的排版 =================

    // 把 key 按规范顺序放进对象(已有就原地改值)；不认识的键位置不动
    function putKey(obj, key, value, order = []) {
      if (Object.prototype.hasOwnProperty.call(obj, key)) { obj[key] = value; return; }
      const rank = k => { const i = order.indexOf(k); return i < 0 ? Infinity : i; };
      const keys = Object.keys(obj);
      const r = rank(key);
      // 插在规范顺序里前一个已有字段的后面；没有就插在后一个已有字段的前面；都没有就放最后
      let at = -1;
      if (r !== Infinity) {
        for (let i = keys.length - 1; i >= 0; i--) if (rank(keys[i]) < r) { at = i + 1; break; }
        if (at < 0) at = keys.findIndex(k => rank(k) !== Infinity && rank(k) > r);
      }
      if (at < 0 || at >= keys.length) { obj[key] = value; return; }
      const entries = keys.map(k => [k, obj[k]]);
      for (const k of keys) delete obj[k];
      entries.splice(at, 0, [key, value]);
      for (const [k, v] of entries) obj[k] = v;
    }
    function own(obj, key, order, make = () => ({})) {
      if (obj[key] === undefined || obj[key] === null || typeof obj[key] !== "object") putKey(obj, key, make(), order);
      return obj[key];
    }
    function renameKey(obj, from, to) {
      const entries = Object.keys(obj).map(k => [k === from ? to : k, obj[k]]);
      for (const k of Object.keys(obj)) delete obj[k];
      for (const [k, v] of entries) obj[k] = v;
    }

    // 记下原文件里哪些键前面空了一行(按路径)，保存时照样空行
    function blankLinePaths(text) {
      const out = new Set(), stack = [];
      let nl = 0, expectKey = false;
      const s = String(text || "");
      for (let i = 0; i < s.length; i++) {
        const c = s[i];
        if (c === "\n") { nl++; continue; }
        if (c === " " || c === "\t" || c === "\r" || c === "﻿") continue;
        if (c === "/" && s[i + 1] === "/") { const e = s.indexOf("\n", i); i = e < 0 ? s.length : e - 1; continue; }
        if (c === "/" && s[i + 1] === "*") { const e = s.indexOf("*/", i + 2); i = e < 0 ? s.length : e + 1; continue; }
        const top = stack[stack.length - 1];
        if (c === '"') {
          let j = i + 1;
          while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1;
          if (top && top.obj && expectKey) {
            let key = "";
            try { key = JSON.parse(s.slice(i, j + 1)); } catch { key = s.slice(i + 1, j); }
            if (nl >= 2) out.add(top.path + "/" + key);
            top.key = key; expectKey = false;
          }
          i = j; nl = 0; continue;
        }
        nl = 0;
        if (c === "{" || c === "[") {
          const path = top ? top.path + "/" + (top.obj ? top.key : top.idx) : "";
          stack.push({ obj: c === "{", path, key: null, idx: 0 });
          expectKey = c === "{";
        } else if (c === "}" || c === "]") { stack.pop(); expectKey = false; }
        else if (c === ",") { if (top) { if (top.obj) expectKey = true; else top.idx++; } }
      }
      return out;
    }

    // 排版：只含简单值的对象、简单值数组写成一行；其余展开。和手写配置的风格一致
    const isPrim = v => v === null || typeof v !== "object";
    function inlineOk(v) {
      if (isPrim(v)) return true;
      if (Array.isArray(v)) return v.every(isPrim);
      const vals = Object.values(v);
      if (vals.some(x => !isPrim(x) && !(Array.isArray(x) && x.every(isPrim)))) return false;
      const arrays = vals.filter(Array.isArray).length;
      return arrays === 0 || arrays * 2 < vals.length;
    }
    function inlineJson(v) {
      if (isPrim(v)) return JSON.stringify(v);
      if (Array.isArray(v)) return "[" + v.map(inlineJson).join(", ") + "]";
      const ks = Object.keys(v);
      return ks.length ? "{ " + ks.map(k => JSON.stringify(k) + ": " + inlineJson(v[k])).join(", ") + " }" : "{}";
    }
    const hasObjArray = v => !isPrim(v) && (Array.isArray(v) ? v.some(x => !isPrim(x)) : Object.values(v).some(hasObjArray));
    // lead：这一行在值前面已经占了多少字符(缩进 + 键名)；短的嵌套对象也写成一行
    function formatJson(v, blanks, ind = 0, path = "", lead = 0) {
      if (inlineOk(v)) return inlineJson(v);
      if (isObj(v) && !hasObjArray(v)) { const one = inlineJson(v); if (lead + one.length <= 100) return one; }
      const pad = "  ".repeat(ind + 1), end = "  ".repeat(ind);
      if (Array.isArray(v))
        return "[\n" + v.map((x, i) => pad + formatJson(x, blanks, ind + 1, path + "/" + i, pad.length)).join(",\n") + "\n" + end + "]";
      return "{\n" + Object.keys(v).map((k, i) => {
        const head = pad + JSON.stringify(k) + ": ";
        return (i > 0 && blanks.has(path + "/" + k) ? "\n" : "") + head + formatJson(v[k], blanks, ind + 1, path + "/" + k, head.length);
      }).join(",\n") + "\n" + end + "}";
    }
    function serializeDoc(f) {
      let text = formatJson(f.data, f.blanks);
      if (f.endsNl) text += "\n";
      if (f.crlf) text = text.replace(/\n/g, "\r\n");
      return text;
    }

    async function readJson(key, path, skeleton) {
      const f = { path, data: null, blanks: new Set(), crlf: false, endsNl: true, error: null, warn: "", dirty: false };
      try {
        const r = await api.readText(path);
        if (!r.exists) { f.data = skeleton(); f.warn = `${path} 不存在，保存时会新建。`; }
        else {
          f.crlf = r.text.includes("\r\n");
          f.endsNl = /\n$/.test(r.text);
          f.data = parseJsonLoose(r.text);
          if (!isObj(f.data)) throw new Error("顶层不是 JSON 对象");
          try { JSON.parse(r.text); } catch { f.warn = `${path} 里有注释或尾逗号，保存后注释会丢失。`; }
          f.blanks = blankLinePaths(r.text);
        }
      } catch (e) { f.error = e.message; f.data = skeleton(); }
      S.files[key] = f;
    }

    // ================= 称谓表 CSV：逐行保留，只改动过的行 =================

    function parseTitleCsv(text) {
      const src = String(text || "").replace(/^﻿/, "");
      const nl = src.includes("\r\n") ? "\r\n" : "\n";
      const endsNl = /\n$/.test(src);
      const raw = src.split(/\r?\n/);
      if (endsNl) raw.pop();
      const headerRaw = raw.length && raw[0].trim() ? raw[0] : "key,cz,en,ch";
      const header = parseCsvLine(headerRaw).map(s => s.trim());
      const col = { key: Math.max(0, header.indexOf("key")) };
      LANGS.forEach(([l], i) => { const at = header.indexOf(l); col[l] = at < 0 ? i + 1 : at; });
      const lines = raw.slice(1).map(r => r.trim() === "" ? { blank: true, raw: r } : { raw: r, cells: parseCsvLine(r) });
      return { nl, endsNl: endsNl || !src, headerRaw, header, col, lines, dirty: false };
    }
    const csvKeyOf = l => l.cells[S.csv.col.key];
    const csvEmpty = l => LANGS.every(([lang]) => !(l.cells[S.csv.col[lang]] || "").trim());
    function csvFind(key) {
      let hit = null;
      for (const l of S.csv.lines) if (!l.blank && csvKeyOf(l) === key) hit = l;
      return hit;
    }
    function csvLive() { return S.csv.lines.filter(l => !l.blank && !l.deleted); }
    function csvGet(key, lang) { const l = csvFind(key); return l && !l.deleted ? (l.cells[S.csv.col[lang]] ?? "") : ""; }
    const groupOf = key => String(key).replace(/_\d+$/, "");
    const suffixOf = key => { const m = String(key).match(/_(\d+)$/); return m ? Number(m[1]) : null; };
    function csvInsert(key) {
      const m = S.csv;
      const width = Math.max(m.header.length, Math.max(m.col.key, m.col.cz, m.col.en, m.col.ch) + 1);
      const line = { cells: Array(width).fill(""), added: true, changed: true };
      line.cells[m.col.key] = key;
      const g = groupOf(key), n = suffixOf(key);
      const same = [];
      m.lines.forEach((l, i) => { if (!l.blank && groupOf(csvKeyOf(l)) === g) same.push(i); });
      if (same.length) {
        let at = same[same.length - 1] + 1;
        if (n !== null) {
          const before = same.filter(i => { const s = suffixOf(csvKeyOf(m.lines[i])); return s !== null && s < n; });
          at = before.length ? before[before.length - 1] + 1 : same[0];
        }
        m.lines.splice(at, 0, line);
      } else {
        if (m.lines.length && !m.lines[m.lines.length - 1].blank) m.lines.push({ blank: true, raw: "", added: true });
        m.lines.push(line);
      }
      return line;
    }
    function csvSet(key, lang, value) {
      let l = csvFind(key);
      if (!l) { if (!String(value).trim()) return; l = csvInsert(key); }
      if (l.deleted) l.deleted = false;
      while (l.cells.length <= S.csv.col[lang]) l.cells.push("");
      l.cells[S.csv.col[lang]] = value;
      l.changed = true;
      if (!l.added && csvEmpty(l)) l.deleted = true;
      S.csv.dirty = true;
    }
    function csvDelete(key) {
      for (const l of S.csv.lines) if (!l.blank && csvKeyOf(l) === key) l.deleted = true;
      S.csv.dirty = true;
    }
    function serializeTitleCsv(m) {
      const out = [];
      let gap = false;
      for (const l of m.lines) {
        if (l.deleted || (l.added && !l.blank && csvEmpty(l))) { gap = true; continue; }
        if (l.blank) {
          const prev = out[out.length - 1];
          if ((l.added || gap) && (!prev || prev.blank)) continue;
          out.push({ s: l.raw, blank: true, soft: !!l.added });
        } else out.push({ s: l.changed ? l.cells.map(csvCell).join(",") : l.raw, blank: false });
        gap = false;
      }
      while (out.length && out[out.length - 1].blank && (gap || out[out.length - 1].soft)) out.pop();
      return [m.headerRaw, ...out.map(o => o.s)].join(m.nl) + (m.endsNl ? m.nl : "");
    }

    // ================= 读取 =================

    // 读 C# 枚举的成员名；notes 收集行尾注释的第一个词(语言文件里没有名字时当显示名)
    async function enumFrom(path, name, fallback, notes = {}) {
      try {
        const r = await api.readText(path);
        if (!r.exists) return fallback;
        const at = r.text.search(new RegExp(`enum\\s+${name}\\s*\\{`));
        if (at < 0) return fallback;
        const names = [];
        for (const line of r.text.slice(r.text.indexOf("{", at) + 1).replace(/\/\*[\s\S]*?\*\//g, "").split(/\r?\n/)) {
          const cut = line.indexOf("//");
          const code = cut < 0 ? line : line.slice(0, cut);
          const end = code.indexOf("}");
          const found = (end < 0 ? code : code.slice(0, end)).split(",").map(s => s.trim().replace(/\s*=.*$/s, "")).filter(s => /^[A-Za-z_]\w*$/.test(s));
          names.push(...found);
          if (found.length && cut >= 0) {
            const word = line.slice(cut + 2).trim().split(/[：:，,;；\s(（-]/)[0];
            if (word) notes[found[found.length - 1]] = word;
          }
          if (end >= 0) break;
        }
        return names.length ? names : fallback;
      } catch { return fallback; }
    }

    async function load() {
      if (!api) { panel.innerHTML = `<p class="muted">浏览器模式下无法读写文件，请用 启动桌面版.bat 打开。</p>`; return; }
      try {
        await readJson("formations", FORM_FILE, () => ({ version: 1, formations: {}, regimes: {}, fallback: {} }));
        await readJson("ranks", RANK_FILE, () => ({ version: 1 }));
        const csv = await api.readText(TITLE_CSV);
        S.csv = parseTitleCsv(csv.exists ? csv.text : "key,cz,en,ch\n");
        S.honorary = {};
        const hon = await api.readText(HONORARY_CSV);
        if (hon.exists) {
          const p = parseCsv(hon.text);
          const ci = l => Math.max(0, p.header.indexOf(l));
          for (const row of p.rows) S.honorary[row[0]] = Object.fromEntries(LANGS.map(([l]) => [l, row[ci(l)] || ""]));
        }
        S.regimeNotes = {};
        S.regimes = await enumFrom("Scripts/Regimes/RegimeSystem.cs", "RegimeType", FALLBACK_REGIMES, S.regimeNotes);
        S.arms = await enumFrom("Scripts/GeneralSystems/Warfare/CorpsArmSystem.cs", "Arm", FALLBACK_ARMS);
        S.czAll = {};
        try { const cz = await api.readText("Locales/cz.json"); if (cz.exists) S.czAll = parseJsonLoose(cz.text); } catch { S.czAll = {}; }
        const wanted = Object.keys(S.czAll).filter(k => /^(formation_|corps_arm_|regime_type_)/.test(k));
        for (const id of Object.keys(F().formations || {})) wanted.push(nameKeyOf(id));
        S.loc = await api.readLocales(uniq(wanted));
        S.locEdits = {};
        // 官职档：各政体文件夹 OfficialType.csv 与 cz.json 里的 <政体>_officiallevel_<n>
        S.officeNames = {};
        const addOffice = (key, name) => {
          const m = String(key).match(/^([A-Za-z]+)_officiallevel_(\d+)$/);
          if (!m) return;
          (S.officeNames[m[1]] = S.officeNames[m[1]] || {})[m[2]] = name;
        };
        for (const [k, v] of Object.entries(S.czAll)) if (typeof v === "string") addOffice(k, v);
        for (const e of await api.listDir("Scripts/Regimes/Configs")) {
          if (!e.dir) continue;
          const r = await api.readText(`Scripts/Regimes/Configs/${e.name}/OfficialType.csv`);
          if (!r.exists) continue;
          const p = parseCsv(r.text);
          const cz = Math.max(1, p.header.indexOf("cz"));
          for (const row of p.rows) addOffice(row[0], row[cz] || "");
        }
        try {
          const list = await api.listCultures();
          S.cultures = list.map(c => c.name);
          S.cultureNames = Object.fromEntries(list.map(c => [c.name, c.data?.translate_cz || ""]));
        } catch { S.cultures = []; S.cultureNames = {}; }
        S.lines = (await api.listDir("InstitutionTrees")).filter(e => !e.dir && /\.json$/i.test(e.name) && !/^settings\.json$/i.test(e.name)).map(e => e.name.replace(/\.json$/i, ""));
        S.extraSets = [];
        S.newIds = new Set();
        S.auto = {};
        S.manual = {};
        for (const k of Object.keys(S.sel)) S.sel[k] = null;
        updateSaveBtn();
        renderAll();
      } catch (e) {
        panel.innerHTML = `<p class="warn">读取失败：${esc(e.message)}</p>`;
        toast("读取失败：" + e.message, true);
      }
    }

    // ================= 小工具 =================

    function locText(key, lang) {
      if (!key) return "";
      const e = S.locEdits[key];
      if (e && e[lang] !== undefined) return e[lang];
      const v = S.loc[key]?.[lang];
      if (v) return v;
      return lang === "cz" && typeof S.czAll[key] === "string" ? S.czAll[key] : "";
    }
    function titleText(key, lang) {
      return csvGet(key, lang) || S.honorary[key]?.[lang] || locText(key, lang);
    }
    const regimeLabel = k => k === "fallback" ? "其余政体" : (locText("regime_type_" + k, "cz") || S.regimeNotes?.[k] || k);
    const formLabel = k => SPECIAL_FORMS[k]?.[0] || regimeLabel(k);
    const armName = a => locText("corps_arm_" + a.toLowerCase(), "cz") || a;
    const nameKeyOf = (id, d = F().formations?.[id]) => isObj(d) && typeof d.name === "string" && d.name ? d.name : "formation_" + id;
    const formationName = id => locText(nameKeyOf(id), "cz") || id;
    const missingLangs = key => LANGS.filter(([l]) => !locText(key, l)).map(([l]) => l);
    const tierLabel = t => `${t} · 第${t + 1}档${t === 0 ? "(最高)" : t === 8 ? "(最低)" : ""}`;
    function cnNum(n) {
      const d = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九"];
      if (n < 10) return d[n];
      if (n < 20) return "十" + (n % 10 ? d[n % 10] : "");
      if (n < 100) return d[Math.floor(n / 10)] + "十" + (n % 10 ? d[n % 10] : "");
      return String(n);
    }

    function fl(label, key, hint, control) {
      return `<label class="field"><span>${label}${key ? `<span class="fk">${esc(key)}</span>` : ""}</span>${control}${hint ? `<span class="fh">${hint}</span>` : ""}</label>`;
    }
    function optSelect(attrs, value, options, defLabel) {
      const cur = value === undefined || value === null ? "" : String(value);
      let found = false, html = "";
      if (defLabel) { html += `<option value="" ${cur === "" ? "selected" : ""}>${esc(defLabel)}</option>`; found = cur === ""; }
      for (const [v, t] of options) {
        const on = !found && String(v) === cur;
        if (on) found = true;
        html += `<option value="${esc(v)}" ${on ? "selected" : ""}>${esc(t)}</option>`;
      }
      if (!found) html += `<option value="${esc(cur)}" selected>${esc(cur)}(未知取值，原样保留)</option>`;
      return `<select ${attrs}>${html}</select>`;
    }
    function tierSelect(attrs, value, defLabel) {
      const opts = [];
      for (let t = 0; t <= 8; t++) opts.push([t, tierLabel(t)]);
      return optSelect(attrs, value, opts, defLabel);
    }
    function stageSelect(attrs, value) {
      return optSelect(attrs, value ?? 0, STAGES.map((t, i) => [i, `${i} · ${t}`]));
    }
    function langInputs(key, attr = "data-loc") {
      return LANGS.map(([l, t]) => fl(t, l, "", `<input ${attr}="${esc(key)}" data-lang="${l}" value="${esc(attr === "data-loc" ? locText(key, l) : csvGet(key, l))}">`)).join("");
    }

    function markDirty(key) {
      const f = S.files[key];
      if (f) {
        f.dirty = true;
        if (f.error) toast(`${f.path} 读取失败，这份文件不会被保存`, true);
      }
      updateSaveBtn();
    }
    const isDirty = () => Object.values(S.files).some(f => f.dirty) || !!S.csv?.dirty || Object.keys(S.locEdits).length > 0;
    function updateSaveBtn() { document.getElementById("saveBtn").classList.toggle("dirty", isDirty()); }
    function fileBanner(key) {
      const f = S.files[key];
      if (!f) return "";
      if (f.error) return `<div class="note warn">读取 ${esc(f.path)} 失败：${esc(f.error)}。这份文件不会被保存，修好后点“重新读取”。</div>`;
      return f.warn ? `<div class="note">${esc(f.warn)}</div>` : "";
    }

    // 普通字段：data-f=字段名，data-t=num|int|str；留空 = 删掉这个字段
    function bindFields(root, obj, order, fileKey, after) {
      $$("[data-f]", root).forEach(el => el.addEventListener("change", () => {
        const k = el.dataset.f, t = el.dataset.t || "str";
        if (el.type === "checkbox") { if (el.checked) putKey(obj, k, true, order); else delete obj[k]; }
        else {
          const raw = el.value.trim();
          if (raw === "") delete obj[k];
          else if (t === "num" || t === "int") {
            const n = Number(raw);
            if (!Number.isFinite(n) || (t === "int" && !Number.isInteger(n))) {
              toast(`「${raw}」不是有效的${t === "int" ? "整数" : "数字"}`, true);
              el.value = obj[k] ?? "";
              return;
            }
            putKey(obj, k, n, order);
          } else putKey(obj, k, raw, order);
        }
        markDirty(fileKey);
        if (after) after(k);
      }));
    }

    // 弹窗输入(Electron 不支持 prompt)；fields: [{label, value, placeholder, suggestions, options}]
    function ask(title, fields, note = "") {
      const dlg = document.getElementById("askDlg");
      $("#askTitle").textContent = title;
      $("#askBody").innerHTML = fields.map((f, i) => f.options
        ? `<label class="field">${esc(f.label)}<select data-ask="${i}">${f.options.map(([v, t]) => `<option value="${esc(v)}" ${v === f.value ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label>`
        : `<label class="field">${esc(f.label)}<input data-ask="${i}" value="${esc(f.value ?? "")}" placeholder="${esc(f.placeholder ?? "")}" ${f.suggestions ? `list="askDl${i}"` : ""}>` +
          (f.suggestions ? `<datalist id="askDl${i}">${f.suggestions.map(s => `<option value="${esc(s)}">`).join("")}</datalist>` : "") + `</label>`
      ).join("") + (note ? `<p class="hint">${note}</p>` : "");
      return new Promise(resolve => {
        const done = ok => {
          const values = ok ? fields.map((_, i) => $(`[data-ask="${i}"]`, dlg).value.trim()) : null;
          dlg.close();
          resolve(values);
        };
        $("#askOk").onclick = () => done(true);
        $("#askCancel").onclick = () => done(false);
        dlg.oncancel = e => { e.preventDefault(); done(false); };
        dlg.onkeydown = e => { if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); done(true); } };
        dlg.showModal();
        $("[data-ask]", dlg)?.focus();
      });
    }

      const out = [];
      for (const [k, m] of Object.entries(F().regimes || {}))
        if (isObj(m)) for (const s of ["central", "district", "prefecture", "manual", "early"]) if (m[s] === id) out.push(`${regimeLabel(k)}·${SLOT_SHORT[s]}`);
      const fb = F().fallback;
      if (isObj(fb)) for (const s of ["central", "district", "prefecture", "manual", "early"]) if (fb[s] === id) out.push(`其余政体·${SLOT_SHORT[s]}`);
      return out;
    }

    function numeralCz(style, serial) {
      const i = Math.max(0, serial - 1);
      if (style === "stem") { const round = Math.floor(i / STEMS.length); return STEMS[i % STEMS.length] + "字" + (round > 0 ? cnNum(round + 1) : ""); }
      if (style === "banner") return locText("formation_banner_group_" + (Math.floor(i / 8) % 3), "cz") + locText("formation_banner_" + (i % 8), "cz");
      if (style === "wing") return locText(["formation_wing_left", "formation_wing_right", "formation_wing_center"][i % 3], "cz") + "第" + cnNum(Math.floor(i / 3) + 1);
      return cnNum(serial);
    }
    function exampleName(id, d, serial, member, modern) {
      const tplKey = modern ? d.modern_template : (d.template || DEF.template);
      const tpl = locText(tplKey, "cz");

      const ech = Array.isArray(d.echelons) && d.echelons.length && isObj(d.echelons[0]) ? locText(d.echelons[0].key, "cz") : "";

      return tpl.replace(/\{(\d)\}/g, (m, n) => args[n] ?? m);

          <div id="fEchelons"></div>
        </details>`;

      const refresh = () => {
        $("#fExampleBox").innerHTML = examplesHtml(id, d);
        for (const k of ["template", "modern_template"]) {
          const key = d[k] || (k === "template" ? DEF.template : "");
          const text = key ? locText(key, "cz") : "";
          const el = $(`[data-prev="${k}"]`, panel);
          el.textContent = key ? (text ? `简体：${text}` : `找不到语言键 ${key}`) : "";
          el.classList.toggle("warn", !!key && !text);
        }
      };
      refresh();
      bindFields(panel, d, FORMATION_FIELDS, "formations", k => {
        // 新建的建制只写和默认值不同的字段
        if (S.newIds.has(id) && k in d && k in DEF && String(d[k]) === String(DEF[k])) delete d[k];
        if (k === "name") { renderPanel(); renderList(); return; }
        refresh();
        renderList();
      });
      $$("[data-prev]", panel).forEach(el => el.previousElementSibling?.addEventListener("input", e => {
        const key = e.target.value.trim(); const text = key ? locText(key, "cz") : "";
        el.textContent = key ? (text ? `简体：${text}` : `找不到语言键 ${key}`) : "";
      }));
      $$("[data-arm]", panel).forEach(cb => cb.addEventListener("change", () => {
        const a = cb.dataset.arm;
        let list = Array.isArray(d.denied_arms) ? d.denied_arms : null;
        if (cb.checked) {
          if (!list) { list = []; putKey(d, "denied_arms", list, FORMATION_FIELDS); }
          if (!list.includes(a)) {
            const idx = S.arms.indexOf(a);
            let at = list.findIndex(x => S.arms.indexOf(x) > idx);
            if (at < 0) at = list.length;
            list.splice(at, 0, a);
          }
        } else if (list) {
          const i = list.indexOf(a);
          if (i >= 0) list.splice(i, 1);
          if (!list.length) delete d.denied_arms;
        }
        markDirty("formations");
      }));
      $("#fId").addEventListener("change", e => renameFormation(id, e.target.value.trim(), e.target));
      $("#fCopy").addEventListener("click", () => newFormation(id));
      $$("[data-jump]", panel).forEach(c => c.addEventListener("click", () => switchSection(c.dataset.jump)));
      $("#fEchelons").appendChild(objTable({
        get: () => d.echelons,
        make: () => { putKey(d, "echelons", [], FORMATION_FIELDS); return d.echelons; },
        cols: [
          { key: "below", label: "满编上限 below", type: "num", ph: "不写 = 其余" },
          { key: "key", label: "层级名语言键 key", type: "str", list: "dlEchelons", preview: true }
        ],
        newRow: arr => { const last = arr.filter(x => isObj(x) && typeof x.below === "number").pop(); return { below: last ? last.below * 2 : 1000, key: "" }; },
        addAt: arr => arr.length && isObj(arr[arr.length - 1]) && arr[arr.length - 1].below === undefined ? arr.length - 1 : arr.length,
        order: ["below", "key"], fileKey: "formations", addLabel: "添加层级",
        onEmpty: () => delete d.echelons,
        after: refresh
      }));
    }

    async function renameFormation(from, to, input) {
      const all = F().formations;
      if (to === from) return;
      if (!/^[A-Za-z][A-Za-z0-9_]*$/.test(to)) { toast("id 只能用英文字母、数字和下划线，并以字母开头", true); input.value = from; return; }
      if (Object.prototype.hasOwnProperty.call(all, to)) { toast(`已经有建制 ${to}`, true); input.value = from; return; }
      if (!confirm(`把建制 ${from} 改成 ${to}？\n政体槽位里的引用会一起改；存档里已有的部队记的是旧 id，找不到定义时按默认值算、番号退回旧写法。`)) { input.value = from; return; }
      const d = all[from];
      const oldKey = nameKeyOf(from, d);
      renameKey(all, from, to);
      for (const m of [...Object.values(F().regimes || {}), F().fallback])
        if (isObj(m)) for (const s of ["central", "district", "prefecture", "manual", "early"]) if (m[s] === from) m[s] = to;
      const blanks = S.files.formations.blanks;
      if (blanks.delete("/formations/" + from)) blanks.add("/formations/" + to);
      if (!(isObj(d) && d.name)) {
        const entry = {};
        for (const [l] of LANGS) { const t = locText(oldKey, l); if (t) entry[l] = t; }
        if (Object.keys(entry).length) S.locEdits["formation_" + to] = { ...(S.locEdits["formation_" + to] || {}), ...entry };
        S.loc["formation_" + to] = S.loc["formation_" + to] || {};
      }
      if (S.newIds.delete(from)) S.newIds.add(to);
      S.sel.formations = to;
      markDirty("formations");
      renderAll();
      toast(`已改为 ${to}；旧的语言键 ${oldKey} 仍留在语言文件里，不用可以手动删`);
    }

    // 新建建制的起点：照现有的几种典型建制(存在才列出)，其余建制也可以照抄
    const FORMATION_PRESETS = [
      ["standing", "常备军：野战主力，全按默认值"],
      ["regional", "地方军：攻守兼顾"],
      ["levy", "地方守备：就近征召、便宜、不出远门"],
      ["imperial_guard", "禁卫营：天干字营号(甲字营、乙字营……)"],
      ["banner_guard", "旗军：只收旗人，八旗番号"],
      ["tribal_host", "部落骑兵：左右翼番号，部族统带"],
      ["fubo", "新式军队：只收受训军人，按满编分营、团、师"]
    ];
    function stripDefaults(d) {
      for (const k of Object.keys(d)) if (k in DEF && String(d[k]) === String(DEF[k])) delete d[k];
      return d;
    }
    // 由英文名生成 id(小写、下划线)；没有英文名就 custom_1、custom_2……；语言键也不能撞
    function deriveFormationId(en) {
      const all = F().formations || {};
      let base = String(en || "").toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
      if (base && !/^[a-z]/.test(base)) base = "f_" + base;
      const taken = id => Object.prototype.hasOwnProperty.call(all, id) || ("formation_" + id) in S.czAll || ("formation_" + id) in S.locEdits;
      if (base && !taken(base)) return base;
      if (!base) base = "custom";
      let n = base === "custom" ? 1 : 2;
      while (taken(`${base}_${n}`)) n++;
      return `${base}_${n}`;
    }

    async function newFormation(copyFrom) {
      const all = own(F(), "formations", TOP_F);
      const options = [
        ...FORMATION_PRESETS.filter(([src]) => isObj(all[src])).map(([src, t]) => ["preset:" + src, t]),
        ["blank", "空白：全部按默认值"],
        ...Object.keys(all).filter(id => isObj(all[id])).map(id => ["copy:" + id, `照抄：${formationName(id)}(${id})`])
      ];
      const r = await ask(copyFrom ? `复制建制：${formationName(copyFrom)}` : "新建建制", [
        { label: "名称(简体)", placeholder: "例如 边防军" },
        { label: "英文名称(可留空；只用来生成内部 id)", placeholder: "例如 Border Guard" },
        { label: "从哪种建制起步", options, value: copyFrom ? "copy:" + copyFrom : options[0][0] }
      ], "繁体名自动生成，英文名留空时保存会先用简体。建好后到“政体军制”里把它放进某个政体的槽位，新军才会用它。");
      if (!r) return;
      const [cz, en, from] = r;
      if (!cz) return toast("请填写名称", true);
      const id = deriveFormationId(en);
      const src = /^(copy|preset):/.test(from) ? all[from.slice(from.indexOf(":") + 1)] : null;
      const base = isObj(src) ? clone(src) : {};
      delete base.name;
      all[id] = stripDefaults(base);
      const key = "formation_" + id;
      const entry = { cz };
      if (en) entry.en = en;
      if (typeof zhToTrad === "function") { entry.ch = zhToTrad(cz); S.auto[key + "|ch"] = entry.ch; }
      S.locEdits[key] = entry;
      S.newIds.add(id);
      S.sel.formations = id;
      markDirty("formations");
      renderAll();
      toast(`已新建建制 ${cz}(内部 id：${id})`);
    }

    function deleteFormation(id) {
      const uses = formationUses(id);
      if (!confirm(`删除建制 ${id}(${formationName(id)})？` + (uses.length ? `\n还有这些槽位在用：${uses.join("、")}，删了以后它们找不到定义，按默认值的常备军算。` : "") +
        `\n存档里这个建制的部队也会按默认值算。名称语言键留在语言文件里。`)) return;
      delete F().formations[id];
      S.sel.formations = null;
      markDirty("formations");
      renderAll();
    }

    // 对象数组的小表格(编制层级、军团定底、士兵阶梯)；改动只碰对应字段
    function objTable(o) {
      const wrap = document.createElement("div");
      const draw = () => {
        const arr = o.get();
        const rows = Array.isArray(arr) ? arr : [];
        const nameCols = o.cols.some(c => c.names);
        wrap.innerHTML = `<table class="sheet"><thead><tr><th class="act">#</th>${o.cols.map(c => c.names ? LANGS.map(([l, t]) => `<th>${t}</th>`).join("") : `<th ${c.width ? `style="width:${c.width}"` : ""}>${c.label}</th>`).join("")}<th class="act"></th></tr></thead><tbody>
          ${rows.map((row, i) => {
            if (!isObj(row)) return `<tr><td class="act">${i + 1}</td><td class="txt muted" colspan="${o.cols.length + (nameCols ? 2 : 0)}">${esc(JSON.stringify(row))}(不是对象，原样保留)</td><td class="act"></td></tr>`;
            return `<tr><td class="act">${i + 1}</td>${o.cols.map(c => cell(c, row, i)).join("")}<td class="act"><button class="small" data-up="${i}" title="上移">↑</button><button class="small" data-dn="${i}" title="下移">↓</button><button class="small danger" data-del="${i}" title="删除">×</button></td></tr>`;
          }).join("") || `<tr><td class="txt muted" colspan="${o.cols.length + (nameCols ? 4 : 2)}">(空)</td></tr>`}
          </tbody></table>
          <div class="toolbar" style="margin-top:6px"><button class="small" data-add>${o.addLabel || "添加一行"}</button>${o.note ? `<span class="fh">${o.note}</span>` : ""}</div>`;
        const unknown = rows.filter(isObj).flatMap(r => Object.keys(r).filter(k => !o.order.includes(k)));
        if (unknown.length) wrap.insertAdjacentHTML("beforeend", `<p class="fh">另有字段 ${uniq(unknown).map(k => `<code>${esc(k)}</code>`).join(" ")}，原样保留。</p>`);
        $$("[data-c]", wrap).forEach(el => el.addEventListener("change", () => {
          const row = rows[Number(el.dataset.i)], k = el.dataset.c, t = el.dataset.t;
          const raw = el.value.trim();
          if (raw === "") delete row[k];
          else if (t === "num" || t === "int") {
            const n = Number(raw);
            if (!Number.isFinite(n) || (t === "int" && !Number.isInteger(n))) { toast(`「${raw}」不是有效的数字`, true); el.value = row[k] ?? ""; return; }
            putKey(row, k, n, o.order);
          } else putKey(row, k, raw, o.order);
          markDirty(o.fileKey);
          if (o.cols.some(c => c.key === k && (c.preview || c.namesOf))) draw();
          o.after?.();
        }));
        $$("[data-up],[data-dn]", wrap).forEach(b => b.addEventListener("click", () => {
          const i = Number(b.dataset.up ?? b.dataset.dn), j = b.dataset.up !== undefined ? i - 1 : i + 1;
          if (j < 0 || j >= rows.length) return;
          [rows[i], rows[j]] = [rows[j], rows[i]];
          markDirty(o.fileKey); draw(); o.after?.();
        }));
        $$("[data-del]", wrap).forEach(b => b.addEventListener("click", () => {
          rows.splice(Number(b.dataset.del), 1);
          if (!rows.length) o.onEmpty?.();
          markDirty(o.fileKey); draw(); o.after?.();
        }));
        $("[data-add]", wrap).addEventListener("click", () => {
          const list = Array.isArray(o.get()) ? o.get() : o.make();
          const at = o.addAt ? o.addAt(list) : list.length;
          list.splice(at, 0, o.newRow(list));
          markDirty(o.fileKey); draw(); o.after?.();
        });
      };
      const cell = (c, row, i) => {
        if (c.names) {
          const key = row[c.namesOf];
          return LANGS.map(([l]) => `<td>${key ? `<input data-ck="${esc(key)}" data-lang="${l}" value="${esc(csvGet(key, l))}" placeholder="${esc(locText(key, l))}">` : ""}</td>`).join("");
        }
        const v = row[c.key];
        if (c.type === "tier") return `<td>${tierSelect(`data-c="${c.key}" data-t="int" data-i="${i}"`, v, c.defLabel)}</td>`;
        if (c.type === "num" || c.type === "int")
          return `<td><input type="number" step="any" data-c="${c.key}" data-t="${c.type}" data-i="${i}" value="${esc(v ?? "")}" placeholder="${esc(c.ph || "")}"></td>`;
        const pv = c.preview && v ? (titleText(v, "cz") || locText(v, "cz")) : "";
        return `<td><input data-c="${c.key}" data-t="str" data-i="${i}" value="${esc(v ?? "")}" placeholder="${esc(c.ph || "")}" ${c.list ? `list="${c.list}"` : ""}>${c.preview && v ? `<div class="fh ${pv ? "" : "warn"}" style="padding:0 6px 2px">${pv ? "简体：" + esc(pv) : "找不到这个语言键"}</div>` : ""}</td>`;
      };
      draw();
      return wrap;
    }

    // 键值表(文明组、元老专属军衔)
    function dictTable(o) {
      const wrap = document.createElement("div");
      const draw = () => {
        const obj = isObj(o.get()) ? o.get() : {};
        const keys = Object.keys(obj);
        wrap.innerHTML = `<table class="sheet"><thead><tr><th>${o.keyLabel}</th><th ${o.names ? `style="width:32%"` : ""}>${o.valLabel}</th>${o.names ? LANGS.map(([, t]) => `<th>${t}</th>`).join("") : ""}<th class="act"></th></tr></thead><tbody>
          ${keys.map(k => {
            const v = obj[k];
            const names = o.names ? LANGS.map(([l]) => `<td>${typeof v === "string" && v ? `<input data-ck="${esc(v)}" data-lang="${l}" value="${esc(csvGet(v, l))}" placeholder="${esc(locText(v, l))}">` : ""}</td>`).join("") : "";
            const kn = o.keyName?.(k);
            return `<tr><td><input data-dk="${esc(k)}" value="${esc(k)}" ${o.keyList ? `list="${o.keyList}"` : ""}>${kn ? `<div class="fh" style="padding:0 6px">${esc(kn)}</div>` : ""}</td>
              <td>${typeof v === "string" ? `<input data-dv="${esc(k)}" value="${esc(v)}" ${o.valList ? `list="${o.valList}"` : ""}>` : `<span class="fh">${esc(JSON.stringify(v))}(原样保留)</span>`}</td>${names}
              <td class="act"><button class="small danger" data-dd="${esc(k)}" title="删除">×</button></td></tr>`;
          }).join("") || `<tr><td class="txt muted" colspan="${o.names ? 6 : 3}">(空)</td></tr>`}</tbody></table>
          <div class="toolbar" style="margin-top:6px"><button class="small" data-da>${o.addLabel}</button></div>`;
        $$("[data-dk]", wrap).forEach(el => el.addEventListener("change", () => {
          const from = el.dataset.dk, to = el.value.trim();
          if (to === from) return;
          if (!to || Object.prototype.hasOwnProperty.call(obj, to)) { toast(to ? `已经有 ${to}` : "不能为空", true); el.value = from; return; }
          renameKey(obj, from, to); markDirty(o.fileKey); draw(); o.after?.();
        }));
        $$("[data-dv]", wrap).forEach(el => el.addEventListener("change", () => {
          obj[el.dataset.dv] = el.value.trim(); markDirty(o.fileKey); draw(); o.after?.();
        }));
        $$("[data-dd]", wrap).forEach(b => b.addEventListener("click", () => {
          delete obj[b.dataset.dd]; markDirty(o.fileKey); draw(); o.after?.();
        }));
        $("[data-da]", wrap).addEventListener("click", async () => {
          // 有现成选项的用下拉(显示中文)，也能手动输入
          const keyOpts = o.keyOptions?.().filter(([v]) => !Object.prototype.hasOwnProperty.call(obj, v));
          const fields = keyOpts
            ? [{ label: o.keyLabel, options: [...keyOpts, ["__custom", "其它(下面手动输入)"]], value: keyOpts[0]?.[0] || "__custom" }, { label: `${o.keyLabel}(手动输入)` }]
            : [{ label: o.keyLabel, suggestions: o.keySuggest?.() }];
          const valOpts = o.valOptions?.();
          fields.push(valOpts ? { label: o.valLabel, options: valOpts, value: valOpts[0]?.[0] } : { label: o.valLabel, value: o.defaultVal || "", suggestions: o.valSuggest?.() });
          const r = await ask(o.addLabel, fields);
          if (!r) return;
          const key = keyOpts ? (r[0] === "__custom" ? r[1] : r[0]) : r[0];
          const val = r[r.length - 1];
          if (!key) return;
          const target = o.make();
          if (Object.prototype.hasOwnProperty.call(target, key)) return toast(`已经有 ${key}`, true);
          target[key] = val;
          markDirty(o.fileKey); draw(); o.after?.();
        });
      };
      draw();
      return wrap;
    }

    // ================= 政体军制 =================

    function formationOptions(value, emptyLabel) {
      const ids = Object.keys(F().formations || {});
      const cur = value ?? "";
      const names = ids.map(formationName);
      let html = `<option value="" ${cur === "" ? "selected" : ""}>${esc(emptyLabel)}</option>` +
        ids.map((id, i) => `<option value="${esc(id)}" ${id === cur ? "selected" : ""}>${esc(names.indexOf(names[i]) !== i || names.lastIndexOf(names[i]) !== i ? `${names[i]}(${id})` : names[i])}</option>`).join("");
      if (cur && !ids.includes(cur)) html += `<option value="${esc(cur)}" selected>找不到：${esc(cur)}</option>`;
      return html;
    }

          (kind === "missing" ? `<div class="fh">没有单独配置，用“其余政体”</div>` : "") +

          return `<tr class="dim">${head}${SLOTS.map(([s]) => `<td class="txt">${esc(fb[s] ? formationName(fb[s]) : "—")}</td>`).join("")}<td class="txt">—</td>

        const slots = SLOTS.map(([s]) => `<td><select data-rk="${esc(k)}" data-slot="${s}">${formationOptions(m[s], "(空：不编建制)")}</select><div class="fk sel-id">${esc(m[s] ?? "")}</div></td>`).join("");
        const hasEarly = ["early", "early_below_stage", "merge_at_stage"].some(x => x in m) || k === "Transmigrant";
        const early = hasEarly
          ? `<td><div class="early"><select data-rk="${esc(k)}" data-slot="early">${formationOptions(m.early, "(不用早期建制)")}</select><div class="fk sel-id">${esc(m.early ?? "")}</div>
              <label>阶段不到 ${stageSelect(`data-rk="${esc(k)}" data-stage="early_below_stage"`, m.early_below_stage)} 时新军用它</label>
              <label>到阶段 ${stageSelect(`data-rk="${esc(k)}" data-stage="merge_at_stage"`, m.merge_at_stage)} 并入中央</label></div></td>`
          : `<td class="txt muted">—</td>`;
        const act = kind === "own" ? `<button class="small danger" data-drop="${esc(k)}" title="删掉这一行，改用“其余政体”">删除</button>` : "";
        return `<tr>${head}${slots}${early}<td class="act">${act}</td></tr>`;
      };
      panel.innerHTML = `${fileBanner("formations")}
        <h2>${ico("iconKingdom", "lg")}政体军制<span class="badge">regimes / fallback</span></h2>
        <p class="hint">每个政体把四种军镇映射到建制：新军按驻在哪里取这一格的建制。政体按 RegimeType 的名字；没写的政体用最后一行“其余政体”(fallback)。
          格子选“空”= 不编建制，按默认值的常备军、没有番号。改了这里不会改已有部队的建制(只有被俘、改投和整编才换)。</p>
        <div class="card"><table class="sheet sticky"><thead><tr><th>政体</th>${SLOTS.map(([s, t, h]) => `<th title="${esc(h)}">${t}<span class="fk">${s}</span></th>`).join("")}<th>穿越政体早期建制<span class="fk">early</span></th><th class="act"></th></tr></thead><tbody>
          ${keys.map(k => row(k, map[k], "own")).join("")}
          ${missing.map(k => row(k, fb, "missing")).join("")}
          ${row("fallback", fb, "fallback")}
        </tbody></table></div>
        <div class="note" style="margin-top:12px">
          <b>各格</b>：${SLOTS.map(([s, t, h]) => `${t}(${s})：${h}`).join("；")}。<br>
          <b>穿越政体</b>另有 <code>early</code>、<code>early_below_stage</code>、<code>merge_at_stage</code>：元老院的阶段不到前者时新军用 early 建制；到后者时把 early 的部队并入中央那一格，只并一次。

    function ladderKeys() {
      const r = R(), keys = new Set();

    function csvSets() {
      const special = ladderKeys(), sets = new Map();
      for (const l of csvLive()) {
        const key = csvKeyOf(l), m = key.match(/^official_rank_(.+)_(\d+)$/);
        if (!m || special.has(key) || Number(m[2]) > 8) continue;
        if (!sets.has(m[1])) sets.set(m[1], new Set());

    function referencedSets() {
      const r = R(), out = [];
      const add = v => { if (typeof v === "string" && v && v !== "@metropole") out.push(v); };
      if (isObj(r.fallback)) { add(r.fallback.civil); add(r.fallback.military); }
      for (const f of Object.values(isObj(r.forms) ? r.forms : {}))
        if (isObj(f) && isObj(f.civilizations)) for (const e of Object.values(f.civilizations)) if (isObj(e)) { add(e.civil); add(e.military); }
      return uniq(out);
    }

    function allSetNames() { return uniq([...csvSets().keys(), ...S.extraSets, ...referencedSets(), ...honoraryPatterns()]); }
    function setRange(set) {
      if (!set || set === "@metropole") return "";
      const a = titleText(setKey(set, 0), "cz"), b = titleText(setKey(set, 8), "cz");
      return a || b ? `${a || "?"} … ${b || "?"}` : "";

    const setLabel = s => { const range = setRange(s); return range ? `${range}(${s})` : s; };
    function setUses(set) {
      const r = R(), out = [];
      if (isObj(r.fallback)) { if (r.fallback.civil === set) out.push(["", "通用回退 · 文"]); if (r.fallback.military === set) out.push(["", "通用回退 · 武"]); }

    // 称谓套选择：不写(null) / 空(不设等级) / @metropole / 套名 / 手动输入

    // 新建称谓套：默认照抄一套现有的九档名字，再逐档改；套名可留空自动起
    async function newSet(copyFrom) {
      const sources = allSetNames().filter(s => setRange(s));
      const def = copyFrom || (S.sel.titles && S.sel.titles !== "@others" ? S.sel.titles : sources.includes("grades_general") ? "grades_general" : sources[0]);
      const r = await ask(copyFrom ? `复制称谓套：${setLabel(copyFrom)}` : "新建称谓套", [
        { label: "照抄哪一套的九档名字", options: [...sources.map(s => [s, setLabel(s)]), ["", "空白：九档都自己写"]], value: def || "" },
        { label: "套名(英文，可留空自动起名)", placeholder: "例如 court_viking" }
      ], "建好后逐档改名字；再到“政体形态”里给某个文明组选上这一套才会用到。");
      if (!r) return;
      const [src, typed] = r;
      const taken = n => allSetNames().includes(n) || csvLive().some(l => groupOf(csvKeyOf(l)) === `official_rank_${n}`);
      let name = typed;
      if (name) {
        if (!/^[A-Za-z0-9_]+$/.test(name)) return toast("套名只能用英文字母、数字和下划线", true);
        if (taken(name)) return toast(`已经有 ${name}`, true);
      } else {
        const base = (src || "custom").replace(/\{0\}/g, "").replace(/[^A-Za-z0-9_]+/g, "_").replace(/_+$/, "") || "custom";
        let n = 2;
        while (taken(`${base}_v${n}`)) n++;
        name = `${base}_v${n}`;
      }
      if (src) for (let t = 0; t <= 8; t++) for (const [l] of LANGS) {
        const v = titleText(setKey(src, t), l);
        if (v) csvSet(setKey(name, t), l, v);
      }
      S.extraSets.push(name);
      S.sel.titles = name; updateSaveBtn(); renderAll();
      toast(`已新建称谓套 ${name}` + (src ? `，九档先照抄 ${src}` : ""));
    }

      } else if (sec === "forms") {
        const forms = isObj(R().forms) ? R().forms : {};
        html = Object.keys(forms).filter(k => hit(k, formLabel(k))).map(k => item(k, formLabel(k), k, k === S.sel.forms, k === "Modern" || k === "Republic")).join("");
        toolHtml = `<button class="small primary" data-tool="addForm">${ico("iconShovelPlus", "sm")}添加形态</button>`;
      } else if (sec === "floors") {
        const r = R();
        html = floorRegimes().filter(k => hit(k, regimeLabel(k))).map(k => {
          const n = isObj(r.floors?.[k]) ? Object.keys(r.floors[k]).length : 0;
          const u = Array.isArray(r.unranked?.[k]) ? r.unranked[k].length : 0;
          const m = Array.isArray(r.military_offices?.[k]) ? r.military_offices[k].length : 0;
          const sub = [n && `定底${n}`, u && `不列${u}`, m && `武职${m}`].filter(Boolean).join(" · ") || "未配置";
          return item(k, regimeLabel(k), sub, k === S.sel.floors);
        }).join("");
      } else if (sec === "titles") {
        const sets = csvSets(), used = new Set(referencedSets());
        const names = uniq([...sets.keys(), ...S.extraSets, ...[...used].filter(s => !s.includes("{0}"))]);
        html = item("@others", "其它条目", "元老、元帅、士兵阶梯…", S.sel.titles === "@others") +
          names.filter(s => hit(s, setRange(s))).map(s => {
            const have = sets.get(s)?.size || 0;
            const state = have === 0 ? "称谓表里没有" : have < 9 ? `缺 ${9 - have} 档` : used.has(s) ? "" : "没用上";
            const head = titleText(setKey(s, 0), "cz");
            return item(s, head ? `${head} …` : s, state ? `${s} · ${state}` : s, s === S.sel.titles, have < 9 && (used.has(s) || have > 0), setRange(s));
          }).join("");
        toolHtml = `<button class="small primary" data-tool="newSet">${ico("iconShovelPlus", "sm")}新建称谓套</button>`;
      } else if (sec === "regimes") {
        html = `<div class="note">右侧一张表就是全部政体的军制：每个政体四个槽位各放一种建制。建制本身在“建制”里编辑。</div>`;
      } else if (sec === "general") {
        html = `<div class="note">通用规则对所有政体形态生效：回退称谓、文明组划分、统帅和军官的底线、士兵军衔阶梯、元老专属军衔。</div>`;
      }
      const listed = ["formations", "forms", "floors", "titles"].includes(sec);
      $("#filter").hidden = !listed;
      tools.hidden = !toolHtml;
      // 侧栏尽量原地更新：输入框失焦(change)时会重画侧栏，元素换掉的话刚按下的那一下点击就丢了
      if (tools.dataset.html !== toolHtml) { tools.innerHTML = toolHtml; tools.dataset.html = toolHtml; }
      patchChildren(list, html);
    }
    function patchChildren(box, html) {
      const tpl = document.createElement("div");
      tpl.innerHTML = html;
      const next = [...tpl.children], cur = [...box.children];
      if (next.length === cur.length && next.every((n, i) => n.tagName === cur[i].tagName && n.dataset.k === cur[i].dataset.k)) {
        next.forEach((n, i) => {
          if (cur[i].outerHTML === n.outerHTML) return;
          cur[i].className = n.className; cur[i].title = n.title; cur[i].innerHTML = n.innerHTML;
        });
      } else box.innerHTML = html;
    }
    // 侧栏的点击用事件委托，只绑一次
    document.getElementById("list").addEventListener("click", e => {
      const it = e.target.closest(".item[data-k]");
      if (it) selectItem(it.dataset.k);
    });
    document.getElementById("listTools").addEventListener("click", e => {
      const t = e.target.closest("[data-tool]")?.dataset.tool;
      if (t === "new") newFormation(null);
      else if (t === "copy") S.sel.formations ? newFormation(S.sel.formations) : toast("先在列表里选一个建制", true);
      else if (t === "del") S.sel.formations ? deleteFormation(S.sel.formations) : toast("先在列表里选一个建制", true);
      else if (t === "addForm") addForm();
      else if (t === "newSet") newSet(null);
    });

    function selectItem(key) {
      S.sel[S.section] = key || null;
      renderList(); renderPanel();
      panel.scrollTop = 0;
    }
    function switchSection(sec) {
      S.section = sec;
      $("#filter").value = "";
      renderAll();
      panel.scrollTop = 0;
    }
    function renderNav() {
      $("#sectionNav").innerHTML = SECTIONS.map(([k, t, icon]) => `<button type="button" data-sec="${k}" class="${k === S.section ? "active" : ""}">${ico(icon, "sm")}${t}</button>`).join("");
      $$("[data-sec]", $("#sectionNav")).forEach(b => b.addEventListener("click", () => switchSection(b.dataset.sec)));
    }
    function renderPanel() {
      const top = panel.scrollTop;
      renderDatalists();
      const sec = S.section;
      if (sec === "formations") renderFormation();
      else if (sec === "regimes") renderRegimes();
      else if (sec === "general") renderGeneral();
      else if (sec === "forms") renderForm();
      else if (sec === "floors") renderFloors();
      else if (sec === "titles") renderTitles();
      panel.scrollTop = top;
    }
    function renderAll() { renderNav(); renderList(); renderPanel(); }

    // 简繁互填：另一边是空的、还是上次自动填的、或(本次还没手动改过时)正好是这一边旧值的转换，就跟着改；
    // 这次手动改过的那一边以后不再自动改
    function autoPair(attr, key, lang, before, value, get, set) {
      if (lang !== "cz" && lang !== "ch") return;
      S.manual[key + "|" + lang] = true;
      delete S.auto[key + "|" + lang];
      if (!hasZh() || !value) return;
      const other = lang === "cz" ? "ch" : "cz";
      const conv = lang === "cz" ? zhToTrad : zhToSimp;
      const cur = get(other), tag = key + "|" + other;
      if (S.manual[tag] && cur !== "") return;
      if (!(cur === "" || cur === S.auto[tag] || (before && cur === conv(before)))) return;
      const next = conv(value);
      if (next === cur) { S.auto[tag] = next; return; }
      set(other, next);
      S.auto[tag] = next;
      const inp = panel.querySelector(`[${attr}="${CSS.escape(key)}"][data-lang="${other}"]`);
      if (inp) inp.value = next;
    }

    // 语言文件、称谓表的输入框：边打字边记
    panel.addEventListener("input", e => {
      const el = e.target, lang = el.dataset.lang;
      if (el.dataset.loc) {
        const k = el.dataset.loc, before = locText(k, lang);
        const set = (l, v) => { S.locEdits[k] = { ...(S.locEdits[k] || {}), [l]: v }; };
        set(lang, el.value);
        autoPair("data-loc", k, lang, before, el.value, l => locText(k, l), set);
        updateSaveBtn();
        if (S.section === "formations") { const t = $("#fTitle"); if (t && lang === "cz") t.textContent = el.value || S.sel.formations; }
      } else if (el.dataset.ck) {
        const k = el.dataset.ck, before = csvGet(k, lang);
        csvSet(k, lang, el.value);
        autoPair("data-ck", k, lang, before, el.value, l => csvGet(k, l), (l, v) => csvSet(k, l, v));
        updateSaveBtn();
      }
    });

    // 一键补全繁体：只填空着的格子
    function fillTraditional(keys) {
      if (!hasZh()) { toast("没有找到简繁转换(zh-convert.js)", true); return 0; }
      let n = 0;
      for (const k of keys) {
        const cz = csvGet(k, "cz");
        if (cz && !csvGet(k, "ch")) { const t = zhToTrad(cz); csvSet(k, "ch", t); S.auto[k + "|ch"] = t; delete S.manual[k + "|ch"]; n++; }
      }
      updateSaveBtn();
      toast(n ? `补全了 ${n} 个繁体` : "没有空着的繁体格子");
      return n;
    }
    panel.addEventListener("change", e => {
      if (e.target.dataset.loc || e.target.dataset.ck) renderList();
    });
    // 记住“高级”是否展开，重画后保持
    panel.addEventListener("toggle", e => { const k = e.target.dataset?.adv; if (k) S.advOpen[k] = e.target.open; }, true);

    // ================= 保存 =================

    async function saveAll() {
      if (!api) return toast("只有桌面版才能保存", true);
      const done = [], skipped = [];
      // 本次改过的名字：英文空着先用简体；繁体空着用简体转换
      let enFallback = 0, chFilled = 0;
      const trad = t => hasZh() ? zhToTrad(t) : t;
      for (const [k, v] of Object.entries(S.locEdits)) {
        const cz = v.cz ?? S.loc[k]?.cz ?? "";
        if (!cz.trim()) continue;
        if (!(v.en ?? S.loc[k]?.en ?? "").trim()) { v.en = cz; enFallback++; }
        if (!(v.ch ?? S.loc[k]?.ch ?? "").trim()) { v.ch = trad(cz); chFilled++; }
      }
      const col = S.csv.col;
      for (const l of S.csv.lines) {
        if (l.blank || l.deleted || !l.changed) continue;
        const cz = l.cells[col.cz] || "";
        if (!cz.trim()) continue;
        while (l.cells.length <= Math.max(col.en, col.ch)) l.cells.push("");
        if (!l.cells[col.en].trim()) { l.cells[col.en] = cz; enFallback++; }
        if (!l.cells[col.ch].trim()) { l.cells[col.ch] = trad(cz); chFilled++; }
      }
      const extra = [enFallback && `${enFallback} 处英文留空，已先用简体代替`, chFilled && `${chFilled} 处繁体留空，已按简体自动转换`].filter(Boolean).join("；");
      try {
        for (const key of ["formations", "ranks"]) {
          const f = S.files[key];
          if (!f.dirty) continue;
          if (f.error) { skipped.push(f.path); continue; }
          const text = serializeDoc(f);
          await api.writeText(f.path, text);
          f.dirty = false;
          f.blanks = blankLinePaths(text);
          done.push(f.path.split("/").pop());
        }
        if (S.csv.dirty) {
          const text = serializeTitleCsv(S.csv);
          await api.writeText(TITLE_CSV, text);
          S.csv = parseTitleCsv(text);
          done.push("OfficialRanks.csv");
        }
        const edits = {};
        for (const [k, v] of Object.entries(S.locEdits)) if (k) edits[k] = v;
        if (Object.keys(edits).length) {
          await api.writeLocales(edits);
          for (const [k, v] of Object.entries(edits)) S.loc[k] = { ...(S.loc[k] || {}), ...v };
          S.locEdits = {};
          done.push("语言文件");
        }
        updateSaveBtn();
        renderList();
        if (skipped.length) toast(`${skipped.join("、")} 读取失败，没有保存` + (done.length ? `；已保存 ${done.join("、")}` : ""), true);
        else toast(done.length ? `已保存 ${done.join("、")}，重启游戏后生效` + (extra ? `。${extra}` : "") : "没有需要保存的修改");
        if (!skipped.length && done.length) renderPanel();
      } catch (e) { toast("保存失败：" + e.message, true); }
    }

    mountAppBar("military.html");
    document.getElementById("filter").addEventListener("input", renderList);
    document.getElementById("saveBtn").addEventListener("click", saveAll);
    document.getElementById("reloadBtn").addEventListener("click", () => {
      if (isDirty() && !confirm("有未保存的修改，确定重新读取？")) return;
      load();
    });
    document.getElementById("openBtn").addEventListener("click", async () => {
      if (!api) return toast("只有桌面版才能打开目录", true);
      try { await api.openPath("Scripts/Regimes/Configs"); } catch (e) { toast(e.message, true); }
    });
    window.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveAll(); } });
    window.addEventListener("beforeunload", e => { if (isDirty()) { e.preventDefault(); e.returnValue = ""; } });
    load();
  </script>
</body>
</html>
