<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmpireCraft 杂项配置</title>
  <link rel="stylesheet" href="common.css" />
  <style>
    .hint{font-size:12px;color:var(--muted);line-height:1.6}
    .hint.warn,.warn{color:var(--danger) !important}
    .pre{white-space:pre-wrap}
    .fname{font-family:Consolas,monospace;font-size:11px;opacity:.6;margin-left:6px}
    .side .section-nav button{display:flex;align-items:center;gap:6px}
    .side .section-nav .navsub{margin-left:auto;font-size:11px;color:var(--danger)}
    .sub-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px;align-items:start}
    .sub-list{display:grid;gap:2px;align-content:start;max-height:calc(100vh - 290px);min-height:240px;overflow:auto;position:sticky;top:0;border:1px solid var(--line);padding:4px}
    .sub-list .grp-title{color:var(--muted);font-size:12px;padding:6px 10px 2px}
    .item .sub{white-space:nowrap}
    .table-wrap{overflow:auto;max-height:calc(100vh - 300px);min-height:240px;border:1px solid var(--line)}
    .table-wrap.free{max-height:none;min-height:0}
    table.sheet{table-layout:fixed}
    table.sheet th .fname{display:block;margin:0}
    table.sheet td select{border:none !important;border-radius:0;padding:4px 6px;background:transparent !important;width:100%}
    table.sheet td.rn{text-align:center;color:var(--muted);font-size:12px}
    table.sheet td.txt{padding:4px 6px}
    table.sheet td.act{width:auto;white-space:nowrap;text-align:center;padding:2px 4px}
    table.sheet td.act button{padding:0 6px}
    table.sheet tr.grp td{color:var(--c-gold,#8d6836);padding:4px 8px;background:var(--c-card2,#efe1c4) !important}
    table.sheet tr.grp td button{margin-left:8px}
    table.sheet tr.skip td{opacity:.65}
    table.sheet tr.core td.rn{color:var(--c-gold,#8d6836)}
    table.sheet tr.warnrow td{padding:2px 8px;border-top:none}
    table.sheet input.bad,input.bad{outline:1px solid var(--danger) !important}
    table.sheet input.dup{color:var(--danger) !important}
    .preview{table-layout:auto !important}
    .preview td,.preview th{white-space:nowrap;padding:3px 8px !important}
    .preview td.diff{color:var(--c-gold,#8d6836)}
    .natf .field-row{display:flex;gap:6px;align-items:center}
    .natf .field-row input{flex:1}
    .natf.changed input{border-color:var(--c-gold,#8d6836) !important}
    .natf .def{color:var(--muted)}
    #conBody select.set{border-color:var(--c-gold,#8d6836) !important}
    .natf .def b{color:var(--c-gold,#8d6836)}
    .sum{font-size:12px;margin:-4px 0 8px}
    .sum.ok{color:var(--good)}.sum.bad{color:var(--danger)}
    .pun{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
    .pun .chip{font-size:12px}
    .toggles label{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line)}
    textarea.short{min-height:56px}
    .warn-box{display:grid;gap:2px;margin:8px 0}
    .grid.five{grid-template-columns:repeat(5,minmax(0,1fr))}
    .head-path{margin:-4px 0 10px}
    h3 button{margin-left:auto}
    /* 律法：三种语言的名称与条文、现行刑罚 */
    .lawloc{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .lawloc .col{display:grid;gap:4px;align-content:start}
    .lawloc .col > span{font-size:12px;color:var(--muted)}
    .fallback{font-size:12px;color:var(--muted)}
    .fallback .diff{color:var(--c-gold,#8d6836)}
    .badge.grave{color:var(--danger);border-color:var(--danger)}
    .item .sub.grave{color:var(--danger)}
    table.sheet.eff{table-layout:auto;width:auto;min-width:60%}
    table.sheet.eff td,table.sheet.eff th{padding:3px 8px;white-space:normal}
    table.sheet.eff td.same{color:var(--muted)}
    /* 律法时代与宽严 */
    .erf{border:1px solid var(--line);padding:8px 10px;display:grid;gap:6px;align-content:start;min-width:0}
    .erf.changed{border-color:var(--c-gold,#8d6836)}
    .erf.wide{grid-column:1/-1}
    .erf-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
    .erf-head .def{font-size:12px;color:var(--muted)}
    .erf-head .def b{color:var(--c-gold,#8d6836)}
    .erf-head button{margin-left:auto}
    .erf input[type=number]{max-width:170px}
    .erf select.solo{max-width:280px}
    .kv{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
    .kv .pair{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);padding:2px 4px 2px 8px;font-size:12px}
    .kv .pair.bad{border-color:var(--danger);color:var(--danger)}
    .kv select,.kv input{width:auto;padding:2px 6px;font-size:12px}
    .rule{border:1px dashed var(--line);padding:6px 8px;display:grid;gap:6px}
    .rule .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .rule .row select,.rule .row input{width:auto;min-width:150px}
    .checkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 8px}
    .checkgrid label{display:flex;align-items:center;gap:6px;font-size:13px;padding:2px 4px}
    .checkgrid label.on{color:var(--danger)}
    .checkgrid .grp-title{grid-column:1/-1;color:var(--muted);font-size:12px;margin-top:4px}
    table.sheet.mapt{table-layout:auto;width:auto;min-width:340px}
    table.sheet.mapt td,table.sheet.mapt th{padding:2px 8px}
    table.sheet.mapt td input{width:120px;border:1px solid var(--line) !important}
    table.sheet.mapt td.dv{color:var(--muted);font-size:12px}
    .maps{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
    .erf > table,.erf > .maps{justify-self:start}
    table.sheet.mapt th,table.sheet.eff th{position:static}
    .rule .row input[data-rule-note]{min-width:230px}
  </style>
  <link rel="stylesheet" href="pixel-theme.css" />
</head>
<body>
  <div class="layout">
    <aside class="side">
      <div class="side-group">
        <h4>配置文件</h4>
        <div class="section-nav" id="fileNav"></div>
      </div>
      <div class="side-group">
        <h4>保存到模组</h4>
        <button class="primary wide" id="saveBtn"><img class="ico sm" src="assets/icons/iconSaveLocal.png" alt="">保存当前文件</button>
        <div class="btn-list">
          <button id="saveAllBtn">保存全部改动</button>
          <button id="reloadBtn">重新读取当前文件</button>
          <button id="openDirBtn">打开所在文件夹</button>
        </div>
      </div>
      <details class="help">
        <summary>使用说明</summary>
        <ol>
          <li>每个文件单独保存；改过还没保存的文件左边标 ●。Ctrl+S 保存当前文件。</li>
          <li>保存时只重写改动过的值或行：注释、空行、缩进、键的顺序、编辑器不认识的字段都原样保留。</li>
          <li>称谓表、律法名称填简体会自动补上繁体；英文留空的，保存时用简体代替。</li>
          <li>律法的名称、条文存在语言文件(Locales/cz、ch、en.json)，保存「帝国律法」时一起写。</li>
          <li>改完要重启游戏才生效。</li>
          <li>文武官阶称谓表(OfficialRanks.csv)在「军制与官阶」页。</li>
        </ol>
      </details>
    </aside>
    <main class="panel" id="editor"><p class="muted">读取中…</p></main>
  </div>

  <script src="common.js"></script>
  <script src="zh-convert.js"></script>
  <script>
    // 杂项配置：模组后来加的几份配置与称谓表，每份一个分页。
    // 读写原则：JSON 只重写改动过的值(注释、空行、缩进、键顺序、不认识的字段原样保留)；CSV 只重写改动过的行。
    const isObj = v => !!v && typeof v === "object" && !Array.isArray(v);
    const isCont = v => !!v && typeof v === "object";
    const has = (o, k) =>!!o && Object.prototype.hasOwnProperty.call(o, k);
    const zhOK = () => typeof zhToTrad === "function" && typeof zhToSimp === "function";

    function deepEqual(a, b) {
      if (a === b) return true;
      if (!a || !b || typeof a !== "object" || typeof b !== "object") return false;
      if (Array.isArray(a) !== Array.isArray(b)) return false;
      if (Array.isArray(a)) return a.length === b.length && a.every((x, k) => deepEqual(x, b[k]));
      const ka = Object.keys(a), kb = Object.keys(b);
      return ka.length === kb.length && ka.every(k => has(b, k) && deepEqual(a[k], b[k]));
    }

    // ================= 保留原格式的 JSON 读写 =================
    // 解析成带位置的语法树；保存时没改的部分照抄原文，改了的值就地替换，增删的成员按本文件的缩进风格补写
    const JsonDoc = (() => {
      const isCont = v => !!v && typeof v === "object";
      const defineKey = (o, k, v) => Object.defineProperty(o, k, { value: v, enumerable: true, writable: true, configurable: true });

      function parse(text) {
        const n = text.length;
        let i = 0;
        const fail = msg => new Error(`第 ${text.slice(0, i).split("\n").length} 行：${msg}`);
        const trivia = () => {
          while (i < n) {
            const c = text[i];
            if (c === " " || c === "\t" || c === "\n" || c === "\r" || c === "﻿") i++;
            else if (c === "/" && text[i + 1] === "/") { const e = text.indexOf("\n", i); i = e < 0 ? n : e; }
            else if (c === "/" && text[i + 1] === "*") { const e = text.indexOf("*/", i + 2); if (e < 0) throw fail("/* 注释没有结束"); i = e + 2; }
            else break;
          }
        };
        const str = () => {
          const s = i++;
          while (i < n && text[i] !== '"') {
            if (text[i] === "\n") throw fail("字符串里不能换行");
            i += text[i] === "\\" ? 2 : 1;
          }
          if (i >= n) throw fail("字符串没有结束");
          i++;
          try { return JSON.parse(text.slice(s, i)); } catch { throw fail("字符串里有不合法的转义"); }
        };
        const value = () => {
          trivia();
          const s = i, c = text[i];
          if (c === "{" || c === "[") return container(c === "{");
          if (c === '"') { const v = str(); return { kind: "scalar", start: s, end: i, json: v }; }
          const m = /^(?:-?(?:0|[1-9]\d*)(?:\.\d+)?(?:[eE][+-]?\d+)?|true|false|null)(?![\w.$])/.exec(text.slice(i, i + 100));
          if (!m) throw fail("这里应该是一个值");
          i += m[0].length;
          return { kind: "scalar", start: s, end: i, json: JSON.parse(m[0]) };
        };
        // 逗号(或最后一项)后面同一行的 // 注释算这一项的，删、挪这一项时跟着走
        const trailFrom = pos => {
          let j = pos;
          while (text[j] === " " || text[j] === "\t") j++;
          if (text[j] !== "/" || text[j + 1] !== "/") return pos;
          const e = text.indexOf("\n", j);
          if (e < 0) return pos;
          return text[e - 1] === "\r" ? e - 1 : e;
        };
        const container = isObjNode => {
          const node = { kind: isObjNode ? "object" : "array", start: i, items: [] };
          const close = isObjNode ? "}" : "]";
          i++;
          let leadStart = i;
          for (;;) {
            trivia();
            if (i >= n) throw fail(`缺少 ${close}`);
            if (text[i] === close) { node.tailStart = leadStart; break; }
            const item = { leadStart, start: i };
            if (isObjNode) {
              if (text[i] !== '"') throw fail("这里应该是带双引号的键名");
              item.key = str();
              item.keyEnd = i;
              trivia();
              if (text[i] !== ":") throw fail("键名后面应该是冒号");
              i++;
            }
            item.value = value();
            item.end = item.value.end;
            const after = i;
            trivia();
            node.items.push(item);
            if (text[i] === ",") { i++; item.sepEnd = i; item.trailEnd = trailFrom(i); leadStart = item.trailEnd; continue; }
            if (text[i] === close) { item.sepEnd = after; item.trailEnd = trailFrom(after); node.tailStart = item.trailEnd; break; }
            throw fail(`这里应该是逗号或 ${close}`);
          }
          node.closeAt = i;
          i++;
          node.end = i;
          if (isObjNode) { node.json = {}; for (const it of node.items) defineKey(node.json, it.key, it.value.json); }
          else node.json = node.items.map(it => it.value.json);
          return node;
        };
        const root = value();
        trivia();
        if (i < n) throw fail("末尾有多余的内容");
        const origin = new WeakMap();
        const live = node => {
          if (node.kind === "scalar") return node.json;
          if (node.kind === "array") { const a = node.items.map(it => live(it.value)); origin.set(a, node); return a; }
          const o = {};
          for (const it of node.items) defineKey(o, it.key, live(it.value));
          origin.set(o, node);
          return o;
        };
        return { text, root, origin, style: detectStyle(text, root), data: live(root) };
      }

      function detectStyle(text, root) {
        const eol = /\r\n/.test(text) ? "\r\n" : "\n";
        let unit = null;
        for (const line of text.split(/\r?\n/)) {
          const m = /^([ \t]+)["{\[\d\-tfn]/.exec(line);
          if (m && (!unit || m[1].length < unit.length)) unit = m[1];
        }
        let colon = null, inline = null, sep = null, objInline = null;
        const walk = node => {
          if (node.kind === "scalar") return;
          if (node.kind === "object" && node.items.length && colon === null) {
            const c = text.slice(node.items[0].keyEnd, node.items[0].value.start);
            colon = /^[ \t]*:[ \t]*$/.test(c) ? c : ": ";
          }
          // 写在一行里的 { } 对象(如 { "MinEraTier": 7, "Replace": { … } })：新加的同类对象照它的空格写成一行
          if (node.kind === "object" && node.items.length && !objInline && !/\n/.test(text.slice(node.start, node.end))) {
            const first = node.items[0], last = node.items[node.items.length - 1];
            const a = text.slice(node.start + 1, first.start), b = text.slice(last.end, node.closeAt);
            const s = node.items.length > 1 ? text.slice(first.end, node.items[1].start) : "";
            objInline = { padL: /\S/.test(a) ? " " : a, padR: /[^\s,]/.test(b) ? " " : b.replace(",", ""), sep: /^\s*,\s*$/.test(s) ? s : ", " };
          }
          if (node.kind === "array" && node.items.length && node.items.every(it => it.value.kind === "scalar") &&
            !/\n/.test(text.slice(node.start, node.end))) {
            const first = node.items[0], last = node.items[node.items.length - 1];
            const padL = text.slice(node.start + 1, first.start), padR = text.slice(last.end, node.closeAt);
            if (!inline && !/\S/.test(padL) && !/\S/.test(padR)) inline = { padL, padR, sep: ", " };
            if (!sep && node.items.length > 1) {
              const s = text.slice(first.end, node.items[1].start);
              if (/^\s*,\s*$/.test(s)) sep = s;
            }
          }
          for (const it of node.items) walk(it.value);
        };
        walk(root);
        if (inline && sep) inline.sep = sep;
        return { eol, unit: unit || "  ", colon: colon || ": ", inline, objInline: objInline || { padL: " ", padR: " ", sep: ", " } };
      }

      function serialize(doc, data) {
        const { text, root, origin, style } = doc;
        const sl = (a, b) => text.slice(a, b);
        const indentAt = pos => { const ls = text.lastIndexOf("\n", pos - 1) + 1; return /^[ \t]*/.exec(text.slice(ls, pos))[0]; };
        const memberIndent = node => node.items.length ? indentAt(node.items[0].start) : indentAt(node.start) + style.unit;
        const fresh = (v, ind) => {
          const nl = style.eol;
          if (Array.isArray(v)) {
            if (!v.length) return "[]";
            if (style.inline && v.every(x => !isCont(x)))
              return "[" + style.inline.padL + v.map(x => JSON.stringify(x ?? null)).join(style.inline.sep) + style.inline.padR + "]";
            const ci = ind + style.unit;
            return "[" + nl + v.map(x => ci + fresh(x, ci)).join("," + nl) + nl + ind + "]";
          }
          if (isObj(v)) {
            const ks = Object.keys(v);
            if (!ks.length) return "{}";
            const ci = ind + style.unit;
            return "{" + nl + ks.map(k => ci + JSON.stringify(k) + style.colon + fresh(v[k], ci)).join("," + nl) + nl + ind + "}";
          }
          return v === undefined ? "null" : JSON.stringify(v);
        };
        // 写成一行：嵌在单行对象里的新成员、同一列表里原有对象都写成一行时新加的对象
        const compact = v => {
          if (Array.isArray(v)) {
            if (!v.length) return "[]";
            const p = style.inline || { padL: "", padR: "", sep: ", " };
            return "[" + p.padL + v.map(compact).join(p.sep) + p.padR + "]";
          }
          if (isObj(v)) {
            const ks = Object.keys(v);
            if (!ks.length) return "{}";
            const p = style.objInline;
            return "{" + p.padL + ks.map(k => JSON.stringify(k) + style.colon + compact(v[k])).join(p.sep) + p.padR + "}";
          }
          return v === undefined ? "null" : JSON.stringify(v);
        };
        const emit = (node, v) => {
          if (deepEqual(node.json, v)) return sl(node.start, node.end);
          if (node.kind === "object" && isObj(v)) return assemble(node, objectPieces(node, v));
          if (node.kind === "array" && Array.isArray(v)) return assemble(node, arrayPieces(node, v));
          return fresh(v, indentAt(node.start));
        };
        const objectPieces = (node, obj) => {
          const lastIdx = new Map();
          node.items.forEach((it, k) => lastIdx.set(it.key, k));
          const pieces = [];
          node.items.forEach((it, k) => {
            if (lastIdx.get(it.key) !== k) { pieces.push({ orig: it, v: it.value.json, body: sl(it.start, it.end) }); return; } // 重复键的前几个原样留着
            if (!has(obj, it.key)) return;
            pieces.push({ orig: it, v: obj[it.key], body: sl(it.start, it.value.start) + emit(it.value, obj[it.key]) });
          });
          const mi = memberIndent(node);
          for (const k of Object.keys(obj))
            if (!lastIdx.has(k)) pieces.push({ orig: null, k, v: obj[k], body: JSON.stringify(k) + style.colon + fresh(obj[k], mi) });
          return pieces;
        };
        const arrayPieces = (node, arr) => {
          const used = new Set();
          // 列表里仍在的原成员认领着自己的原文；新成员只能顶替没人认领的原条目
          const claimed = new Set(arr.map(x => isCont(x) ? origin.get(x) : null).filter(Boolean));
          const free = t => !!t && !used.has(t) && !claimed.has(t.value);
          const conts = node.items.filter(t => t.value.kind !== "scalar");
          const oneLine = conts.length > 0 && conts.every(t => !/\n/.test(sl(t.value.start, t.value.end)));
          return arr.map((x, j) => {
            let it = null;
            if (isCont(x)) {
              const on = origin.get(x);
              if (on) it = node.items.find(t => t.value === on && !used.has(t)) || null;
              else {
                // 新对象(如恢复默认换上的副本)：和某条原文内容一样就照抄原文；否则顶替同一位置上没人认领的同类条目，按键逐个改
                it = node.items.find(t => free(t) && deepEqual(t.value.json, x)) || null;
                const t = node.items[j];
                if (!it && free(t) && t.value.kind === (Array.isArray(x) ? "array" : "object")) it = t;
              }
            } else {
              const ok = t => t && !used.has(t) && t.value.kind === "scalar" && t.value.json === x;
              it = ok(node.items[j]) ? node.items[j] : (node.items.find(ok) || null);
            }
            if (it) used.add(it);
            return { orig: it, v: x, body: it ? emit(it.value, x) : isCont(x) && oneLine ? compact(x) : fresh(x, memberIndent(node)) };
          });
        };
        const assemble = (node, pieces) => {
          const items = node.items;
          const open = text[node.start], close = text[node.closeAt];
          if (pieces.length === items.length && pieces.every((p, k) => p.orig === items[k])) {
            let out = "", pos = node.start;
            pieces.forEach((p, k) => { out += sl(pos, items[k].start) + p.body; pos = items[k].end; });
            return out + sl(pos, node.end);
          }
          const tailRaw = sl(node.tailStart, node.closeAt);
          if (!pieces.length) return open + (/\S/.test(tailRaw) ? tailRaw : "") + close;
          const wasEmpty = !items.length;
          let inline = !wasEmpty && !/\n/.test(sl(node.start, node.end));
          if (wasEmpty && node.kind === "array" && style.inline && pieces.every(p => !isCont(p.v))) inline = true;
          // 空的 { } / [ ] 嵌在单行里(同一行后面还有别的内容，如 { "Replace": {} })：加进去的也写在这一行
          if (wasEmpty && !inline) {
            const le = text.indexOf("\n", node.end);
            const rest = sl(node.end, le < 0 ? text.length : le).replace(/\/\/.*$/, "").trim();
            if (rest !== "" && rest !== ",") inline = true;
          }
          if (inline) {
            const base = node.kind === "object" ? style.objInline : (style.inline || { padL: "", padR: "", sep: ", " });
            let padL = base.padL, padR = base.padR, sep = base.sep;
            if (!wasEmpty) {
              const a = sl(node.start + 1, items[0].start), b = sl(items[items.length - 1].end, node.closeAt);
              if (!/\S/.test(a)) padL = a;
              if (!/[^\s,]/.test(b)) padR = b.replace(",", "");
              if (items.length > 1) { const s = sl(items[0].end, items[1].start); if (/^\s*,\s*$/.test(s)) sep = s; }
            }
            const body = p => p.orig || !isCont(p.v) ? p.body : (p.k !== undefined ? JSON.stringify(p.k) + style.colon : "") + compact(p.v);
            return open + padL + pieces.map(body).join(sep) + padR + close;
          }
          const ind = indentAt(node.start);
          let defLead, tail;
          if (!wasEmpty) {
            const fl = sl(items[0].leadStart, items[0].start);
            defLead = !/\S/.test(fl) && /\n/.test(fl) ? style.eol + fl.slice(fl.lastIndexOf("\n") + 1) : style.eol + indentAt(items[0].start);
            tail = tailRaw;
          } else {
            defLead = style.eol + ind + style.unit;

          }
          const last = items[items.length - 1];
          const hadTrailing = !wasEmpty && sl(last.end, last.sepEnd).includes(",");
          let out = open;
          pieces.forEach((p, k) => {
            const isLast = k === pieces.length - 1;
            const lead = p.orig ? sl(p.orig.leadStart, p.orig.start) : defLead;
            let between = p.orig ? sl(p.orig.end, p.orig.sepEnd) : "";
            if (!isLast || hadTrailing) { if (!between.includes(",")) between += ","; }
            else between = between.replace(",", "");

          });

        };

      }

          const raw = parts[k];
          lines.push({ raw, eol: parts[k + 1] || "", cells: quoting ? parseCsvLine(raw) : raw.split(","), edited: false });
        }

      serialize(doc) {
        return doc.lines.map(l => (l.edited ? l.cells.map(c => doc.quoting ? csvCell(c) : String(c ?? "")).join(",") : l.raw) + l.eol).join("");

      newLine: cells => ({ raw: "", eol: "\n", cells, edited: true }),
      insertAfter(doc, idx, line) {
        const prev = doc.lines[idx];
        line.eol = doc.eol;

        doc.lines.splice(idx + 1, 0, line);

      // 最后一行有内容的行(末尾换行留下的空行之前)
      lastContent(doc) { for (let k = doc.lines.length - 1; k >= 0; k--) if (doc.lines[k].edited || doc.lines[k].raw !== "") return k; return 0; },
      remove(doc, idx) {
        const [gone] = doc.lines.splice(idx, 1);
        if (gone && gone.eol === "" && idx > 0 && idx === doc.lines.length) doc.lines[idx - 1].eol = "";
      },
      setCell(line, k, v) {

    function parseEnum(text, name) {
      if (!text) return [];
      const at = text.search(new RegExp(`enum\\s+${name}\\b`));
      if (at < 0) return [];
      const open = text.indexOf("{", at);
      if (open < 0) return [];
      let close = open + 1, inStr = false;
      for (; close < text.length; close++) {
        const c = text[close];
        if (inStr) { if (c === "\\") close++; else if (c === '"') inStr = false; }
        else if (c === '"') inStr = true;
        else if (c === "}") break;
      }
      const out = [];
      let next = 0;
      for (const raw of text.slice(open + 1, close).split(/\r?\n/)) {
        const line = raw.replace(/\/\/.*$/, "").replace(/\/\*.*?\*\//g, "").replace(/\[[^\]]*\]/g, "").trim();
        for (const part of line.split(",")) {
          const [nm, val] = part.split("=").map(s => s.trim());
          if (!/^[\p{L}_][\p{L}\p{N}_]*$/u.test(nm || "")) continue;
          const v = val !== undefined && /^-?\d+$/.test(val) ? parseInt(val, 10) : next;
          out.push({ name: nm, value: v });
          next = v + 1;
        }
      }
      return out;
    }

    function parseClauses(sysText, dataText) {
      if (!sysText) return null;
      const t = stripCsComments(sysText);
      const consts = {}, ints = {};
      for (const m of t.matchAll(/const\s+string\s+(Clause\w+)\s*=\s*"([^"]+)"/g)) consts[m[1]] = m[2];
      for (const m of t.matchAll(/const\s+int\s+(\w+)\s*=\s*(-?\d+)\s*;/g)) ints[m[1]] = +m[2];
      const at = t.indexOf("void ApplyValues");
      if (at < 0) return null;
      const end = t.indexOf("private static", at + 20);
      const body = t.slice(at, end < 0 ? t.length : end);
      const num = x => /^-?\d+$/.test(x) ? +x : ints[x];
      const dt = stripCsComments(dataText);
      const clsAt = dt.indexOf("class ConstitutionClauses");
      const builtins = {};
      if (clsAt >= 0) for (const m of dt.slice(clsAt, dt.indexOf("Clone()", clsAt)).matchAll(/public\s+int\s+(\w+)\s*=\s*(-?\d+)\s*;/g)) builtins[m[1]] = +m[2];
      const list = [];
      for (const m of body.matchAll(/case\s+(Clause\w+)\s+when\s+(Enum|int)\.TryParse\(\s*value\s*,\s*out\s+(\w+)(?:\s+\w+)?\s*\)([\s\S]*?)break\s*;/g)) {
        const key = consts[m[1]];
        if (!key) continue;
        if (m[2] === "Enum") {
          const members = parseEnum(dataText, m[3]).map(x => x.name);
          if (!members.length) return null;
          list.push({ key, type: "enum", enumName: m[3], values: members, builtin: members[0] });
        } else {
          const cl = /Clamp\(\s*\w+\s*,\s*([\w-]+)\s*,\s*([\w-]+)\s*\)/.exec(m[4]);
          const min = cl ? num(cl[1]) : undefined, max = cl ? num(cl[2]) : undefined;
          if (!Number.isFinite(min) || !Number.isFinite(max)) return null;
          list.push({ key, type: "int", min, max, builtin: String(builtins[key] ?? 0) });
        }
      }
      if (!list.length) return null;
      const rows = /EditableRows\s*=\s*\{([\s\S]*?)\};/.exec(t);
      const order = rows ? [...rows[1].matchAll(/Clause\w+/g)].map(x => consts[x[0]]).filter(Boolean) : [];
      const pos = k => { const p = order.indexOf(k); return p < 0 ? 999 : p; };
      return list.sort((a, b) => pos(a.key) - pos(b.key));
    }

    // ================= 读写文件 =================
    async function loadFile(f) {

    function parseInto(f, st, text) {

    }

    // 保存前的整理：称谓表英文留空的用简体代替；名册检查逗号
    function beforeSave(f, st) {
      const notes = [];
      if (f.kind !== "csv") return notes;
      const head = st.csv.lines[0]?.cells || [];
      if (f.render === renderLocaleTable) {
        const czI = head.indexOf("cz"), enI = head.indexOf("en");
        let n = 0;
        if (czI >= 0 && enI >= 0) st.csv.lines.forEach((l, li) => {
          if (!CsvDoc.isData(l, li) || !l.edited) return;
          if (!(l.cells[enI] || "").trim() && (l.cells[czI] || "").trim()) { CsvDoc.setCell(l, enI, l.cells[czI]); n++; }
        });
        if (n) notes.push(`英文留空的 ${n} 条已用简体代替`);
      } else {
        const bad = st.csv.lines.some((l, li) => li > 0 && l.edited && l.cells.some(c => /[,\r\n]/.test(c)));
        if (bad) throw new Error("名册里有格子带英文逗号或换行，游戏按逗号分列会错位，请先改掉");
      }

    async function saveFile(id) {
