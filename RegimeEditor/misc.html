      if (!st.exists && !st.dirty) return { notes: [`${f.label}文件不存在、也没有改动，没有新建`], same: true, skipped: true };
      const notes = beforeSave(f, st);
      // 帝国律法：改过的罪名、条文写进语言文件(先核对、再写、写完读回来核对)，律法表里的后备名称同步成简体
      const loc = f.id === "laws" ? prepareLawLocales(st, notes) : {};
      const text = buildText(f, st);
      const same = st.exists && text === st.text && !Object.keys(loc).length;
      if (Object.keys(loc).length) {
        await writeLocalesChecked(loc);
        for (const k of Object.keys(st.locCur)) st.locOrig[k] = { ...st.locCur[k] };
      }
      await api.writeText(f.path, (st.bom ? "﻿" : "") + text);
      st.exists = true;
      st.dirty = false;
      parseInto(f, st, text);
      return { notes, same };
    }

    async function save(ids) {
      if (!api) return toast("只有桌面版才能保存", true);
      const done = [], notes = [];
      try {
        for (const id of ids) {
          const r = await saveFile(id);
          if (!r.skipped) done.push(BY_ID[id].label + (r.same ? "(没有改动)" : ""));
          notes.push(...r.notes);
        }
        if (!ids.length) toast("没有需要保存的改动");
        else if (!done.length) toast(notes.join("；"));
        else toast(`已保存 ${done.join("、")}，重启游戏后生效` + (notes.length ? `；${notes.join("；")}` : ""));
      } catch (e) { toast("保存失败：" + e.message, true); }
      renderNav();
      renderCurrent();
    }

    function markDirty(id = S.cur) {
      const st = S.files[id];
      if (st && !st.dirty) { st.dirty = true; renderNav(); }
    }

    // ================= 外框 =================
    function renderNav() {
      const nav = document.getElementById("fileNav");
      nav.innerHTML = FILES.map(f => {
        const st = S.files[f.id];
        const sub = !st ? "读取中" : st.error ? "读取失败" : !st.exists ? "没有文件" : "";
        return `<button type="button" data-f="${f.id}" class="${f.id === S.cur ? "active" : ""}" title="${esc(f.path)}">${ico(f.icon, "sm")}` +
          `<span class="${st && st.dirty ? "dirty" : ""}">${esc(f.label)}</span>${sub ? `<span class="navsub">${sub}</span>` : ""}</button>`;
      }).join("");
      nav.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
        S.cur = b.dataset.f;
        try { localStorage.setItem("misc.tab", S.cur); } catch { /* 无痕模式等 */ }
        renderNav();
        renderCurrent();
        document.getElementById("editor").scrollTop = 0;
      }));
    }

    function fileHead(f, st, extra = "") {
      return `<h2>${ico(f.icon, "lg")}${esc(f.label)}</h2>` +
        `<p class="hint head-path"><code>${esc(f.path)}</code>${st.exists ? "" : "　·　文件不存在，保存时新建"}${extra}</p>`;
    }

    function renderCurrent() {
      const panel = document.getElementById("editor");
      const f = BY_ID[S.cur], st = S.files[S.cur];
      if (!api) { panel.innerHTML = `<p class="muted">请用 启动桌面版.bat 打开，浏览器里无法读写模组文件。</p>`; return; }
      if (!st) { panel.innerHTML = `<p class="muted">读取中…</p>`; return; }
      if (st.error) {
        panel.innerHTML = fileHead(f, st) + `<p class="hint warn">读取失败：${esc(st.error)}</p><p class="hint">编辑器不敢改格式不对的文件，请先手动修好再点「重新读取当前文件」。</p>`;
        return;
      }
      try { f.render(panel, st, f); }
      catch (e) { panel.innerHTML = fileHead(f, st) + `<p class="hint warn">显示出错：${esc(e.message)}</p>`; console.error(e); }
    }

    function badRoot(panel, f, st, msg) {
      panel.innerHTML = fileHead(f, st) + `<p class="hint warn">${esc(msg)}，编辑器不敢改，请先手动修好。</p>`;
    }

    // 标签文字 + 灰色小字的 JSON 字段名，放同一行
    const lab = (text, fname) => `<span>${esc(text)}<span class="fname">${esc(fname)}</span></span>`;

    function optionHtml(value, label, selected) {
      return `<option value="${esc(value)}" ${selected ? "selected" : ""}>${esc(label)}</option>`;
    }

    // ================= 1. 宪法条款模板 =================
    const clauseName = c => cz(`constitution_clause_${c.key}`) || CLAUSE_ZH[c.key] || c.key;
    function valueName(c, v) {
      if (v === undefined || v === null || v === "") return "";
      if (c.type === "int") return c.key === "max_terms" ? (Number(v) === 0 ? "不限" : `最多 ${v} 届`) : `${v} 年`;
      return cz(`constitution_${c.key}_${v}`) || VALUE_ZH[v] || String(v);
    }
    const shortName = (c, v) => valueName(c, v).split(/[：:]/)[0];
    const ideoName = x => cz(`party_ideology_${x}`) || IDEO_ZH[x] || x;
    // 与 ConstitutionSystem.ApplyValues 一致：去空格；枚举按名字，整数按范围夹住；不认识的返回 undefined(游戏忽略)
    function clauseValue(c, raw) {
      if (raw === undefined) return undefined;
      const v = raw === null ? "" : String(raw).trim();
      if (c.type === "enum") return c.values.includes(v) ? v : undefined;
      if (!/^[+-]?\d+$/.test(v)) return undefined;
      return String(Math.min(c.max, Math.max(c.min, parseInt(v, 10))));
    }
    function applyLayer(eff, layer) {
      if (!isObj(layer)) return;
      for (const c of S.clauses) if (has(layer, c.key)) { const v = clauseValue(c, layer[c.key]); if (v !== undefined) eff[c.key] = v; }
    }
    function conEffective(d, ideo, { monarchy = false, oneParty = false, stop = "" } = {}) {
      const eff = Object.fromEntries(S.clauses.map(c => [c.key, c.builtin]));
      if (stop === "defaults") return eff;
      applyLayer(eff, d.defaults);
      if (stop === "ideologies") return eff;
      if (ideo && isObj(d.ideologies)) applyLayer(eff, d.ideologies[ideo]);
      if (stop === "monarchy") return eff;
      if (monarchy && ideo && isObj(d.monarchy)) applyLayer(eff, d.monarchy[ideo]);
      if (stop === "one_party") return eff;
      if (oneParty) applyLayer(eff, d.one_party);
      return eff;
    }
    function conProblems(d) {
      const out = [];
      const known = new Set(S.clauses.map(c => c.key));
      const scalar = v => v === null || typeof v !== "object";
      const checkLayer = (layer, where) => {
        if (layer === undefined || layer === null) return;
        if (!isObj(layer)) { out.push(`${where} 不是 { } 对象，游戏读这个文件会失败，整份按内置默认`); return; }
        for (const [k, v] of Object.entries(layer)) {
          if (!scalar(v)) { out.push(`${where} 里 ${k} 的值不是文字，游戏读这个文件会失败`); continue; }
          const c = S.clauses.find(x => x.key === k);
          if (!known.has(k)) out.push(`${where} 里的条款名 ${k} 游戏不认识，会忽略`);
          else if (clauseValue(c, v) === undefined) out.push(`${where} 里 ${clauseName(c)} 的值 ${JSON.stringify(v)} 游戏不认识，会忽略`);
        }
      };
      checkLayer(d.defaults, "默认主张");
      checkLayer(d.one_party, "一党制");
      for (const [sec, label] of [["ideologies", "各理念"], ["monarchy", "君主立宪"]]) {
        const s = d[sec];
        if (s === undefined || s === null) continue;
        if (!isObj(s)) { out.push(`${label}(${sec}) 不是 { } 对象，游戏读这个文件会失败`); continue; }
        for (const [ideo, layer] of Object.entries(s)) {
          if (!S.ideologies.includes(ideo)) out.push(`${label}里的理念 ${ideo} 代码里没有，这一条不起作用`);
          checkLayer(layer, `${label}·${ideoName(ideo)}`);
        }
      }
      const extra = Object.keys(d).filter(k => !["_comment", "defaults", "ideologies", "monarchy", "one_party"].includes(k));
      if (extra.length) out.push(`编辑器不认识的字段(保存时原样保留)：${extra.join("、")}`);
      return out;
    }
    function conLayerOf(d, sec, ideo) {
      if (sec === "defaults" || sec === "one_party") return isObj(d[sec]) ? d[sec] : null;
      return isObj(d[sec]) && isObj(d[sec][ideo]) ? d[sec][ideo] : null;
    }
    function conEnsure(d, sec, ideo) {
      if (!isObj(d[sec])) d[sec] = {};
      if (sec === "defaults" || sec === "one_party") return d[sec];
      if (!isObj(d[sec][ideo])) d[sec][ideo] = {};
      return d[sec][ideo];
    }
    function conSet(d, sec, ideo, key, value) {
      if (value === "") { const layer = conLayerOf(d, sec, ideo); if (layer && has(layer, key)) delete layer[key]; }
      else conEnsure(d, sec, ideo)[key] = value;
      markDirty("constitution");
    }

    // 一条条款的下拉框：第一项是"沿用上一层"，其余是方案(中文名)
    function clauseSelect(c, layer, baseLabel) {
      const raw = layer && has(layer, c.key) ? layer[c.key] : undefined;
      const valid = clauseValue(c, raw);
      const rawText = raw === undefined ? "" : String(raw ?? "");
      const vals = c.type === "enum" ? c.values : Array.from({ length: c.max - c.min + 1 }, (_, k) => String(c.min + k));
      let html = optionHtml("", baseLabel, raw === undefined);
      if (raw !== undefined && valid === undefined) html += optionHtml("\u0000keep", `${rawText}(游戏不认识，会忽略)`, true);
      const clamped = raw !== undefined && valid !== undefined && c.type === "int" && parseInt(rawText.trim(), 10) !== +valid;
      if (clamped) html += optionHtml("\u0000keep", `${rawText}(超出范围，按 ${valid} 算)`, true);
      const keepRaw = raw !== undefined && valid !== undefined && !clamped;
      html += vals.map(v => optionHtml(v, valueName(c, v), keepRaw && valid === v)).join("");
      return `<select data-c="${esc(c.key)}" class="${raw !== undefined ? "set" : ""}">${html}</select>`;
    }

    function clauseHint(c) {
      const h = cz(`constitution_${c.key}_hint`);
      return h ? h.replace(/^[^\n·　]*[\n　]/, "").trim() : "";
    }

    function renderConstitution(panel, st, f) {
      const d = st.data;
      if (!isObj(d)) return badRoot(panel, f, st, "最外层应该是 { } 对象");
      const ui = S.ui.con || (S.ui.con = { tab: "defaults", ideo: null, mode: "republic" });
      const problems = conProblems(d);
      const tabs = [["defaults", "默认主张"], ["ideologies", "各理念"], ["monarchy", "君主立宪"], ["one_party", "一党制"], ["preview", "汇总预览"]];
      panel.innerHTML = fileHead(f, st) +
        `<p class="hint">制宪会议起草正式宪法时，各合法政党按议席(没有议会按中央占比)替本党理念的主张投票，每条取得票最多的方案，任期按票数加权平均；没有政党或起草临时约法时直接用执政理念的主张。` +
        `一个理念的主张按 默认 → 理念 → 君主立宪(只限君主立宪国) → 一党制(只限一党制国) → 文化包里的宪法条款(在文化编辑器改) 依次覆盖，没写的条款沿用上一层。理念主张单一制的，军阀混战时会想统一全国。</p>` +
        (typeof d._comment === "string" ? `<details class="help"><summary>文件自带说明(_comment，保存时原样保留)</summary><p class="hint">${esc(d._comment)}</p></details>` : "") +
        `<details class="help"><summary>各条款的含义</summary><ol>${S.clauses.map(c => `<li>${esc(clauseName(c))}<span class="fname">${esc(c.key)}</span>` +
          `${clauseHint(c) ? `<div class="hint pre">${esc(clauseHint(c))}</div>` : ""}</li>`).join("")}</ol></details>` +
        (problems.length ? `<div class="note warn-box">${problems.map(p => `<div class="hint warn">${esc(p)}</div>`).join("")}</div>` : "") +
        `<div class="tabs" id="conTabs">${tabs.map(([k, t]) => `<button type="button" data-t="${k}" class="${ui.tab === k ? "active" : ""}">${t}</button>`).join("")}</div>` +
        `<div id="conBody"></div>`;
      panel.querySelectorAll("#conTabs button").forEach(b => b.addEventListener("click", () => { ui.tab = b.dataset.t; renderCurrent(); }));
      const body = panel.querySelector("#conBody");
      if (ui.tab === "defaults" || ui.tab === "one_party") conFlatLayer(body, d, ui.tab);
      else if (ui.tab === "preview") conPreview(body, d, ui);
      else conIdeoLayer(body, d, ui.tab, ui);
    }

    function clauseGrid(c, select) {
      return `<label class="field">${lab(clauseName(c), c.key)}${select}</label>`;
    }

    function conFlatLayer(body, d, sec) {
      const layer = conLayerOf(d, sec);
      const isDef = sec === "defaults";
      body.innerHTML = `<p class="hint">${isDef
        ? "所有理念共同的起点，各理念只写和这里不同的条款。这里也没写的，用游戏内置初值。"
        : "一党制(含民主集中制)国家在各理念的主张之后再叠加这一层：这里写了的条款，所有理念都改成这样。"}</p>` +
        `<div class="grid three">${S.clauses.map(c => clauseGrid(c, clauseSelect(c, layer,
          isDef ? `不写(游戏初值：${valueName(c, c.builtin)})` : "不改(沿用各理念的主张)"))).join("")}</div>`;
      body.querySelectorAll("select[data-c]").forEach(s => s.addEventListener("change", () => {
        if (s.value === "\u0000keep") return;
        conSet(d, sec, null, s.dataset.c, s.value);
        renderCurrent();
      }));
    }

    function conIdeoLayer(body, d, sec, ui) {
      const secObj = isObj(d[sec]) ? d[sec] : {};
      const extra = Object.keys(secObj).filter(k => !S.ideologies.includes(k));
      const names = [...S.ideologies, ...extra];
      if (!ui.ideo || !names.includes(ui.ideo)) ui.ideo = Object.keys(secObj)[0] || names[0];
      const x = ui.ideo;
      const count = k => has(secObj, k) ? (isObj(secObj[k]) ? Object.keys(secObj[k]).length : -1) : null;
      const firstAncient = S.ideologies.indexOf("Confucianism");
      const list = names.map((k, n) => {
        const cnt = count(k);
        const sub = cnt === null ? "" : cnt < 0 ? "格式不对" : cnt ? `改 ${cnt} 条` : "空条目";
        return (n === firstAncient ? `<div class="grp-title">古代理念</div>` : "") + (n === S.ideologies.length && extra.length ? `<div class="grp-title">代码里没有的</div>` : "") +
          `<div class="item ${k === x ? "active" : ""} ${S.ideologies.includes(k) ? "" : "bad"}" data-i="${esc(k)}">${esc(ideoName(k))}<span class="sub ${cnt ? "has" : ""}">${sub}</span></div>`;
      }).join("");
      const layer = conLayerOf(d, sec, x);
      const base = sec === "ideologies" ? conEffective(d, x, { stop: "ideologies" }) : conEffective(d, x, { stop: "monarchy" });
      const baseText = sec === "ideologies" ? "沿用默认" : "沿用理念主张";
      const donors = Object.keys(secObj).filter(k => k !== x && isObj(secObj[k]) && Object.keys(secObj[k]).length);
      body.innerHTML = `<p class="hint">${sec === "ideologies"
        ? "每个理念只写和「默认主张」不同的条款。没有条目的理念完全按默认。"
        : "君主立宪国(开了议会或已立宪的君主国，穿越政权除外)在理念主张之后再叠加这一层，只写要改的条款。"}</p>` +
        `<div class="sub-layout"><div class="sub-list">${list}</div><div>` +
        `<h3>${esc(ideoName(x))}<span class="fname">${esc(x)}</span></h3>` +
        (S.ideologies.includes(x) ? "" : `<p class="hint warn">代码里没有这个理念(PartyIdeology 里找不到)，这一条不起作用。</p>`) +
        (has(secObj, x) && !isObj(secObj[x]) ? `<p class="hint warn">这一条不是 { } 对象：${esc(JSON.stringify(secObj[x]))}；在下面改任一条款会换成对象。</p>` : "") +
        `<div class="grid three">${S.clauses.map(c => clauseGrid(c, clauseSelect(c, layer, `${baseText}：${valueName(c, base[c.key])}`))).join("")}</div>` +
        `<div class="toolbar section" style="margin-top:12px">` +
        (donors.length ? `<label class="field" style="min-width:240px">照抄另一个理念的写法<select id="conCopy">${optionHtml("", "选一个理念…", true)}${donors.map(k => optionHtml(k, ideoName(k), false)).join("")}</select></label>` : "") +
        (has(secObj, x) ? `<button class="danger small" id="conDel">删除这个理念的条目(全部沿用上一层)</button>` : "") +
        `</div></div></div>`;
      body.querySelectorAll(".sub-list .item").forEach(it => it.addEventListener("click", () => { ui.ideo = it.dataset.i; renderCurrent(); }));
      body.querySelectorAll("select[data-c]").forEach(s => s.addEventListener("change", () => {
        if (s.value === "\u0000keep") return;
        conSet(d, sec, x, s.dataset.c, s.value);
        renderCurrent();
      }));
      body.querySelector("#conCopy")?.addEventListener("change", e => {
        const from = e.target.value;
        if (!from) return;
        const target = conEnsure(d, sec, x);
        for (const k of Object.keys(target)) delete target[k];
        Object.assign(target, structuredClone(secObj[from]));
        markDirty("constitution");
        toast(`已照抄「${ideoName(from)}」的 ${Object.keys(target).length} 条主张`);
        renderCurrent();
      });
      body.querySelector("#conDel")?.addEventListener("click", () => {
        if (!confirm(`删除「${ideoName(x)}」在${sec === "ideologies" ? "各理念" : "君主立宪"}里的条目？`)) return;
        delete d[sec][x];
        markDirty("constitution");
        renderCurrent();
      });
    }

    function conPreview(body, d, ui) {
      const modes = [["republic", "普通(多党)"], ["monarchy", "君主立宪"], ["one_party", "一党制"], ["both", "君主立宪 + 一党制"]];
      const monarchy = ui.mode === "monarchy" || ui.mode === "both", oneParty = ui.mode === "one_party" || ui.mode === "both";
      const listed = uniq([...Object.keys(isObj(d.ideologies) ? d.ideologies : {}), ...Object.keys(isObj(d.monarchy) ? d.monarchy : {})]);
      const rows = [...S.ideologies.filter(k => listed.includes(k)), ...listed.filter(k => !S.ideologies.includes(k))];
      const rest = conEffective(d, null, { monarchy, oneParty });
      const row = (label, eff, isRest) => `<tr><th>${esc(label)}</th>${S.clauses.map(c =>
        `<td class="${!isRest && eff[c.key] !== rest[c.key] ? "diff" : ""}" title="${esc(valueName(c, eff[c.key]))}">${esc(shortName(c, eff[c.key]))}</td>`).join("")}</tr>`;
      body.innerHTML = `<div class="toolbar" style="margin-bottom:8px"><label class="field" style="min-width:220px">国家类型<select id="conMode">${modes.map(([k, t]) => optionHtml(k, t, ui.mode === k)).join("")}</select></label>` +
        `<span class="hint">各理念最终主张的条款(不含文化包)。金色 = 与没有条目的理念不同。</span></div>` +
        `<div class="table-wrap free"><table class="sheet preview"><thead><tr><th>理念</th>${S.clauses.map(c => `<th>${esc(clauseName(c))}</th>`).join("")}</tr></thead><tbody>` +
        rows.map(k => row(ideoName(k), conEffective(d, k, { monarchy, oneParty }), false)).join("") +
        row("其余理念(没有条目)", rest, true) + `</tbody></table></div>`;
      body.querySelector("#conMode").addEventListener("change", e => { ui.mode = e.target.value; renderCurrent(); });
    }

    // ================= 2. 归化民参数 =================
    // 说明取自 Scripts/Regimes/Configs/README.md「归化民配置」
    const NAT_GROUPS = [
      ["规模与预算", [
        ["max_share", "受训人口上限", "一座城进台账的人至多占可入流程人口的这个比例，其余留在本地社会"],
        ["budget_share", "年度花费上限", "一年至多花可支配资金的这个比例"]]],
      ["收容、检疫、教育的人手", [
        ["registry_per_cadre", "每名干部每年登记", "一名干部每年能收容登记的人数"],
        ["quarantine_per_nurse", "每名护理同时检疫", "一名护理同时能检疫安置的人数"],
        ["school_per_teacher", "每名教师同时教", "一名教师同时能教的人数"],
        ["base_registry", "元老亲抓：登记", "人手为零时每年也能登记这么多"],
        ["base_quarantine", "元老亲抓：检疫", "人手为零时也能检疫这么多"],
        ["base_school", "元老亲抓：教育", "人手为零时也能教这么多"]]],
      ["花费与学制", [
        ["cost_registry", "登记每人花费", "收容登记一人的花费"],
        ["cost_quarantine", "检疫每人花费", "检疫安置一人的花费"],
        ["cost_school", "上学每人每年花费", "学费按年交，交不起的停在检疫营"],
        ["school_years", "基础教育年数", "上几年学才结业"]]],
      ["结业分岗", [
        ["worker_floor", "至少去做工的比例", "结业的人至少这么多去做工"],
        ["focus_share", "培养重点优先比例", "定了培养重点时，分配时这么多先给重点"],
        ["retrain_share", "工人每年转岗比例", "岗位还缺人时，每年工人里转岗的比例"],
        ["soldier_reserve", "军人预备比例", "军人岗位按伏波军满编多留的预备"]]],
      ["干部", [
        ["cadre_base", "每城干部底数", "一座城要的干部：底数加每多少人一名"],
        ["cadre_per_people", "每多少人一名干部", "一座城要的干部：底数加每多少人一名"],
        ["cadre_min_yield", "没有干部时的收成", "一个干部都没有时赋税、征兵能收上来几成"],
        ["dispatch_share", "富余干部每年调走上限", "富余的干部每年至多调走这么多"]]],
      ["工厂", [
        ["workers_per_factory", "每座工厂要的工人", "按这个数算工厂配员"],
        ["staffing_floor", "配员不足时工业加成保底", "工人不够时工业加成至少保留这么多"]]],
      ["同化", [
        ["culture_shift", "已归化者每年改文化比例", "已归化的人每年改成澳洲人文化的比例"],
        ["assimilation", "城市文化占比推动", "按已归化人口占比推动城市文化"]]],
      ["降临带来的人分岗", [
        ["landing_worker", "工人", ""], ["landing_soldier", "军人", ""], ["landing_cadre", "干部", ""], ["landing_teacher", "教师", ""], ["landing_nurse", "护理", ""]], "landing"],
      ["旧档澳洲人文化的人分岗", [
        ["migrate_worker", "工人", ""], ["migrate_soldier", "军人", ""], ["migrate_cadre", "干部", ""], ["migrate_teacher", "教师", ""], ["migrate_nurse", "护理", ""]], "migrate"]
    ];

    function renderNaturalization(panel, st, f) {
      const d = st.data;
      if (!isObj(d)) return badRoot(panel, f, st, "最外层应该是 { } 对象");
      const def = S.natDefaults;
      const known = new Set(NAT_GROUPS.flatMap(g => g[1].map(x => x[0])));
      const groups = [...NAT_GROUPS];
      const codeOnly = Object.keys(def).filter(k => !known.has(k));
      if (codeOnly.length) groups.push(["代码里新加的参数", codeOnly.map(k => [k, k, ""])]);
      const extra = Object.keys(d).filter(k => !known.has(k) && !has(def, k));
      const field = ([k, label, hint]) => {
        const v = has(d, k) ? d[k] : undefined;
        const bad = v !== undefined && typeof v !== "number";
        return `<div class="natf" data-k="${esc(k)}"><label class="field"><span>${esc(label)}<span class="fname">${esc(k)}</span></span>` +
          `<span class="field-row"><input type="number" step="any" value="${typeof v === "number" ? v : ""}" placeholder="${esc(def[k] ?? "")}">` +
          `<button type="button" class="small" data-reset title="改回代码默认值">恢复默认</button></span>` +
          (bad ? `<span class="hint warn">文件里的值 ${esc(JSON.stringify(v))} 不是数字</span>` : "") +
          `<span class="hint">${hint ? esc(hint) + "；" : ""}<span class="def"></span></span></label></div>`;
      };
      panel.innerHTML = fileHead(f, st) +
        `<p class="hint">穿越政权的归化流程：收容登记 → 检疫安置 → 基础教育 → 分到岗位，一年走一步。只给城里已有的人贴标签，不产生人。比例都是 0~1 的小数。留空的参数按代码默认值。读取失败时游戏日志记 [归化]，整份按默认。</p>` +
        `<div class="toolbar" style="margin-bottom:6px"><button class="small" id="natResetAll">全部恢复默认</button></div>` +
        (extra.length ? `<p class="hint warn">编辑器和代码都不认识的字段(保存时原样保留)：${esc(extra.join("、"))}</p>` : "") +
        groups.map(([title, fields, sum], gi) => `<h3>${esc(title)}<button type="button" class="small" data-reset-group="${gi}">本组恢复默认</button></h3>` +
          (sum ? `<div class="sum" data-sum="${sum}"></div>` : "") +
          `<div class="grid ${sum ? "five" : fields.length > 4 ? "three" : "two"}">${fields.map(field).join("")}</div>`).join("");
      const refresh = box => {
        const k = box.dataset.k, v = has(d, k) ? d[k] : undefined;
        const dv = def[k];
        const changed = typeof v === "number" && dv !== undefined && v !== dv;
        box.classList.toggle("changed", changed);
        box.querySelector(".def").innerHTML = dv === undefined ? "代码里没有这个参数"
          : `代码默认 <b>${esc(dv)}</b>${v === undefined ? "，文件里没写，按默认" : changed ? "，已改" : ""}`;
        box.querySelector("[data-reset]").disabled = !changed && !(v !== undefined && typeof v !== "number");
      };
      const refreshSums = () => panel.querySelectorAll("[data-sum]").forEach(el => {
        const p = el.dataset.sum;
        const keys = Object.keys(def).filter(k => k.startsWith(p + "_"));
        const total = keys.reduce((s, k) => s + (typeof d[k] === "number" ? d[k] : def[k] || 0), 0);
        const ok = Math.abs(total - 1) < 0.005;
        el.className = "sum " + (ok ? "ok" : "bad");
        el.textContent = `合计 ${+total.toFixed(4)}` + (ok ? "，正好分完" : "，应当正好是 1(多了多分、少了少分)");
      });
      const setVal = (box, value) => {
        const k = box.dataset.k;
        if (value === undefined) delete d[k]; else d[k] = value;
        box.querySelector("input").value = value === undefined ? "" : value;
        box.querySelector("input").classList.remove("bad");
        refresh(box);
      };
      panel.querySelectorAll(".natf").forEach(box => {
        refresh(box);
        const input = box.querySelector("input");
        input.addEventListener("input", () => {
          const t = input.value.trim();
          if (t === "") { delete d[box.dataset.k]; input.classList.remove("bad"); }
          else {
            const n = Number(t);
            if (!Number.isFinite(n)) { input.classList.add("bad"); return; }
            input.classList.remove("bad");
            d[box.dataset.k] = n;
          }
          markDirty("naturalization");
          refresh(box);
          refreshSums();
        });
        box.querySelector("[data-reset]").addEventListener("click", () => {
          const dv = def[box.dataset.k];
          if (dv === undefined) return;
          setVal(box, dv);
          markDirty("naturalization");
          refreshSums();
        });
      });
      const resetBoxes = boxes => {
        let n = 0;
        boxes.forEach(box => {
          const k = box.dataset.k, dv = def[k];
          if (dv === undefined || !has(d, k) || d[k] === dv) return;
          setVal(box, dv);
          n++;
        });
        if (n) { markDirty("naturalization"); refreshSums(); }
        toast(n ? `已恢复 ${n} 项默认值` : "这些参数本来就是默认值");
      };
      panel.querySelectorAll("[data-reset-group]").forEach(b => b.addEventListener("click", () => {
        const fields = groups[+b.dataset.resetGroup][1].map(x => x[0]);
        resetBoxes([...panel.querySelectorAll(".natf")].filter(box => fields.includes(box.dataset.k)));
      }));
      panel.querySelector("#natResetAll").addEventListener("click", () => resetBoxes([...panel.querySelectorAll(".natf")]));
      refreshSums();
    }

    // ================= 3. 元老名册 =================
    const SEN_COLS = [
      ["seat", "席次", "只是编号；游戏按行的先后对应席位", "56px"],
      ["name", "姓名", "复姓、带·的外国名能自动拆出姓和名；空着游戏会跳过这一行", "96px"],
      ["sex", "性别", "", "64px"],
      ["group", "分组", "临时执委会的分组，名册窗口显示", "120px"],
      ["landing_post", "降临时职务", "第 1 阶段(降临·临时执委会)；空则用第一届执委会职务", ""],
      ["early_post", "第一届执委会职务", "第 2 阶段；空则用现任职务", ""],
      ["post", "现任职务", "共同纲领以后；空则用第一届执委会职务", ""],
      ["cabinet_post", "内阁职务", "第 5 阶段元老院内阁起；空则用现任职务", ""]
    ];

    function senRows(doc) {
      const rows = [];
      let roster = 0;
      doc.lines.forEach((l, li) => {
        if (!CsvDoc.isData(l, li)) return;
        // 与 TransmigrantSystem.Roster 一致：不足 7 格或姓名为空的行跳过，后面的行号前移
        const valid = l.cells.length >= 7 && (l.cells[1] || "").trim() !== "";
        rows.push({ l, li, valid, roster: valid ? roster++ : -1 });
      });
      return rows;
    }

    function renderSenators(panel, st, f) {
      const doc = st.csv;
      const ui = S.ui.sen || (S.ui.sen = { q: "", group: "" });
      const header = doc.lines[0]?.cells || [];
      const ncol = Math.max(SEN_COLS.length, header.length);
      const rows = senRows(doc);
      const validCount = rows.filter(r => r.valid).length;
      const groups = uniq(rows.map(r => (r.l.cells[3] || "").trim())).sort();
      const headerOk = SEN_COLS.every(([k], i) => header[i] === k);
      panel.innerHTML = fileHead(f, st) +
        `<p class="hint">穿越政权元老院共 ${S.seatCount} 席，名册里的人按行的先后坐进第 1、2、3……席，名册以外的席位自动起名。前 ${S.coreRoster} 行是执委会核心人物，选举与讣告优先。` +
        `各阶段显示的职务：降临 → 降临时职务；第一届执委会 → 第一届执委会职务；共同纲领、大宋澳洲行在 → 现任职务；元老院内阁起 → 内阁职务(空则用现任职务)。</p>` +
        `<p class="hint warn">存档里按行号记元老：删行、在中间插行会让旧存档里后面的元老对应错人。新元老请加在末尾。游戏按英文逗号分列，格子里不能有英文逗号。</p>` +
        (headerOk ? "" : `<p class="hint warn">表头和预期(${SEN_COLS.map(c => c[0]).join(",")})不一样；游戏只按列的位置读，这里也按位置显示。</p>`) +
        `<div class="toolbar" style="margin-bottom:8px"><input id="senQ" placeholder="搜索姓名、分组、职务…" style="max-width:240px" value="${esc(ui.q)}">` +
        `<select id="senGroup" style="max-width:180px">${optionHtml("", "全部分组", !ui.group)}${groups.map(g => optionHtml(g, g || "(未分组)", ui.group === g)).join("")}</select>` +
        `<button class="primary small" id="senAdd">${ico("iconShovelPlus", "sm")}在末尾加一位元老</button>` +
        `<span class="hint">名册 ${validCount} 人${validCount > S.seatCount ? `，超过 ${S.seatCount} 席的不会用到` : ""}${rows.length > validCount ? `，${rows.length - validCount} 行会被跳过` : ""}</span></div>` +
        `<datalist id="dlSenGroups">${groups.filter(Boolean).map(g => `<option value="${esc(g)}">`).join("")}</datalist>` +
        `<div class="table-wrap"><table class="sheet" id="senTable"><colgroup><col style="width:44px">` +
        Array.from({ length: ncol }, (_, i) => `<col style="width:${SEN_COLS[i]?.[3] || "auto"}">`).join("") + `<col style="width:96px"></colgroup>` +
        `<thead><tr><th title="游戏里的名册行号(存档记的是它)">行</th>` +
        Array.from({ length: ncol }, (_, i) => `<th title="${esc(SEN_COLS[i]?.[2] || "")}">${esc(SEN_COLS[i]?.[1] || header[i] || `第 ${i + 1} 列`)}<span class="fname">${esc(header[i] || "")}</span></th>`).join("") +
        `<th></th></tr></thead><tbody></tbody></table></div>`;
      const tbody = panel.querySelector("#senTable tbody");
      const draw = () => {
        const q = ui.q.trim();
        const shown = senRows(doc).filter(r => (!ui.group || (r.l.cells[3] || "").trim() === ui.group) && (!q || r.l.cells.some(c => String(c).includes(q))));
        tbody.innerHTML = shown.map(r => {
          const cells = Array.from({ length: ncol }, (_, i) => {
            const v = r.l.cells[i] ?? "";
            if (i === 2) {
              const opts = [["M", "男"], ["F", "女"]];
              if (!["M", "F"].includes(v.trim())) opts.push([v, v ? `${v}(按男)` : "(空，按男)"]);
              return `<td><select data-c="2">${opts.map(([o, t]) => optionHtml(o, t, v.trim() === o || (v === o))).join("")}</select></td>`;
            }
            return `<td><input data-c="${i}" value="${esc(v)}" ${i === 3 ? `list="dlSenGroups"` : ""} class="${i === 1 && !v.trim() ? "bad" : ""}"></td>`;
          }).join("");
          return `<tr data-li="${r.li}" class="${r.valid ? "" : "skip"} ${r.valid && r.roster < S.coreRoster ? "core" : ""}">` +
            `<td class="rn" title="${r.valid ? `第 ${r.roster + 1} 席` : "游戏会跳过这一行(姓名为空或不足 7 列)"}">${r.valid ? r.roster + 1 : "跳过"}</td>${cells}` +
            `<td class="act"><button class="small" data-act="copy" title="照这一行在末尾加一位">复制</button> <button class="small danger" data-act="del" title="删除这一行">×</button></td></tr>`;
        }).join("") || `<tr><td colspan="${ncol + 2}" class="txt muted">没有符合条件的元老</td></tr>`;
      };
      draw();
      const lineOf = el => doc.lines[+el.closest("tr").dataset.li];
      tbody.addEventListener("input", e => {
        const el = e.target;
        if (!el.dataset.c) return;
        let v = el.value;
        if (/[,\r\n]/.test(v)) {
          v = v.replace(/,/g, "，").replace(/[\r\n]/g, "");
          el.value = v;
          toast("名册按英文逗号分列，已换成中文逗号");
        }
        if (CsvDoc.setCell(lineOf(el), +el.dataset.c, v)) markDirty("senators");
        if (+el.dataset.c === 1) el.classList.toggle("bad", !v.trim());
      });
      // 改了姓名：只更新行号列(姓名为空的行游戏会跳过，后面的行号前移)，不重绘，免得 Tab 到下一格时丢焦点
      const renumber = () => {
        const map = new Map(senRows(doc).map(r => [r.li, r]));
        tbody.querySelectorAll("tr[data-li]").forEach(tr => {
          const r = map.get(+tr.dataset.li);
          if (!r) return;
          tr.classList.toggle("skip", !r.valid);
          tr.classList.toggle("core", r.valid && r.roster < S.coreRoster);
          const td = tr.querySelector(".rn");
          td.textContent = r.valid ? r.roster + 1 : "跳过";
          td.title = r.valid ? `第 ${r.roster + 1} 席` : "游戏会跳过这一行(姓名为空或不足 7 列)";
        });
      };
      tbody.addEventListener("change", e => { if (+e.target.dataset.c === 1) renumber(); });
      const maxSeat = () => Math.max(0, ...senRows(doc).map(r => parseInt(r.l.cells[0], 10)).filter(Number.isFinite));
      const append = cells => {
        CsvDoc.insertAfter(doc, CsvDoc.lastContent(doc), CsvDoc.newLine(cells));
        markDirty("senators");
        ui.q = ""; panel.querySelector("#senQ").value = "";
        draw();
        const wrap = panel.querySelector(".table-wrap");
        wrap.scrollTop = wrap.scrollHeight;
        const inputs = tbody.querySelectorAll("tr:last-child input[data-c='1']");
        inputs[0]?.focus();
      };
      tbody.addEventListener("click", e => {
        const b = e.target.closest("button[data-act]");
        if (!b) return;
        const tr = b.closest("tr"), li = +tr.dataset.li, line = doc.lines[li];
        if (b.dataset.act === "copy") {
          const cells = Array.from({ length: Math.max(ncol, line.cells.length) }, (_, i) => line.cells[i] ?? "");
          cells[0] = String(maxSeat() + 1);
          cells[1] = "";
          if (ui.group && ui.group !== (cells[3] || "").trim()) ui.group = "";
          append(cells);
          toast("已照这一行加在末尾，填上姓名即可");
        } else {
          const later = senRows(doc).some(r => r.li > li && r.valid);
          if (!confirm(`删除「${line.cells[1] || "(无名)"}」这一行？` + (later ? "\n后面的元老行号都会前移一位，旧存档里会对应错人。" : ""))) return;
          CsvDoc.remove(doc, li);
          markDirty("senators");
          renderCurrent();
        }
      });
      panel.querySelector("#senAdd").addEventListener("click", () => {
        const last = senRows(doc).pop();
        const cells = Array.from({ length: ncol }, () => "");
        cells[0] = String(maxSeat() + 1);
        cells[2] = "M";
        cells[3] = ui.group || (last ? (last.l.cells[3] || "") : "");
        if (ui.group && ui.group !== cells[3]) ui.group = "";
        append(cells);
      });
      panel.querySelector("#senQ").addEventListener("input", e => { ui.q = e.target.value; draw(); });
      panel.querySelector("#senGroup").addEventListener("change", e => { ui.group = e.target.value; draw(); });
    }

    // ================= 4. 帝国律法 =================
    // 罪名、条文在游戏里取自语言文件(law_name_罪名、law_desc_罪名，cz 简体、ch 繁体、en 英文)；
    // 律法表里的 Name、Description 只在语言文件缺键时顶用(EmpireLawSystem.GetLawName / GetLawDescription)
    const LANGS = [["cz", "简体中文"], ["ch", "繁体中文"], ["en", "English"]];
    function lawsList(data) {
      if (Array.isArray(data)) return data;
      if (isObj(data) && Array.isArray(data.Laws)) return data.Laws;
      return null;
    }
    // Newtonsoft 读枚举：名字或数字都行
    const enumName = (list, v) => typeof v === "number" ? (list.find(m => m.value === v)?.name ?? null) : (list.some(m => m.name === v) ? v : null);
    const lawTypeOf = l => !isObj(l) ? null : S.lawTypes.length ? enumName(S.lawTypes, l.Type) : (typeof l.Type === "string" && l.Type ? l.Type : null);
    const lawKey = (kind, t) => `law_${kind}_${t}`;
    const shortText = (s, n = 24) => { s = String(s ?? ""); return s.length > n ? s.slice(0, n) + "…" : s; };
    // 罪名的显示名：语言文件(含本页还没保存的修改)；没有返回空串
    function lawLocName(t) {
      if (!t) return "";
      const k = lawKey("name", t);
      return S.files.laws?.locCur?.[k]?.cz || cz(k) || "";
    }
    const lawDisplayName = t => lawLocName(t) || t;
    const pName = p => cz(`punishment_${p}`) || String(p);

    async function loadLawLocales(st) {
      st.locOrig = {}; st.locCur = {}; st.locAuto = {}; st.locError = "";
      if (typeof api.readLocales !== "function") { st.locError = "这个版本的编辑器不能读语言文件"; return; }
      const types = uniq([...S.lawTypes.map(t => t.name), ...(lawsList(st.data) || []).map(lawTypeOf)]);
      const keys = types.flatMap(t => [lawKey("name", t), lawKey("desc", t)]);
      if (!keys.length) return;
      try {
        const r = await api.readLocales(keys);
        for (const k of keys) {
          const v = { cz: String(r?.[k]?.cz ?? ""), ch: String(r?.[k]?.ch ?? ""), en: String(r?.[k]?.en ?? "") };
          st.locOrig[k] = v;
          st.locCur[k] = { ...v };
        }
      } catch (e) { st.locError = e?.message || String(e); }
    }
    function locEntry(st, k) {
      if (!st.locCur[k]) { st.locCur[k] = { cz: "", ch: "", en: "" }; st.locOrig[k] = { cz: "", ch: "", en: "" }; }
      return st.locCur[k];
    }
    const locEdited = (st, k) => !!st.locCur?.[k] && LANGS.some(([l]) => (st.locCur[k][l] ?? "") !== (st.locOrig[k]?.[l] ?? ""));

    // 改一种语言；简繁互相自动补(同称谓表)：繁体为空、仍是上次自动补的、或正好是旧简体转出来的(且没手改过)就跟着简体改
    function locInput(st, k, lang, v) {
      const cur = locEntry(st, k);
      const before = cur[lang];
      cur[lang] = v;
      const a = st.locAuto[k] || (st.locAuto[k] = {});
      const filled = {};
      if (!zhOK()) return filled;
      if (lang === "cz") {
        if (!a.manualCh && (cur.ch === "" || cur.ch === a.ch || cur.ch === zhToTrad(before))) {
          const t = v ? zhToTrad(v) : "";
          cur.ch = t; a.ch = t; filled.ch = t;
        }
        a.manualCz = v !== "" && v !== a.cz;
      } else if (lang === "ch") {
        a.manualCh = v !== "";
        if (!a.manualCz && (cur.cz === "" || cur.cz === a.cz)) {
          const t = v ? zhToSimp(v) : "";
          cur.cz = t; a.cz = t; filled.cz = t;
        }
      }
      return filled;
    }

    // 保存「帝国律法」前：改过的名称、条文补齐(繁体留空按简体转换，英文留空用简体)，律法表里对应的 Name / Description 跟着改成简体。
    // 返回要写进语言文件的 { 键: { 语言: 值 } }(只含真改了的语言)
    function prepareLawLocales(st, notes) {
      const entries = {};
      if (!st.locCur) return entries;
      const changed = Object.keys(st.locCur).filter(k => locEdited(st, k));
      let enN = 0, chN = 0;
      for (const k of changed) {
        const v = st.locCur[k];
        if (k.startsWith("law_name_") && !v.cz.trim()) throw new Error(`${k} 的简体名称是空的，游戏里会显示成空白，请先填上`);
        if (v.cz.trim()) {
          if (!v.ch.trim()) { v.ch = zhOK() ? zhToTrad(v.cz) : v.cz; chN++; }
          if (!v.en.trim()) { v.en = v.cz; enN++; }
        }
        const e = {};
        for (const [l] of LANGS) if ((v[l] ?? "") !== (st.locOrig[k]?.[l] ?? "")) e[l] = v[l];
        if (Object.keys(e).length) entries[k] = e;
      }
      for (const law of lawsList(st.data) || []) {
        const t = lawTypeOf(law);
        if (!t) continue;
        for (const [kind, field] of [["name", "Name"], ["desc", "Description"]]) {
          const k = lawKey(kind, t);
          if (changed.includes(k) && law[field] !== st.locCur[k].cz) law[field] = st.locCur[k].cz;
        }
      }
      const n = Object.keys(entries).length;
      if (n) notes.push(`语言文件写入 ${n} 条名称、条文`);
      if (chN) notes.push(`${chN} 处繁体留空，已按简体自动转换`);
      if (enN) notes.push(`${enN} 处英文留空，已先用简体代替`);
      return entries;
    }

    const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    // 写语言文件：先照 writeLocales 的办法核对三份文件(标准 JSON、要改的键各只出现一次，免得改了一处游戏读的却是另一处)，写完再读回来核对
    async function writeLocalesChecked(entries) {
      const keys = Object.keys(entries);
      if (!keys.length) return;
      if (typeof api.writeLocales !== "function") throw new Error("这个版本的编辑器不能写语言文件");
      for (const [lang] of LANGS) {
        const r = await api.readText(`Locales/${lang}.json`);
        if (!r || !r.exists) throw new Error(`找不到 Locales/${lang}.json，没有写语言文件`);
        const text = String(r.text ?? "").replace(/^﻿/, "");
        try { JSON.parse(text); } catch (e) { throw new Error(`Locales/${lang}.json 不是标准 JSON(${e.message})，为免写坏没有写语言文件`); }
        for (const k of keys) {
          if (entries[k][lang] === undefined) continue;
          const n = (text.match(new RegExp(`"${escRe(k)}"\\s*:\\s*"(?:[^"\\\\]|\\\\.)*"`, "g")) || []).length;
          if (n > 1) throw new Error(`Locales/${lang}.json 里 ${k} 出现了 ${n} 次，请先手动删掉多余的`);
        }
      }
      await api.writeLocales(entries);
      const back = await api.readLocales(keys);
      const bad = keys.filter(k => LANGS.some(([l]) => entries[k][l] !== undefined && String(back?.[k]?.[l] ?? "") !== entries[k][l]));
      if (bad.length) throw new Error(`语言文件写入后核对不上：${bad.join("、")}`);
    }

    function lawProblems(list, law, idx) {
      const out = [];
      if (!isObj(law)) return ["这一条不是 { } 对象，游戏读到这一条会跳过"];
      if (S.lawTypes.length && enumName(S.lawTypes, law.Type) === null)
        out.push(`罪名 ${JSON.stringify(law.Type)} 在代码(LawType)里没有，游戏会跳过这一条`);
      else if (S.lawTypes.length) {
        const first = list.findIndex(o => isObj(o) && enumName(S.lawTypes, o.Type) === enumName(S.lawTypes, law.Type) && o.Type !== undefined);
        if (first >= 0 && first < idx) out.push("同一罪名前面已经有一条，游戏只认第一条");
      }
      if (law.Category !== undefined && S.lawCats.length && enumName(S.lawCats, law.Category) === null) out.push(`类别 ${JSON.stringify(law.Category)} 在代码里没有，游戏会跳过这一条`);
      const pun = Array.isArray(law.Punishments) ? law.Punishments : [];
      const badPun = pun.filter(p => enumName(S.punish, p) === null);
      if (badPun.length) out.push(`刑罚 ${badPun.map(p => JSON.stringify(p)).join("、")} 在代码里没有，游戏会跳过这一条`);
      if (law.AffectDescendants === true && !pun.some(p => enumName(S.punish, p) === "剥夺官职")) out.push("勾了「株连子孙」，但刑罚里没有「剥夺官职」，这一项不起作用");
      const extra = Object.keys(law).filter(k => !["Type", "Category", "Name", "Description", "IsForbidden", "AffectDescendants", "Punishments", "Note"].includes(k));
      if (extra.length) out.push(`编辑器不认识的字段(保存时原样保留)：${extra.join("、")}`);
      return out;
    }

    // 现行刑罚：与 EmpireLawSystem 的 OrderedPunishments / Adapt / AdaptPunishments 一致
    const LETHAL = new Set(["死刑", "夷三族"]);
    function orderedPun(list) {
      const out = uniq(list.filter(p => !LETHAL.has(p)));
      if (list.includes("夷三族")) out.push("夷三族");
      else if (list.includes("死刑")) out.push("死刑");
      return out;
    }
    // rg：{ era 科技时代档次, modern 现代政体, abolish 现代政体且废死 }
    function adaptOne(p, rg, cfg, notes) {
      const note = k => { if (notes && k && !notes.includes(k)) notes.push(k); };
      let cur = p;
      for (const rule of cfg.EraRules || []) {
        if (rg.era < rule.MinEraTier) continue;
        const r = rule.Replace?.[cur];
        if (r !== undefined && r !== cur) { cur = r; note(rule.NoteKey); }
      }
      if (rg.modern) { const m = cfg.ModernReplace?.[cur]; if (m !== undefined && m !== cur) { cur = m; note(cfg.ModernNoteKey); } }
      if (rg.abolish && LETHAL.has(cur)) { cur = cfg.ModernDeathReplacement; note(cfg.ModernDeathNoteKey); }
      return cur;
    }
    function adaptPun(base, rg, cfg) {
      const notes = [], out = [];
      let life = false;
      for (const p of base) {
        const a = adaptOne(p, rg, cfg, notes);
        if (LETHAL.has(p) && !LETHAL.has(a)) life = true;
        if (!out.includes(a)) out.push(a);
      }
      return { list: orderedPun(out), notes, life };
    }
    // 几种典型情形：最早的时代规则生效前、各时代规则生效起、现代政体(保留死刑)、现代政体废死
    function penalScenarios(cfg) {
      const tiers = [...new Set((cfg.EraRules || []).map(r => r.MinEraTier))].filter(x => Number.isFinite(x) && x < 99).sort((a, b) => a - b);
      const top = tiers.length ? tiers[tiers.length - 1] : 0;
      const rows = [{ label: tiers.length ? `${eraLabel(tiers[0], true)}以前` : "古代", rg: { era: -Infinity } }];
      for (const t of tiers) rows.push({ label: `${eraLabel(t, true)}起`, rg: { era: t } });
      rows.push({ label: "现代政体", title: "现代、穿越政体与改制共和的帝国，保留死刑的(按已进入上面各时代算)", rg: { era: top, modern: true } });
      rows.push({ label: "现代政体·废死", title: "民主共和国(按已进入上面各时代算)", rg: { era: top, modern: true, abolish: true } });
      return rows;
    }
    const basePrisonYears = (base, cfg) => Math.max(0, ...base.map(p => cfg.PrisonYears?.[p] ?? 0)) || 4;

    function renderLaws(panel, st, f) {
      const list = lawsList(st.data);
      if (!list) return badRoot(panel, f, st, "最外层应该是 [ ] 列表，或带 Laws 列表的 { } 对象");
      const ui = S.ui.law || (S.ui.law = { sel: 0, q: "", cat: "" });
      ui.sel = Math.max(0, Math.min(ui.sel, list.length - 1));
      const locOK = !!st.locCur && !st.locError;
      const eras = lawErasConfig();
      const catOf = l => isObj(l) ? (enumName(S.lawCats, l.Category) ?? (l.Category === undefined ? "" : String(l.Category))) : "";
      const titleOf = l => { if (!isObj(l)) return "(格式不对)"; const t = lawTypeOf(l); return (t && lawLocName(t)) || l.Name || t || String(l.Type ?? "(无罪名)"); };
      const cats = uniq([...S.lawCats.map(c => c.name), ...list.map(catOf)]);
      const have = new Set(list.map(lawTypeOf).filter(Boolean));
      const missing = S.lawTypes.map(t => t.name).filter(t => !have.has(t));
      panel.innerHTML = fileHead(f, st) +
        `<p class="hint">每条律法对应代码里的一个罪名(LawType)：犯了这个罪按「刑罚」论处，再按本国所处的科技时代、政体改判，按一国宽严加减一等(见「律法时代与宽严」页)。` +
        `判决、卷宗、史书里显示的罪名和条文取自语言文件(键 law_name_罪名、law_desc_罪名，简体、繁体、英文各一份)；律法表里的 Name、Description 只在语言文件缺这个键时顶用，改了名称、条文保存时跟着改成简体。</p>` +
        (S.lawLoaded === false ? `<p class="hint warn">注意：当前代码里没有调用 EmpireLawSystem.init()，游戏不会读律法文件，这里的改动暂时不生效。</p>` : "") +
        (st.locError ? `<p class="hint warn">读不到语言文件(${esc(st.locError)})：这里只能改律法表里的后备名称，游戏里一般看不到。</p>` : "") +
        (missing.length ? `<p class="hint">代码里这些罪名还没有律法，不会定罪：${esc(missing.join("、"))}</p>` : "") +
        `<div class="toolbar" style="margin-bottom:8px"><input id="lawQ" placeholder="搜索名称、罪名、条文…" style="max-width:220px" value="${esc(ui.q)}">` +
        `<select id="lawCat" style="max-width:180px">${optionHtml("", "全部类别", !ui.cat)}${cats.map(c => optionHtml(c, c, ui.cat === c)).join("")}</select>` +
        `<button class="primary small" id="lawAdd">${ico("iconShovelPlus", "sm")}新增律法</button>` +
        (locOK ? `<button class="small" id="lawSync" title="把每条律法的 Name、Description 改成语言文件里的简体(语言文件缺键时游戏用它们)">后备名称按简体同步</button>` : "") +
        `<span class="hint">共 ${list.length} 条${S.lawTypes.length ? `，代码里有 ${S.lawTypes.length} 个罪名` : ""}</span></div>` +
        `<div class="sub-layout"><div class="sub-list" id="lawList"></div><div id="lawEditor"></div></div>`;
      const drawList = () => {
        const q = ui.q.trim();
        const texts = l => { const t = lawTypeOf(l); return [titleOf(l), l?.Type, l?.Name, l?.Description, l?.Note, ...(t && st.locCur ? LANGS.flatMap(([lg]) => [st.locCur[lawKey("name", t)]?.[lg], st.locCur[lawKey("desc", t)]?.[lg]]) : [])]; };
        const shown = list.map((l, i) => ({ l, i })).filter(({ l }) => (!ui.cat || catOf(l) === ui.cat) &&
          (!q || texts(l).some(t => String(t ?? "").includes(q))));
        let html = "", lastCat = null;
        for (const { l, i } of shown) {
          const c = catOf(l);
          if (c !== lastCat && !ui.cat) { html += `<div class="grp-title">${esc(c || "(无类别)")}</div>`; lastCat = c; }
          const bad = lawProblems(list, l, i).some(p => !p.startsWith("编辑器不认识"));
          const grave = eras.GraveCrimes.includes(lawTypeOf(l));
          html += `<div class="item ${i === ui.sel ? "active" : ""} ${bad ? "bad" : ""}" data-i="${i}">${esc(titleOf(l))}${grave ? `<span class="sub grave" title="十恶之罪">十恶</span>` : ""}</div>`;
        }
        const el = panel.querySelector("#lawList");
        el.innerHTML = html || `<p class="muted">没有符合条件的律法</p>`;
        el.querySelectorAll(".item").forEach(it => it.addEventListener("click", () => { ui.sel = +it.dataset.i; drawList(); drawEditor(); }));
      };
      const usedTypes = () => new Set(list.map(lawTypeOf).filter(Boolean));
      const freeType = () => S.lawTypes.find(t => !usedTypes().has(t.name))?.name;
      // 新律法、换了罪名的律法：后备名称取语言文件里这个罪名的简体
      const fillFallback = (law, t) => {
        if (!t || !locOK) return;
        const n = st.locCur[lawKey("name", t)]?.cz, d = st.locCur[lawKey("desc", t)]?.cz;
        if (n) law.Name = n;
        if (d) law.Description = d;
      };
      const drawEditor = () => {
        const box = panel.querySelector("#lawEditor");
        const law = list[ui.sel];
        if (!isObj(law)) {
          box.innerHTML = list.length ? `<p class="hint warn">这一条不是 { } 对象：${esc(JSON.stringify(law))}</p>` : `<p class="muted">还没有律法，点「新增律法」。</p>`;
          return;
        }
        const tName = enumName(S.lawTypes, law.Type), cName = enumName(S.lawCats, law.Category);
        const t = lawTypeOf(law);
        const used = usedTypes();
        const typeOpts = (tName === null ? optionHtml("\u0000keep", `${law.Type ?? "(没写)"}(代码里没有)`, true) : "") +
          S.lawTypes.map(x => optionHtml(x.name, lawDisplayName(x.name) + (lawLocName(x.name) && lawLocName(x.name) !== x.name ? `(${x.name})` : "") +
            (used.has(x.name) && x.name !== tName ? "(已有律法)" : ""), x.name === tName)).join("");
        const catOpts = (cName === null ? optionHtml("\u0000keep", law.Category === undefined ? "(没写，按第一类)" : `${law.Category}(代码里没有)`, true) : "") +
          S.lawCats.map(c => optionHtml(c.name, c.name, c.name === cName)).join("");
        const pun = Array.isArray(law.Punishments) ? law.Punishments : [];
        const punNames = pun.map(p => enumName(S.punish, p) ?? String(p));
        const problems = lawProblems(list, law, ui.sel);
        const fallbackHtml = () => `律法表里的后备(语言文件缺键时用)：` + [["Name", "name"], ["Description", "desc"]].map(([field, kind]) => {
          const k = lawKey(kind, t), czv = st.locCur[k]?.cz ?? "", jv = law[field] ?? "";
          return `${field}「${esc(shortText(jv))}」` + (jv !== czv ? `<span class="diff">${locEdited(st, k) ? "(保存时改成简体)" : "(与简体不同)"}</span>` : "");
        }).join("　");
        const locHtml = () => {
          if (!t) return `<p class="hint warn">罪名不对，没法对应语言文件里的名称和条文。</p>`;
          const nk = lawKey("name", t), dk = lawKey("desc", t);
          const nv = locEntry(st, nk), dv = locEntry(st, dk);
          const ph = (l, kind) => l === "cz" ? (kind === "name" ? (law.Name || `${t}罪`) : (law.Description || "条文")) : l === "ch" ? "留空按简体自动转换" : "留空保存时用简体代替";
          return `<div class="field"><span>${lab("罪名与条文(游戏里显示的)", `${nk}、${dk}`)}</span><div class="grid lawloc">` +
            LANGS.map(([l, label]) => `<div class="col"><span>${label}</span>` +
              `<input data-loc="${esc(nk)}" data-lang="${l}" value="${esc(nv[l])}" placeholder="${esc(ph(l, "name"))}">` +
              `<textarea class="short" data-loc="${esc(dk)}" data-lang="${l}" placeholder="${esc(ph(l, "desc"))}">${esc(dv[l])}</textarea></div>`).join("") +
            `</div><span class="fallback" id="lawFallback">${fallbackHtml()}</span></div>`;
        };
        const oldNameHtml = () =>
          `<label class="field">${lab("律法名称(后备)", "Name")}<input data-f="Name" value="${esc(law.Name ?? "")}" placeholder="${esc(tName ? tName + "罪" : "")}"><span class="hint">语言文件缺 law_name_罪名 时才显示这个</span></label>` +
          `<label class="field">${lab("条文(后备)", "Description")}<textarea data-f="Description" class="short">${esc(law.Description ?? "")}</textarea></label>`;
        const effHtml = () => {
          if (!t) return "";
          const grave = eras.GraveCrimes.includes(t);
          const base = orderedPun(punNames.filter(p => S.punish.some(x => x.name === p)));
          let prev = null;
          const rows = penalScenarios(eras).map(sc => {
            const r = adaptPun(base, sc.rg, eras);
            const txt = r.list.map(pName).join("、") || "(不处刑)";
            const notes = r.notes.map(k => cz(k) || k);
            if (r.life && r.list.includes("监禁")) notes.push(`刑期 ${eras.LifeImprisonmentYears} 年`);
            const same = prev !== null && txt === prev;
            prev = txt;
            return `<tr><th title="${esc(sc.title || "")}">${esc(sc.label)}</th><td class="${same ? "same" : ""}">${esc(txt)}</td><td class="${same ? "same" : ""}">${esc(notes.join("；"))}</td></tr>`;
          }).join("");
          const anyPrison = penalScenarios(eras).some(sc => { const r = adaptPun(base, sc.rg, eras); return r.list.includes("监禁") && !r.life; });
          const ransomable = base.filter(p => eras.RansomCost?.[p] !== undefined);
          const ransom = grave ? "十恶不许赎。"
            : base.some(p => LETHAL.has(p)) || base.includes("没收财产") ? "判死、抄家的不赎。"
            : ransomable.length ? `家资够的可纳赎金约 ${ransomable.reduce((s, p) => s + eras.RansomCost[p], 0)} 赎免${ransomable.map(pName).join("、")}(宽严增减三成；现代政体不赎)。` : "";
          return `<div class="field"><div class="toolbar" style="gap:8px">${lab("现行刑罚", "按 EmpireLawEras.json 改判")}` +
            (grave ? `<span class="badge grave" title="宽仁之政、八议都不减等，不许赎，不在大赦之列">十恶</span>` : `<span class="badge" title="不在 GraveCrimes 里">非十恶</span>`) +
            `<button type="button" class="small" id="lawToEras">到「律法时代与宽严」修改</button></div>` +
            `<table class="sheet eff"><tbody>${rows}</tbody></table>` +
            `<span class="hint">${anyPrison ? `判监禁的刑期从 ${basePrisonYears(base, eras)} 年起算(按律文最重的刑罚；宽严增减至多四成，从重加五成，不超过 ${eras.LifeImprisonmentYears} 年)。` : ""}${ransom}</span></div>`;
        };
        box.innerHTML = `<div class="card grid">` +
          (problems.length ? `<div class="warn-box">${problems.map(p => `<div class="hint warn">${esc(p)}</div>`).join("")}</div>` : "") +
          `<div class="grid two"><label class="field">${lab("罪名", "Type")}<select data-f="Type">${typeOpts}</select>` +
          `<span class="hint">判罪时按罪名找律法；同一罪名只认第一条</span></label>` +
          `<label class="field">${lab("类别", "Category")}<select data-f="Category">${catOpts}</select><span class="hint">分组显示用</span></label></div>` +
          (locOK ? locHtml() : oldNameHtml()) +
          `<div class="field"><label class="field">${lab("刑罚", "Punishments")}</label>` +
          `<div class="pun">${punNames.length ? punNames.map((p, i) => `<span class="chip ${enumName(S.punish, pun[i]) === null ? "missing" : ""}">${esc(p)}<button data-pun-del="${i}" title="去掉">×</button></span>`).join("") : `<span class="hint">没有刑罚(只定罪)</span>`}</div>` +
          `<div class="pun"><span class="hint">加上：</span>${S.punish.filter(p => !punNames.includes(p.name)).map(p => `<button class="small" data-pun-add="${esc(p.name)}">${esc(pName(p.name))}</button>`).join("")}</div>` +
          `<span class="hint">致死的刑罚(死刑、夷三族)最后执行；有夷三族就不另施死刑</span></div>` +
          effHtml() +
          `<div class="toolbar toggles"><label title="判了剥夺官职时，本人与子孙不得在本帝国(不在帝国里的在本国)出仕"><input type="checkbox" data-f="AffectDescendants" ${law.AffectDescendants === true ? "checked" : ""}>株连子孙<span class="fname">AffectDescendants</span></label>` +
          `<label title="代码里目前没有用到"><input type="checkbox" data-f="IsForbidden" ${law.IsForbidden === true ? "checked" : ""}>禁令<span class="fname">IsForbidden(代码暂未使用)</span></label></div>` +
          `<label class="field">${lab("备注(游戏里不显示)", "Note")}<textarea data-f="Note" class="short">${esc(law.Note ?? "")}</textarea></label></div>` +
          `<div class="toolbar section" style="margin-top:10px"><button class="small" id="lawCopy">复制这条</button>` +
          `<button class="danger small" id="lawDel">删除这条</button></div>`;
        const orig = JsonDoc.originalOf(st.doc, law) || {};
        box.querySelectorAll("input[data-f]:not([type=checkbox]),textarea[data-f]").forEach(el => el.addEventListener("input", () => {
          law[el.dataset.f] = el.value;
          markDirty("laws");
          if (el.dataset.f === "Name") drawList();
        }));
        box.querySelectorAll("[data-loc]").forEach(el => el.addEventListener("input", () => {
          const k = el.dataset.loc, l = el.dataset.lang;
          let v = el.value;
          if (k.startsWith("law_name_") && /[\r\n]/.test(v)) { v = v.replace(/[\r\n]/g, ""); el.value = v; }
          const filled = locInput(st, k, l, v);
          for (const [fl, fv] of Object.entries(filled)) {
            const other = [...box.querySelectorAll("[data-loc]")].find(o => o.dataset.loc === k && o.dataset.lang === fl);
            if (other) other.value = fv;
          }
          markDirty("laws");
          const fb = box.querySelector("#lawFallback");
          if (fb) fb.innerHTML = fallbackHtml();
          if (k.startsWith("law_name_")) drawList();
        }));
        box.querySelectorAll("select[data-f]").forEach(el => el.addEventListener("change", () => {
          if (el.value === "\u0000keep") return;
          law[el.dataset.f] = el.value;
          if (el.dataset.f === "Type") fillFallback(law, el.value);
          markDirty("laws");
          drawList(); drawEditor();
        }));
        box.querySelectorAll("input[type=checkbox][data-f]").forEach(el => el.addEventListener("change", () => {
          const k = el.dataset.f;
          // 默认就是 false：原文写了这个字段就写 false，没写就去掉，不多出一行
          if (el.checked) law[k] = true;
          else if (has(orig, k)) law[k] = false;
          else delete law[k];
          markDirty("laws");
          drawList(); drawEditor();
        }));
        const setPun = names => { law.Punishments = names; markDirty("laws"); drawList(); drawEditor(); };
        box.querySelectorAll("[data-pun-del]").forEach(b => b.addEventListener("click", () => setPun(punNames.filter((_, i) => i !== +b.dataset.punDel))));
        box.querySelectorAll("[data-pun-add]").forEach(b => b.addEventListener("click", () => setPun([...punNames, b.dataset.punAdd])));
        box.querySelector("#lawToEras")?.addEventListener("click", () => gotoFile("lawEras", "grave"));
        box.querySelector("#lawCopy").addEventListener("click", () => {
          const copy = structuredClone(law);
          const nt = freeType();
          if (nt) { copy.Type = nt; copy.Name = `${nt}罪`; fillFallback(copy, nt); }
          list.splice(ui.sel + 1, 0, copy);
          ui.sel++;
          markDirty("laws");
          toast(nt ? `已复制，罪名换成还没有律法的「${lawDisplayName(nt)}」` : "已复制；所有罪名都有律法了，记得改罪名，否则这条不起作用");
          drawList(); drawEditor();
        });
        box.querySelector("#lawDel").addEventListener("click", () => {

    // 与 EmpireLawEraConfig.TryParseEnum 一致：去空格后按名字，或按数字(须是定义过的值)
    function enumOf(list, v) {
      if (v === null || v === undefined || isCont(v)) return null;
      const t = String(v).trim();
      if (!t) return null;
      if (!list.length) return t;
      if (list.some(m => m.name === t)) return t;
      if (/^[+-]?\d+$/.test(t)) return list.find(m => m.value === parseInt(t, 10))?.name ?? null;
      return null;
    }

    // 解析 C# 的一小部分表达式：new 集合/对象初始化({ [键] = 值 }、{ 成员 = 值 }、{ 值, … })、字面量、枚举成员
    function csExpr(src, from) {
      let i = from;
      const n = src.length;
      const ws = () => { while (i < n && /\s/.test(src[i])) i++; };
      const fail = () => { throw new Error("看不懂的 C# 表达式：" + src.slice(i, i + 40)); };
      const expect = c => { ws(); if (src[i] !== c) fail(); i++; };
      const value = () => {
        ws();
        if (/^new(?![\p{L}\p{N}_])/u.test(src.slice(i, i + 4))) {
          i += 3; ws();
          const ts = i;
          let depth = 0;
          while (i < n) {
            const c = src[i];
            if (c === "<") depth++;
            else if (c === ">") depth--;
            else if (depth === 0 && "{(;,}".includes(c)) break;
            i++;
          }
          const type = src.slice(ts, i).trim();
          if (src[i] === "(") {
            let d2 = 0;
            for (; i < n; i++) { if (src[i] === "(") d2++; else if (src[i] === ")" && --d2 === 0) { i++; break; } }
            ws();
          }
          if (src[i] !== "{") return { type, items: null };
          i++;
          const items = [];
          for (;;) {
            ws();
            if (src[i] === "}") { i++; break; }
            if (src[i] === "[") { i++; const k = value(); expect("]"); expect("="); items.push({ k, v: value() }); }
            else {
              const m = /^([\p{L}_][\p{L}\p{N}_]*)\s*=(?!=)/u.exec(src.slice(i, i + 200));
              if (m) { i += m[0].length; items.push({ m: m[1], v: value() }); }
              else items.push({ v: value() });
            }
            ws();
            if (src[i] === ",") { i++; continue; }
            if (src[i] === "}") { i++; break; }
            fail();
          }
          return { type, items };
        }
        if (src[i] === '"') {
          const s = i++;
          while (i < n && src[i] !== '"') i += src[i] === "\\" ? 2 : 1;
          i++;
          return JSON.parse(src.slice(s, i));
        }
        const num = /^-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?[fFdDmM]?/.exec(src.slice(i, i + 40));
        if (num) { i += num[0].length; return parseFloat(num[0]); }
        const id = /^[\p{L}_][\p{L}\p{N}_]*(?:\s*\.\s*[\p{L}_][\p{L}\p{N}_]*)*/u.exec(src.slice(i, i + 200));
        if (id) {
          i += id[0].length;
          const parts = id[0].split(".").map(s => s.trim());
          if (parts.length === 1 && (parts[0] === "true" || parts[0] === "false")) return parts[0] === "true";
          if (parts.length === 1 && parts[0] === "null") return null;
          return { enumMember: parts[parts.length - 1] };
        }
        return fail();
      };
      return value();
    }
    // 转成 json 的样子；declType：字段声明的类型(target-typed new() 用)
    function csToJson(node, declType = "") {
      if (node === null || typeof node !== "object") return node;
      if (node.enumMember !== undefined) return node.enumMember;
      const type = node.type || declType;
      const isArr = /^(?:List|HashSet|IList|ISet|ICollection|IEnumerable)\s*</.test(type) || /\[\]\s*$/.test(type);
      if (!node.items || !node.items.length) return isArr ? [] : {};
      if (node.items.every(it => it.k === undefined && it.m === undefined)) return node.items.map(it => csToJson(it.v));
      const o = {};
      for (const it of node.items) {
        const k = it.k !== undefined ? csToJson(it.k) : it.m;
        if (k === undefined || isCont(k)) throw new Error("看不懂的初始化");
        o[String(k)] = csToJson(it.v);
      }
      return o;
    }
    function parseEraDefaults(text) {
      if (!text) return null;
      const t = stripCsComments(text);
      const cls = t.search(/class\s+EmpireLawEraConfig\b/);
      if (cls < 0) return null;
      const defAt = t.indexOf("Defaults()", cls);
      const loadAt = t.search(/static\s+EmpireLawEraConfig\s+Load\s*\(/);
      const fieldsText = t.slice(cls, defAt < 0 ? (loadAt < 0 ? t.length : loadAt) : defAt);
      const out = {}, types = {};
      for (const m of fieldsText.matchAll(/public\s+(?!const\b|static\b)([\w<>,\s\[\]]+?)\s+(\w+)\s*=(?!=)\s*/g)) {
        types[m[2]] = m[1].trim();
        out[m[2]] = csToJson(csExpr(fieldsText, m.index + m[0].length), types[m[2]]);
      }
      if (defAt >= 0) {
        const body = t.slice(defAt, loadAt > defAt ? loadAt : t.length);
        const at = body.search(/new\s+EmpireLawEraConfig\b/);
        if (at >= 0) {
          const node = csExpr(body, at);
          for (const it of node.items || []) {
            if (it.m === undefined) return null;
            out[it.m] = csToJson(it.v, types[it.m] || "");
          }
        }
        for (const m of body.matchAll(/\bconfig\s*\.\s*(\w+)\s*=(?!=)\s*/g)) out[m[1]] = csToJson(csExpr(body, m.index + m[0].length), types[m[1]] || "");
      }
      return Object.keys(out).length ? out : null;
    }
    // EmpireLawEraConfig.Load 读了哪些键(root["…"]、root.Value<…>("…"))
    function parseEraReadKeys(text) {
      if (!text) return null;
      const t = stripCsComments(text);
      const at = t.search(/static\s+EmpireLawEraConfig\s+Load\s*\(/);
      if (at < 0) return null;
      const keys = new Set();
      for (const m of t.slice(at).matchAll(/\broot\s*\[\s*"(\w+)"\s*\]|\broot\s*\.\s*Value\s*<[^>]*>\s*\(\s*"(\w+)"\s*\)/g)) keys.add(m[1] || m[2]);
      return keys.size ? keys : null;
    }

    // 照 EmpireLawEraConfig.Load 读一遍：写了的项整项替换默认，认不出的条目跳过。
    // 返回 cfg(各项生效的值)、probs(各项的问题)、fatal(有游戏读不了的值：整份按代码默认)
    function erasEffective(d) {
      const def = eraDefs();
      const cfg = structuredClone(def), probs = {};
      let fatal = false;
      if (!isObj(d)) return { cfg, probs, fatal };
      const warn = (k, msg, isFatal) => { (probs[k] || (probs[k] = [])).push(msg); if (isFatal) fatal = true; };
      const FATAL = "，游戏读这个文件会出错、整份按代码默认";
      const num = v => typeof v === "number" ? v : typeof v === "string" && v.trim() !== "" && Number.isFinite(+v) ? +v : null;
      const pun = v => enumOf(S.punish, v);
      const replace = (obj, w) => {
        const r = {};
        for (const [a, b] of Object.entries(obj)) {
          const from = pun(a), to = pun(b);
          if (from && to) r[from] = to;
          else w(`${a} → ${JSON.stringify(b)} 不是刑罚名，游戏跳过这一条`);
        }
        return r;
      };
      for (const [k, kind, , , opts = {}] of ERA_FIELDS) {
        if (!has(d, k)) continue;
        const v = d[k];
        const notObj = () => warn(k, `${v === null ? "是 null" : "不是 { } 对象"}，游戏按代码默认`);
        const notArr = () => warn(k, `${v === null ? "是 null" : "不是 [ ] 列表"}，游戏按代码默认`);
        switch (kind) {
          case "num": case "int": {
            if (v === null) break;
            const x = num(v);
            if (x === null) { warn(k, `值 ${JSON.stringify(v)} 不是数字${FATAL}`, true); break; }
            if (typeof v !== "number") warn(k, `值写成了文字 ${JSON.stringify(v)}，游戏会转成数字，最好去掉引号`);
            let y = kind === "int" ? Math.round(x) : x;
            if (kind === "int" && y !== x) warn(k, `应当是整数，游戏按 ${y} 算`);
            if (opts.min !== undefined && y < opts.min) { warn(k, `小于 ${opts.min}，游戏按 ${opts.min} 算`); y = opts.min; }
            if (opts.max !== undefined && y > opts.max) { warn(k, `大于 ${opts.max}，游戏按 ${opts.max} 算`); y = opts.max; }
            cfg[k] = y;
            break;
          }
          case "bool":
            if (v === null) break;
            if (typeof v !== "boolean") { warn(k, `值 ${JSON.stringify(v)} 应当是 true 或 false${FATAL}`, true); break; }
            cfg[k] = v;
            break;
          case "note":
            if (v === null) break;
            if (isCont(v)) { warn(k, `应当是文字${FATAL}`, true); break; }
            cfg[k] = String(v);
            break;
          case "punish": {
            if (v === null) break;
            if (isCont(v)) { warn(k, `应当是刑罚名${FATAL}`, true); break; }
            const p = pun(v);
            if (!p) { warn(k, `${JSON.stringify(v)} 不是刑罚名，游戏按代码默认`); break; }
            cfg[k] = p;
            break;
          }
          case "replace":
            if (!isObj(v)) { notObj(); break; }
            cfg[k] = replace(v, m => warn(k, m));
            break;
          case "rules": {
            if (!Array.isArray(v)) { notArr(); break; }
            const rules = [];
            v.forEach((rule, i) => {
              const w = (m, f) => warn(k, `第 ${i + 1} 条：${m}`, f);
              if (!isObj(rule)) { w("不是 { } 对象，游戏跳过"); return; }
              let tier = 99;
              if (has(rule, "MinEraTier") && rule.MinEraTier !== null) {
                const x = num(rule.MinEraTier);
                if (x === null) { w(`MinEraTier ${JSON.stringify(rule.MinEraTier)} 不是数字${FATAL}`, true); return; }
                tier = Math.round(x);
              } else w("没写 MinEraTier，按 99 算(永不生效)");
              let note = "";
              if (has(rule, "NoteKey") && rule.NoteKey !== null) {
                if (isCont(rule.NoteKey)) { w(`NoteKey 应当是文字${FATAL}`, true); return; }
                note = String(rule.NoteKey);
              }
              const rep = isObj(rule.Replace) ? replace(rule.Replace, m => w(m)) : {};
              if (!Object.keys(rep).length) { w("没有有效的替换，游戏会忽略这一条"); return; }
              rules.push({ MinEraTier: tier, NoteKey: note, Replace: rep });
            });
            cfg[k] = rules;
            break;
          }
          case "ideoList": case "lawSet": {
            if (!Array.isArray(v)) { notArr(); break; }
            const list = kind === "ideoList" ? S.ideoEnum : S.lawTypes;
            const out = [];
            for (const x of v) {
              const e = enumOf(list, x);
              if (!e) warn(k, `${JSON.stringify(x)} 认不出，游戏跳过`);
              else if (!out.includes(e)) out.push(e);
            }
            cfg[k] = out;
            break;
          }
          case "ideoMap": case "punishIntMap": case "traitMap": {
            if (!isObj(v)) { notObj(); break; }
            const out = {};
            for (const [a, b] of Object.entries(v)) {
              const key = kind === "traitMap" ? (a.trim() ? a : null) : enumOf(kind === "ideoMap" ? S.ideoEnum : S.punish, a);
              if (!key) { warn(k, `${JSON.stringify(a)} 认不出，游戏跳过`); continue; }
              const x = num(b);
              if (x === null) { warn(k, `${a} 的值 ${JSON.stringify(b)} 不是数字，游戏跳过`); continue; }
              let y = x;
              if (kind === "punishIntMap") {
                y = Math.round(x);
                if (y !== x) warn(k, `${a} 应当是整数，游戏按 ${y} 算`);
                if (y < opts.min) { warn(k, `${a} 小于 ${opts.min}，游戏按 ${opts.min} 算`); y = opts.min; }
              }
              out[key] = y;
            }
            cfg[k] = out;
            break;
          }
        }
      }
      return { cfg, probs, fatal };
    }
    // 律法页用：游戏实际用的设置(读不了就是整份默认)
    function lawErasConfig() {
      const st = S.files.lawEras;
      if (!st || st.error || !isObj(st.data)) return eraDefs();
      const e = erasEffective(st.data);
      return e.fatal ? eraDefs() : e.cfg;
    }

    function eraValText(kind, v) {
      switch (kind) {
        case "num": case "int": return String(v);
        case "bool": return v ? "是" : "否";
        case "note": return v ? v + (noteText(v) ? `(${noteText(v)})` : "") : "(空)";
        case "punish": return pName(v);
        case "replace": return replaceText(v) || "无";
        case "rules": return (v || []).map(r => `${eraLabel(r.MinEraTier, true)}起 ${replaceText(r.Replace)}`).join("；") || "无";
        case "ideoList": return (v || []).map(ideoName).join("、") || "无";
        case "lawSet": return `${(v || []).length} 条`;
        case "ideoMap": return `${Object.keys(v || {}).length} 个理念(见表)`;
        case "traitMap": return Object.entries(v || {}).map(([a, b]) => `${traitLabel(a)} ${signed(b)}`).join("、") || "无";
        case "punishIntMap": return Object.entries(v || {}).map(([a, b]) => `${pName(a)} ${b}`).join("、") || "无";
      }
      return JSON.stringify(v);
    }
    // 要改的那一项：文件里没写(或格式不对)时先换成代码默认的副本，免得只写一条把整项默认丢掉
    function eraEnsure(d, k) {
      const ok = ERA_ARRAY_KINDS.has(ERA_KIND[k]) ? Array.isArray(d[k]) : isObj(d[k]);
      if (!ok) d[k] = structuredClone(eraDefs()[k]);
      return d[k];
    }
    // "ModernReplace" 或 "EraRules/序号"(那条规则的 Replace)
    function eraMap(d, path) {
      const [k, i] = path.split("/");
      if (k !== "EraRules") return eraEnsure(d, k);
      const rule = eraEnsure(d, "EraRules")[+i];
      if (!isObj(rule)) return null;
      if (!isObj(rule.Replace)) rule.Replace = {};
      return rule.Replace;
    }
    // 别名(数字、带空格)也算同一个枚举值
    const enumKeys = (map, list, name) => Object.keys(map).filter(a => enumOf(list, a) === name);

    function replaceHtml(path, m) {
      const used = new Set(Object.keys(m).map(a => enumOf(S.punish, a)).filter(Boolean));
      return `<div class="kv">` + Object.keys(m).map(a => {
        const from = enumOf(S.punish, a), to = enumOf(S.punish, m[a]);
        const toOpts = (to ? "" : optionHtml("\u0000keep", `${JSON.stringify(m[a])}(认不出)`, true)) + S.punish.map(x => optionHtml(x.name, pName(x.name), x.name === to)).join("");
        return `<span class="pair ${from && to ? "" : "bad"}" title="${from ? "" : "游戏认不出这个刑罚名，跳过"}">${esc(from ? pName(from) : a)} →` +
          `<select data-rep-to="${esc(a)}" data-map="${esc(path)}">${toOpts}</select>` +
          `<button type="button" class="small" data-rep-del="${esc(a)}" data-map="${esc(path)}" title="去掉">×</button></span>`;
      }).join("") +
        `<span class="pair">加：<select data-rep-new-from="${esc(path)}">${optionHtml("", "选刑罚…", true)}${S.punish.filter(x => !used.has(x.name)).map(x => optionHtml(x.name, pName(x.name), false)).join("")}</select>` +
        ` → <select data-rep-new-to="${esc(path)}">${S.punish.map(x => optionHtml(x.name, pName(x.name), x.name === "监禁")).join("")}</select>` +
        `<button type="button" class="small" data-rep-add="${esc(path)}">加上</button></span></div>`;
    }
    function eraTierOptions(v) {
      const n = typeof v === "number" ? v : typeof v === "string" && /^\s*-?\d+\s*$/.test(v) ? parseInt(v, 10) : undefined;
      let html = "";
      if (v === undefined || v === null) html += optionHtml("\u0000keep", "没写(按 99，永不生效)", true);
      else if (n === undefined) html += optionHtml("\u0000keep", `${JSON.stringify(v)}(不是数字)`, true);
      else if (n !== 99 && !S.eraTiers.some(e => e.tier === n)) html += optionHtml("\u0000keep", `时代 ${n}`, true);
      return html + S.eraTiers.map(e => optionHtml(String(e.tier), eraLabel(e.tier), n === e.tier)).join("") + optionHtml("99", "99(永不生效)", n === 99);
    }
    // 一张「枚举值 → 数字」的表(理念宽严、赎金、刑期)
    function enumNumTable(k, m, def, names, label, { int = false, empty = "0", titleOf = x => x } = {}) {
      const rawOf = name => { const ks = enumKeys(m, label.list, name); return ks.length ? m[ks[ks.length - 1]] : undefined; };
      return `<table class="sheet mapt"><thead><tr><th>${esc(label.head)}</th><th>值</th><th>代码默认</th></tr></thead><tbody>` +
        names.map(x => {
          const v = rawOf(x);
          const bad = v !== undefined && typeof v !== "number";
          return `<tr><td class="txt">${esc(titleOf(x))}${titleOf(x) !== x ? `<span class="fname">${esc(x)}</span>` : ""}</td>` +
            `<td><input type="number" step="${int ? 1 : "any"}" data-mapnum="${esc(k)}" data-key="${esc(x)}" value="${typeof v === "number" ? v : ""}" placeholder="${esc(empty)}" class="${bad ? "bad" : ""}" title="${bad ? `文件里是 ${esc(JSON.stringify(v))}` : ""}"></td>` +
            `<td class="dv">${def[x] !== undefined ? esc(int ? def[x] : signed(def[x])) : esc(empty)}</td></tr>`;
        }).join("") + `</tbody></table>`;
    }

    function eraBody(d, k, kind, opts) {
      const def = eraDefs();
      const raw = has(d, k) ? d[k] : undefined;
      switch (kind) {
        case "num": case "int":
          return `<input type="number" step="${kind === "int" ? 1 : "any"}" data-num="${esc(k)}" value="${typeof raw === "number" ? raw : ""}" placeholder="${esc(def[k])}">`;
        case "bool":
          return `<select class="solo" data-bool="${esc(k)}">${optionHtml("", `不写(按代码默认：${def[k] ? "是" : "否"})`, raw === undefined)}` +
            (raw !== undefined && typeof raw !== "boolean" ? optionHtml("\u0000keep", `${JSON.stringify(raw)}(不对)`, true) : "") +
            optionHtml("true", "是", raw === true) + optionHtml("false", "否", raw === false) + `</select>`;
        case "punish": {
          const p = raw === undefined ? null : enumOf(S.punish, raw);
          return `<select class="solo" data-punish="${esc(k)}">${optionHtml("", `不写(按代码默认：${pName(def[k])})`, raw === undefined)}` +
            (raw !== undefined && !p ? optionHtml("\u0000keep", `${JSON.stringify(raw)}(认不出)`, true) : "") +
            S.punish.map(x => optionHtml(x.name, pName(x.name), p === x.name)).join("") + `</select>`;
        }
        case "note":
          return `<input data-note="${esc(k)}" list="dlLawNotes" value="${esc(typeof raw === "string" ? raw : "")}" placeholder="${esc(def[k])}"><span class="hint" data-note-text></span>`;
        case "replace":
          return replaceHtml(k, isObj(raw) ? raw : def[k]);
        case "rules": {
          const arr = Array.isArray(raw) ? raw : def[k];
          return `<div class="grid">` + arr.map((rule, i) => {
            if (!isObj(rule)) return `<div class="rule"><div class="row"><span class="hint warn">第 ${i + 1} 条不是 { } 对象：${esc(JSON.stringify(rule))}</span>` +
              `<button type="button" class="small danger" data-rule-del="${i}">删除这条</button></div></div>`;
            return `<div class="rule"><div class="row"><b>第 ${i + 1} 条</b>` +
              `<span class="kv">科技时代达到<select data-rule-tier="${i}">${eraTierOptions(has(rule, "MinEraTier") ? rule.MinEraTier : undefined)}</select>起</span>` +
              `<span class="kv">卷宗说明<input data-rule-note="${i}" list="dlLawNotes" value="${esc(typeof rule.NoteKey === "string" ? rule.NoteKey : "")}" placeholder="不记说明"></span>` +
              `<span class="hint" data-rule-note-text="${i}">${esc(noteShow(typeof rule.NoteKey === "string" ? rule.NoteKey : ""))}</span>` +
              `<button type="button" class="small danger" data-rule-del="${i}" style="margin-left:auto">删除这条</button></div>` +
              replaceHtml(`EraRules/${i}`, isObj(rule.Replace) ? rule.Replace : {}) + `</div>`;
          }).join("") + `<div><button type="button" class="small" data-rule-add>${ico("iconShovelPlus", "sm")}加一条时代规则</button></div></div>`;
        }
        case "ideoList": {
          const arr = Array.isArray(raw) ? raw : def[k];
          const inList = new Set(arr.map(x => enumOf(S.ideoEnum, x)).filter(Boolean));
          return `<div class="kv">` + arr.map((x, i) => {
            const e = enumOf(S.ideoEnum, x);
            return `<span class="pair ${e ? "" : "bad"}" title="${e ? "" : "认不出，游戏跳过"}">${esc(e ? ideoName(e) : JSON.stringify(x))}${e ? `<span class="fname">${esc(e)}</span>` : ""}` +
              `<button type="button" class="small" data-list-del="${esc(k)}" data-idx="${i}" title="去掉">×</button></span>`;
          }).join("") +
            `<select data-list-add="${esc(k)}">${optionHtml("", "加上理念…", true)}${S.ideoEnum.filter(x => !inList.has(x.name)).map(x => optionHtml(x.name, `${ideoName(x.name)}(${x.name})`, false)).join("")}</select></div>`;
        }
        case "lawSet": {
          const arr = Array.isArray(raw) ? raw : def[k];
          const on = new Set(arr.map(x => enumOf(S.lawTypes, x)).filter(Boolean));
          const catOfType = {};
          for (const l of lawsList(S.files.laws?.data) || []) { const t = lawTypeOf(l); if (t && catOfType[t] === undefined) catOfType[t] = enumName(S.lawCats, l.Category) || ""; }
          const groups = {};
          for (const t of S.lawTypes) (groups[catOfType[t.name] ?? ""] || (groups[catOfType[t.name] ?? ""] = [])).push(t.name);
          const order = uniq([...S.lawCats.map(c => c.name), ...Object.keys(groups)]).concat(groups[""] ? [""] : []);
          const bad = arr.map((x, i) => [x, i]).filter(([x]) => !enumOf(S.lawTypes, x));
          return `<div class="checkgrid">` + order.filter(c => groups[c]).map(c => `<div class="grp-title">${esc(c || "律法表里没有的罪名")}</div>` +
            groups[c].map(t => `<label class="${on.has(t) ? "on" : ""}" title="${esc(t)}"><input type="checkbox" data-law="${esc(t)}" ${on.has(t) ? "checked" : ""}>${esc(lawDisplayName(t))}</label>`).join("")).join("") + `</div>` +
            (bad.length ? `<div class="kv">${bad.map(([x, i]) => `<span class="pair bad">${esc(JSON.stringify(x))}(认不出)<button type="button" class="small" data-list-del="${esc(k)}" data-idx="${i}">×</button></span>`).join("")}</div>` : "");
        }
        case "ideoMap": {
          const m = isObj(raw) ? raw : def[k];
          const names = S.ideoEnum.map(x => x.name);
          const anc = names.filter(x => ANCIENT_IDEOS.includes(x)), mod = names.filter(x => !ANCIENT_IDEOS.includes(x));
          const extra = Object.keys(m).filter(a => !enumOf(S.ideoEnum, a));
          const L = { list: S.ideoEnum, head: "理念" };
          return `<div class="maps">${enumNumTable(k, m, def[k], mod, L, { titleOf: ideoName })}${enumNumTable(k, m, def[k], anc, L, { titleOf: ideoName })}</div>` +
            (extra.length ? `<div class="kv">${extra.map(a => `<span class="pair bad">${esc(a)}(认不出)<button type="button" class="small" data-mapdel="${esc(k)}" data-key="${esc(a)}">×</button></span>`).join("")}</div>` : "");
        }
        case "punishIntMap": {
          const m = isObj(raw) ? raw : def[k];
          const names = S.punish.map(x => x.name).filter(x => x !== "无罪" || enumKeys(m, S.punish, x).length);
          const extra = Object.keys(m).filter(a => !enumOf(S.punish, a));
          return enumNumTable(k, m, def[k], names, { list: S.punish, head: "刑罚" }, { int: true, empty: opts.empty || "", titleOf: pName }) +
            (extra.length ? `<div class="kv">${extra.map(a => `<span class="pair bad">${esc(a)}(认不出)<button type="button" class="small" data-mapdel="${esc(k)}" data-key="${esc(a)}">×</button></span>`).join("")}</div>` : "");
        }
        case "traitMap": {

            Object.keys(m).map(a => `<tr><td class="txt">${esc(traitLabel(a))}<span class="fname">${esc(a)}</span></td>` +
              `<td><input type="number" step="any" data-mapnum="${esc(k)}" data-key="${esc(a)}" value="${typeof m[a] === "number" ? m[a] : ""}" class="${typeof m[a] === "number" ? "" : "bad"}"></td>` +
              `<td class="dv">${def[k][a] !== undefined ? esc(signed(def[k][a])) : "—"}</td>` +
              `<td class="act"><button type="button" class="small danger" data-mapdel="${esc(k)}" data-key="${esc(a)}" title="去掉">×</button></td></tr>`).join("") +
            `<tr><td><input data-trait-new-id list="dlTraits" placeholder="特性 id"></td><td><input type="number" step="any" data-trait-new-val placeholder="如 0.2"></td>` +
            `<td colspan="2"><button type="button" class="small" data-trait-add="${esc(k)}">加上</button></td></tr></tbody></table>`;
        }
      }
      return "";
    }

    // 各刑罚在几种典型情形下改判成什么
    function eraPreviewHtml(cfg) {
      const grades = ["罚金", "笞刑", "杖刑", "监禁", "流放", "死刑", "夷三族"].filter(g => S.punish.some(p => p.name === g));
      const sc = penalScenarios(cfg);
      return `<details class="help" open><summary>按当前设置，各刑罚的改判(预览)</summary><div class="table-wrap free"><table class="sheet eff"><thead><tr><th>原定</th>` +

        grades.map(g => `<tr><th>${esc(pName(g))}</th>${sc.map(s => { const a = adaptOne(g, s.rg, cfg, null); return `<td class="${a === g ? "same" : ""}">${esc(pName(a))}</td>`; }).join("")}</tr>`).join("") +
        `</tbody></table></div></details>`;
