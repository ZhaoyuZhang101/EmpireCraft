    function renderLawEras(panel, st, f) {
      const d = st.data;
      if (!isObj(d)) return badRoot(panel, f, st, "最外层应该是 { } 对象");
      const def = eraDefs();
      const known = new Set(ERA_FIELDS.map(x => x[0]));
      const comment = ["说明", "_comment"].find(k => typeof d[k] === "string");
      const extra = Object.keys(d).filter(k => !known.has(k) && k !== comment);
      const codeOnly = S.eraReadKeys ? [...S.eraReadKeys].filter(k => !known.has(k)) : [];
      const notRead = S.eraReadKeys ? [...known].filter(k => !S.eraReadKeys.has(k)) : [];
      const eff = erasEffective(d);
      panel.innerHTML = fileHead(f, st) + `<div id="eraRoot">` +
        `<p class="hint">律随时变、法因政异：量刑时律文的刑罚先按本国所处的科技时代、政体改判，再按一国宽严加减一等，再议八议、赎刑。` +
        `每一项写了就覆盖代码默认，没写的沿用默认；列表、表格类的项写了就整项替换，不是逐条合并(所以这里改其中一条时，会把整项连同其余默认值一起写进文件)。读取出错时游戏日志记 [律法]。</p>` +
        (comment ? `<details class="help"><summary>文件自带说明(${esc(comment)}，保存时原样保留)</summary><p class="hint">${esc(d[comment])}</p></details>` : "") +
        (S.eraFromCode ? "" : `<p class="hint warn">没读出 EmpireLawEraConfig.cs 里的默认值，下面的「代码默认」是编辑器自带的一份，可能已经过时。</p>`) +
        `<p class="hint warn" id="eraFatal" ${eff.fatal ? "" : "hidden"}>文件里有游戏读不了的值(下面标红的项)，游戏会整份按代码默认。</p>` +
        (extra.length ? `<p class="hint warn">编辑器不认识的字段(保存时原样保留)：${esc(extra.join("、"))}</p>` : "") +
        (codeOnly.length ? `<p class="hint warn">代码会读、编辑器还不认识的设置：${esc(codeOnly.join("、"))}(请直接改 json)</p>` : "") +
        (notRead.length ? `<p class="hint warn">代码已经不读这些设置，改了不起作用：${esc(notRead.join("、"))}</p>` : "") +
        `<div class="toolbar" style="margin-bottom:6px"><button type="button" class="small" data-reset-all>全部恢复默认</button></div>` +
        `<datalist id="dlLawNotes">${uniq([...S.noteKeys, ...ERA_FIELDS.filter(x => x[1] === "note").map(x => def[x[0]])]).map(k => `<option value="${esc(k)}">${esc(noteText(k))}</option>`).join("")}</datalist>` +
        `<datalist id="dlTraits">${Object.keys(TRAIT_ZH).map(k => `<option value="${esc(k)}">${esc(TRAIT_ZH[k])}</option>`).join("")}</datalist>` +
        ERA_SECTIONS.map(sec => `<h3 data-sec="${sec.id}">${esc(sec.title)}<button type="button" class="small" data-reset-sec="${sec.id}">本组恢复默认</button></h3>` +
          `<p class="hint">${esc(sec.about)}</p><div class="grid two">` +
          sec.fields.map(([k, kind, label, hint, opts = {}]) => `<div class="erf ${opts.wide ? "wide" : ""}" data-k="${esc(k)}">` +
            `<div class="erf-head">${lab(label, k)}<span class="def"></span><button type="button" class="small" data-reset="${esc(k)}">恢复默认</button></div>` +
            eraBody(d, k, kind, opts) + (hint ? `<span class="hint">${esc(hint)}</span>` : "") + `<div class="probs"></div></div>`).join("") +
          `</div>` + (sec.id === "death" ? eraPreviewHtml(eff.fatal ? def : eff.cfg) : "")).join("") + `</div>`;
      const root = panel.querySelector("#eraRoot");

      // 各项的状态(代码默认、改没改、问题)就地刷新，不重绘(免得输入时丢焦点)
      const refresh = () => {
        const e = erasEffective(d);
        root.querySelector("#eraFatal").hidden = !e.fatal;
        root.querySelectorAll(".erf").forEach(box => {
          const k = box.dataset.k, kind = ERA_KIND[k];
          const absent = !has(d, k);
          const changed = !deepEqual(e.cfg[k], def[k]);
          box.classList.toggle("changed", changed);
          box.querySelector(".def").innerHTML = `代码默认 <b>${esc(eraValText(kind, def[k]))}</b>` + (absent ? "，文件里没写，按默认" : changed ? "，已改" : "");
          box.querySelector("[data-reset]").disabled = absent || deepEqual(d[k], def[k]);
          box.querySelector(".probs").innerHTML = (e.probs[k] || []).map(m => `<div class="hint warn">${esc(m)}</div>`).join("");
          const nt = box.querySelector("[data-note-text]");
          if (nt) nt.textContent = noteShow(e.cfg[k]);
        });
      };
      const rerender = () => { const ed = document.getElementById("editor"); const top = ed.scrollTop; renderCurrent(); ed.scrollTop = top; };
      const done = (redraw = true) => { markDirty("lawEras"); if (redraw) rerender(); else refresh(); };
      const resetKeys = keys => {
        let n = 0;
        for (const k of keys) if (has(d, k) && !deepEqual(d[k], def[k])) { d[k] = structuredClone(def[k]); n++; }
        if (n) done();

      root.addEventListener("click", e => {
        const b = e.target.closest("button");

        if (ds.reset !== undefined) resetKeys([ds.reset]);
        else if (ds.resetSec !== undefined) resetKeys(ERA_SECTIONS.find(s => s.id === ds.resetSec).fields.map(x => x[0]));
        else if (ds.resetAll !== undefined) resetKeys([...known]);
        else if (ds.repDel !== undefined) { const m = eraMap(d, ds.map); if (m) { delete m[ds.repDel]; done(); } }
        else if (ds.repAdd !== undefined) {
          const box = b.closest(".pair");
          const from = box.querySelector("[data-rep-new-from]").value, to = box.querySelector("[data-rep-new-to]").value;
          if (!from) return toast("先选要改掉的刑罚", true);
          const m = eraMap(d, ds.repAdd);
          if (!m) return;
          for (const a of enumKeys(m, S.punish, from)) if (a !== from) delete m[a];
          m[from] = to;
          done();
        } else if (ds.ruleDel !== undefined) {
          const rules = eraEnsure(d, "EraRules");
          if (!confirm(`删除第 ${+ds.ruleDel + 1} 条时代规则？`)) return;
          rules.splice(+ds.ruleDel, 1);
          done();
        } else if (ds.ruleAdd !== undefined) {
          const rules = eraEnsure(d, "EraRules");
          const last = [...rules].reverse().find(r => isObj(r) && typeof r.MinEraTier === "number");
          rules.push({ MinEraTier: last ? last.MinEraTier : 7, NoteKey: "", Replace: {} });
          done();
          toast("已加一条规则，再给它加上替换才会生效");
        } else if (ds.listDel !== undefined) { eraEnsure(d, ds.listDel).splice(+ds.idx, 1); done(); }
        else if (ds.mapdel !== undefined) { delete eraEnsure(d, ds.mapdel)[ds.key]; done(); }
        else if (ds.traitAdd !== undefined) {
          const row = b.closest("tr");
          const id = row.querySelector("[data-trait-new-id]").value.trim(), val = row.querySelector("[data-trait-new-val]").value.trim();
          if (!id) return toast("先填特性 id", true);
          if (val === "" || !Number.isFinite(Number(val))) return toast("值要填数字，如 0.2 或 -0.1", true);
          eraEnsure(d, ds.traitAdd)[id] = Number(val);
          done();
        }
      });
      root.addEventListener("change", e => {
        const el = e.target, ds = el.dataset;
        if (el.value === "\u0000keep") return;
        if (ds.bool !== undefined) { if (el.value === "") delete d[ds.bool]; else d[ds.bool] = el.value === "true"; done(); }
        else if (ds.punish !== undefined) { if (el.value === "") delete d[ds.punish]; else d[ds.punish] = el.value; done(); }
        else if (ds.repTo !== undefined) { const m = eraMap(d, ds.map); if (m) { m[ds.repTo] = el.value; done(); } }
        else if (ds.ruleTier !== undefined) { const r = eraEnsure(d, "EraRules")[+ds.ruleTier]; if (isObj(r)) { r.MinEraTier = parseInt(el.value, 10); done(); } }
        else if (ds.listAdd !== undefined) { if (el.value) { eraEnsure(d, ds.listAdd).push(el.value); done(); } }
        else if (ds.law !== undefined) {
          const arr = eraEnsure(d, "GraveCrimes");
          if (el.checked) { if (!arr.some(x => enumOf(S.lawTypes, x) === ds.law)) arr.push(ds.law); }
          else for (let i = arr.length - 1; i >= 0; i--) if (enumOf(S.lawTypes, arr[i]) === ds.law) arr.splice(i, 1);
          done();
        }
      });
      root.addEventListener("input", e => {
        const el = e.target, ds = el.dataset;
        if (ds.num !== undefined) {
          const t = el.value.trim(), int = ERA_KIND[ds.num] === "int";
          if (t === "") delete d[ds.num];
          else {
            const n = Number(t);
            if (!Number.isFinite(n) || (int && !Number.isInteger(n))) { el.classList.add("bad"); return; }
            d[ds.num] = n;
          }
          el.classList.remove("bad");
          done(false);
        } else if (ds.note !== undefined) {
          if (el.value.trim() === "") delete d[ds.note]; else d[ds.note] = el.value.trim();
          done(false);
        } else if (ds.ruleNote !== undefined) {
          const r = eraEnsure(d, "EraRules")[+ds.ruleNote];
          if (!isObj(r)) return;
          r.NoteKey = el.value.trim();
          const span = root.querySelector(`[data-rule-note-text="${ds.ruleNote}"]`);
          if (span) span.textContent = noteShow(r.NoteKey);
          done(false);
        } else if (ds.mapnum !== undefined) {
          const k = ds.mapnum, kind = ERA_KIND[k], t = el.value.trim();
          const n = Number(t);
          if (t !== "" && (!Number.isFinite(n) || (kind === "punishIntMap" && !Number.isInteger(n)))) { el.classList.add("bad"); return; }
          if (t === "" && kind === "traitMap") { el.classList.add("bad"); return; }
          el.classList.remove("bad");
          const m = eraEnsure(d, k);
          if (kind === "traitMap") m[ds.key] = n;
          else {
            const list = kind === "ideoMap" ? S.ideoEnum : S.punish;
            const ks = enumKeys(m, list, ds.key);
            if (t === "") ks.forEach(a => delete m[a]);
            else {
              const keep = ks.includes(ds.key) ? ds.key : (ks[ks.length - 1] ?? ds.key);
              ks.filter(a => a !== keep).forEach(a => delete m[a]);
              m[keep] = n;
            }
          }
          done(false);
        }
      });
      refresh();
    }

    function gotoFile(id, sec) {
      S.cur = id;
      try { localStorage.setItem("misc.tab", id); } catch { /* 无痕模式等 */ }
      renderNav();
      renderCurrent();
      const ed = document.getElementById("editor");
      const h = sec ? ed.querySelector(`[data-sec="${sec}"]`) : null;
      if (h) h.scrollIntoView({ block: "start" }); else ed.scrollTop = 0;
    }

    // ================= 5. 官员考绩事件 =================
    const PERF_ZH = {
      Irrigation_Project_Completed: "兴修水利", Local_Rebellion_Suppressed: "平定地方叛乱", Virtuous_Talent_Recommended: "举荐贤良",
      Disaster_Relief_Conducted: "赈济灾荒", Schools_Restored: "兴复学校", Factionalism_Exposed: "结党营私败露", Negligence_in_Local_Affairs: "怠于地方政务",
      Excessive_Taxation_Imposed: "横征暴敛", Corrupted_Performance_Reports: "考绩造假", Refused_Imperial_Summons: "抗旨不赴召",
      Administrative_Reform: "整顿吏治", Legal_Code_Revision: "修订律令", Policy_Championed_at_Court: "在朝力推新政", Talents_Recommended: "荐举人才",
      Corruption_Exposed: "揭发贪腐", Factional_Infighting: "党争内斗", Examination_Manipulation: "科场舞弊", Neglect_of_Duty: "玩忽职守",
      Unpopular_Reforms: "推行失人心的改革", Misleading_the_Emperor: "欺君罔上", None: "平平无奇(无事)"
    };
    const perfName = t => PERF_ZH[t] || t;
    const levelsText = v => Array.isArray(v) ? v.join(", ") : "";
    function parseLevels(t) {
      const parts = String(t).split(/[,，、\s]+/).filter(Boolean);
      if (parts.some(p => !/^-?\d+$/.test(p))) return null;
      return parts.map(p => parseInt(p, 10));
    }

    function renderPerformance(panel, st, f) {
      const d = st.data;
      if (!isObj(d)) return badRoot(panel, f, st, "最外层应该是 { } 对象");
      const types = S.perfTypes.length ? S.perfTypes.map(t => t.name) : uniq(Object.values(d).map(e => e?.eventType));
      const keys = Object.keys(d);
      const typeCount = {};
      for (const k of keys) if (isObj(d[k])) typeCount[d[k].eventType] = (typeCount[d[k].eventType] || 0) + 1;
      const problems = k => {
        const e = d[k];
        if (!isObj(e)) return ["这一条不是 { } 对象，游戏读这个文件会出错"];
        const out = [];
        if (S.perfTypes.length && !types.includes(e.eventType)) out.push(`类型 ${JSON.stringify(e.eventType)} 在代码里没有，游戏读这个文件会出错`);
        if (e.is_good === true && Number(e.performance_add_on) < 0) out.push("标成好事却会扣绩效");
        if (e.is_good === false && Number(e.performance_add_on) > 0) out.push("标成坏事却会加绩效");
        if (e.official_levels !== undefined && e.official_levels !== null && !Array.isArray(e.official_levels)) out.push("适用官职等级应该是数字列表");
        const extra = Object.keys(e).filter(x => !["eventType", "is_good", "trigger_rate", "performance_add_on", "official_levels"].includes(x));
        if (extra.length) out.push(`编辑器不认识的字段(保存时原样保留)：${extra.join("、")}`);
        return out;
      };
      const unused = types.filter(t => !typeCount[t]);
      panel.innerHTML = fileHead(f, st) +
        `<p class="hint">每次考绩，从适用的事件里按权重抽一件(权重 0.001 以下的不抽)，官员绩效加上 0 到「绩效变化」之间的随机数，负数就是扣。` +
        `好事的权重按官员特性上调(正面特性多最多 +0.5)，坏事反之。「适用官职等级」是官员现任官职的等级(政体配置里官职的 type)，空 = 所有官员都可能。</p>` +
        `<div class="table-wrap free"><table class="sheet"><colgroup><col style="width:24%"><col style="width:19%"><col style="width:90px"><col style="width:96px"><col style="width:132px"><col><col style="width:96px"></colgroup>` +
        `<thead><tr><th>事件<span class="fname">键名</span></th><th>类型<span class="fname">eventType</span></th><th>好事/坏事<span class="fname">is_good</span></th>` +
        `<th title="越大越容易抽到">权重<span class="fname">trigger_rate</span></th><th title="每次加 0~这个数">绩效变化<span class="fname">performance_add_on</span></th>` +
        `<th>适用官职等级<span class="fname">official_levels</span></th><th></th></tr></thead><tbody>` +
        keys.map(k => {
          const e = d[k], p = problems(k);
          if (!isObj(e)) return `<tr data-k="${esc(k)}"><td class="txt">${esc(k)}</td><td colspan="5" class="txt hint warn">${esc(p[0])}：${esc(JSON.stringify(e))}</td><td class="act"><button class="small danger" data-act="del">×</button></td></tr>`;
          const tOpts = (types.includes(e.eventType) ? "" : optionHtml("\u0000keep", `${e.eventType ?? "(没写)"}(代码里没有)`, true)) +
            types.map(t => optionHtml(t, perfName(t), t === e.eventType)).join("");
          const lv = e.official_levels;
          return `<tr data-k="${esc(k)}"><td class="txt"><div>${esc(perfName(k))}</div><span class="fname">${esc(k)}</span></td>` +
            `<td><select data-f="eventType">${tOpts}</select></td>` +
            `<td><select data-f="is_good">${optionHtml("1", "好事", e.is_good === true)}${optionHtml("0", "坏事", e.is_good !== true)}</select></td>` +
            `<td><input type="number" step="any" data-f="trigger_rate" value="${typeof e.trigger_rate === "number" ? e.trigger_rate : ""}"></td>` +
            `<td><input type="number" step="any" data-f="performance_add_on" value="${typeof e.performance_add_on === "number" ? e.performance_add_on : ""}"></td>` +
            `<td><input data-f="official_levels" value="${esc(Array.isArray(lv) ? levelsText(lv) : "")}" placeholder="空 = 所有官员"></td>` +
            `<td class="act"><button class="small" data-act="copy" title="照这一条新加一条">复制</button> <button class="small danger" data-act="del" title="删除">×</button></td></tr>` +
            (p.length ? `<tr class="warnrow"><td colspan="7" class="hint warn">${esc(p.join("；"))}</td></tr>` : "");
        }).join("") + `</tbody></table></div>` +
        `<div class="toolbar" style="margin-top:10px"><select id="perfNew" style="max-width:260px">${unused.map(t => optionHtml(t, perfName(t), false)).join("")}` +
        `${unused.length ? `<option disabled>──已有的类型──</option>` : ""}${types.filter(t => typeCount[t]).map(t => optionHtml(t, perfName(t) + "(已有)", false)).join("")}</select>` +
        `<button class="primary small" id="perfAdd">${ico("iconShovelPlus", "sm")}添加事件</button><span class="hint">新事件照抄同为好事/坏事的上一条的数值。</span></div>`;
      const tbody = panel.querySelector("tbody");
      const entry = el => d[el.closest("tr").dataset.k];
      tbody.addEventListener("change", e => {
        const el = e.target, ev = entry(el);
        if (!isObj(ev) || !el.dataset.f) return;
        const k = el.dataset.f;
        if (k === "eventType") { if (el.value === "\u0000keep") return; ev.eventType = el.value; }
        else if (k === "is_good") ev.is_good = el.value === "1";
        else if (k === "official_levels") {
          const arr = parseLevels(el.value);
          if (!arr) { el.classList.add("bad"); toast("官职等级要写整数，用逗号隔开", true); return; }
          el.classList.remove("bad");
          if (!deepEqual(arr, ev.official_levels)) ev.official_levels = arr;
          else return;
        } else return;
        markDirty("performance");
        renderCurrent();
      });
      tbody.addEventListener("input", e => {
        const el = e.target, ev = entry(el);
        if (!isObj(ev) || !["trigger_rate", "performance_add_on"].includes(el.dataset.f)) return;
        const t = el.value.trim(), n = Number(t);
        if (t === "" || !Number.isFinite(n)) { el.classList.add("bad"); return; }
        el.classList.remove("bad");
        ev[el.dataset.f] = n;
        markDirty("performance");
        // 只更新这一行下面的提示，不重绘(免得丢焦点)
        const tr = el.closest("tr"), k = tr.dataset.k, p = problems(k);
        let warn = tr.nextElementSibling?.classList.contains("warnrow") ? tr.nextElementSibling : null;
        if (!p.length) { warn?.remove(); return; }
        if (!warn) { warn = document.createElement("tr"); warn.className = "warnrow"; warn.innerHTML = `<td colspan="7" class="hint warn"></td>`; tr.after(warn); }
        warn.firstElementChild.textContent = p.join("；");
      });
      const uniqueKey = base => { let k = base, n = 2; while (has(d, k)) k = `${base}_${n++}`; return k; };
      tbody.addEventListener("click", e => {
        const b = e.target.closest("button[data-act]");
        if (!b) return;
        const k = b.closest("tr").dataset.k;
        if (b.dataset.act === "del") {
          if (!confirm(`删除考绩事件「${perfName(k)}」？`)) return;
          delete d[k];
        } else d[uniqueKey(k)] = structuredClone(d[k]);
        markDirty("performance");
        renderCurrent();
      });
      panel.querySelector("#perfAdd").addEventListener("click", () => {
        const t = panel.querySelector("#perfNew").value;
        if (!t) return;
        const good = !/Exposed|Negligence|Excessive|Corrupted|Refused|Infighting|Manipulation|Neglect|Unpopular|Misleading/.test(t);
        const vals = Object.values(d).filter(isObj);
        const like = [...vals].reverse().find(v => v.is_good === good) || vals[vals.length - 1];
        d[uniqueKey(t)] = {
          eventType: t, is_good: good,
          trigger_rate: typeof like?.trigger_rate === "number" ? like.trigger_rate : 0.5,
          performance_add_on: typeof like?.performance_add_on === "number" ? Math.abs(like.performance_add_on) * (good ? 1 : -1) : (good ? 15 : -15),
          official_levels: Array.isArray(like?.official_levels) ? [...like.official_levels] : []
        };
        markDirty("performance");
        renderCurrent();
        const wrap = document.getElementById("editor");
        wrap.scrollTop = wrap.scrollHeight;
      });
    }

    // ================= 6. 称谓表(爵位 / 散官 / 勋级) =================
    function keyParts(key) { const m = /^(.*?)(\d+)$/.exec(String(key || "")); return m ? { prefix: m[1], n: +m[2] } : null; }

    function renderLocaleTable(panel, st, f) {
      const doc = st.csv;
      const ui = S.ui[f.id] || (S.ui[f.id] = { q: "" });
      const header = doc.lines[0]?.cells || ["key", "cz", "en", "ch"];
      const ncol = header.length;
      const czI = header.indexOf("cz"), enI = header.indexOf("en"), chI = header.indexOf("ch");
      const COL = { key: ["键", "游戏代码按它取名字"], cz: ["简体中文", ""], en: ["English", "留空保存时用简体代替"], ch: ["繁体中文", "留空或没手改过时，按简体自动转换"] };
      // 按空行分组
      const groups = [];
      let cur = null;
      doc.lines.forEach((l, li) => {
        if (li === 0) return;
        if (!CsvDoc.isData(l, li)) { cur = null; return; }
        if (!cur) groups.push(cur = { lines: [] });
        cur.lines.push(li);
      });
      const keyCount = {};
      for (const g of groups) for (const li of g.lines) { const k = (doc.lines[li].cells[0] || "").trim(); if (k) keyCount[k] = (keyCount[k] || 0) + 1; }
      const dups = Object.keys(keyCount).filter(k => keyCount[k] > 1);
      panel.innerHTML = fileHead(f, st) + `<p class="hint">${esc(f.about || "")}三种语言在同一行；空行只是分组，游戏不管。</p>` +
        (dups.length ? `<p class="hint warn">重复的键：${esc(dups.join("、"))}(游戏只用其中一个)</p>` : "") +
        (zhOK() ? "" : `<p class="hint warn">没有载入简繁转换(zh-convert.js)，繁体不会自动补。</p>`) +
        `<div class="toolbar" style="margin-bottom:8px"><input id="locQ" placeholder="搜索键或名称…" style="max-width:220px" value="${esc(ui.q)}">` +
        (chI >= 0 && czI >= 0 ? `<button class="small" id="locTrad" ${zhOK() ? "" : "disabled"} title="只补繁体为空的格子">补全繁体</button>` : "") +
        `<button class="small" id="locGroup">${ico("iconShovelPlus", "sm")}新建一组</button></div>` +
        `<div class="table-wrap free"><table class="sheet"><colgroup>${header.map((h, i) => `<col style="width:${i === 0 ? "30%" : "auto"}">`).join("")}<col style="width:96px"></colgroup>` +
        `<thead><tr>${header.map(h => `<th title="${esc(COL[h]?.[1] || "")}">${esc(COL[h]?.[0] || h)}<span class="fname">${esc(h)}</span></th>`).join("")}<th></th></tr></thead><tbody></tbody></table></div>`;
      const tbody = panel.querySelector("tbody");
      const draw = () => {
        const q = ui.q.trim();
        tbody.innerHTML = groups.map((g, gi) => {
          const rows = g.lines.filter(li => !q || doc.lines[li].cells.some(c => String(c).includes(q)));
          if (!rows.length) return "";
          const prefixes = uniq(g.lines.map(li => keyParts(doc.lines[li].cells[0])?.prefix).filter(Boolean));
          return `<tr class="grp"><td colspan="${ncol + 1}">${esc(prefixes.length ? prefixes.map(p => p + "*").join(" / ") : "(一组)")}` +
            `<button class="small" data-add-group="${gi}">在本组末尾加一行</button></td></tr>` +
            rows.map(li => {
              const l = doc.lines[li];
              return `<tr data-li="${li}">${Array.from({ length: ncol }, (_, i) => {
                const v = l.cells[i] ?? "";
                return `<td><input data-c="${i}" value="${esc(v)}" class="${i === 0 && keyCount[v.trim()] > 1 ? "dup" : ""} ${i === 0 && !v.trim() ? "bad" : ""}" ${i === 0 ? `placeholder="新键名"` : ""}></td>`;
              }).join("")}<td class="act"><button class="small" data-act="copy" title="照这一行加下一档">复制</button> <button class="small danger" data-act="del" title="删除">×</button></td></tr>`;
            }).join("");
        }).join("") || `<tr><td colspan="${ncol + 1}" class="txt muted">没有内容</td></tr>`;
      };
      draw();
      const autoOf = l => { let a = st.auto.get(l); if (!a) st.auto.set(l, a = {}); return a; };
      const setInput = (tr, i, v) => { const inp = tr.querySelector(`input[data-c="${i}"]`); if (inp) inp.value = v; };
      tbody.addEventListener("input", e => {
        const el = e.target;
        if (!el.dataset.c) return;
        const tr = el.closest("tr"), l = doc.lines[+tr.dataset.li], i = +el.dataset.c;
        const before = l.cells[i] ?? "";
        const v = el.value.replace(/[\r\n]/g, "");
        if (!CsvDoc.setCell(l, i, v)) return;
        markDirty(f.id);
        if (!zhOK()) return;
        const a = autoOf(l);
        // 简体改了：繁体为空、仍是上次自动补的、或正好是旧简体转出来的(且没手改过)，就跟着改
        if (i === czI && chI >= 0) {
          const ch = l.cells[chI] ?? "";
          if (!a.manualCh && (ch === "" || ch === a.ch || ch === zhToTrad(before))) {
            const t = v ? zhToTrad(v) : "";
            CsvDoc.setCell(l, chI, t);
            a.ch = t;
            setInput(tr, chI, t);
          }
        } else if (i === chI && czI >= 0) {
          a.manualCh = v !== "";
          const s = l.cells[czI] ?? "";
          if (!a.manualCz && (s === "" || s === a.cz)) {
            const t = v ? zhToSimp(v) : "";
            CsvDoc.setCell(l, czI, t);
            a.cz = t;
            setInput(tr, czI, t);
          }
        }
        if (i === czI) a.manualCz = v !== "" && v !== a.cz;
      });
      const currentKeys = () => {
        const cnt = {};
        doc.lines.forEach((l, li) => { if (CsvDoc.isData(l, li)) { const k = (l.cells[0] || "").trim(); if (k) cnt[k] = (cnt[k] || 0) + 1; } });
        return cnt;
      };
      // 改了键名：就地标出重复/空的键，不重绘
      tbody.addEventListener("change", e => {
        if (+e.target.dataset.c !== 0) return;
        const cnt = currentKeys();
        tbody.querySelectorAll('input[data-c="0"]').forEach(inp => {
          const k = inp.value.trim();
          inp.classList.toggle("dup", cnt[k] > 1);
          inp.classList.toggle("bad", !k);
        });
      });
      const nextKey = (afterLi, groupLines) => {
        const p = keyParts(doc.lines[afterLi]?.cells[0]);
        if (!p) return "";
        const taken = new Set(Object.keys(currentKeys()));
        let n = Math.max(p.n, ...groupLines.map(li => keyParts(doc.lines[li].cells[0])).filter(x => x && x.prefix === p.prefix).map(x => x.n)) + 1;
        while (taken.has(p.prefix + n)) n++;
        return p.prefix + n;
      };
      const addRow = (afterLi, cells) => {
        const line = CsvDoc.newLine(cells);
        CsvDoc.insertAfter(doc, afterLi, line);
        markDirty(f.id);
        renderCurrent();
        const inp = document.querySelector(`#editor tr[data-li="${afterLi + 1}"] input[data-c="${czI >= 0 ? czI : 0}"]`);
        inp?.focus();
      };
      tbody.addEventListener("click", e => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.dataset.addGroup !== undefined) {
          const g = groups[+b.dataset.addGroup];
          const last = g.lines[g.lines.length - 1];
          const cells = Array.from({ length: ncol }, () => "");
          cells[0] = nextKey(last, g.lines);
          addRow(last, cells);
          return;
        }
        const tr = b.closest("tr"), li = +tr.dataset.li, l = doc.lines[li];
        if (b.dataset.act === "del") {
          if (!confirm(`删除「${l.cells[0] || "(空键)"}」这一行？代码要是还用到这个键，就会显示成键名。`)) return;
          CsvDoc.remove(doc, li);
          markDirty(f.id);
          renderCurrent();
        } else if (b.dataset.act === "copy") {
          const g = groups.find(x => x.lines.includes(li));
          const cells = Array.from({ length: ncol }, (_, i) => l.cells[i] ?? "");
          cells[0] = nextKey(li, g ? g.lines : [li]);
          addRow(li, cells);
        }
      });
      panel.querySelector("#locQ").addEventListener("input", e => { ui.q = e.target.value; draw(); });
      panel.querySelector("#locTrad")?.addEventListener("click", () => {
        let n = 0;
        doc.lines.forEach((l, li) => {
          if (!CsvDoc.isData(l, li)) return;
          const s = (l.cells[czI] ?? "").trim();
          if (s && !(l.cells[chI] ?? "").trim()) { const t = zhToTrad(l.cells[czI]); CsvDoc.setCell(l, chI, t); autoOf(l).ch = t; n++; }
        });
        if (n) markDirty(f.id);
        toast(n ? `已补全 ${n} 个繁体格子` : "没有空着的繁体格子");
        renderCurrent();
      });
      panel.querySelector("#locGroup").addEventListener("click", () => {
        const at = CsvDoc.lastContent(doc);
        const blank = { raw: "", eol: "\n", cells: [""], edited: false };
        CsvDoc.insertAfter(doc, at, blank);
        const cells = Array.from({ length: ncol }, () => "");
        addRow(at + 1, cells);
        document.querySelector(`#editor tr[data-li="${at + 2}"] input[data-c="0"]`)?.focus();
      });
    }

    // ================= 启动 =================
    async function init() {
      mountAppBar("misc.html");
      try { const t = localStorage.getItem("misc.tab"); if (t && BY_ID[t]) S.cur = t; } catch { /* 无痕模式等 */ }
      renderNav();
      if (!api) { renderCurrent(); return; }
      try { await loadLookups(); } catch (e) { toast("读取代码里的枚举失败：" + e.message, true); }
      await Promise.all(FILES.map(loadFile));
      renderNav();
      renderCurrent();
    }

    async function reloadCurrent() {
      const st = S.files[S.cur];
      if (st?.dirty && !confirm("这个文件有未保存的修改，确定重新读取？")) return;
      await loadFile(BY_ID[S.cur]);
      renderNav();
      renderCurrent();
      toast("已重新读取");
    }

    document.getElementById("saveBtn").addEventListener("click", () => save([S.cur]));
    document.getElementById("saveAllBtn").addEventListener("click", () => save(FILES.filter(f => S.files[f.id]?.dirty).map(f => f.id)));
    document.getElementById("reloadBtn").addEventListener("click", reloadCurrent);
    document.getElementById("openDirBtn").addEventListener("click", async () => {
      if (!api) return toast("只有桌面版才能打开文件夹", true);
      const p = BY_ID[S.cur].path;
      try { await api.openPath(p.includes("/") ? p.slice(0, p.lastIndexOf("/")) : "."); } catch (e) { toast(e.message, true); }
    });
    document.addEventListener("keydown", e => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); document.activeElement?.blur?.(); save([S.cur]); }
    });
    window.addEventListener("beforeunload", e => { if (Object.values(S.files).some(st => st.dirty)) { e.preventDefault(); e.returnValue = ""; } });
    init();
  </script>
</body>
</html>
