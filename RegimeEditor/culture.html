<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmpireCraft 文化编辑器</title>
  <link rel="stylesheet" href="common.css" />
  <link rel="stylesheet" href="pixel-theme.css" />
  <style>
    .hint{font-size:12px;color:var(--muted);line-height:1.5}
    .tag-err{color:var(--danger)}
    .tag-warn{color:#d9a441}
    .tag-ok{color:var(--good)}
    .chip small{opacity:.75;margin-left:2px}
    .chip .mv{color:var(--muted)}
    td.cell-pad{padding:2px 6px !important}
    .issues{display:grid;gap:4px;margin:6px 0}
    .issues div{padding:2px 0}
    .check-list label{display:flex;gap:6px;align-items:center}
    td select{border:none !important;background:transparent !important}
  </style>
</head>
<body>
  <div class="layout">
    <aside class="side">
      <div class="toolbar">
        <button class="primary" id="newCultureBtn"><img class="ico sm" src="assets/icons/iconShovelPlus.png">新建文化</button>
        <button id="reloadBtn"><img class="ico sm" src="assets/icons/iconArrowBack.png">刷新</button>
      </div>
      <input id="cultureFilter" placeholder="搜索文化…" />
      <div class="list" id="cultureList"></div>
      <div class="note">
        每个文化就是 <code>Locales/Cultures/Culture_&lt;名字&gt;/</code> 一个文件夹：
        <code>CultureRule.jsonc</code> 是规则，其余 CSV 是各种词库。加文化、改词库都不用碰代码。
        保存规则时只改动过的地方，文件里的注释和编辑器不认识的字段原样保留。
      </div>
    </aside>
    <main class="panel" id="main">
      <p class="muted">从左侧选择一个文化，或新建一个。</p>
    </main>
  </div>

  <dialog id="newDialog">
    <h2><img class="ico" src="assets/icons/iconCulture.png">新建文化</h2>
    <div class="grid">
      <div class="grid two">
        <label class="field">中文名<input id="ndCz" placeholder="朝鲜" /></label>
        <label class="field">照哪个文化复制<select id="ndFrom"></select></label>
      </div>
      <label class="field">英文名(可不填)<input id="ndEn" placeholder="Korean" />
        <span class="hint">填了就用它当文化 id；不填英文界面显示中文名</span></label>
      <details id="ndAdvanced">
        <summary>高级</summary>
        <div class="grid" style="margin-top:8px">
          <div class="grid three">
            <label class="field">文化 id<input id="ndName" placeholder="(自动)" /><span class="hint">文件夹 Culture_&lt;id&gt;，游戏里认文化用；留空自动生成</span></label>
            <label class="field">繁體中文名<input id="ndCh" placeholder="(按中文名自动转换)" /></label>
            <label class="field">地图颜色<input type="color" id="ndColor" value="#888888" /></label>
          </div>
          <label class="field">词库怎么处理<select id="ndMode">
            <option value="copy">复制模板文化的全部词库(文件名、key 里的文化名自动换成新文化)</option>
            <option value="ref">规则里用到的词库改成引用模板文化(写成 模板:词库名，不复制)；书名、宗教名、党名这些按文件名找的照样复制</option>
            <option value="none">不复制词库，只复制规则(之后自己补词库；没补的起名退回原版)</option>
          </select></label>
        </div>
      </details>
      <div class="note" id="ndNote"></div>
      <div class="toolbar"><button class="primary" id="ndOk">创建</button><button id="ndCancel">取消</button></div>
    </div>
  </dialog>

  <dialog id="libDialog">
    <h2><img class="ico" src="assets/icons/iconCultureList.png">选词库</h2>
    <div class="grid" style="min-width:520px">
      <div class="grid two">
        <label class="field">哪个文化的词库<select id="ldCulture"></select></label>
        <label class="field">筛选<input id="ldFilter" placeholder="词库名的一部分" /></label>
      </div>
      <select id="ldList" size="14"></select>
      <div class="hint" id="ldNote"></div>
      <div class="toolbar"><button class="primary" id="ldOk">选定</button><button id="ldClear">清空(用默认)</button><button id="ldCancel">取消</button></div>
    </div>
  </dialog>

  <script src="common.js"></script>
  <script src="zh-convert.js"></script>
  <script>
    /* JSONC-BEGIN */
    // CultureRule.jsonc 原地改写：只改动过的值、增删的键，注释、排版、编辑器不认识的字段原样保留。
    // patch(原文, 目标对象) → 新原文；改完再解析一遍和目标比对，对不上就抛错，不会写出坏文件。
    const Jsonc = (() => {
      const isObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
      const isPrim = v => v === null || typeof v !== "object";
      const BOM = String.fromCharCode(0xFEFF);
      // 不可见字符(细空格 U+200A、不换行空格、零宽字符、行分隔符等)
      const INVISIBLE = new RegExp("[" + [[0x7f, 0xa0], [0xad, 0xad], [0x2000, 0x200f], [0x2028, 0x202f], [0x205f, 0x206f], [0xfeff, 0xfeff]]
        .map(([a, b]) => String.fromCharCode(a) + "-" + String.fromCharCode(b)).join("") + "]", "g");

      function deepEqual(a, b) {
        if (a === b) return true;
        if (Array.isArray(a)) return Array.isArray(b) && a.length === b.length && a.every((v, i) => deepEqual(v, b[i]));
        if (isObj(a)) {
          if (!isObj(b)) return false;
          const ka = Object.keys(a), kb = Object.keys(b);
          return ka.length === kb.length && ka.every(k => Object.prototype.hasOwnProperty.call(b, k) && deepEqual(a[k], b[k]));
        }
        return false;
      }

      // 不可见的空白(细空格 U+200A 等)写成 \uXXXX，和现有文件一致，肉眼看得出来
      function quote(s) {
        return JSON.stringify(String(s)).replace(INVISIBLE,
          c => "\\u" + c.charCodeAt(0).toString(16).toUpperCase().padStart(4, "0"));
      }
      const prim = v => typeof v === "string" ? quote(v) : JSON.stringify(v);

      function skip(s, i) {
        for (;;) {
          while (i < s.length && (s[i] === " " || s[i] === "\t" || s[i] === "\r" || s[i] === "\n" || s[i] === BOM)) i++;
          if (s.startsWith("//", i)) { const e = s.indexOf("\n", i); i = e < 0 ? s.length : e; continue; }
          if (s.startsWith("/*", i)) { const e = s.indexOf("*/", i + 2); i = e < 0 ? s.length : e + 2; continue; }
          return i;
        }
      }

      // 解析成带位置的树：{ type, start, end, v, members|items }
      function parse(s) {
        let i = 0;
        const fail = msg => { const line = s.slice(0, i).split("\n").length; throw new Error(`${msg}(第 ${line} 行)`); };
        const NUM = /-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?|true|false|null/y;
        function value() {
          i = skip(s, i);
          const c = s[i];
          if (c === "{") return object();
          if (c === "[") return array();
          if (c === '"') return string();
          NUM.lastIndex = i;
          const m = NUM.exec(s);
          if (!m) fail("无法识别的值");
          const start = i; i += m[0].length;
          return { type: "literal", start, end: i, v: JSON.parse(m[0]) };
        }
        function string() {
          const start = i; let j = i + 1;
          while (j < s.length && s[j] !== '"') j += s[j] === "\\" ? 2 : 1;
          if (j >= s.length) fail("字符串没有结束");
          i = j + 1;
          return { type: "string", start, end: i, v: JSON.parse(s.slice(start, i)) };
        }
        function object() {
          const start = i++; const members = []; const v = {};
          for (;;) {
            i = skip(s, i);
            if (s[i] === "}") { i++; break; }
            if (s[i] !== '"') fail("这里应该是键名");
            const k = string();
            i = skip(s, i);
            if (s[i] !== ":") fail("缺少冒号");
            i++;
            const val = value();
            const m = { key: k.v, start: k.start, value: val, comma: -1 };
            i = skip(s, i);
            if (s[i] === ",") { m.comma = i; i++; } else if (s[i] !== "}") fail("缺少逗号");
            members.push(m);
            v[k.v] = val.v;
          }
          return { type: "object", start, end: i, members, v };
        }
        function array() {
          const start = i++; const items = [];
          for (;;) {
            i = skip(s, i);
            if (s[i] === "]") { i++; break; }
            const val = value();
            const it = { value: val, comma: -1 };
            i = skip(s, i);
            if (s[i] === ",") { it.comma = i; i++; } else if (s[i] !== "]") fail("缺少逗号");
            items.push(it);
          }
          return { type: "array", start, end: i, items, v: items.map(it => it.value.v) };
        }
        const root = value();
        i = skip(s, i);
        if (i < s.length) fail("结尾有多余的内容");
        return root;
      }

      // 新写的值：小对象、简单数组写成一行，其余按缩进展开
      function format(v, indent = "", unit = "    ", forceInline = false) {
        if (Array.isArray(v)) {
          if (!v.length) return "[]";
          if (forceInline || v.every(isPrim)) return "[" + v.map(x => format(x, indent, unit, true)).join(", ") + "]";
          const inner = indent + unit;
          return "[\n" + v.map(x => inner + format(x, inner, unit)).join(",\n") + "\n" + indent + "]";
        }
        if (isObj(v)) {
          const keys = Object.keys(v);
          if (!keys.length) return "{}";
          const inline = "{ " + keys.map(k => quote(k) + ": " + format(v[k], indent, unit, true)).join(", ") + " }";
          if (forceInline) return inline;
          const simple = keys.every(k => isPrim(v[k]) || (Array.isArray(v[k]) && v[k].every(isPrim)));
          if (simple && indent.length + inline.length <= 110) return inline;
          const inner = indent + unit;
          return "{\n" + keys.map(k => inner + quote(k) + ": " + format(v[k], inner, unit)).join(",\n") + "\n" + indent + "}";
        }
        return prim(v);
      }

      function patch(text, target) {
        const s = String(text);
        const root = parse(s);
        if (root.type !== "object" || !isObj(target)) throw new Error("根节点必须是对象");
        const unit = (() => { const m = root.members[0]; const ind = m ? lineIndent(m.start) : ""; return ind && atLineStart(m.start) ? ind : "    "; })();
        const edits = [];

        function lineStart(p) { return s.lastIndexOf("\n", p - 1) + 1; }
        function lineEnd(p) { const e = s.indexOf("\n", p); return e < 0 ? s.length : e; }
        function lineIndent(p) { const ls = lineStart(p); return /^[ \t]*/.exec(s.slice(ls, p))[0]; }
        function atLineStart(p) { return /^[ \t]*$/.test(s.slice(lineStart(p), p)); }
        // 行尾只剩空白或 // 注释
        const restIsBlank = (from, to) => /^[ \t]*(\/\/.*)?\r?$/.test(s.slice(from, to));
        const singleLine = node => !s.slice(node.start, node.end).includes("\n");
        const padded = node => s[node.start + 1] === " ";

        function replace(node, nv) {
          let out;
          if (node.type === "array" && Array.isArray(nv)) out = formatArrayLike(node, nv);
          else if (node.type === "object" && isObj(nv) && singleLine(node) && node.members.length) out = inlineObject(nv, padded(node));
          else out = format(nv, lineIndent(node.start), unit);
          edits.push({ start: node.start, end: node.end, text: out });
        }

        function inlineObject(nv, pad) {
          const keys = Object.keys(nv);
          if (!keys.length) return "{}";
          const p = pad ? " " : "";
          return "{" + p + keys.map(k => quote(k) + ": " + format(nv[k], "", unit, true)).join(", ") + p + "}";
        }

        // 数组按原来的样子写：原来一行就一行([ "a", "b" ] 还是 ["a", "b"])，原来多行就多行
        function formatArrayLike(node, nv) {
          if (!nv.length) return "[]";
          if (!nv.every(isPrim)) return format(nv, lineIndent(node.start), unit);
          if (singleLine(node)) {
            const p = padded(node) ? " " : "";
            return "[" + p + nv.map(prim).join(", ") + p + "]";
          }
          const itemIndent = node.items.length && atLineStart(node.items[0].value.start)
            ? lineIndent(node.items[0].value.start) : lineIndent(node.start) + unit;
          const closeIndent = atLineStart(node.end - 1) ? lineIndent(node.end - 1) : lineIndent(node.start);
          return "[\n" + nv.map(x => itemIndent + prim(x)).join(",\n") + "\n" + closeIndent + "]";
        }

        function diff(node, nv) {
          if (deepEqual(node.v, nv)) return;
          if (node.type === "object" && isObj(nv)) return diffObject(node, nv);
          if (node.type === "array" && Array.isArray(nv) && node.items.length === nv.length && !singleLine(node)) {
            node.items.forEach((it, idx) => diff(it.value, nv[idx]));
            return;
          }
          replace(node, nv);
        }

        function diffObject(node, nv) {
          const members = node.members;
          const has = k => Object.prototype.hasOwnProperty.call(nv, k);
          const keep = members.filter(m => has(m.key));
          const del = members.filter(m => !has(m.key));
          const known = new Set(members.map(m => m.key));
          const added = Object.keys(nv).filter(k => !known.has(k));
          // 一行写完的对象、删光了的对象：整个重写(一行的对象里不会有 // 注释)
          if (singleLine(node) || !keep.length) return replace(node, nv);
          const lastOf = new Map();
          members.forEach(m => lastOf.set(m.key, m));
          // 删掉的键：连同所在的整行(含行尾注释)一起删；不是独占一行的就整个对象重写
          const delEdits = [];
          for (const m of del) {
            const end = m.comma >= 0 ? m.comma + 1 : m.value.end;
            if (!atLineStart(m.start) || !restIsBlank(end, lineEnd(end))) return replace(node, nv);
            const e = lineEnd(end);
            delEdits.push({ start: lineStart(m.start), end: e < s.length ? e + 1 : e, text: "" });
          }
          const lastKeep = keep[keep.length - 1];
          const origLast = members[members.length - 1];
          const tail = [];
          if (added.length) {
            // 新键接在最后一个保留的键后面；它那一行末尾有注释的，接在注释之后
            const after = lastKeep.comma >= 0 ? lastKeep.comma + 1 : lastKeep.value.end;
            if (!restIsBlank(after, lineEnd(after))) return replace(node, nv);
            const indent = atLineStart(lastKeep.start) ? lineIndent(lastKeep.start) : lineIndent(node.start) + unit;
            const body = added.map(k => indent + quote(k) + ": " + format(nv[k], indent, unit)).join(",\n");
            const eol = lineEnd(after);
            const cr = s[eol - 1] === "\r" ? eol - 1 : eol;
            // 同一位置的两处插入：后应用的排在前面，所以先放换行内容、再放逗号
            tail.push({ start: cr, end: cr, text: "\n" + body + (lastKeep !== origLast && origLast.comma >= 0 ? "," : "") });
            if (lastKeep.comma < 0) tail.push({ start: lastKeep.value.end, end: lastKeep.value.end, text: "," });
          } else if (lastKeep !== origLast && lastKeep.comma >= 0 && origLast.comma < 0) {
            // 后面的键都删了：去掉它的逗号，不留尾逗号
            tail.push({ start: lastKeep.comma, end: lastKeep.comma + 1, text: "" });
          }
          for (const m of keep) if (lastOf.get(m.key) === m) diff(m.value, nv[m.key]);
          edits.push(...delEdits, ...tail);
        }

        diff(root, target);
        if (!edits.length) return s;
        edits.sort((a, b) => b.start - a.start || b.end - a.end);
        let out = s;
        let floor = Infinity;
        for (const e of edits) {
          if (e.end > floor) throw new Error("改动重叠，无法原地改写");
          out = out.slice(0, e.start) + e.text + out.slice(e.end);
          floor = e.start;
        }
        const check = parse(out).v;
        if (!deepEqual(check, target)) throw new Error("原地改写后的结果和表单不一致");
        return out;
      }

      return { parse, patch, format, deepEqual, quote, value: text => parse(String(text)).v };
    })();
    /* JSONC-END */

    const $ = id => document.getElementById(id);
    const isObj = v => v !== null && typeof v === "object" && !Array.isArray(v);
    const has = (o, k) => isObj(o) && Object.prototype.hasOwnProperty.call(o, k);
    const SPACE = String.fromCharCode(0x200A); // 细空格：组的值写它表示分隔符
    const CSV_LIKE = /^[A-Za-z][A-Za-z0-9]*$/; // 游戏把这种样子的值当词库名(找不到文件也不是翻译键时，整类起名保持原版)
    const snake = s => String(s).replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/:/g, "_").toLowerCase();

    // 简繁互补(zh-convert.js)：没加载时什么都不补
    const zhReady = () => typeof zhToTrad === "function" && typeof zhToSimp === "function";
    const toTrad = s => zhReady() ? zhToTrad(String(s ?? "")) : "";
    const toSimp = s => zhReady() ? zhToSimp(String(s ?? "")) : "";
    // 改了一边，另一边要不要跟着改：另一边没手改过，且空着、还是上次自动填的、或正好是旧值的转换才跟；
    // 清空一边不会清掉另一边。返回新值，不跟返回 null
    function followZh(prevSrc, newSrc, dst, conv, lastAuto, dstManual) {
      if (!zhReady() || dstManual || !String(newSrc ?? "").trim()) return null;
      const d = String(dst ?? "");
      if (d && d !== lastAuto && d !== conv(prevSrc)) return null;
      return conv(newSrc);
    }
    // 折叠的“高级”区块记住开合
    const openDetails = new Set();
    function bindDetails(root) {
      root.querySelectorAll("details[data-key]").forEach(el => {
        if (openDetails.has(el.dataset.key)) el.open = true;
        el.addEventListener("toggle", () => { if (el.open) openDetails.add(el.dataset.key); else openDetails.delete(el.dataset.key); });
      });
    }
    // 词库输入框 + “选”按钮(从已有文化的词库里挑，选别的文化的自动写成 文化:词库名)
    function libInput(attrs, value, placeholder, { filter = "", refOk = true } = {}) {
      return `<div style="display:flex;gap:4px;align-items:center"><input ${attrs} value="${esc(value ?? "")}" placeholder="${esc(placeholder || "")}">` +
        `<button class="small" data-pick="${esc(filter)}" data-refok="${refOk ? 1 : ""}" title="从已有的词库里选">选</button></div>`;
    }

    const BOOK_TYPES = [
      ["HistoryBook", "史书"], ["BadStoryAboutKing", "讽刺君王"], ["Fable", "志怪寓言"], ["FamilyStory", "家族"],
      ["FriendshipStory", "友情"], ["LoveStory", "爱情"], ["BiologyBook", "博物"], ["Mathbook", "算学"],
      ["DiplomacyManual", "外交"], ["EconomyManual", "经济"], ["StewardshipManual", "治理"], ["WarfareManual", "兵书"]
    ];
    const BOOK_KINDS = [
      ["Books", "固定书名", "每个全世界只用一次；也可以写带 $占位符$ 的书名"],
      ["BookTemplates", "书名模板", "用占位符组合，用不完"],
      ["BookWords", "$word$ 词", "模板里 $word$ 随机取一个"],
      ["BookTopics", "$topic$ 主题", "模板里 $topic$ 随机取一个"]
    ];
    const PLACEHOLDERS = "$word$ 词库  $topic$ 主题词  $author$ 作者  $city$ 城市  $kingdom$ 国家  $clan$ 氏族  $era$ 科技时代  " +
      "$dynasty$ 朝代(帝国名)  $dynasty_short$ 去掉“朝/国”的朝代名  $year_name$ 当朝年号  $emperor$ 当朝皇帝  " +
      "$past_emperor$ 某位先帝(有庙号用庙号)  $past_year_name$ 那位先帝的年号。取不到值(比如没有帝国)的模板会自动跳过。";

    // 文化包 Party 下的四张"理念 → 词库名"表(CultureRules.cs 的 PartySetting)；党名一列游戏只认本文件夹的词库
    const PARTY_MAPS = ["groups", "suffix_groups", "untitled_groups", "provisional_groups"];
    const PARTY_COLUMNS = [
      ["groups", "党名词库", "Party", false],
      ["suffix_groups", "共和国号后缀词库", "Suffix", true],
      ["untitled_groups", "非政府势力称呼词库", "Untitled", true],
      ["provisional_groups", "临时政府称呼词库", "Provisional", true]
    ];
    const IDEOLOGIES = ["Anarchism", "SocialDemocracy", "Libertarianism", "SocialLiberalism", "Capitalism", "ConservativeLiberalism",
      "Centrism", "Socialism", "Communism", "ReligiousDemocracy", "Authoritarianism", "Conservatism", "Fascism"];

    // 宪法 clauses 可写的条款与方案(ConstitutionSystem.ApplyValues、ConstitutionTemplates.json)
    const CONSTITUTION_CLAUSES = [
      ["territory", "央地关系", [["Unitary", "单一制"], ["Federal", "联邦制"]]],
      ["economy", "经济制度", [["PrivateProperty", "保护私有财产"], ["Mixed", "混合经济"], ["Planned", "计划经济"]]],
      ["religion", "政教关系", [["Secular", "政教分离"], ["StateReligion", "确立国教"]]],
      ["emergency", "紧急状态", [["Prohibited", "不得宣布"], ["Allowed", "元首可宣布"]]],
      ["ideology_intensity", "意识形态强度", [["High", "高"], ["Medium", "中"], ["Low", "低"]]],

    function confirmLeave() {
      if (S.dirty && !confirm("当前文化规则有未保存的修改，确定放弃？")) return false;

    // ---------- 查表：政体、制度线、物种、规则词、通用词库 ----------
    async function loadLookups() {
      const keys = new Set();
      // 政体：只有 RegimeType 枚举里的名字游戏才读得进去；SystemConfig.json 里写了的才有政体配置
      S.regimes = []; S.regimeConfig = {};
      try {
        const rs = await api.readText("Scripts/Regimes/RegimeSystem.cs");
        const m = /enum\s+RegimeType\s*\{([\s\S]*?)\}/.exec(rs.text || "");
        if (m) S.regimes = m[1].replace(/\/\*[\s\S]*?\*\//g, "").replace(/\/\/.*$/gm, "").split(",")
          .map(x => x.replace(/=.*$/s, "").trim()).filter(x => /^[A-Za-z_]\w*$/.test(x));
      } catch { }
      try {
        for (const e of (await api.listDir("Scripts/Regimes/Configs")).filter(e => e.dir)) {
          const r = await api.readText(`Scripts/Regimes/Configs/${e.name}/SystemConfig.json`);
          if (!r.exists) continue;
          try { for (const k of Object.keys(parseJsonLoose(r.text))) S.regimeConfig[k] = e.name; } catch { }
        }
      } catch { }
      if (!S.regimes.length) S.regimes = Object.keys(S.regimeConfig);
      S.regimes.forEach(r => keys.add(`regime_type_${r}`));
      // 制度科技线：InstitutionTrees/<线>.json，节点用于“开局阶段”
      S.lineInfo = {}; S.defaultLine = "";
      try {
        const files = (await api.listDir("InstitutionTrees")).filter(e => !e.dir && e.name.endsWith(".json"));
        for (const f of files) {
          const r = await api.readText(`InstitutionTrees/${f.name}`);
          let d = null;
          try { d = parseJsonLoose(r.text); } catch { continue; }
          if (f.name === "Settings.json") { S.defaultLine = d?.default_line || ""; continue; }
          const id = f.name.replace(/\.json$/, "");
          const nodes = (Array.isArray(d?.nodes) ? d.nodes : []).filter(n => n && n.id)
            .map(n => ({ id: n.id, nameKey: n.name_key || "", adv: Number(n.advancement) || 0 }))
            .sort((a, b) => a.adv - b.adv || a.id.localeCompare(b.id));
          S.lineInfo[id] = { nameKey: d?.name_key || "", nodes };
          if (d?.name_key) keys.add(d.name_key);
          nodes.forEach(n => n.nameKey && keys.add(n.nameKey));
        }
      } catch { }
      S.lines = Object.keys(S.lineInfo).sort();
      try { S.localeText = await api.readLocales([...keys]); } catch { S.localeText = {}; }
      try {
        const cfg = await api.readText("Scripts/Data/ConfigData.cs");
        const block = cfg.text.split("speciesCulturePair")[1] || "";
        S.species = uniq([...block.matchAll(/\{\s*"([^"]+)"\s*,\s*"[^"]+"\s*\}/g)].map(m => m[1])).sort();
      } catch { }
      try {
        const en = await api.readText("Scripts/Enums/OnomasticsType.cs");
        const body = (/enum\s+OnomasticsType\s*\{([\s\S]*?)\}/.exec(en.text || "") || [])[1] || "";
        S.onomastics = uniq(body.replace(/\[[^\]]*\]/g, "").replace(/\/\/.*$/gm, "").split(",").map(x => x.replace(/=.*$/s, "").trim())
          .filter(x => /^[A-Za-z_]\w*$/.test(x)));
      } catch { }
      // 通用词库(文化没配时用)
      S.general = {};
      for (const folder of ["Wilderness", "Settlements", "PartyNames", "Books"]) {
        try { S.general[folder] = new Set((await api.listDir(`Locales/Cultures/${folder}`)).filter(e => !e.dir).map(e => e.name)); }
        catch { S.general[folder] = new Set(); }
      }
    }

    const loc = key => S.localeText?.[key]?.cz || "";
    const regimeLabel = r => loc(`regime_type_${r}`) || REGIME_FALLBACK[r] || r;
    const lineLabel = id => loc(S.lineInfo[id]?.nameKey) || id;
    const nodeLabel = n => loc(n.nameKey) || n.id;

    async function reloadCultures(keep) {
      S.cultures = await api.listCultures();
      await prefetchLocaleKeys(S.cultures.map(c => c.data));
      renderList();
      const name = keep || S.current?.name;
      if (name && S.cultures.find(c => c.name === name)) selectCulture(name, true);
    }

    // 命名组里像词库名、又没有文件的值：看看是不是 Locales 里的翻译键("Clan" → 氏)
    async function prefetchLocaleKeys(datas) {
      const want = new Set();
      for (const d of datas) for (const key of Object.keys(NAMING)) {
        const groups = d?.setting?.[key]?.groups;
        if (isObj(groups)) for (const v of Object.values(groups)) if (typeof v === "string" && CSV_LIKE.test(v.trim()) && !(v.trim() in S.localeCache)) want.add(v.trim());
      }
      if (!want.size) return false;
      try {
        const r = await api.readLocales([...want]);
        for (const k of want) S.localeCache[k] = r?.[k]?.cz || r?.[k]?.en || r?.[k]?.ch || "";
      } catch { for (const k of want) S.localeCache[k] = ""; }
      return true;
    }

    function displayName(c) {
      const d = c.data || {};
      return d.translate_cz || d.translate_ch || d.translate_en || c.name;
    }

    function renderList() {
      const q = $("cultureFilter").value.trim().toLowerCase();
      const list = $("cultureList");
      list.innerHTML = S.cultures.filter(c => !q || c.name.toLowerCase().includes(q) || displayName(c).toLowerCase().includes(q))
        .map(c => {
          const errs = c.data ? collectIssues(c.data, c).filter(i => i.level === "err") : [];
          const bad = c.error || !c.data || errs.length;
          const title = c.error ? `解析失败：${c.error}` : errs.map(i => i.text).join("\n");
          return `<div class="item ${c.name === S.current?.name ? "active" : ""} ${bad ? "bad" : ""}" data-name="${esc(c.name)}" title="${esc(title)}">
            <span class="dot" style="background:${esc(c.data?.color || "#ccc")}"></span>${esc(displayName(c))}
            <span class="sub">${esc(c.name)}</span></div>`;
        }).join("");
      list.querySelectorAll(".item").forEach(el => el.onclick = () => selectCulture(el.dataset.name));
    }

    function selectCulture(name, force) {
      if (!force && S.current?.name !== name && !confirmLeave()) return;
      const c = S.cultures.find(x => x.name === name);
      if (!c) return;
      if (S.current?.name !== name) S.csv = null;
      S.current = c;
      S.rawText = c.text || "";
      S.orig = c.data ? JSON.parse(JSON.stringify(c.data)) : null;
      S.data = c.data ? JSON.parse(JSON.stringify(c.data)) : null;
      if (!S.data && !c.error) S.data = { name: c.name, color: "#888888", translate_cz: c.name, setting: {} };
      if (S.data) normalize(S.data);
      S.dirty = false;
      S.autoCh = S.autoCz = undefined;
      S.manualCh = S.manualCz = false;
      if (S.csv && !S.csv.dirty) S.csv = null;
      renderList();
      renderMain();
    }

    // 只补界面要用的空容器；保存时没填的新容器不会写进文件(见 buildTarget)
    function normalize(d) {
      if (!isObj(d.setting)) d.setting = {};
      const st = d.setting;
      if (!Array.isArray(d.species)) d.species = [];
      if (!Array.isArray(st.traits)) st.traits = [];
      if (!Array.isArray(st.political_traits)) st.political_traits = [];
      for (const key of Object.keys(NAMING)) {
        if (!isObj(st[key])) st[key] = {};
        if (!isObj(st[key].groups)) st[key].groups = {};
        if (!Array.isArray(st[key].rule)) st[key].rule = [];
      }
      if (!isObj(st.Party)) st.Party = {};
      for (const k of PARTY_MAPS) if (!isObj(st.Party[k])) st.Party[k] = {};
      if (!isObj(st.Constitution)) st.Constitution = {};
      if (!isObj(st.Constitution.clauses)) st.Constitution.clauses = {};
      if (!isObj(st.GrandName)) st.GrandName = {};
      if (!isObj(st.Settlement)) st.Settlement = {};
      if (!isObj(st.Settlement.terrain)) st.Settlement.terrain = {};
      if (!isObj(st.Wilderness)) st.Wilderness = {};
      for (const [m] of WILD_MAPS) if (!isObj(st.Wilderness[m])) st.Wilderness[m] = {};
    }

    function markDirty() {
      S.dirty = true;
      $("saveBtn")?.classList.add("dirty");

    // ---------- 词库引用 ----------
    // 词库名可写"别的文化:词库名"，文件是 Culture_<文化>/<文化><词库名>.csv
    function cultureFile(owner, lib) {
      const c = S.cultures.find(x => x.name === owner);
      const want = `${owner}${lib}.csv`.toLowerCase();
      return c?.csvs.find(f => f.toLowerCase() === want) || null;
    }
    function resolveLib(value, self = S.current?.name) {
      const v = String(value ?? "").trim();
      let owner = self, lib = v;
      const colon = v.indexOf(":");
      if (colon > 0) { owner = v.slice(0, colon).trim(); lib = v.slice(colon + 1).trim(); }
      const file = cultureFile(owner, lib);
      return { owner, lib, ref: colon > 0 && owner !== self, colon: colon > 0, exists: !!file,
        rel: `Locales/Cultures/Culture_${owner}/${file || owner + lib + ".csv"}` };
    }
    function generalLib(folder, lib) {
      const file = [...(S.general[folder] || [])].find(f => f.toLowerCase() === `${lib}.csv`.toLowerCase());
      return { owner: "", lib, general: folder, exists: !!file, rel: `Locales/Cultures/${folder}/${file || lib + ".csv"}` };
    }
    function openLink(r, label, hint = "") {
      return `<a href="#" data-open-rel="${esc(r.rel)}" data-lib="${esc(r.lib)}" data-owner="${esc(r.owner || "")}" data-general="${esc(r.general || "")}" data-hint="${esc(hint)}">${label}</a>`;
    }
    // 词库字段的状态格：空 → 默认(通用词库或说明)；别的文化 → 引用；本文件夹 → 打开 / 创建
    function libCell(value, { fallback = null, fallbackText = "", hint = "", refOk = true } = {}) {
      const v = String(value ?? "").trim();
      if (!v) {
        if (fallback) return `<span class="muted">默认 ${openLink(fallback, esc(`${fallback.general}/${fallback.lib}`), hint)}${fallback.exists ? "" : `<span class="tag-warn">(没有这个文件)</span>`}</span>`;
        return `<span class="muted">${esc(fallbackText || "未配置")}</span>`;
      }
      const r = resolveLib(v);
      if (r.colon && !refOk) return `<span class="tag-err" title="这一项游戏不认 别的文化:词库名 的写法，会退回默认">不支持引用</span>`;
      if (r.exists) return r.ref ? `引用 ${openLink(r, `Culture_${esc(r.owner)}`, hint)}` : openLink(r, "打开", hint);
      if (r.ref) return `<span class="tag-err" title="${esc(r.rel)}">Culture_${esc(r.owner)} 没有这个词库</span>`;
      return `<span class="tag-warn" title="游戏里按没配处理">没有文件</span> ${openLink(r, "＋ 创建", hint)}`;
    }
    function bindOpen(root) {
      root.querySelectorAll("a[data-open-rel]").forEach(a => a.onclick = e => {
        e.preventDefault();
        openCsv({ rel: a.dataset.openRel, lib: a.dataset.lib, owner: a.dataset.owner, general: a.dataset.general, hint: a.dataset.hint });
      });
    }

    // ---------- 页面 ----------
    const TABS = [["basic", "基本信息", "iconMainInfo"], ["naming", "命名规则", "iconCityName"], ["settlement", "村镇", "iconBuildings"],
      ["wilderness", "无人区", "iconResStone"], ["grand", "国号美号", "iconKingdom"], ["party", "政党", "iconPlot"], ["constitution", "宪法", "iconBooks"],
      ["books", "书籍词库", "iconBooksWritten"], ["files", "全部词库", "iconCultureList"], ["check", "检查", "iconQuestionMark"], ["raw", "JSON 原文", "iconEdit"]];

    function renderMain() {
      const main = $("main");
      const c = S.current;
      if (!c) return;
      if (!S.data && !["raw", "files", "books"].includes(S.tab)) S.tab = "raw";
      const issues = S.data ? collectIssues(S.data, c) : [];
      const errCount = issues.filter(i => i.level === "err").length, warnCount = issues.filter(i => i.level === "warn").length;
      main.innerHTML = `
        <h2><span class="dot" style="display:inline-block;width:18px;height:18px;border-radius:4px;background:${esc(S.data?.color || "#ccc")}"></span>
          ${esc(displayName(c))} <span class="badge">${esc(c.folder)}</span>
          <span style="flex:1"></span>
          <button id="openDirBtn" class="small">${ico("iconCultureList", "sm")}打开文件夹</button>
          <button id="saveBtn" class="primary">${ico("iconSaveLocal", "sm")}保存规则</button></h2>
        ${c.error ? `<div class="note" style="color:var(--danger)">CultureRule.jsonc 解析失败：${esc(c.error)}。请在“JSON 原文”里修正。</div>` : ""}
        ${!c.text && !c.error ? `<div class="note">这个文件夹还没有 CultureRule.jsonc，保存后会创建。</div>` : ""}
        <div class="tabs">${TABS.map(([id, label, icon]) => `<button data-tab="${id}" class="${S.tab === id ? "active" : ""}">${ico(icon, "sm")}${label}${id === "check" && (errCount || warnCount)
          ? ` <span class="${errCount ? "tag-err" : "tag-warn"}">${errCount || warnCount}</span>` : ""}</button>`).join("")}</div>
        <div id="tabBody"></div>
        <div id="csvEditor" style="margin-top:12px"></div>`;
      main.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; renderMain(); });
      $("openDirBtn").onclick = () => api.openPath(c.rel);
      $("saveBtn").onclick = saveRule;
      if (S.dirty) $("saveBtn").classList.add("dirty");
      renderTab();
      renderCsvEditor();
    }

    function renderTab() {
      const body = $("tabBody");
      if (!body) return;
      ({ basic: renderBasic, naming: renderNaming, settlement: renderSettlement, wilderness: renderWilderness, grand: renderGrand,
        party: renderParty, constitution: renderConstitution, books: renderBooks, files: renderFiles, check: renderCheck, raw: renderRaw })[S.tab](body);
      bindOpen(body);
      bindPickers(body);
      bindDetails(body);
    }

    // ---------- 选词库 ----------
    let picking = null;
    function bindPickers(root) {
      root.querySelectorAll("button[data-pick]").forEach(b => b.onclick = () => {
        const input = b.parentElement.querySelector("input");
        if (input && !input.disabled) openLibPicker(input, { filter: b.dataset.pick, refOk: !!b.dataset.refok });
      });
    }
    function openLibPicker(input, { filter, refOk }) {
      const cur = resolveLib(input.value.trim());
      picking = { input, refOk, filter };
      const self = S.current.name;
      const owners = [S.current, ...(refOk ? S.cultures.filter(c => c.name !== self && c.csvs.length) : [])];
      $("ldCulture").innerHTML = owners.map(c => `<option value="${esc(c.name)}">${c.name === self ? "本文化" : esc(displayName(c))} (${esc(c.name)})</option>`).join("");
      $("ldCulture").value = input.value.trim() && owners.some(c => c.name === cur.owner) ? cur.owner : self;
      $("ldFilter").value = filter || "";
      picking.current = input.value.trim() ? cur.lib : "";
      $("ldNote").textContent = refOk ? "选别的文化的词库会写成 文化:词库名，不复制文件。" : "这一项游戏只认本文件夹的词库。";
      renderLibChoices();
      $("ldOk").onclick = () => {
        const lib = $("ldList").value;
        if (!lib) return toast("先选一个词库", true);
        const owner = $("ldCulture").value;
        finishPick(owner === self ? lib : `${owner}:${lib}`);
      };
      $("ldClear").onclick = () => finishPick("");
      $("libDialog").showModal();
    }
    function renderLibChoices() {
      const owner = $("ldCulture").value;
      const c = S.cultures.find(x => x.name === owner);
      const libs = (c?.csvs || []).map(f => f.startsWith(owner) ? f.slice(owner.length, -4) : f.slice(0, -4)).sort();
      const q = $("ldFilter").value.trim().toLowerCase();
      let shown = q ? libs.filter(l => l.toLowerCase().includes(q)) : libs;
      if (!shown.length) shown = libs;
      $("ldList").innerHTML = shown.map(l => `<option value="${esc(l)}" ${l === picking?.current ? "selected" : ""}>${esc(l)}</option>`).join("");
      if (!$("ldList").value && shown.length) $("ldList").selectedIndex = 0;
    }
    function finishPick(value) {
      const p = picking;
      $("libDialog").close();
      picking = null;
      if (!p) return;
      p.input.value = value;
      p.input.dispatchEvent(new Event("change"));
    }

    function bindInput(el, getter, setter, evt = "input") {
      el.value = getter() ?? "";
      el.addEventListener(evt, () => { setter(el.value); markDirty(); });
    }

    // 下拉框：当前值不在选项里也照样显示，不会悄悄改掉
    function selectHtml(options, current, emptyLabel) {
      const cur = current ?? "";
      const list = [...(emptyLabel !== undefined ? [["", emptyLabel]] : []), ...options];
      if (!list.some(([v]) => v === cur)) list.push([cur, `(不认识) ${cur}`]);
      return list.map(([v, label]) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(label)}</option>`).join("");
    }

    function tianxiaOf(c) { const t = c?.data?.setting?.tianxia; return t && String(t).trim() ? String(t).trim() : c?.name; }

    function renderBasic(body) {
      const d = S.data, st = d.setting;
      const lineId = st.institution_line || S.defaultLine;
      const nodes = S.lineInfo[lineId]?.nodes || [];
      const myTx = (st.tianxia || "").trim() || d.name;
      const peers = S.cultures.filter(c => c.name !== S.current.name && tianxiaOf(c) === myTx).map(c => displayName(c));
      const txIds = uniq([...Object.keys(FAITH_BY_TIANXIA), ...S.cultures.map(c => (c.data?.setting?.tianxia || "").trim())]).sort();
      const autoFaith = FAITH_BY_TIANXIA[myTx] || "Folk";
      const faithLabel = id => (FAITHS.find(f => f[0] === id) || [id, id])[1];
      const driveDefault = st.political_traits.includes("strong_unification") ? 1 : 0;
      const regimeOpts = S.regimes.map(r => [r, `${regimeLabel(r)} (${r})${S.regimeConfig[r] ? "" : " · 没有政体配置"}`]);
      const religionFile = resolveLib("ReligionNames");
      const startNode = nodes.find(n => n.id === st.start_institution);
      const advSummary = [
        `开局：${st.start_institution ? (startNode ? nodeLabel(startNode) : st.start_institution) : "根节点"}`,
        `宗教：${st.faith ? faithLabel(st.faith) : `按天下(${faithLabel(autoFaith)})`}`,
        `统一倾向：${has(st, "unification_drive") && st.unification_drive >= 0 ? st.unification_drive : `默认 ${driveDefault}`}`,
        st.archipelago ? "列岛天下" : "", st.surname_evolution ? "姓氏演变" : "",
        st.Religion ? "宗教名直接写" : ""
      ].filter(Boolean).join(" · ");
      const unknownTraits = st.political_traits.filter(t => !POLITICAL_TRAITS.some(p => p[0] === t));
      body.innerHTML = `
        <div class="grid four">
          <label class="field">简体中文名<input id="bCz"><span class="hint">translate_cz</span></label>
          <label class="field">繁體中文名<input id="bCh" placeholder="${esc(toTrad(d.translate_cz || "") || "")}"><span class="hint">改简体时自动跟着转换 · translate_ch</span></label>
          <label class="field">English<input id="bEn" placeholder="${esc(d.name)}"><span class="hint">留空用文化 id(${esc(d.name)}) · translate_en</span></label>
          <label class="field">${ico("iconColorCustomization", "sm")} 地图颜色<input type="color" id="bColor"><span class="hint">文化图层的颜色 · color</span></label>
        </div>
        <div class="grid three" style="margin-top:10px">
          <label class="field">${ico("iconKings", "sm")} 默认政体<select id="bRegime">${selectHtml(regimeOpts, st.regime, "(不写：律令制)")}</select>
            <span class="hint">开局先看制度线一级制度的政体，线里没写才用这里 · regime</span></label>
          <label class="field">${ico("iconKnowledge", "sm")} 制度科技线<select id="bLine">${selectHtml(S.lines.map(l => [l, `${lineLabel(l)} (${l})`]), st.institution_line || "", `(默认线 ${S.defaultLine ? lineLabel(S.defaultLine) : ""})`)}</select>
            <span class="hint">InstitutionTrees 里的线 · institution_line</span></label>
          <label class="field">${ico("iconWorldInfo", "sm")} 天下标识<input id="bTianxia" list="dlTianxia" placeholder="(本文化自成一个天下)">
            <datalist id="dlTianxia">${txIds.map(t => `<option value="${esc(t)}">`).join("")}</datalist>
            <span class="hint">同标识的文化同属一个天下 · tianxia${peers.length ? `<br>同一天下：${esc(peers.join("、"))}` : ""}</span></label>
        </div>
        <h3>${ico("iconSpecies")}物种</h3>
        <p class="muted">这些物种默认属于本文化(覆盖代码里的默认映射；玩家自己的 CultureSpeciesPairPlayerConfig.json 仍然优先) · species</p>
        <div id="bSpecies"></div>
        <h3>${ico("iconEditTrait")}文化特质</h3>
        <p class="muted">游戏里文化特质的 id，比如 patriarchy(父系) · traits</p>
        <div id="bTraits"></div>
        <h3>${ico("iconKings")}政治特质 <span class="hint">political_traits</span></h3>
        <div class="check-list grid two">${POLITICAL_TRAITS.map(([id, l]) => `<label><input type="checkbox" data-pt="${id}" ${st.political_traits.includes(id) ? "checked" : ""}> ${esc(l)} <span class="hint">${id}</span></label>`).join("")}</div>
        ${unknownTraits.length ? `<p class="hint">其它写在文件里的政治特质(保留不动)：${esc(unknownTraits.join("、"))}</p>` : ""}
        <details data-key="basic-adv" style="margin-top:12px"><summary><b>高级</b> <span class="hint">${esc(advSummary)}</span></summary>
        <div class="grid four" style="margin-top:10px">
          <label class="field">${ico("iconInstitutionEnacted", "sm")} 开局阶段<select id="bStart">${selectHtml(nodes.map(n => [n.id, `${nodeLabel(n)} (${n.id})`]), st.start_institution || "", "(从根节点起步)")}</select>
            <span class="hint">开局即施行这个制度和它的全部前置 · start_institution</span></label>
          <label class="field">${ico("iconReligion", "sm")} 宗教类型<select id="bFaith">${selectHtml(FAITHS.map(([v, l]) => [v, `${l} (${v})`]), st.faith || "", `(按天下标识：${faithLabel(autoFaith)})`)}</select>
            <span class="hint">本文化创的宗教 · faith</span></label>
          <label class="field">${ico("iconWar", "sm")} 统一倾向(0~1)<input type="number" id="bDrive" min="0" max="1" step="0.1" placeholder="(默认 ${driveDefault})">
            <span class="hint">分裂时多想归于一统；留空：有强统一诉求算 1，否则 0 · unification_drive</span></label>
          <div class="field" style="display:grid;align-content:start;gap:2px">
            <label><input type="checkbox" id="bArch"> 列岛天下</label><span class="hint">隔海峡、在水师辐射里的同标识天下也相并(日本) · archipelago</span>
            <label><input type="checkbox" id="bSurname"> 姓氏演变</label><span class="hint">原始无姓→有姓→分氏→姓氏合一，只对华夏线有效 · surname_evolution</span>
          </div>
        </div>
        <div class="grid two" style="margin-top:10px">
          <label class="field">${ico("iconReligion", "sm")} 直接写的宗教名(用空格隔开)<input id="bReligion" placeholder="(留空用右边的宗教名词库)">
            <span class="hint">写了就从这里随机取，不读词库；写的是名字本身，不是词库名 · Religion</span></label>
          <div class="field">宗教名词库 <span>${religionFile.exists ? openLink(religionFile, `打开 ${esc(S.current.name)}ReligionNames.csv`) : `<span class="tag-warn">还没有</span> ${openLink(religionFile, "＋ 创建")}`}</span>
            <span class="hint">宗教类型是多神民间时创教从这里取名(别的类型有自己的名库)；多神民间又没有宗教名会出错</span></div>
        </div>
        </details>`;
      const czEl = body.querySelector("#bCz"), chEl = body.querySelector("#bCh");
      czEl.value = d.translate_cz || ""; chEl.value = d.translate_ch || "";
      // 简繁互相跟着填；手改过的一边不再跟
      czEl.oninput = () => {
        const prev = d.translate_cz || ""; d.translate_cz = czEl.value; S.manualCz = true;
        const next = followZh(prev, czEl.value, d.translate_ch, toTrad, S.autoCh, S.manualCh);
        if (next !== null) { d.translate_ch = next; S.autoCh = next; chEl.value = next; }
        markDirty();
      };
      chEl.oninput = () => {
        const prev = d.translate_ch || ""; d.translate_ch = chEl.value; S.manualCh = true;
        const next = followZh(prev, chEl.value, d.translate_cz, toSimp, S.autoCz, S.manualCz);
        if (next !== null) { d.translate_cz = next; S.autoCz = next; czEl.value = next; }
        markDirty();
      };
      bindInput(body.querySelector("#bEn"), () => d.translate_en, v => d.translate_en = v);
      bindInput(body.querySelector("#bColor"), () => /^#[0-9a-f]{6}$/i.test(d.color || "") ? d.color : "#888888", v => d.color = v.toUpperCase());
      bindInput(body.querySelector("#bRegime"), () => st.regime || "", v => { if (v) st.regime = v; else delete st.regime; }, "change");
      bindInput(body.querySelector("#bLine"), () => st.institution_line || "", v => { st.institution_line = v; renderTab(); }, "change");
      bindInput(body.querySelector("#bStart"), () => st.start_institution || "", v => { st.start_institution = v; renderTab(); }, "change");
      bindInput(body.querySelector("#bTianxia"), () => st.tianxia || "", v => st.tianxia = v.trim(), "change");
      body.querySelector("#bTianxia").addEventListener("change", () => renderTab());
      bindInput(body.querySelector("#bFaith"), () => st.faith || "", v => { st.faith = v; renderTab(); }, "change");
      bindInput(body.querySelector("#bDrive"), () => has(st, "unification_drive") && st.unification_drive >= 0 ? st.unification_drive : "",
        v => { if (v === "" || isNaN(Number(v))) delete st.unification_drive; else st.unification_drive = Math.min(1, Math.max(0, Number(v))); });
      bindInput(body.querySelector("#bReligion"), () => st.Religion || "", v => st.Religion = v);
      const arch = body.querySelector("#bArch"), sur = body.querySelector("#bSurname");
      arch.checked = st.archipelago === true; sur.checked = st.surname_evolution === true;
      arch.onchange = () => { st.archipelago = arch.checked; markDirty(); renderTab(); };
      sur.onchange = () => { st.surname_evolution = sur.checked; markDirty(); renderTab(); };
      body.querySelectorAll("input[data-pt]").forEach(cb => cb.onchange = () => {
        const id = cb.dataset.pt, i = st.political_traits.indexOf(id);
        if (cb.checked && i < 0) st.political_traits.push(id);
        if (!cb.checked && i >= 0) st.political_traits.splice(i, 1);
        markDirty(); renderTab();
      });
      body.querySelector("#bSpecies").appendChild(chipEditor(d.species, { suggestions: S.species, placeholder: "物种 id，回车添加", onChange: markDirty }));
      body.querySelector("#bTraits").appendChild(chipEditor(st.traits, { suggestions: ["patriarchy", "matriarchy"], placeholder: "特质 id，回车添加", onChange: markDirty }));
    }

    // ---------- 命名规则 ----------
    function groupLabel(v) { return !String(v ?? "").trim() ? "(细空格)" : v; }

    // 命名组的值：空白 = 分隔符；别的文化:词库名 = 引用；本文件夹有词库 = 词库；像词库名但没文件 = 翻译键或找不到；其余 = 直接写的词
    function groupStatus(v) {
      const t = String(v ?? "").trim();
      if (!t) return `<span class="muted">分隔符</span>`;
      const r = resolveLib(t);
      if (r.colon) return r.exists ? `引用 ${openLink(r, `Culture_${esc(r.owner)}`)}` : `<span class="tag-err" title="游戏里这一类起名会保持原版">引用的词库不存在</span>`;
      if (r.exists) return openLink(r, "打开词库");
      if (CSV_LIKE.test(t)) {
        const text = S.localeCache[t];
        if (text) return `<span class="muted" title="Locales 里的翻译键，直接用它的译文">翻译键：${esc(text)}</span>`;
        if (text === undefined) return `<span class="muted">…</span>`;
        return `<span class="tag-err" title="没有这个词库也没有这个翻译键：游戏里这一类起名会保持原版">找不到</span> ${openLink(r, "＋ 创建")}`;
      }
      return `<span class="muted" title="不是词库名，游戏把它当作直接写的词，用空格隔开">直接写的词(${t.split(/\s+/).length} 个)</span>`;
    }

    // 拼接规则：可以重复(sex_male 可出现多次)、可以左移
    function ruleEditor(values, { suggestions, known, labels, onChange }) {
      const wrap = document.createElement("div");
      wrap.className = "chips";
      const listId = "dl" + Math.random().toString(36).slice(2);
      const render = () => {
        wrap.innerHTML = values.map((v, i) => `<span class="chip ${known.has(v) ? "" : "missing"}" title="${esc(known.has(v) ? (labels[v] || "") : "不是规则词：整个文化会读取失败")}">` +
          `${i ? `<button class="mv" data-l="${i}" title="左移">‹</button>` : ""}${esc(v)}${labels[v] ? `<small>${esc(labels[v])}</small>` : ""}<button data-d="${i}" title="删除">×</button></span>`).join("") +
          `<span class="chip-add"><input list="${listId}" placeholder="组名或规则词，回车添加"><datalist id="${listId}">${suggestions.map(s => `<option value="${esc(s)}">`).join("")}</datalist></span>`;
        wrap.querySelectorAll("button[data-d]").forEach(b => b.onclick = () => { values.splice(Number(b.dataset.d), 1); render(); onChange(); });
        wrap.querySelectorAll("button[data-l]").forEach(b => b.onclick = () => {
          const i = Number(b.dataset.l); [values[i - 1], values[i]] = [values[i], values[i - 1]]; render(); onChange();
        });
        const input = wrap.querySelector("input");
        input.addEventListener("keydown", e => {
          if (e.key !== "Enter") return;
          const v = input.value.trim();
          if (v) { values.push(v); render(); onChange(); wrap.querySelector("input").focus(); }
        });
      };
      render();
      return wrap;
    }

    function renderNaming(body) {
      body.innerHTML = `<div class="note">
        <b>组</b>：组名(group_1 ~ group_10) → 词库。词库是本文件夹的 <code>${esc(S.current.name)}&lt;词库名&gt;.csv</code>，
        也可以写 <code>别的文化:词库名</code> 直接用别的文化的词库；值写成细空格(按钮“空格组”)表示分隔符；不是词库名的值当作直接写的词或翻译键。
        找不到词库的那一类，游戏保持原版起名。<br>
        <b>拼接规则</b>：按顺序拼接，可以写组名，也可以写 sex_male / sex_female(前一组只给男/女)、coin_flip(前一组五成机会)、space(空格)等，
        写错一个词整个文化都读不进去。<b>有效名字位置</b>：按空格拆开后第几段是“名字本身”(从 0 数，如“XX 市”是 0)。</div>
        <div id="namingCards" class="grid" style="margin-top:10px"></div>`;
      const box = body.querySelector("#namingCards");
      const missing = [];
      for (const [key, meta] of Object.entries(NAMING)) {
        const cfg = S.data.setting[key];
        const rows = Object.entries(cfg.groups);
        rows.forEach(([, v]) => { const t = String(v ?? "").trim(); if (CSV_LIKE.test(t) && !(t in S.localeCache)) missing.push(t); });
        const card = document.createElement("div");
        card.className = "card";
        const absent = !has(S.orig?.setting, key);
        const freeGroups = n => Array.from({ length: 10 }, (_, i) => `group_${i + 1}`).filter(g => g === n || !has(cfg.groups, g));
        const sexPost = (field, idx) => (Array.isArray(cfg[field]) ? cfg[field][idx] : "") ?? "";
        card.innerHTML = `<h3 style="margin-top:0">${ico(meta.icon)}${meta.label} <span class="badge">${key}</span></h3>
          ${absent ? `<div class="note" style="color:var(--danger)">规则里没有这一类，游戏起名会出错。加上组和拼接规则后保存即可补上。</div>` : ""}
          <table class="sheet"><tr><th style="width:120px">组名</th><th>词库 / 内容</th><th style="width:170px">状态</th><th class="act"></th></tr>
          ${rows.map(([g, lib], i) => `<tr><td><select data-g="${i}">${selectHtml(freeGroups(g).map(x => [x, x]), g)}</select></td>
            <td>${!String(lib ?? "").trim() ? `<input data-l="${i}" value="${esc(groupLabel(lib))}" disabled>` : libInput(`data-l="${i}"`, lib, "", { filter: meta.pick || key })}</td>
            <td class="cell-pad">${groupStatus(lib)}</td>
            <td class="act"><button class="small" data-del="${i}">×</button></td></tr>`).join("")}
          </table>
          <div class="toolbar" style="margin:6px 0"><button class="small" data-add="lib">＋ 词库组</button><button class="small" data-add="space">＋ 空格组</button></div>
          <label class="field">拼接规则 · rule</label><div class="rule"></div>

        </table>

      body.querySelector("#gGroup").onchange = e => {
        const v = e.target.value.trim();
        if (v || has(S.orig?.setting?.GrandName, "group")) g.group = v; else delete g.group;

      };
      body.querySelector("#gPrefix").onchange = e => { if (e.target.value) g.prefix = e.target.value; else delete g.prefix; markDirty(); };
      // 取义词库里给美号词库的每一条补一行(key 加 _meaning)，已有的不动
      body.querySelector("#gMeaningFill").onclick = async () => {
        const r = resolveLib(g.group || "GrandNames");
        if (r.ref) return toast("美号词库引用了别的文化，取义请到那个文化里补", true);
        const names = await api.readText(r.rel);
        if (!names.exists) return toast(`还没有 ${r.lib} 词库`, true);
        const meanings = resolveLib("GrandNameMeanings");
        if (!await openCsv({ rel: meanings.rel, lib: meanings.lib, owner: meanings.owner, hint: "grand-meaning" })) return;
        const c = S.csv, have = new Set(c.rows.filter(x => !x.blank).map(x => x.cells[0]));
        let added = 0;
        for (const row of csvModel(names.text, true).rows) {
          const key = (row.cells?.[0] || "").trim();
          if (!key || key.endsWith("_meaning") || have.has(key + "_meaning")) continue;
          const cells = new Array(c.header.length).fill(""); cells[0] = key + "_meaning";
          c.rows.push({ cells, raw: null, changed: true }); added++;
        }
        if (added) c.dirty = true;
        renderCsvEditor();
        toast(added ? `补了 ${added} 条，填好取义后点“保存 csv”` : "取义条目已齐");
      };
    }

      body.querySelectorAll("input[data-cn]").forEach(inp => inp.onchange = () => {
