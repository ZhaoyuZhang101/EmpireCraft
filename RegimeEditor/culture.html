        if (v || has(S.orig?.setting?.Constitution, inp.dataset.cn)) c[inp.dataset.cn] = v; else delete c[inp.dataset.cn];
        markDirty(); renderTab();
      });
      body.querySelectorAll("select[data-cc]").forEach(sel => sel.onchange = () => {
        if (sel.value) c.clauses[sel.dataset.cc] = sel.value; else delete c.clauses[sel.dataset.cc];
        markDirty();
      });
    }

    // ---------- 书籍 ----------
    function renderBooks(body) {
      const cell = lib => {
        const r = resolveLib(lib), g = generalLib("Books", lib);
        return `<td class="cell-pad">${r.exists ? openLink(r, "编辑", "books") : `${openLink(r, "＋ 创建", "books")}${g.exists ? ` <span class="muted">(现用 ${openLink(g, "通用", "books")})</span>` : ""}`}</td>`;
      };
      body.innerHTML = `<div class="note">书写出来时按类型从这里取名。本文化没有的文件用 <code>Locales/Cultures/Books/</code> 下的通用词库。<br>占位符：${esc(PLACEHOLDERS)}</div>
        <table class="sheet" style="margin-top:10px"><tr><th>类型</th>${BOOK_KINDS.map(([k, label, tip]) => `<th title="${esc(tip)}">${label}</th>`).join("")}</tr>
        ${BOOK_TYPES.map(([tag, label]) => `<tr><td class="cell-pad">${ico("iconBooks", "sm")} ${label} <span class="muted">${tag}</span></td>${BOOK_KINDS.map(([k]) => cell(k + tag)).join("")}</tr>`).join("")}
        <tr><td class="cell-pad">${ico("iconBooksWritten", "sm")} 传世名著</td>${cell("LandmarkBooks")}<td colspan="3" class="cell-pad muted">key 为 landmark_book_&lt;书 id&gt;(见 Technology/LandmarkBooks.json)，值为本文化的书名</td></tr>
        <tr><td class="cell-pad">${ico("iconWorldInfo", "sm")} 名著问世播报</td>${cell("LandmarkBookLogs")}<td colspan="3" class="cell-pad muted">{0} 文化 {1} 作者 {2} 书名 {3} 城市，随机取一句</td></tr>
        <tr><td class="cell-pad">${ico("iconKnowledge", "sm")} 理念著作</td>${cell("IdeologyBooks")}<td colspan="3" class="cell-pad muted">和通用的 Books/IdeologyBooks.csv 合并使用；key 以 &lt;理念&gt;_ 开头是该理念专属，Any_ 开头是通用模板；{0} 理念名 {1} 作者 {2} 城市 {3} 奠基名著</td></tr>
        </table>`;
    }

    // ---------- 全部词库 ----------
    function libGroupOf(lib) {
      if (/^(Books|BookTemplates|BookWords|BookTopics|Landmark|IdeologyBooks)/.test(lib)) return "书籍";
      if (/^(Party|Suffix|Untitled|Provisional)/.test(lib)) return "政党";
      if (/^Wild/.test(lib)) return "无人区";
      if (/^(Village|Town|Fort|Surname|Terrain|Yurt)/.test(lib)) return "村镇";
      if (/^GrandName|Constitution|Charter/.test(lib)) return "国号与宪法";
      if (/Names|Ancient|^Shi|NickNames|Letters/.test(lib)) return "命名";
      return "其他";
    }
    function renderFiles(body) {
      const groups = { "命名": [], "村镇": [], "无人区": [], "国号与宪法": [], "政党": [], "书籍": [], "其他": [] };
      for (const f of S.current.csvs) {
        const lib = f.startsWith(S.current.name) ? f.slice(S.current.name.length, -4) : f.slice(0, -4);
        groups[libGroupOf(lib)].push([lib, f]);
      }
      // 别的文化引用了本文化的哪些词库
      const usedBy = S.cultures.filter(c => c.name !== S.current.name && c.text.includes(`"${S.current.name}:`))
        .map(c => `${displayName(c)}(${uniq([...c.text.matchAll(new RegExp(`"${S.current.name}:([A-Za-z0-9_]+)"`, "g"))].map(m => m[1])).join("、")})`);
      body.innerHTML = `<div class="toolbar"><input id="newLib" placeholder="新词库名，比如 CityNames4" style="width:260px"><button id="newLibBtn">＋ 新建词库</button></div>
        ${usedBy.length ? `<p class="hint">别的文化引用了本文化的词库：${esc(usedBy.join("；"))}。改这些词库会一起影响它们。</p>` : ""}
        ${Object.entries(groups).map(([g, libs]) => libs.length ? `<h3>${g} <span class="badge">${libs.length}</span></h3><div class="chips">${libs.map(([l, f]) =>
          `<span class="chip">${openLink({ rel: `${S.current.rel}/${f}`, lib: l, owner: S.current.name }, esc(l))}</span>`).join("")}</div>` : "").join("")}`;
      body.querySelector("#newLibBtn").onclick = () => {
        const v = body.querySelector("#newLib").value.trim();
        if (!/^[A-Za-z][A-Za-z0-9_]*$/.test(v)) return toast("词库名只能用英文字母、数字和下划线", true);
        const r = resolveLib(v);
        openCsv({ rel: r.rel, lib: r.lib, owner: r.owner });
      };
    }

    // ---------- 检查 ----------
    // 按 C# 读取逻辑找会出错、会悄悄失效的配置。level：err 游戏读不进去/会出错；warn 某项不生效
    function collectIssues(d, culture) {
      const out = [];
      const add = (level, text, tab) => out.push({ level, text, tab });
      const self = culture.name;
      const st = isObj(d.setting) ? d.setting : null;
      const exists = v => { const r = resolveLib(v, self); return r.exists; };
      if (!st) { add("err", "缺少 setting：游戏不会读这个文化", "raw"); return out; }
      if (d.name && d.name !== self) add("err", `name 写的是“${d.name}”，和文件夹 Culture_${self} 对不上：游戏按 name 认文化，词库却按 name 找文件夹`, "raw");
      if (has(st, "regime") && S.regimes.length && !S.regimes.includes(st.regime)) add("err", `默认政体“${st.regime}”不是游戏里的政体，整个文化会读取失败`, "basic");
      else if (st.regime && Object.keys(S.regimeConfig).length && !S.regimeConfig[st.regime]) add("warn", `默认政体 ${st.regime} 没有政体配置(Scripts/Regimes/Configs)`, "basic");
      if (st.institution_line && S.lines.length && !S.lineInfo[st.institution_line]) add("warn", `制度线“${st.institution_line}”不存在，会退回默认线`, "basic");
      const lineNodes = S.lineInfo[st.institution_line || S.defaultLine]?.nodes;
      if (st.start_institution && lineNodes && !lineNodes.some(n => n.id === st.start_institution)) add("warn", `开局阶段“${st.start_institution}”不是这条制度线的节点`, "basic");
      if (st.faith && !FAITHS.some(f => f[0].toLowerCase() === String(st.faith).trim().toLowerCase())) add("warn", `宗教类型“${st.faith}”游戏不认，会按天下标识取`, "basic");
      const tx = (st.tianxia || "").trim() || self;
      const faith = FAITHS.find(f => f[0].toLowerCase() === String(st.faith || "").trim().toLowerCase())?.[0] || FAITH_BY_TIANXIA[tx] || "Folk";
      if (faith === "Folk" && !String(st.Religion || "").trim() && !cultureFile(self, "ReligionNames"))
        add("err", "宗教类型是多神民间，却既没写宗教名也没有 ReligionNames 词库：创教时会出错", "basic");
      if (/^ReligionNames$/i.test(String(st.Religion || "").trim())) add("warn", "宗教名写的是 ReligionNames：游戏会把它当作宗教名本身。想用词库就留空", "basic");
      if (has(st, "unification_drive") && (typeof st.unification_drive !== "number" || st.unification_drive > 1)) add("warn", "统一倾向应在 0~1 之间", "basic");
      if (d.color && !/^#[0-9a-f]{6}([0-9a-f]{2})?$/i.test(d.color)) add("warn", `颜色“${d.color}”格式不对，地图上会随便取色`, "basic");
      for (const t of st.political_traits || []) if (!POLITICAL_TRAITS.some(p => p[0] === t)) add("info", `政治特质 ${t} 代码里没用到(制度节点的 requires_traits 可能会用)`, "basic");
      const tokens = new Set(S.onomastics);
      for (const [key, meta] of Object.entries(NAMING)) {
        const cfg = st[key];
        const hasRule = isObj(cfg) && ((isObj(cfg.groups) && Object.keys(cfg.groups).length) || (Array.isArray(cfg.rule) && cfg.rule.length));
        if (!hasRule) { add("err", `缺少${meta.label}起名(${key})：游戏起名会出错`, "naming"); continue; }
        const groups = isObj(cfg.groups) ? cfg.groups : {};
        for (const tk of Array.isArray(cfg.rule) ? cfg.rule : []) {
          if (tokens.size && !tokens.has(tk)) add("err", `${meta.label}的拼接规则里“${tk}”不是规则词：整个文化会读取失败`, "naming");
          else if (/^group_\d+$/.test(tk) && !has(groups, tk)) add("info", `${meta.label}的拼接规则用了 ${tk}，但没有这一组(这一段是空的)`, "naming");
        }
        for (const [g, v] of Object.entries(groups)) {
          if (!/^group_([1-9]|10)$/.test(g)) add("warn", `${meta.label}的组名“${g}”不是 group_1~group_10，拼接规则里用不了`, "naming");
          const t = String(v ?? "").trim();
          if (!t) continue;
          if (t.indexOf(":") > 0) { if (!exists(t)) add("warn", `${meta.label}的 ${g} 引用的 ${t} 不存在：这一类保持原版起名`, "naming"); continue; }
          if (!exists(t) && CSV_LIKE.test(t) && S.localeCache[t] === "") add("warn", `${meta.label}的 ${g} 找不到词库 ${self}${t}.csv：这一类保持原版起名`, "naming");
        }
        for (const f of EXTRA_FIELDS) if (cfg[f] && !exists(cfg[f])) add("warn", `${meta.label}的 ${f} 词库 ${cfg[f]} 不存在`, "naming");
      }
      const libField = (v, what, tab) => { if (String(v ?? "").trim() && !exists(v)) add("warn", `${what}的词库 ${v} 不存在，会用默认`, tab); };
      if (isObj(st.Party)) {
        for (const [id, v] of Object.entries(st.Party.groups || {})) {
          if (String(v).indexOf(":") > 0) add("warn", `党名(${id})写了引用 ${v}：党名游戏只认本文件夹的词库，会用默认党名`, "party");
          else libField(v, `党名(${id})`, "party");
        }
        for (const m of ["suffix_groups", "untitled_groups", "provisional_groups"]) for (const [id, v] of Object.entries(st.Party[m] || {})) libField(v, `政党 ${m}(${id})`, "party");
      }
      if (isObj(st.Constitution)) for (const f of ["name_group", "provisional_name_group"]) libField(st.Constitution[f], `宪法 ${f}`, "constitution");
      if (isObj(st.Settlement)) {
        for (const [f, label] of SETTLEMENT_LIBS) libField(st.Settlement[f], `村镇 ${label}`, "settlement");
        for (const [t, v] of Object.entries(st.Settlement.terrain || {})) libField(v, `村镇地势词(${t})`, "settlement");
        for (const [m] of SETTLEMENT_MODES) for (const k of Object.keys(st.Settlement[m] || {})) if (!SETTLEMENT_METHODS.some(x => x[0] === k)) add("warn", `村镇 ${m} 里的“${k}”不是命名方式(surname / terrain / words)`, "settlement");
      }
      if (isObj(st.Wilderness)) {
        for (const [m, label] of WILD_MAPS) for (const [k, v] of Object.entries(st.Wilderness[m] || {})) {
          if (!WILD_KINDS.some(x => x[0] === k.trim().toLowerCase())) add("warn", `无人区 ${m} 里的“${k}”不是无人区类型`, "wilderness");
          libField(v, `无人区${label}(${k})`, "wilderness");
        }
        libField(st.Wilderness.directions, "无人区方位字头", "wilderness");
      }
      if (isObj(st.GrandName) && st.GrandName.group) libField(st.GrandName.group, "美号", "grand");
      return out;
    }

    function issuesHtml(list) {
      if (!list.length) return `<div class="tag-ok">没有发现问题。</div>`;
      const tabName = id => (TABS.find(t => t[0] === id) || [, ""])[1];
      return `<div class="issues">${list.map(i => `<div><span class="${i.level === "err" ? "tag-err" : i.level === "warn" ? "tag-warn" : "muted"}">${i.level === "err" ? "出错" : i.level === "warn" ? "不生效" : "提示"}</span>
        ${esc(i.text)} ${i.tab ? `<a href="#" data-goto="${i.tab}">${esc(tabName(i.tab))}</a>` : ""}</div>`).join("")}</div>`;
    }

    function renderCheck(body) {
      body.innerHTML = `<div class="note">按游戏读取规则检查本文化(以表单当前内容为准，未保存的修改也算)。“出错”是游戏读不进去或会报错，“不生效”是那一项会被忽略、退回默认。</div>
        ${issuesHtml(collectIssues(S.data, S.current))}
        <div class="toolbar" style="margin-top:10px"><button id="checkAll">检查全部文化(按已保存的文件)</button></div>
        <div id="checkAllBox"></div>`;
      body.querySelectorAll("[data-goto]").forEach(a => a.onclick = e => { e.preventDefault(); S.tab = a.dataset.goto; renderMain(); });
      body.querySelector("#checkAll").onclick = () => {
        const box = body.querySelector("#checkAllBox");
        box.innerHTML = S.cultures.map(c => {
          const list = c.data ? collectIssues(c.data, c).filter(i => i.level !== "info") : [{ level: "err", text: `CultureRule.jsonc 解析失败：${c.error || "没有文件"}` }];
          return `<h3>${esc(displayName(c))} <span class="badge">${esc(c.name)}</span></h3>${list.length ? issuesHtml(list).replace(/<a href="#" data-goto[^>]*>[^<]*<\/a>/g, "") : `<div class="tag-ok">没有问题</div>`}`;
        }).join("");
      };
    }

    // ---------- JSON 原文 ----------
    function renderRaw(body) {
      let preview = S.rawText, note = "";
      if (S.data && (S.dirty || !S.rawText)) {
        try { preview = ruleTextFor(S.data); note = "下面是按表单改动后将要写入的内容。"; }
        catch (e) { note = `表单改动没法原地写进原文(${e.message})，下面是原文。`; }
      }
      body.innerHTML = `<div class="note">直接编辑 CultureRule.jsonc(允许 // 注释)。“按原文保存”把这里的内容原样写入；在其它页签保存只改动过的值，注释和不认识的字段都保留。${esc(note)}</div>
        <textarea class="code" id="rawText" style="margin-top:8px" spellcheck="false"></textarea>
        <div class="toolbar" style="margin-top:8px"><button class="primary" id="rawSave">${ico("iconSaveLocal", "sm")}按原文保存</button></div>`;
      const ta = body.querySelector("#rawText");
      ta.value = preview || "";
      body.querySelector("#rawSave").onclick = saveRaw;
    }

    async function saveRaw() {
      const ta = $("rawText");
      if (!ta) return;
      let parsed;
      try { parsed = Jsonc.value(ta.value); } catch (e) { return toast("JSON 格式错误：" + e.message, true); }
      if (parsed?.name && parsed.name !== S.current.name && !confirm(`name 写的是“${parsed.name}”，和文件夹 Culture_${S.current.name} 对不上，游戏会认错文化。仍要保存？`)) return;
      await api.writeText(`${S.current.rel}/CultureRule.jsonc`, ta.value);
      S.dirty = false; toast("已保存 CultureRule.jsonc(按原文)"); await reloadCultures(S.current.name);
    }

    // ---------- 保存规则 ----------
    const TRUE_BY_DEFAULT = new Set(["english_type_prefix"]);
    // 新加的键是空值/默认值就不写进文件；原文已有的键照写(哪怕清空)
    function isDefaultValue(key, v) {
      if (v === undefined || v === null || v === "") return true;
      if (Array.isArray(v)) return v.length === 0;
      if (typeof v === "boolean") return v === TRUE_BY_DEFAULT.has(key);
      if (isObj(v)) return Object.keys(v).length === 0;
      return false;
    }
    function buildTarget(cur, orig) {
      const out = {};
      for (const [k, v] of Object.entries(cur)) {
        if (v === undefined) continue;
        const had = has(orig, k);
        if (isObj(v)) {
          const sub = buildTarget(v, had ? orig[k] : undefined);
          if (had || Object.keys(sub).length) out[k] = sub;
        } else if (had || !isDefaultValue(k, v)) out[k] = v;
      }
      return out;
    }
    function ruleTextFor(data) {
      const target = buildTarget(data, S.orig || {});
      return S.rawText && S.orig ? Jsonc.patch(S.rawText, target) : Jsonc.format(target) + "\n";
    }

    async function saveRule() {
      if (!S.current) return;
      if (S.tab === "raw") return saveRaw();
      if (!S.data) return toast("规则解析失败，请在 JSON 原文里修正", true);
      let text;
      try { text = ruleTextFor(S.data); }
      catch (e) {
        if (!confirm(`没法在原文上直接改(${e.message})。改为按表单整个重写？文件里的注释会丢失。`)) return;
        text = Jsonc.format(buildTarget(S.data, S.orig || {})) + "\n";
      }
      if (text === S.rawText) { S.dirty = false; $("saveBtn")?.classList.remove("dirty"); return toast("没有改动"); }
      const errs = collectIssues(Jsonc.value(text), S.current).filter(i => i.level === "err");
      if (errs.length && !confirm(`保存后游戏会有这些问题：\n${errs.map(i => "· " + i.text).join("\n")}\n\n仍要保存？`)) return;
      await api.writeText(`${S.current.rel}/CultureRule.jsonc`, text);
      S.dirty = false;
      toast(`已保存 ${S.current.folder}/CultureRule.jsonc`);
      await reloadCultures(S.current.name);
    }

    // ---------- CSV 词库(key,cz,en,ch) ----------
    // 没改的行原样写回；换行符、文件末尾换行照原文件
    function csvModel(text, exists) {
      const t = String(text || "");
      if (!exists || !t.trim()) return { nl: "\n", trailing: true, headerRaw: "key,cz,en,ch", header: ["key", "cz", "en", "ch"], rows: [] };
      const nl = t.includes("\r\n") ? "\r\n" : "\n";
      const trailing = /\n$/.test(t);
      const lines = t.split(/\r?\n/);
      if (trailing) lines.pop();
      return { nl, trailing, headerRaw: lines[0], header: parseCsvLine(lines[0]),
        rows: lines.slice(1).map(raw => raw.trim() ? { cells: parseCsvLine(raw), raw, changed: false } : { blank: true, raw }) };
    }
    function csvText(c) {
      return [c.headerRaw, ...c.rows.map(r => r.blank || (r.raw !== null && !r.changed) ? r.raw : r.cells.map(csvCell).join(","))].join(c.nl) + (c.trailing ? c.nl : "");
    }

    const CSV_HINTS = {
      "wild-words": "地名：末尾写 ! 表示整名、不接后缀(秦岭!、Alps!)，每一列各算各的；地名已以本类型后缀结尾的(燕山)也不再接。",
      "wild-suffix": "后缀：英文以 _ 开头表示前面加空格(_Mountains)；写 {0} 代入地名(Great {0} Desert、{0}的旷野)，不写就接在地名后面。",
      "wild-dir": "方位字头：写 {0} 代入名字(北{0}、North {0})，没写的直接加在前面。",
      "set-suffix": "后缀：英文以 _ 开头表示前面加空格(_Farm)，单写 _ 表示不加后缀；词已以后缀结尾的不重复。",
      "set-words": "直接读当前语言那一列，空着的语言退回英文、简体。",
      "party-title": "写 {0} 代入势力名号(如 {0}系军阀)，否则接在名号后面。",
      "con-name": "每条写 {0} 代表国号，如 {0}宪章。",
      "grand": "美号词条：以前缀字开头(大乾)时国号取后面的字。",
      "grand-meaning": "key = 美号词条的 key + _meaning，值写取义。",
      "books": PLACEHOLDERS
    };
    function csvHintFor(c) {
      if (c.hint && CSV_HINTS[c.hint]) return CSV_HINTS[c.hint];
      const lib = c.lib || "";
      if (/^Wild(Mountain|Desert|Tundra|Jungle|Swamp|Lava)$/.test(lib)) return CSV_HINTS["wild-words"];
      if (/^Wild.*(Suffix|Great)$/.test(lib)) return CSV_HINTS["wild-suffix"];
      if (lib === "WildDirections") return CSV_HINTS["wild-dir"];
      if (/^(Village|Town|Fort|Surname|Terrain|Yurt).*Suffix$/.test(lib)) return CSV_HINTS["set-suffix"];
      if (/^(Untitled|Provisional)/.test(lib)) return CSV_HINTS["party-title"];
      if (/^Book/.test(lib)) return "书名词库里空着的语言会退回 English / 简体。" + PLACEHOLDERS;
      if (lib === "GrandNameMeanings") return CSV_HINTS["grand-meaning"];
      return "命名词库请把 cz / en / ch 都填上。";
    }

    async function openCsv(spec) {
      if (S.csv?.dirty && S.csv.rel !== spec.rel && !confirm(`词库 ${S.csv.lib} 有未保存的修改，确定放弃？`)) return false;
      const r = await api.readText(spec.rel);
      S.csv = { ...spec, owner: spec.owner || "", exists: r.exists, ...csvModel(r.text, r.exists), dirty: false };
      renderCsvEditor();
      $("csvEditor")?.scrollIntoView({ behavior: "smooth" });
      return true;
    }

    function nextKey(c) {
      const prefix = snake(c.general || !c.owner ? c.lib : `${c.owner}_${c.lib}`);
      const used = new Set(c.rows.filter(r => !r.blank).map(r => r.cells[0]));
      let n = c.rows.filter(r => !r.blank).length + 1;
      while (used.has(`${prefix}_${n}`)) n++;
      return `${prefix}_${n}`;
    }

    function renderCsvEditor() {
      const box = $("csvEditor");
      if (!box) return;
      const c = S.csv;
      if (!c) { box.innerHTML = ""; return; }
      const cols = c.header.length;
      const iCz = c.header.indexOf("cz"), iEn = c.header.indexOf("en"), iCh = c.header.indexOf("ch");
      const visible = c.rows.map((r, i) => [r, i]).filter(([r]) => !r.blank);
      const foreign = !c.general && c.owner && c.owner !== S.current?.name;
      box.innerHTML = `<div class="card">
        <h3 style="margin-top:0">${ico("iconEdit")}${esc(c.lib)} <span class="badge">${visible.length} 行</span> ${c.exists ? "" : `<span class="badge">新文件</span>`}
          ${c.general ? `<span class="badge">通用词库</span>` : foreign ? `<span class="badge">Culture_${esc(c.owner)}</span>` : ""}
          <span style="flex:1"></span>
          <button class="small" id="csvAdd">＋ 行</button>
          <button class="small" id="csvPaste" title="每行一个，写中文即可，会自动生成 key">＋ 批量添加</button>
          <button class="small" id="csvFillZh" ${zhReady() && iCz > 0 && iCh > 0 ? "" : "disabled"} title="空着的繁体格按简体转换填上(反过来也补)">补全繁体</button>
          <button class="small primary ${c.dirty ? "dirty" : ""}" id="csvSave">${ico("iconSaveLocal", "sm")}保存 csv</button>
          <button class="small" id="csvClose">关闭</button></h3>
        <p class="muted" style="margin:0 0 6px">${esc(c.rel)}　key 在本文件里必须唯一，单元格里别写英文逗号。<br>${esc(csvHintFor(c))}</p>
        ${c.general ? `<div class="note" style="margin-bottom:6px">这是所有文化共用的通用词库，改了会影响每个没配这一项的文化。</div>`
          : foreign ? `<div class="note" style="margin-bottom:6px">这是 Culture_${esc(c.owner)} 的词库，改了会影响它和所有引用它的文化。</div>` : ""}
        <div id="csvPasteBox" hidden style="margin-bottom:6px">
          <textarea id="csvPasteText" placeholder="每行一个名字，写简体中文即可；也可以写 简体,English 或 简体,English,繁體(逗号、竖线、Tab 都行)。繁体不写自动转换，key 自动生成。"></textarea>
          <div class="toolbar" style="margin-top:4px"><button class="small primary" id="csvPasteOk">添加</button><button class="small" id="csvPasteCancel">取消</button></div>
        </div>
        <div style="max-height:52vh;overflow:auto"><table class="sheet"><tr>${c.header.map(h => `<th>${esc(h)}</th>`).join("")}<th class="act"></th></tr>
        ${visible.map(([row, i]) => `<tr>${Array.from({ length: cols }, (_, j) => `<td><input data-r="${i}" data-c="${j}" value="${esc(row.cells[j] ?? "")}"></td>`).join("")}
          <td class="act"><button class="small" data-del="${i}">×</button></td></tr>`).join("")}
        </table></div></div>`;
      const touch = () => { c.dirty = true; box.querySelector("#csvSave").classList.add("dirty"); };
      box.querySelectorAll("input[data-r]").forEach(inp => inp.oninput = () => {
        const ri = Number(inp.dataset.r), ci = Number(inp.dataset.c);
        const row = c.rows[ri];
        while (row.cells.length < cols) row.cells.push("");
        const prev = row.cells[ci] ?? "";
        row.cells[ci] = inp.value; row.changed = true;
        (row.manual ||= {})[ci] = true;
        // 简体、繁体互相跟着填：另一格空着或还是自动填的才跟，手改过的不动
        const pair = ci === iCz && iCh > 0 ? [iCh, toTrad, "autoCh"] : ci === iCh && iCz > 0 ? [iCz, toSimp, "autoCz"] : null;
        if (pair) {
          const [di, conv, slot] = pair;
          const next = followZh(prev, inp.value, row.cells[di], conv, row[slot], row.manual[di]);
          if (next !== null && next !== row.cells[di]) {
            row.cells[di] = next; row[slot] = next;
            const el = box.querySelector(`input[data-r="${ri}"][data-c="${di}"]`);
            if (el) el.value = next;
          }
        }
        touch();
      });
      box.querySelector("#csvFillZh").onclick = () => {
        let n = 0;
        for (const row of c.rows) {
          if (row.blank) continue;
          while (row.cells.length < cols) row.cells.push("");
          if (!row.cells[iCh]?.trim() && row.cells[iCz]?.trim()) { row.cells[iCh] = toTrad(row.cells[iCz]); row.autoCh = row.cells[iCh]; row.changed = true; n++; }
          else if (!row.cells[iCz]?.trim() && row.cells[iCh]?.trim()) { row.cells[iCz] = toSimp(row.cells[iCh]); row.autoCz = row.cells[iCz]; row.changed = true; n++; }
        }
        if (n) c.dirty = true;
        renderCsvEditor();
        toast(n ? `补了 ${n} 格，记得点“保存 csv”` : "没有空着的简繁格");
      };
      box.querySelectorAll("button[data-del]").forEach(b => b.onclick = () => { c.rows.splice(Number(b.dataset.del), 1); c.dirty = true; renderCsvEditor(); });
      box.querySelector("#csvAdd").onclick = () => {
        const cells = new Array(cols).fill(""); cells[0] = nextKey(c);
        c.rows.push({ cells, raw: null, changed: true }); c.dirty = true; renderCsvEditor();
      };
      box.querySelector("#csvPaste").onclick = () => { box.querySelector("#csvPasteBox").hidden = false; box.querySelector("#csvPasteText").focus(); };
      box.querySelector("#csvPasteCancel").onclick = () => { box.querySelector("#csvPasteBox").hidden = true; };
      box.querySelector("#csvPasteOk").onclick = () => {
        let added = 0;
        for (const line of box.querySelector("#csvPasteText").value.split(/\r?\n/).map(l => l.trim()).filter(Boolean)) {
          const parts = line.split(/\s*[|\t,，]\s*/);
          const cells = new Array(cols).fill(""); cells[0] = nextKey(c);
          const row = { cells, raw: null, changed: true };
          if (iCz > 0) cells[iCz] = parts[0] || "";
          if (iEn > 0) cells[iEn] = parts[1] || "";
          if (iCh > 0) { cells[iCh] = parts[2] || toTrad(parts[0] || "") || ""; if (!parts[2]) row.autoCh = cells[iCh]; }
          if (iCz < 0 && iEn > 0) cells[iEn] = parts[0] || "";
          c.rows.push(row); added++;
        }
        c.dirty = true; renderCsvEditor();
        toast(`加了 ${added} 条，记得点“保存 csv”`);
      };
      box.querySelector("#csvClose").onclick = () => {
        if (c.dirty && !confirm(`词库 ${c.lib} 有未保存的修改，确定关闭？`)) return;
        S.csv = null; renderCsvEditor();
      };
      box.querySelector("#csvSave").onclick = saveCsv;
    }

    async function saveCsv() {
      const c = S.csv;
      if (!c) return;
      const rows = c.rows.filter(r => !r.blank);
      const keys = rows.map(r => (r.cells[0] || "").trim());
      const dup = keys.find((k, i) => !k || keys.indexOf(k) !== i);
      if (dup !== undefined) return toast(dup ? `key 重复：${dup}` : "有空的 key", true);
      if (rows.some(r => r.changed && r.cells.some(x => /[,"]/.test(x || ""))) &&
        !confirm("有单元格里写了英文逗号或引号。村镇、无人区等词库游戏按逗号直接拆分，会读错。仍要保存？")) return;
      if (!rows.length && !confirm("词库是空的。命名用的词库为空时游戏会起出空名字。仍要保存？")) return;
      // 改过的行：英文空着用简体代替、简繁空着的互相转换，免得游戏里显示空白
      const iCz = c.header.indexOf("cz"), iEn = c.header.indexOf("en"), iCh = c.header.indexOf("ch");
      let enFilled = 0, zhFilled = 0;
      for (const r of rows) {
        if (!(r.changed || r.raw === null)) continue;
        while (r.cells.length < c.header.length) r.cells.push("");
        if (iCh > 0 && iCz > 0 && zhReady()) {
          if (!r.cells[iCh].trim() && r.cells[iCz].trim()) { r.cells[iCh] = toTrad(r.cells[iCz]); zhFilled++; }
          else if (!r.cells[iCz].trim() && r.cells[iCh].trim()) { r.cells[iCz] = toSimp(r.cells[iCh]); zhFilled++; }
        }
        if (iEn > 0 && !r.cells[iEn].trim()) {
          const zh = (iCz > 0 && r.cells[iCz].trim()) || (iCh > 0 && r.cells[iCh].trim()) || "";
          if (zh) { r.cells[iEn] = zh; enFilled++; }
        }
      }
      const text = csvText(c);
      await api.writeText(c.rel, text);
      c.exists = true; c.dirty = false;
      c.rows.forEach(r => { if (!r.blank && (r.changed || r.raw === null)) { r.raw = r.cells.map(csvCell).join(","); r.changed = false; } });
      toast(`已保存 ${c.rel}` + (enFilled ? `；${enFilled} 条英文空着，已用中文代替` : "") + (zhFilled ? `；${zhFilled} 条简繁自动补上` : ""));
      await refreshFileLists();
      renderTab();
      renderCsvEditor();
    }

    async function refreshFileLists() {
      try {
        const fresh = await api.listCultures();
        for (const f of fresh) { const old = S.cultures.find(x => x.name === f.name); if (old) old.csvs = f.csvs; }
      } catch { }
      for (const folder of Object.keys(S.general)) {
        try { S.general[folder] = new Set((await api.listDir(`Locales/Cultures/${folder}`)).filter(e => !e.dir).map(e => e.name)); } catch { }
      }
    }

    // ---------- 新建文化 ----------
    function openNewDialog() {
      if (!confirmLeave()) return;
      const sel = $("ndFrom");
      const def = S.current?.data ? S.current.name : (S.cultures.find(c => c.data)?.name || "");
      sel.innerHTML = S.cultures.filter(c => c.data).map(c => `<option value="${esc(c.name)}" ${c.name === def ? "selected" : ""}>${esc(displayName(c))} (${esc(c.name)})</option>`).join("") +
        `<option value="" ${def ? "" : "selected"}>(空白：自己从头填)</option>`;
      for (const id of ["ndCz", "ndEn", "ndName", "ndCh"]) $(id).value = "";
      $("ndColor").value = "#888888";
      $("ndColor").dataset.auto = "1";
      $("ndColor").oninput = () => { $("ndColor").dataset.auto = ""; };
      $("ndMode").value = "copy";
      updateNewNote();
      $("newDialog").showModal();
      $("ndCz").focus();
    }

    // 文化 id：手填的照用(重名报错)；没填按英文名拼(Korean → Korean，New Rome → NewRome)，都没有就 Custom1、Custom2……
    function newCultureId() {
      const typed = $("ndName").value.trim();
      if (typed) return { id: typed, typed: true };
      const taken = new Set(S.cultures.map(c => c.name.toLowerCase()));
      let base = $("ndEn").value.split(/[^A-Za-z0-9]+/).filter(Boolean).map(w => w[0].toUpperCase() + w.slice(1)).join("").replace(/^[0-9]+/, "");
      let n = 2, id = base;
      if (!base) { base = "Custom"; n = 1; id = "Custom1"; }
      while (taken.has(id.toLowerCase())) id = base + n++;
      return { id, typed: false };
    }

    // 没手选颜色时按中文名给一个稳定的颜色
    function autoColor(text) {
      let h = 0;
      for (const ch of String(text || "")) h = (h * 31 + ch.codePointAt(0)) >>> 0;
      const hue = h % 360, sat = 0.5, light = 0.5;
      const f = n => { const k = (n + hue / 30) % 12; const a = sat * Math.min(light, 1 - light); return Math.round(255 * (light - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))); };
      return "#" + [f(0), f(8), f(4)].map(v => v.toString(16).padStart(2, "0")).join("").toUpperCase();
    }

    function updateNewNote() {
      const from = $("ndFrom").value;
      const cz = $("ndCz").value.trim();
      $("ndMode").disabled = !from;
      $("ndCh").placeholder = toTrad(cz) || "(按中文名自动转换)";
      if ($("ndColor").dataset.auto && cz) $("ndColor").value = autoColor(cz);
      const { id } = newCultureId();
      $("ndName").placeholder = id;
      $("ndNote").innerHTML = `将建 <code>Locales/Cultures/Culture_${esc(id)}/</code>。` + (!from
        ? "空白：五类起名、默认政体、特质给好默认值，词库要自己在“命名规则”里建(没建之前游戏保持原版起名)；另建 1 条宗教名占位(多神民间宗教创教要用)。"
        : `照 ${esc(displayName(S.cultures.find(c => c.name === from) || { name: from }))} 复制规则(连注释)，名称、颜色换成新的，物种清空(一个物种只能属于一个文化)，其余照模板，之后再改。` +
          ($("ndMode").value === "ref" ? "<br>引用模式：起名、村镇、无人区、宪法名、政党称呼、美号这些词库写成 模板:词库名，模板文化改了词库这里也跟着变。"
            : $("ndMode").value === "none" ? "<br>不复制词库：起名会退回原版，直到你补上词库。" : ""));
    }

    // 规则里的本文化词库改成"模板:词库名"(只改游戏认引用写法的字段)；返回被引用的文件名
    function rewriteRefs(st, from, srcCsvs) {
      const used = new Set();
      const fileOf = lib => srcCsvs.find(f => f.toLowerCase() === `${from}${lib}.csv`.toLowerCase());
      const conv = v => {
        if (typeof v !== "string") return v;
        const t = v.trim(), f = t && t.indexOf(":") < 0 ? fileOf(t) : null;
        if (!f) return v;
        used.add(f);
        return `${from}:${t}`;
      };
      const convMap = m => { if (isObj(m)) for (const k of Object.keys(m)) m[k] = conv(m[k]); };
      for (const key of Object.keys(NAMING)) {
        const cfg = st[key];
        if (!isObj(cfg)) continue;
        convMap(cfg.groups);
        for (const f of EXTRA_FIELDS) if (has(cfg, f)) cfg[f] = conv(cfg[f]);
      }
      if (isObj(st.Party)) for (const m of ["suffix_groups", "untitled_groups", "provisional_groups"]) convMap(st.Party[m]);
      if (isObj(st.Constitution)) for (const f of ["name_group", "provisional_name_group"]) if (has(st.Constitution, f)) st.Constitution[f] = conv(st.Constitution[f]);
      if (isObj(st.Settlement)) for (const [k, v] of Object.entries(st.Settlement)) { if (typeof v === "string") st.Settlement[k] = conv(v); else if (k === "terrain") convMap(v); }
      if (isObj(st.Wilderness)) { for (const [m] of WILD_MAPS) convMap(st.Wilderness[m]); if (has(st.Wilderness, "directions")) st.Wilderness.directions = conv(st.Wilderness.directions); }
      // 美号没配词库时默认读本文化的 GrandNames
      const grand = isObj(st.GrandName) && st.GrandName.group ? st.GrandName.group : "GrandNames";
      if (fileOf(grand)) { if (!isObj(st.GrandName)) st.GrandName = {}; st.GrandName.group = conv(grand); }
      return used;
    }

    async function createCultureFlow() {
      try {
        const cz = $("ndCz").value.trim(), en = $("ndEn").value.trim();
        if (!cz && !en) throw new Error("先填中文名。");
        const { id: name, typed } = newCultureId();
        if (!/^[A-Za-z][A-Za-z0-9]*$/.test(name)) throw new Error("文化 id 只能用英文字母和数字，并以字母开头，比如 Korea。");
        if (typed && S.cultures.some(c => c.name.toLowerCase() === name.toLowerCase())) throw new Error(`文化 ${name} 已存在。`);
        const ch = $("ndCh").value.trim() || toTrad(cz);
        const from = $("ndFrom").value;
        const mode = from ? $("ndMode").value : "blank";
        let text = BLANK_RULE_TEXT;
        if (from) {
          const r = await api.readText(`Locales/Cultures/Culture_${from}/CultureRule.jsonc`);
          if (r.exists && r.text.trim()) text = r.text;
        }
        const data = Jsonc.value(text);
        data.name = name;
        data.color = $("ndColor").dataset.auto ? autoColor(cz || en) : $("ndColor").value.toUpperCase();
        data.translate_cz = cz || en;
        // 英文名没填：英文界面显示中文名，不显示自动生成的 id
        data.translate_en = en || cz;
        if (ch) data.translate_ch = ch; else delete data.translate_ch;
        delete data.species;
        let csvFiles;
        if (mode === "ref") {
          const src = S.cultures.find(c => c.name === from);
          const used = rewriteRefs(isObj(data.setting) ? data.setting : (data.setting = {}), from, src?.csvs || []);
          csvFiles = (src?.csvs || []).filter(f => !used.has(f));
        }
        let ruleText;
        try { ruleText = Jsonc.patch(text, data); } catch { ruleText = Jsonc.format(data) + "\n"; }
        const r = await api.createCulture({ name, copyFrom: from || "", copyCsv: !!from && mode !== "none", csvFiles, ruleText,
          translate_cz: data.translate_cz, translate_en: data.translate_en, translate_ch: ch });
        // 多神民间宗教创教要从宗教名词库取名，空白文化先放一条占位
        if (!from) {
          const zh = cz || en;
          await api.writeText(`Locales/Cultures/Culture_${name}/${name}ReligionNames.csv`,
            `key,cz,en,ch\n${snake(name)}_religion_names_1,${csvCell(zh + "教")},${csvCell((en || zh) + (en ? " Faith" : "教"))},${csvCell((ch || zh) + "教")}\n`);
        }
        $("newDialog").close();
        toast(`已创建文化 ${data.translate_cz}(Culture_${r.name})${from ? "" : "：记得在“命名规则”里建词库"}，物种在“基本信息”里绑定`);
        S.dirty = false;
        S.csv = null;
        await reloadCultures(r.name);
        selectCulture(r.name, true);
      } catch (e) { toast(String(e.message || e).replace(/^Error invoking remote method '[^']+': (Error: )?/, ""), true); }
    }

    init();
  </script>
</body>
